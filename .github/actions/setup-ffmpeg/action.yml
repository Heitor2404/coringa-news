name: Ensure media tools
description: Install and verify both media binaries before acquisition or render
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        set -euo pipefail
        if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
          # GitHub Ubuntu runners add third-party package feeds that are not
          # required for FFmpeg. Use the distribution's configured signed
          # sources without disabling signature verification.
          apt_sources=()
          if [[ -s /etc/apt/sources.list.d/ubuntu.sources ]]; then
            apt_sources=(-o Dir::Etc::sourcelist=/etc/apt/sources.list.d/ubuntu.sources -o Dir::Etc::sourceparts=-)
          elif [[ -s /etc/apt/sources.list ]]; then
            apt_sources=(-o Dir::Etc::sourcelist=/etc/apt/sources.list -o Dir::Etc::sourceparts=-)
          fi
          sudo apt-get "${apt_sources[@]}" update -qq
          sudo apt-get "${apt_sources[@]}" install -y -qq --no-install-recommends ffmpeg
        fi
        ffmpeg -version | sed -n '1p'
        ffprobe -version | sed -n '1p'
