name: ATLAS - galeria de midias chips (candidatas, sem publicacao)
# Execução de curadoria visual sem Claude, Gemini, TTS ou render de vídeo.
on:
  push:
    branches: [atlas-biblioteca-20261118]
    paths:
      - "scripts/atlas_acervo_chips_preview.py"
      - "src/v4/formatos/biblioteca_atlas/midias_candidatas_chips.json"
      - ".github/workflows/atlas-acervo-chips-preview.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: atlas-acervo-chips-preview
  cancel-in-progress: true

jobs:
  galeria:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - name: Instalar apenas Pillow
        run: python -m pip install --disable-pip-version-check "Pillow==11.3.0"
      - name: Conferir sintaxe e fontes do acervo
        run: |
          python -m py_compile scripts/atlas_acervo_chips_preview.py
          python -m json.tool src/v4/formatos/biblioteca_atlas/midias_candidatas_chips.json > /dev/null
      - name: Testar regra de licenca sem acesso a rede
        run: |
          python - <<'PY'
          from scripts.atlas_acervo_chips_preview import licenca_confere
          assert licenca_confere("CC BY 4.0", {"short_name":"CC BY 4.0","url":"https://creativecommons.org/licenses/by/4.0/"})
          assert not licenca_confere("CC BY 4.0", {"short_name":"CC BY-SA 4.0","url":"https://creativecommons.org/licenses/by-sa/4.0/"})
          assert licenca_confere("CC BY-SA 4.0", {"short_name":"CC BY-SA 4.0","url":"https://creativecommons.org/licenses/by-sa/4.0/"})
          assert licenca_confere("Public domain (US Government NASA)", {"short_name":"Public domain","url":""})
          assert not licenca_confere("Public domain (US Government NASA)", {"short_name":"CC BY 4.0","url":"https://creativecommons.org/licenses/by/4.0/"})
          print("Reconciliação de licenças: aprovado.")
          PY
      - name: Recuperar miniaturas Commons, auditar hashes e criar galeria
        timeout-minutes: 8
        run: python scripts/atlas_acervo_chips_preview.py saida_galeria_chips
      - name: Validar hashes e quantidade contra arquivos salvos (sem IA)
        run: |
          python - <<'PY'
          import json, pathlib, hashlib
          destino = pathlib.Path("saida_galeria_chips")
          resultado = json.loads((destino / "auditoria_miniaturas.json").read_text(encoding="utf-8"))
          assert resultado["total"] > 0
          assert resultado["baixadas"] == resultado["total"], "Nem todas as mídias foram baixadas; ver auditoria."
          assert not resultado["licencas_nao_conciliadas"], (
              "Licenca declarada difere de metadata Commons: " + repr(resultado["licencas_nao_conciliadas"])
          )
          for item in resultado["itens"]:
              arq = destino / item["arquivo_thumb"]
              assert arq.is_file() and arq.stat().st_size > 4096, item["id"]
              digest = hashlib.sha256(arq.read_bytes()).hexdigest()
              assert digest == item["sha256_thumb"], f"Hash mudou para {item['id']}"
              assert item["estado"] == "candidato" and item["sha256"] is None
          print(f"{resultado['total']} mídias verificadas byte a byte; nenhuma liberada para produção.")
          PY
      - name: Guardar galeria e relatorio SEMPRE (mesmo se houver falhas)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atlas-chips-acervo-candidato
          path: saida_galeria_chips/
          if-no-files-found: warn
          retention-days: 7
