name: ATLAS Chips - prova de reuso e quadros SEM IA
# TESTE ISOLADO: somente mapas/componentes aprovados. Nenhum TTS, Claude, API, MP4 ou publicacao.
on:
  push:
    branches: [atlas-piloto-chips-20261118]
    paths:
      - ".github/workflows/atlas-chips-reuso.yml"
      - "src/v4/formatos/planos/reuso/atlas_chips.json"
      - "src/v4/formatos/planos/reuso/atlas_chips_factual_2026.json"
      - "src/v4/biblioteca_comprovada.json"
      - "scripts/formatos_reuso.py"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: atlas-chips-reuso
  cancel-in-progress: true
env:
  DO_NOT_TRACK: "1"
  REMOTION_DISABLE_TELEMETRY: "1"
  DISABLE_TELEMETRY: "true"
  CORINGA_CHROME: /usr/bin/google-chrome
  REMOTION_CHROME: /usr/bin/google-chrome
  PLANO: src/v4/formatos/planos/reuso/atlas_chips_factual_2026.json
  SAIDA: saida_chips_reuso
jobs:
  quadros:
    runs-on: ubuntu-24.04
    timeout-minutes: 42
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13", cache: pip}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: motor4/package-lock.json
      - name: Verificar Chrome e preparar fontes aprovadas
        run: |
          google-chrome --version
          mkdir -p ~/.fonts
          cp motor4/identidade/ttf/*.ttf ~/.fonts/
          fc-cache -f ~/.fonts
      - name: Instalar dependencias fixadas
        timeout-minutes: 15
        run: |
          pip install --disable-pip-version-check -r requirements.txt -r requirements-dev.txt
          (cd motor4 && npm ci --no-audit --no-fund)
      - name: FFmpeg portatil versionado via Python (sem apt e sem action externa)
        timeout-minutes: 4
        run: |
          python -m pip install --disable-pip-version-check "imageio-ffmpeg==0.6.0"
          python - <<'PY'
          import os, subprocess
          from pathlib import Path
          import imageio_ffmpeg
          origem = Path(imageio_ffmpeg.get_ffmpeg_exe())
          assert origem.is_file(), "O pacote não forneceu o executável FFmpeg."
          dest = Path.home() / ".local" / "bin" / "ffmpeg"
          dest.parent.mkdir(parents=True, exist_ok=True)
          if dest.exists() or dest.is_symlink():
              dest.unlink()
          dest.symlink_to(origem)
          with open(os.environ["GITHUB_PATH"], "a", encoding="utf-8") as p:
              p.write(str(dest.parent) + "\n")
          subprocess.run([str(dest), "-version"], check=True, stdout=subprocess.DEVNULL)
          print("FFmpeg portátil do pacote Python: OK")
          PY
      - name: Testes de contrato do motor antes dos quadros
        run: |
          # O FFmpeg portátil permite validar também áudio e preflight; só
          # a montagem MP4 (requer ffprobe) fica no workflow completo do motor.
          python -m pytest -q tests/test_formatos.py -k 'not test_montagem_previa_confere_mp4_com_relogios_distintos'
          (cd motor4 && npx --no-install tsc -p remotion/tsconfig.json --noEmit)
      - name: PROVA DE REUSO CHIPS (voz sintetica para temporizacao, SEM TTS)
        timeout-minutes: 20
        run: |
          python scripts/formatos_reuso.py "$PLANO" "$SAIDA"
      - name: Provar que duas fotografias correspondem aos arquivos licenciados
        run: |
          python - <<'PY'
          import json, pathlib, os
          saida = pathlib.Path(os.environ["SAIDA"])
          a = json.loads((saida / "ativos.json").read_text(encoding="utf-8"))
          for chave in ("commons:TSMC_Fab_18_May_2025.jpg","commons:Silicon_wafer_close_view.jpg"):
              reg = a.get(chave)
              assert reg, "Fotografia obrigatória não foi usada: " + chave
              assert reg["origem_conferida"] is True, "SHA de origem inválido: " + chave
              assert reg["licenca"] == "CC BY 4.0", "Licença incorreta: " + chave
              assert int(reg["w"]) >= 800 and int(reg["h"]) >= 600, "Mídia pequena: " + chave
          print("Duas fotografias verificadas por arquivo de origem, SHA e licença; sem IA.")
          PY
      - name: Bloquear se preflight/quadros apresentarem erros
        run: |
          python - <<'PY'
          import json, pathlib, os
          p = pathlib.Path(os.environ["SAIDA"]) / "reuso.json"
          r = json.loads(p.read_text(encoding="utf-8"))
          print("Preflight:", r["preflight"])
          print("Quadros:", r.get("quadros"))
          if (r.get("quadros") or {}).get("avisos_por_regra", {}).get("A-CREDITO-RODAPE"):
              print("::warning::Créditos podem ser cobertos pela interface de plataformas; revisar antes da publicação.")
          assert r["preflight"]["pronto"], "Preflight bloqueou o reuso: ver relatorio."
          assert "quadros" in r, "Nenhum quadro gerado."
          assert not r["quadros"]["problemas"], "Problemas visuais: ver relatorio."
          print("REUSO ATLAS CHIPS APROVADO NOS TESTES AUTOMATIZADOS (NÃO é aprovação humana).")
          PY
      - name: Guardar estiloframes e relatorios para auditoria privada
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atlas-chips-reuso-sintetico
          path: |
            saida_chips_reuso/reuso.json
            saida_chips_reuso/preflight.json
            saida_chips_reuso/quadros/relatorio.json
            saida_chips_reuso/quadros/relatorio.md
            saida_chips_reuso/quadros/styleframes.jpg
            saida_chips_reuso/quadros/celular.jpg
            saida_chips_reuso/quadros/amostragem.jpg
            saida_chips_reuso/quadros/plataforma_*.jpg
          if-no-files-found: warn
          retention-days: 7
