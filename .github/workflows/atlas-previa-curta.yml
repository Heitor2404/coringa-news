name: ATLAS V1 - previa audiovisual curta PRIVADA (sem Claude)
# Gatilho exclusivo; sem full render, sem DOSSIÊ/NTC/main e sem publicar nada.
# Revisão curta do Panamá com o mapa, mecanismo e voz nos tempos originais.
on:
  push:
    branches: [motor-integral-v4, atlas-direcao-visual-20261118]
    paths: [".github/atlas/previa_curta.txt"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: atlas-previa-curta
  cancel-in-progress: true

env:
  DO_NOT_TRACK: "1"
  REMOTION_DISABLE_TELEMETRY: "1"
  DISABLE_TELEMETRY: "true"
  ATLAS_MODO: continuo
  PLANO_ATLAS: src/v4/formatos/planos/atlas_panama.json
  CORINGA_CHROME: /usr/bin/google-chrome
  REMOTION_CHROME: /usr/bin/google-chrome

jobs:
  previa:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: motor4/package-lock.json
      - name: FFmpeg sem depender de espelho apt do Ubuntu
        uses: FedericoCarboni/setup-ffmpeg@v3
        with:
          ffmpeg-version: release
      - name: Chrome e fontes versionadas do canal (sem apt)
        timeout-minutes: 3
        run: |
          ffmpeg -version | head -1
          ffprobe -version | head -1
          google-chrome --version
          mkdir -p ~/.fonts
          cp motor4/identidade/ttf/*.ttf ~/.fonts/
          fc-cache -f ~/.fonts
      - name: Preparar dependencias exatas
        run: |
          pip install --disable-pip-version-check -r requirements.txt -r requirements-dev.txt
          (cd motor4 && npm ci --no-audit --no-fund)
      - name: Instalar navegador do mecanismo V2 para o preflight (sem render)
        timeout-minutes: 9
        run: |
          timeout 260 python -m playwright install chromium --only-shell
          python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); p.chromium.launch().close(); p.stop()' || timeout 240 python -m playwright install-deps chromium
      - name: Contrato Python e TypeScript (sem render)
        run: |
          python -m pytest -q tests/test_formatos.py
          (cd motor4 && npx --no-install tsc -p remotion/tsconfig.json --noEmit)
      - name: Narracao PANAMA ja existente, sem geracao por IA
        env:
          CHECKPOINT_KEY: ${{ secrets.CHECKPOINT_KEY }}
          COFRE_TOKEN: ${{ secrets.COFRE_TOKEN }}
        run: python -m src.v4.formatos narrar "$PLANO_ATLAS" saida_formatos/atlas
      - name: Mídia licenciada / bases do ATLAS
        run: python -m src.v4.formatos ativos "$PLANO_ATLAS" saida_formatos/atlas
      - name: PREFLIGHT obrigatorio (falha = sem render)
        run: python -m src.v4.formatos preflight "$PLANO_ATLAS" saida_formatos/atlas
      - name: Calcular chaves pelos insumos reais e arquivos versionados
        run: |
          ATLAS_AMBIENTE=$({
            python --version
            node --version
            python -m playwright --version
            google-chrome --version
            ffmpeg -version
            fc-list --format '%{file}\n' | LC_ALL=C sort -u | while IFS= read -r f; do sha256sum "$f"; done
          } | sha256sum | cut -d' ' -f1)
          export ATLAS_AMBIENTE
          python -m scripts.atlas_cache chaves saida_formatos/atlas >> "$GITHUB_ENV"
      - uses: actions/cache@v4
        id: base
        with:
          path: saida_formatos/atlas/_amostra/eclusa_v2_${{ env.ATLAS_ECLUSA_KEY }}.mp4
          key: ${{ env.ATLAS_ECLUSA_KEY }}
      - uses: actions/cache@v4
        id: visual
        with:
          path: saida_formatos/atlas/intermediarios.enc
          key: ${{ env.ATLAS_VISUAL_KEY }}
      - name: Abrir intermediários verificados
        if: steps.visual.outputs.cache-hit == 'true'
        env:
          CHECKPOINT_KEY: ${{ secrets.CHECKPOINT_KEY }}
          COFRE_TOKEN: ${{ secrets.COFRE_TOKEN }}
        run: |
          if python -m scripts.atlas_cache restaurar saida_formatos/atlas; then
            echo 'ATLAS_VISUAL_RESTAURADO=1' >> "$GITHUB_ENV"
          else
            echo '::warning::Intermediários indisponíveis; refazendo os quadros e cortes.'
          fi
      - name: Conferir recuperação em runner independente
        if: contains(github.event.head_commit.message, '[verificar-cache]')
        run: |
          test "${{ steps.base.outputs.cache-hit }}" = true
          test "$ATLAS_VISUAL_RESTAURADO" = 1
      - name: Quadros, texto/legendas, plataformas, colisões
        if: env.ATLAS_VISUAL_RESTAURADO != '1'
        timeout-minutes: 17
        run: python -m src.v4.formatos quadros "$PLANO_ATLAS" saida_formatos/atlas
      - name: Montar e verificar o MP4 dos intervalos de revisão
        timeout-minutes: 38
        run: python scripts/atlas_previa_curta.py render saida_formatos/atlas
      - name: Guardar intermediários privados após conferir o MP4
        if: steps.visual.outputs.cache-hit != 'true'
        env:
          CHECKPOINT_KEY: ${{ secrets.CHECKPOINT_KEY }}
          COFRE_TOKEN: ${{ secrets.COFRE_TOKEN }}
        run: python -m scripts.atlas_cache salvar saida_formatos/atlas
      - name: Persistir cache cifrado ANTES do Telegram (mesmo se envio falhar)
        if: steps.visual.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: saida_formatos/atlas/intermediarios.enc
          key: ${{ env.ATLAS_VISUAL_KEY }}
      - name: Persistir clipe V2 ANTES do Telegram
        if: steps.base.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: saida_formatos/atlas/_amostra/eclusa_v2_${{ env.ATLAS_ECLUSA_KEY }}.mp4
          key: ${{ env.ATLAS_ECLUSA_KEY }}
      - name: Enviar resultado para Telegram PRIVADO (ou explicar bloqueio)
        if: always() && !cancelled() && !contains(github.event.head_commit.message, '[verificar-cache]')
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/atlas_previa_curta.py enviar saida_formatos/atlas
