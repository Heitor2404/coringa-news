name: ATLAS - testes isolados (sem Claude e sem render)
# Disparo separado da produção: não chama modelo, não gera vídeo e não publica.
on:
  push:
    branches: [motor-integral-v4, atlas-direcao-visual-20261118]
    paths:
      - ".github/atlas/validacao.txt"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: atlas-validacao
  cancel-in-progress: true

jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: FFmpeg do runner (sem release externo instavel)
        timeout-minutes: 4
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            timeout 110 sudo apt-get update -qq -o Acquire::Retries=1
            timeout 100 sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends ffmpeg
          fi
          ffmpeg -version | head -1
          ffprobe -version | head -1
      - name: Instalar dependencias Python de teste
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt -r requirements-dev.txt
      - name: Verificar sintaxe e testes ATLAS (sem API de IA)
        run: |
          python -m py_compile src/voz.py src/v4/formatos/estado.py src/v4/formatos/__main__.py src/v4/formatos/diretor.py src/v4/formatos/plano.py src/v4/formatos/produzir.py src/v4/formatos/ponte_biblioteca.py scripts/atlas_previa_curta.py tests/test_formatos.py tests/test_atlas_integracao_p0.py tests/test_atlas_integracao_p1.py tests/test_atlas_ponte_v3.py tests/test_atlas_abertura_prova_real.py tests/test_atlas_previa_chips_v2.py
          python -m pytest -q -ra tests/test_formatos.py tests/test_atlas_integracao_p0.py tests/test_atlas_integracao_p1.py tests/test_atlas_ponte_v3.py tests/test_atlas_abertura_prova_real.py tests/test_atlas_previa_chips_v2.py
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: motor4/package-lock.json
      - name: Compilar tipagem Remotion (sem render, sem Claude)
        working-directory: motor4
        run: |
          npm ci --no-audit --no-fund
          node --check ../src/render/v2/comp/mecanismos.js
          node --check ../src/render/v2/nucleo.js
          node ../tests/test_clareza_v2.js
          npx --no-install tsc -p remotion/tsconfig.json --noEmit
