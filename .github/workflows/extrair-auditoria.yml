name: Extrair arquivos para auditoria

# Manual. Descriptografa (com o secret ARTEFATOS_SENHA) o pacote de uma rodada do Coringa, separa SÓ os arquivos da
# auditoria visual (zip de diagnóstico, dados.json, roteiro.json, acervo.json) e os entrega CRIPTOGRAFADOS para uma
# chave pública informada na hora (só quem tem a chave privada abre). O resultado sai no log, como texto cifrado.
# Nada é publicado aberto, nada vai para o repositório. Sem IA, sem vídeo, não toca o NTC.
on:
  workflow_dispatch:
    inputs:
      execucao:
        description: "Número da execução do 'Gerar vídeos do dia' (ex.: 43435732255)"
        required: true
      chave_publica:
        description: "Chave pública GPG (armored) em base64, de quem vai receber os arquivos"
        required: true

permissions:
  actions: read
  contents: read

jobs:
  extrair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Baixar o pacote criptografado da execução
        uses: actions/download-artifact@v4
        with:
          name: coringa-rodada-${{ github.event.inputs.execucao }}
          run-id: ${{ github.event.inputs.execucao }}
          github-token: ${{ github.token }}
          path: pacote

      - name: Descriptografar e separar só os arquivos da auditoria
        env:
          ARTEFATOS_SENHA: ${{ secrets.ARTEFATOS_SENHA }}
        run: |
          set -e
          mkdir -p tudo sel
          gpg --batch --yes --quiet --pinentry-mode loopback --passphrase-fd 3 -d pacote/coringa-rodada.tar.gpg \
            3<<< "$ARTEFATOS_SENHA" | tar -xf - -C tudo
          find tudo -name '*-diagnostico.zip' -exec cp {} sel/ \;
          for z in sel/*-diagnostico.zip; do
            unzip -o -q -j "$z" dados.json roteiro.json acervo.json -d sel/ || true
          done
          ls -la sel
          [ -n "$(ls sel/*-diagnostico.zip 2>/dev/null)" ] || { echo "nenhum zip de diagnóstico no pacote"; exit 1; }

      - name: Entregar criptografado para a chave pública
        env:
          CHAVE: ${{ github.event.inputs.chave_publica }}
        run: |
          set -e
          export GNUPGHOME=$(mktemp -d)
          echo "$CHAVE" | base64 -d | gpg --batch --quiet --import
          dest=$(gpg --list-keys --with-colons | awk -F: '/^fpr/{print $10; exit}')
          tar -C sel -czf auditoria.tgz .
          gpg --batch --yes --quiet --trust-model always --encrypt -r "$dest" -o auditoria.tgz.gpg auditoria.tgz
          echo "----- INICIO AUDITORIA $(stat -c %s auditoria.tgz.gpg) -----"
          base64 -w 0 auditoria.tgz.gpg; echo
          echo "----- FIM AUDITORIA -----"
