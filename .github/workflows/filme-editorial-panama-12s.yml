name: FILME — Panamá 12s com eclusa animada (privado)
on:
  push:
    branches: [atlas-direcao-visual-20261118]
    paths: [".github/atlas/filme_panama_12s.txt"]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: filme-editorial-panama-12s
  cancel-in-progress: true

env:
  DO_NOT_TRACK: "1"
  REMOTION_DISABLE_TELEMETRY: "1"
  DISABLE_TELEMETRY: "true"
  CORINGA_CHROME: /usr/bin/google-chrome

jobs:
  proof:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # Arquivo 1080p já curado, fonte/offset e SHA registrados. NÃO baixar nova
      # mídia a cada render, nem aceitar URL aleatória no diretor.
      - name: Recuperar master 1080p da eclusa com SHA conhecido
        uses: actions/download-artifact@v4
        with:
          name: filme-panama-eclusa-real-1080p-master
          run-id: 44519739030
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: stage_hero
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: motor4/package-lock.json
      - name: Verificar contrato narrativo e procedência das mídias locais
        run: |
          python -m pip install -q pillow requests pytest
          python -m pytest -q tests/test_filme_editorial.py tests/test_filme_panama_mechanism.py
          python - <<'PY'
          import json
          from pathlib import Path
          from src.v4.formatos.filme_editorial import avaliar
          p=json.loads(Path('docs/v4/formatos/filme_panama_12s_prova.json').read_text())
          r=avaliar(p)
          assert r['pronto'],r['bloqueios']
          assert sum(s['type']=='video' for s in p['shots'])>=2
          print('CONTRATO_OK',r['cenas'],'shots',r['medias_unicas'],'midias reais')
          PY
      - name: Instalar e compilar Remotion (isolado)
        timeout-minutes: 12
        run: |
          (cd motor4 && npm ci --no-audit --no-fund)
          (cd motor4 && npx --no-install tsc -p remotion/tsconfig.json --noEmit)
      - name: Garantir FFmpeg/FFprobe para verificar os vídeos reais
        timeout-minutes: 5
        run: |
          if ! command -v ffprobe >/dev/null || ! command -v ffmpeg >/dev/null; then
            timeout 150 sudo apt-get update -qq -o Acquire::Retries=1
            timeout 180 sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends ffmpeg
          fi
          ffprobe -version | head -1
      - name: Preparar mídias JÁ VERSIONADAS (sem chamadas de imagens externas)
        run: |
          python -m src.v4.formatos.filme_editorial \
            docs/v4/formatos/filme_panama_12s_prova.json \
            saida_filme_panama motor4/remotion/public
      - name: Renderizar VIDEO CURTO de linguagem, não episódio
        timeout-minutes: 14
        run: |
          cd motor4
          npx --no-install remotion render remotion/src/index.ts FilmeEditorial \
            ../saida_filme_panama/prova_panama_12s.mp4 \
            --props=../saida_filme_panama/props.json \
            --codec=h264 --crf=22 --concurrency=2 --scale=0.5 --public-dir=remotion/public --log=error
      - name: Narração brasileira PRIVADA de ensaio (Edge TTS, sem Claude)
        continue-on-error: true
        timeout-minutes: 6
        run: |
          python -m pip install -q edge-tts
          python - <<'PY'
          import asyncio, json
          from pathlib import Path
          import edge_tts
          roteiro=json.loads(Path('docs/v4/formatos/filme_panama_12s_prova.json').read_text())
          destino=Path('saida_filme_panama/voz.mp3')
          asyncio.run(edge_tts.Communicate(roteiro['narracao'],'pt-BR-AntonioNeural',rate='+12%').save(str(destino)))
          assert destino.stat().st_size>3000
          print('NARRACAO_PRIVADA_GERADA',destino.stat().st_size)
          PY
      - name: Finalizar com áudio se houver; falha explícita nunca vira aprovação
        run: |
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          pasta=Path('saida_filme_panama')
          som=pasta/'voz.mp3'
          meta={'voz_gerada':som.exists() and som.stat().st_size>3000,
                'status':'PENDENTE_APROVACAO_HUMANA'}
          if meta['voz_gerada']:
              d=float(subprocess.check_output(['ffprobe','-v','error','-show_entries',
                  'format=duration','-of','default=noprint_wrappers=1:nokey=1',str(som)],text=True).strip())
              meta['duracao_audio_original_s']=round(d,2)
              fator=max(.80,min(1.25,d/11.3))
              meta['fator_tempo_audio']=round(fator,3)
              inp=pasta/'prova_panama_12s.mp4';out=pasta/'prova_com_voz_12s.mp4'
              subprocess.run(['ffmpeg','-hide_banner','-loglevel','error','-y','-i',str(inp),'-i',str(som),
                  '-filter_complex',f'[1:a]aresample=48000,atempo={fator:.3f},loudnorm=I=-14:TP=-1.5:LRA=9,apad[a]',
                  '-map','0:v','-map','[a]','-c:v','copy','-c:a','aac','-b:a','160k','-t','12',
                  '-movflags','+faststart',str(out)],check=True)
              meta['arquivo']=str(out)
          else:
              meta['alerta']='TTS não respondeu; prova visual SEM ÁUDIO, não é episódio final'
              meta['arquivo']=str(pasta/'prova_panama_12s.mp4')
          (pasta/'som_status.json').write_text(json.dumps(meta,ensure_ascii=False,indent=2),encoding='utf-8')
          print('NARRACAO_STATUS',meta)
          PY
      - name: Inspecionar 6 momentos e métricas básicas
        if: success()
        run: |
          ffmpeg -hide_banner -loglevel error -y -i saida_filme_panama/prova_panama_12s.mp4 \
            -vf "fps=1/2,scale=360:640,tile=3x2" -frames:v 1 \
            saida_filme_panama/contato.jpg
          ffprobe -v error -show_entries format=duration,size -of json \
            saida_filme_panama/prova_panama_12s.mp4 > saida_filme_panama/metadata.json
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('saida_filme_panama')
          print('RENDER_PRIVATE',json.loads((p/'metadata.json').read_text()))
          assert (p/'prova_panama_12s.mp4').stat().st_size>50000
          assert (p/'contato.jpg').stat().st_size>10000
          PY
      - name: Salvar vídeo, storyboard e evidências privados (sem publicar)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: filme-panama-12s-prova-movimento-privada
          path: |
            saida_filme_panama/props.json
            saida_filme_panama/contrato.json
            saida_filme_panama/midias.json
            saida_filme_panama/metadata.json
            saida_filme_panama/contato.jpg
            saida_filme_panama/prova_panama_12s.mp4
            saida_filme_panama/prova_com_voz_12s.mp4
            saida_filme_panama/voz.mp3
            saida_filme_panama/som_status.json
          retention-days: 7
          if-no-files-found: warn
