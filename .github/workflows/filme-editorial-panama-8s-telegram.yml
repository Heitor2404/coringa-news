name: FILME — entregar 8s já renderizados no Telegram (privado)
on:
  push:
    branches: [atlas-direcao-visual-20261118]
    paths: [".github/atlas/filme_panama_8s_telegram.txt"]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: filme-panama-8s-telegram-recuperacao
  cancel-in-progress: false
jobs:
  entregar:
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Reutilizar SOMENTE o MP4 e QA do render válido de 7,8s
        uses: actions/download-artifact@v4
        with:
          name: filme-panama-8s-causal-privado
          run-id: 44532194366
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: saida_filme_panama_8s
      - name: Provar configuração de envio sem conexão externa
        run: |
          python -m pip install -q pytest requests
          python -m pytest -q tests/test_atlas_filme_telegram.py
      - name: Enviar vídeo silencioso e folha de quadros para chat PRIVADO
        timeout-minutes: 8
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "::error::Telegram não configurado; não enviar para outro destino"
            exit 1
          fi
          python -m scripts.atlas_filme_telegram saida_filme_panama_8s
