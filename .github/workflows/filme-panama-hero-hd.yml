name: FILME — arquivo master do trecho real da eclusa (privado)
on:
  push:
    branches: [atlas-direcao-visual-20261118]
    paths: [".github/atlas/filme_panama_hero_hd.txt"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: filme-panama-hero-hd
  cancel-in-progress: true
jobs:
  cache:
    runs-on: ubuntu-22.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: FFmpeg e extrator de origem com licença comprovada
        timeout-minutes: 6
        run: |
          python -m pip install -q yt-dlp pillow requests
          if ! command -v ffprobe >/dev/null || ! command -v ffmpeg >/dev/null; then
            timeout 150 sudo apt-get update -qq -o Acquire::Retries=1
            timeout 180 sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends ffmpeg
          fi
      - name: Recortar UMA fonte DVIDS da eclusa em HD, preservando fonte e hash
        env:
          SCOUT_HERO_HD: "1"
        timeout-minutes: 12
        run: |
          python scripts/filme_panama_scout.py saida_hero_hd
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('saida_hero_hd')
          r=json.loads((p/'relatorio.json').read_text())
          a=r['fontes'][0]
          assert a['resultado']=='CANDIDATO_SEM_REVISÃO',a
          assert a['id']=='comfort-2018-meio',a
          assert (p/a['arquivo']).stat().st_size > 300000
          print('FONTE_VERIFICADA',a['fonte'],a['sha256'],a['offset_s'],'segundos')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: filme-panama-eclusa-real-1080p-master
          path: saida_hero_hd/
          retention-days: 7
          if-no-files-found: warn
