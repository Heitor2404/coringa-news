name: Gerar vídeos do dia

on:
  schedule:                      # 1 vídeo por dia (curiosidade); notícia só pelo botão "Run workflow"
    - cron: "13 12 * * *"       # 09:13 de Brasília → vídeo pronto no Telegram antes do meio-dia
  # disparo de fora (cron-job.org, no horário certo; o agendamento do GitHub chegou a atrasar 7 h e a não disparar — 12/11):
  #   agenda-coringa = o vídeo do dia do Coringa (não repete se já saiu hoje) · agenda-ntc = um Ninguém Te Contou (tema escolhido pelo sistema)
  repository_dispatch:
    types: [agenda-coringa, agenda-ntc]
  workflow_dispatch:             # botão "Run workflow"
    inputs:
      qtd:
        description: "Quantos vídeos de notícia"
        default: "0"
      explica:
        description: "Quantos vídeos Coringa Explica (curiosidade)"
        default: "0"
      tema:
        description: "Notícia específica (opcional, ex.: derrota do Trump)"
        default: ""
      curiosidade:
        description: "Curiosidade específica (opcional, ex.: a história da primeira bomba atômica)"
        default: ""
      parte:
        description: "Parte da curiosidade (1, 2, 3...)"
        default: "1"
      mascote:
        description: "Mascote 3D: 'gerar' = 4 versões no Telegram; número = gera as expressões da versão escolhida"
        default: ""
      ntc:
        description: "Ninguém Te Contou (Valdirene): 'sim' = o sistema escolhe o tema, ou escreva o tema (ex.: E se a internet acabasse?)"
        default: ""
      aprovacao:
        description: "Pedir aprovação no Telegram antes de montar? (sim / não = monta direto e manda o vídeo pronto)"
        default: "sim"
      teste:
        description: "Teste: vídeo de exemplo + amostras de voz"
        type: boolean
        default: false

permissions:
  contents: write                # para salvar data/historico.json

concurrency:
  group: gerar-videos
  cancel-in-progress: false

jobs:
  # O GitHub às vezes atrasa o agendamento das 09:13 em horas. Se o vídeo do dia já foi feito à mão nesse meio tempo,
  # a execução automática atrasada para aqui (≈10 s), sem instalar nada nem mandar outra prévia (10/11–11/11).
  checar:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      pular: ${{ steps.hoje.outputs.pular }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: data
      - id: hoje
        run: |
          # PAUSA (12/11, pedido do Heitor: rodar no manual enquanto melhoramos): disparo automático (agendamento do GitHub e
          # cron-job.org) só roda com a variável AGENDA_ATIVA=1 em Settings → Secrets and variables → Actions → Variables.
          # O botão "Run workflow" continua funcionando sempre.
          if { [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event_name }}" = "repository_dispatch" ]; } && [ "${{ vars.AGENDA_ATIVA }}" != "1" ]; then
            echo "pular=1" >> "$GITHUB_OUTPUT"
            echo "Disparos automáticos pausados (falta AGENDA_ATIVA=1): só rodando no manual."
          elif { [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event.action }}" = "agenda-coringa" ]; } && [ "$(cat data/ultimo_video.txt 2>/dev/null)" = "$(TZ=America/Sao_Paulo date +%F)" ]; then
            echo "pular=1" >> "$GITHUB_OUTPUT"
            echo "Já saiu vídeo hoje: a execução automática (atrasada) não faz nada."
          fi

  gerar:
    needs: checar
    if: needs.checar.outputs.pular != '1'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      # prompts do canal ficam no repositório PRIVADO coringa-cofre (o código é público)
      - name: Baixar o cofre
        uses: actions/checkout@v4
        with:
          repository: Heitor2404/coringa-cofre
          token: ${{ secrets.COFRE_TOKEN }}
          path: cofre
          sparse-checkout: prompts

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # ffmpeg vem do GitHub (binário pronto), não do servidor do Ubuntu, que às vezes fica fora do ar (11/11)
      - name: Instalar ffmpeg
        uses: FedericoCarboni/setup-ffmpeg@v3
        with:
          ffmpeg-version: release

      - name: Instalar dependências
        timeout-minutes: 25         # instalação normal leva ~1,5 min; travou = falha e avisa (não come os 120 min)
        run: |
          # do Ubuntu só a fonte de emoji (detalhe): se o servidor do Ubuntu estiver fora do ar, segue sem ela
          (timeout 120 sudo apt-get update -qq -o Acquire::Retries=2 && timeout 180 sudo apt-get install -y -qq fonts-noto-color-emoji) || echo "apt fora do ar: sigo sem a fonte de emoji"
          command -v ffmpeg > /dev/null && command -v ffprobe > /dev/null || { echo "sem ffmpeg: não dá para montar vídeo"; exit 1; }
          pip install -r requirements.txt
          npm install --no-audit --no-fund
          # navegador: com as bibliotecas do Ubuntu; se o servidor do Ubuntu cair, a máquina do GitHub já tem quase todas
          timeout 420 python -m playwright install --with-deps chromium || timeout 300 python -m playwright install chromium
          # Claude Code: escreve o roteiro usando a assinatura Claude Pro (sem ele, o sistema usa o Gemini como antes)
          timeout 300 npm install -g @anthropic-ai/claude-code --no-audit --no-fund || echo "Claude Code não instalou: sigo com o Gemini"

      - name: Gerar vídeos
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          EUROPEANA_API_KEY: ${{ secrets.EUROPEANA_API_KEY }}
          DATA_GOV_API_KEY: ${{ secrets.DATA_GOV_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          TEMAS_PLANILHA: ${{ vars.TEMAS_PLANILHA }}
          VOZ: ${{ vars.VOZ || 'pt-BR-AntonioNeural' }}
          VOZ_TOM: ${{ vars.VOZ_TOM || '+0Hz' }}
          VOZ_VELOCIDADE: ${{ vars.VOZ_VELOCIDADE || '+10%' }}
          TEMA: ${{ github.event.inputs.tema }}
          CURIOSIDADE: ${{ github.event.inputs.curiosidade }}
          PARTE: ${{ github.event.inputs.parte }}
          AGENDA: ${{ github.event.schedule }}
          MASCOTE: ${{ github.event.inputs.mascote }}
          NTC: ${{ github.event.inputs.ntc }}
          EVENTO: ${{ github.event.action }}
          APROVACAO: ${{ github.event.inputs.aprovacao == 'não' && '0' || github.event.inputs.aprovacao == 'nao' && '0' || '1' }}
        # repositório público: o registro completo (tema, roteiro) não aparece no GitHub; vai para o Telegram se der erro
        run: |
          mkdir -p saida
          set -o pipefail
          (
          if [ "${{ github.event.inputs.teste }}" = "true" ]; then
            python main.py --teste-edge
          elif [ "$EVENTO" = "agenda-ntc" ]; then
            python main.py --fabula
          elif [ "$EVENTO" = "agenda-coringa" ]; then
            python main.py --diario
          elif [ -n "$NTC" ]; then
            if [ "$NTC" = "sim" ]; then python main.py --fabula; else python main.py --fabula "$NTC"; fi
          elif [ -n "$MASCOTE" ]; then
            python main.py --mascote "$MASCOTE"
          elif [ -n "$CURIOSIDADE" ]; then
            python main.py --curiosidade "$CURIOSIDADE" --parte "${PARTE:-1}"
          elif [ -n "$TEMA" ]; then
            python main.py --tema "$TEMA"
          elif [ -n "$AGENDA" ]; then
            python main.py --diario
          elif [ "${{ github.event.inputs.qtd || '0' }}" = "0" ] && [ "${{ github.event.inputs.explica || '0' }}" = "0" ]; then
            python main.py --diario
          else
            python main.py --qtd "${{ github.event.inputs.qtd || '0' }}" --explica "${{ github.event.inputs.explica || '0' }}"
          fi
          ) > saida/registro.txt 2>&1 && ok=1 || ok=0
          grep -E '^\s*\[(aprovação|fiscal final|claude)\]|Traceback|Error' saida/registro.txt | sed -E 's/(resposta: ).*/\1…/' | tail -20 || true
          # Fase 0 (12/11): só NÚMEROS no registro público (custo por etapa, notas, ritmo, áudio); frases e bloqueadores só no Telegram
          grep -E '^\s*\[(custo|fiscal sombra|áudio)\]|💰|🧪|^\s+(fatos|imagem|ritmo|acabamento|narrativa|recursos|áudio) [0-9]|não medido:|🎞' saida/registro.txt | tail -60 || true
          # registro completo vai SEMPRE para o Telegram (sem som), para dá para entender o que aconteceu em cada vídeo
          if [ -n "$TELEGRAM_BOT_TOKEN" ]; then
            cap="📄 Registro completo da execução"; [ "$ok" = "0" ] && cap="📄 Registro do ERRO (veja o fim do arquivo)"
            curl -s -m 30 -F chat_id="$TELEGRAM_CHAT_ID" -F caption="$cap" -F disable_notification=true \
              -F document=@saida/registro.txt "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendDocument" > /dev/null || true
          fi
          [ "$ok" = "1" ]

      # Fase 0 do Coringa (12/11): relatórios JSON, pacote de diagnóstico, registro e vídeo original da rodada guardados por
      # 7 dias. Repositório PÚBLICO: artefato aqui qualquer pessoa logada no GitHub baixa, então vai CRIPTOGRAFADO (AES-256)
      # com o secret ARTEFATOS_SENHA. Sem o secret, não guarda (só avisa). Nada disso vai para o repositório, e falha aqui
      # nunca derruba a produção (continue-on-error). Rodada do NTC fica de fora (o NTC tem o próprio arquivo, no cofre).
      - name: Empacotar arquivos da rodada do Coringa (criptografado)
        if: always() && github.event.inputs.ntc == '' && github.event.action != 'agenda-ntc'
        continue-on-error: true
        env:
          ARTEFATOS_SENHA: ${{ secrets.ARTEFATOS_SENHA }}
        run: |
          if [ -z "$ARTEFATOS_SENHA" ]; then
            echo "::warning::Sem o secret ARTEFATOS_SENHA: os arquivos da rodada NÃO foram guardados."
            exit 0
          fi
          [ -d saida ] || exit 0
          cd saida
          find . -type f ! -path './pacotes_ntc/*' ! -name '*-telegram.mp4' \
            \( -name '*.json' -o -name '*-diagnostico.zip' -o -name '*.mp4' -o -name '*.txt' -o -name '*-capa.jpg' \) | sort > ../lista_rodada.txt
          if [ ! -s ../lista_rodada.txt ]; then echo "nenhum arquivo da rodada para guardar"; exit 0; fi
          echo "guardando $(wc -l < ../lista_rodada.txt) arquivo(s), $(du -ch $(cat ../lista_rodada.txt) | tail -1 | cut -f1)"
          tar -cf - -T ../lista_rodada.txt | gpg --batch --yes --quiet --pinentry-mode loopback --passphrase-fd 3 \
            --symmetric --cipher-algo AES256 -o ../coringa-rodada.tar.gpg 3<<< "$ARTEFATOS_SENHA"

      - name: Guardar arquivos da rodada do Coringa (7 dias)
        if: always() && hashFiles('coringa-rodada.tar.gpg') != ''
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: coringa-rodada-${{ github.run_id }}
          path: coringa-rodada.tar.gpg
          retention-days: 7
          compression-level: 0
          if-no-files-found: ignore

      # NTC Fase 4 (CP1): pacote de reprodução de cada vídeo (roteiro, montagem, motor, eventos) vai para o cofre PRIVADO
      - name: Arquivar pacotes do NTC no cofre
        if: always() && hashFiles('saida/pacotes_ntc/*.json') != ''
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          cd cofre
          git sparse-checkout add arquivo_ntc
          mkdir -p arquivo_ntc
          cp ../saida/pacotes_ntc/*.json arquivo_ntc/
          git config user.name "coringa-bot"
          git config user.email "actions@users.noreply.github.com"
          git add arquivo_ntc
          if git diff --cached --quiet; then exit 0; fi
          git commit -q -m "pacote NTC $(date +%F) (run ${{ github.run_id }})"
          if ! (git push -q || (git pull --rebase -q && git push -q)); then
            echo "pacote NTC: não consegui enviar ao cofre"
            [ -n "$TELEGRAM_BOT_TOKEN" ] && curl -s -m 20 "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
              --data-urlencode "chat_id=$TELEGRAM_CHAT_ID" \
              --data-urlencode "text=⚠️ Pacote do NTC não foi salvo no cofre (o token do cofre pode ser só leitura). O vídeo saiu normal." > /dev/null || true
          fi

      - name: Salvar histórico
        if: always()
        run: |
          git config user.name "coringa-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/ assets/mascote3d/ 2>/dev/null || git add data/ || true
          git diff --cached --quiet || (git commit -m "histórico $(date +%F)" && (git push || (git pull --rebase -q && git push))) || true   # main pode ter mudado durante o vídeo

      # o main.py avisa sozinho quando não sai vídeo; isto cobre o caso em que ele NEM CHEGOU a rodar
      # (instalação travada, erro do GitHub, tempo esgotado)
      - name: Avisar no Telegram se o workflow quebrou
        if: failure() || cancelled()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          LINK: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ] || exit 0
          curl -s -m 20 "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
            --data-urlencode "chat_id=$TELEGRAM_CHAT_ID" \
            --data-urlencode "text=⚠️ O workflow 'Gerar vídeos do dia' quebrou antes de terminar (instalação travada ou erro do GitHub). Dá para rodar de novo em Actions → Run workflow. Detalhes: $LINK" > /dev/null || true
