name: Mídia de teste V2.2 (download licenciado)

# Esta máquina de desenvolvimento não alcança o Commons/LoC; o Actions alcança. Dispara quando o manifesto muda no
# ramo de correção (workflow_dispatch exigiria o arquivo na main, que não é alterada). Sem IA paga: só downloads de
# mídia livre e alinhamento local com faster-whisper. Resultado: ramo órfão midia-teste-v22 (só mídia + metadados).
on:
  push:
    branches: [visual-v2-2-correcao-final]
    paths: ["tests/midia/manifesto.json", "scripts/v22_baixar_midia.py", ".github/workflows/midia-teste-v22.yml"]

permissions:
  contents: write

jobs:
  baixar:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: (timeout 120 sudo apt-get update -qq && timeout 240 sudo apt-get install -y -qq ffmpeg) || sudo apt-get install -y -qq ffmpeg
      - run: pip install -q faster-whisper==1.1.1 requests
      - run: python scripts/v22_baixar_midia.py tests/midia/manifesto.json /tmp/midia
      - name: Publica no ramo órfão midia-teste-v22
        run: |
          cd /tmp/midia
          git init -q -b midia-teste-v22
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git add -A && git commit -q -m "mídia de teste V2.2 (licenças em <id>.json) — origem ${GITHUB_SHA}"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" midia-teste-v22
