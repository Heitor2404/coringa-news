name: Piloto de produção V2.2 (Coringa Explica)

# EXPERIMENTAL, isolado e reversível. Roda o fluxo REAL do Coringa (python main.py --curiosidade, execução única) com o
# motor visual V2.2 ligado só por MOTOR_VISUAL=v2. Mesmo cofre, mesmo roteirista (Claude Code pela assinatura, Gemini
# de reserva), mesma voz e configurações da produção. Diferenças em relação ao "Gerar vídeos do dia", todas de
# isolamento: sem aprovação e sem envio no Telegram, sem salvar histórico no repositório, resultado entregue
# CRIPTOGRAFADO para a chave pública descartável em .github/piloto/ (repositório público). Não toca o NTC.
# Dispara quando .github/piloto/pedido.txt muda neste ramo (workflow_dispatch exigiria o arquivo na main).
on:
  push:
    branches: [piloto-v24-lagartixa]
    paths: [".github/piloto/pedido.txt", ".github/piloto/retomar.txt"]

permissions:
  contents: read

concurrency:
  group: piloto-v22
  cancel-in-progress: false

jobs:
  piloto:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - name: Baixar o cofre
        uses: actions/checkout@v4
        with:
          repository: Heitor2404/coringa-cofre
          token: ${{ secrets.COFRE_TOKEN }}
          path: cofre
          sparse-checkout: prompts
      - name: Prompts EXPERIMENTAIS da Evidência V1 (ramo evidencia-v1 do cofre; os de produção ficam como estão)
        uses: actions/checkout@v4
        with:
          repository: Heitor2404/coringa-cofre
          ref: evidencia-v1
          token: ${{ secrets.COFRE_TOKEN }}
          path: cofre_evidencia
          sparse-checkout: prompts
      - run: cp cofre_evidencia/prompts/PROMPT_CATALOGO_EVIDENCIA.txt cofre_evidencia/prompts/PROMPT_CASAR_EVIDENCIA.txt cofre/prompts/
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: ffmpeg (pacote do sistema; a ação setup-ffmpeg quebrou em 15/11: "Failed to read version from readme")
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg && ffmpeg -version | head -1
      - name: Natural Earth (cache)
        uses: actions/cache@v4
        with:
          path: src/render/v2/dados/ne
          key: natural-earth-v5.1.2-${{ hashFiles('scripts/v2_natural_earth.py') }}
      - name: Instalar dependências (as mesmas da produção + dados do V2)
        timeout-minutes: 25
        run: |
          (timeout 120 sudo apt-get update -qq -o Acquire::Retries=2 && timeout 180 sudo apt-get install -y -qq fonts-noto-color-emoji) || echo "apt fora do ar"
          pip install -r requirements.txt
          npm install --no-audit --no-fund
          timeout 420 python -m playwright install --with-deps chromium || timeout 300 python -m playwright install chromium
          timeout 300 npm install -g @anthropic-ai/claude-code@2.1.322 --no-audit --no-fund || echo "Claude Code não instalou: sigo com o Gemini"
          python scripts/v2_natural_earth.py
      # V2.4: retomada sem refazer pesquisa/acervo/roteiro. .github/piloto/retomar.txt = "<run_id> [roteiro|acervo|pesquisa]"
      # (vazio = execução nova). O checkpoint fica no CACHE do Actions (não é público, ao contrário dos artefatos).
      - name: Ler pedido de retomada
        id: ret
        run: |
          linha=$(grep -v '^#' .github/piloto/retomar.txt 2>/dev/null | head -1 | tr -s ' ' || true)
          echo "run=$(echo "$linha" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          etapa=$(echo "$linha" | cut -s -d' ' -f2); echo "etapa=${etapa:-roteiro}" >> "$GITHUB_OUTPUT"
      - name: Restaurar checkpoint (cifrado)
        id: ck
        if: steps.ret.outputs.run != ''
        uses: actions/cache/restore@v4
        with:
          path: checkpoint_cache
          key: piloto-checkpoint-${{ steps.ret.outputs.run }}
          fail-on-cache-miss: true
      - name: Abrir checkpoint (chave derivada de segredo; confere sha256)
        if: steps.ret.outputs.run != ''
        env:
          CHECKPOINT_KEY: ${{ secrets.CHECKPOINT_KEY }}
          COFRE_TOKEN: ${{ secrets.COFRE_TOKEN }}
        run: |
          set -e
          chave="${CHECKPOINT_KEY:-$(printf 'coringa-checkpoint-v1:%s' "$COFRE_TOKEN" | sha256sum | cut -d' ' -f1)}"
          export GNUPGHOME=$(mktemp -d)
          gpg --batch --quiet --pinentry-mode loopback --passphrase-fd 3 -o ck.tgz -d checkpoint_cache/checkpoint.tgz.gpg 3<<<"$chave"
          echo "$(cat checkpoint_cache/checkpoint.tgz.sha256)  ck.tgz" | sha256sum -c -
          mkdir -p checkpoint_origem && tar -xzf ck.tgz -C checkpoint_origem && rm ck.tgz
          ls checkpoint_origem/checkpoint
      - name: Aplicar edição editorial auditada (se houver, para este checkpoint)
        if: steps.ret.outputs.run != '' && hashFiles('.github/piloto/edicao.json') != ''
        run: |
          base=$(python -c "import json;print(json.load(open('.github/piloto/edicao.json')).get('base_run',''))")
          if [ "$base" = "${{ steps.ret.outputs.run }}" ]; then python -m src.v2.checkpoint editar checkpoint_origem/checkpoint .github/piloto/edicao.json; else echo "edição é de outro checkpoint ($base): ignorada"; fi
      - name: Gerar UM vídeo (fluxo real, motor V2.2)
        env:
          MOTOR_VISUAL: v2
          EVIDENCIA_V1: sombra
          EVIDENCIA_V1_VISAO: "0"      # 15/11: leitura visual da V1 desligada nesta retomada (503/422); V1 segue em sombra
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          APROVACAO: "0"
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ORCAMENTO_MODO: ${{ vars.ORCAMENTO_MODO }}
          EUROPEANA_API_KEY: ${{ secrets.EUROPEANA_API_KEY }}
          DATA_GOV_API_KEY: ${{ secrets.DATA_GOV_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          TEMAS_PLANILHA: ${{ vars.TEMAS_PLANILHA }}
          VOZ: ${{ vars.VOZ || 'pt-BR-AntonioNeural' }}
          VOZ_TOM: ${{ vars.VOZ_TOM || '+0Hz' }}
          VOZ_VELOCIDADE: ${{ vars.VOZ_VELOCIDADE || '+10%' }}
        run: |
          mkdir -p saida
          ini=$(date +%s)
          python - "$(cat .github/piloto/pedido.txt)" "${{ steps.ret.outputs.run }}" "${{ steps.ret.outputs.etapa }}" > saida/tempo_memoria.txt <<'PY' && ok=1 || ok=0
          import resource, subprocess, sys, time
          t = time.time()
          with open('saida/registro.txt', 'w') as f:
              args = ['--retomar', 'checkpoint_origem/checkpoint', '--retomar-etapa', sys.argv[3]] if sys.argv[2] else ['--curiosidade', sys.argv[1], '--parte', '1']
              rc = subprocess.run([sys.executable, 'main.py'] + args, stdout=f, stderr=subprocess.STDOUT).returncode
          print(f'tempo_total_s={time.time() - t:.1f} pico_memoria_mb={resource.getrusage(resource.RUSAGE_CHILDREN).ru_maxrss / 1024:.0f} rc={rc}')
          sys.exit(rc)
          PY
          echo "duracao_total_s=$(( $(date +%s) - ini )) ok=$ok" | tee saida/resultado_piloto.txt
          # só números no log público (como na produção); texto completo vai no pacote criptografado
          grep -E '^\s*\[(custo|orçamento)\]|💰|🎞' saida/registro.txt | tail -30 || true
          cat saida/tempo_memoria.txt || true
      - name: Estado da execução
        id: st
        if: always()
        run: |
          f=$(ls saida/*/status_execucao.json 2>/dev/null | head -1 || true)
          if [ -n "$f" ]; then st=$(python -c "import json,sys;print(json.load(open(sys.argv[1]))['status'])" "$f"); else st=FALHA_OPERACIONAL; fi
          mp4=$(ls saida/*/*.mp4 2>/dev/null | grep -v -- '-piloto/' | head -1 || true)
          if [ -z "$mp4" ] && { [ "$st" = MP4_GERADO ] || [ "$st" = APROVADO_FISCAL ]; }; then st=FALHA_OPERACIONAL; fi
          echo "status=$st" >> "$GITHUB_OUTPUT"
          echo "STATUS=$st mp4=$([ -n "$mp4" ] && echo sim || echo nao)" | tee -a saida/resultado_piloto.txt
          echo "### Piloto V2.4: \`$st\` (MP4: $([ -n "$mp4" ] && echo sim || echo não))" >> "$GITHUB_STEP_SUMMARY"
      - name: Cifrar o checkpoint desta execução (AES256, chave derivada de segredo)
        id: novo
        if: always()
        env:
          CHECKPOINT_KEY: ${{ secrets.CHECKPOINT_KEY }}
          COFRE_TOKEN: ${{ secrets.COFRE_TOKEN }}
        run: |
          d=$(ls -d saida/*/checkpoint 2>/dev/null | head -1 || true)
          if [ -z "$d" ]; then echo "sem checkpoint"; exit 0; fi
          if [ -z "$CHECKPOINT_KEY$COFRE_TOKEN" ]; then echo "sem segredo para cifrar: checkpoint NÃO vai para o cache"; exit 0; fi
          set -e
          chave="${CHECKPOINT_KEY:-$(printf 'coringa-checkpoint-v1:%s' "$COFRE_TOKEN" | sha256sum | cut -d' ' -f1)}"
          rm -rf checkpoint_cache && mkdir checkpoint_cache
          tar -czf ck.tgz -C "$(dirname "$d")" checkpoint
          sha256sum ck.tgz | cut -d' ' -f1 > checkpoint_cache/checkpoint.tgz.sha256
          export GNUPGHOME=$(mktemp -d)
          gpg --batch --quiet --pinentry-mode loopback --passphrase-fd 3 --symmetric --cipher-algo AES256 -o checkpoint_cache/checkpoint.tgz.gpg ck.tgz 3<<<"$chave"
          rm ck.tgz; ls -la checkpoint_cache; echo "tem=1" >> "$GITHUB_OUTPUT"
      - name: Guardar checkpoint cifrado (cache; retomar com retomar.txt = "${{ github.run_id }} roteiro")
        if: always() && steps.novo.outputs.tem == '1'
        uses: actions/cache/save@v4
        with:
          path: checkpoint_cache
          key: piloto-checkpoint-${{ github.run_id }}
      - name: Empacotar e cifrar para as chaves do piloto
        if: always()
        run: |
          set -e
          export GNUPGHOME=$(mktemp -d)
          tar -czf piloto.tgz saida
          rec=$(for k in .github/piloto/chave_publica*.asc; do printf -- '--recipient-file %s ' "$k"; done)
          gpg --batch --yes --quiet --trust-model always --encrypt $rec -o piloto.tgz.gpg piloto.tgz
          rm piloto.tgz; ls -la piloto.tgz.gpg
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: piloto-v22-${{ github.run_id }}
          path: piloto.tgz.gpg
          retention-days: 7
          compression-level: 0
      - name: Resultado audiovisual (sem MP4 não é sucesso)
        if: always()
        run: |
          st="${{ steps.st.outputs.status }}"
          echo "status final: ${st:-FALHA_OPERACIONAL}"
          case "$st" in MP4_GERADO|APROVADO_FISCAL) exit 0 ;; *) echo "::error::execução sem MP4 aprovado para auditoria ($st); diagnóstico no pacote cifrado"; exit 1 ;; esac
