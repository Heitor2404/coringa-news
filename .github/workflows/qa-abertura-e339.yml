name: E339 - abertura narrada comparativa com acervo existente
on:
  push:
    branches: [atlas-direcao-visual-20261118]
    paths: ['.github/workflows/qa-abertura-e339.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CAIXA_MAX_CHAMADAS: '0'
      CAIXA_TETO_USD: '0'
      USAR_CLAUDE: '0'
      REMOTION_CHROME: /usr/bin/google-chrome
      REMOTION_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: ./.github/actions/setup-ffmpeg
      - uses: actions/setup-python@v5
        with: {python-version: '3.13', cache: pip}
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm, cache-dependency-path: motor4/package-lock.json}
      - name: Testes do macrobloco
        run: |
          python -m pip install -q -r requirements.txt beautifulsoup4 pytest
          npm ci --prefix motor4 --no-audit --no-fund
          python -m pytest -q tests/test_reedicao_fala_e339.py tests/test_auditoria_fala_visual_e338.py tests/test_composicao_e286.py tests/test_imersao_e328.py tests/test_cortes_revisados_e302.py tests/test_evidencias_estaticas_e321.py tests/test_replanejamento_e319.py
      - name: Restaurar somente fontes e mix da abertura
        env:
          GH_TOKEN: ${{ secrets.COFRE_TOKEN }}
        run: python -m scripts.qa_abertura_e339
      - name: Renderizar somente alternativa de 260 frames
        run: |
          cd motor4
          npx --no-install remotion render remotion/src/index.ts FilmeEditorial ../stage_documental/e339/variant.mp4 --props=../stage_documental/e339/variant.json --codec=h264 --crf=20 --scale=0.5 --concurrency=4 --public-dir=remotion/public --log=error
      - name: Conferir comparacao
        run: python -m scripts.qa_abertura_e339 --finish
      - name: Preservar comparacao privada
        if: always()
        env:
          GH_TOKEN: ${{ secrets.COFRE_TOKEN }}
        run: |
          shopt -s nullglob
          root=stage_documental/e339
          if [[ -s "$root/comparison.json" ]]; then
            files=("$root/comparison.json" "$root"/pair-*.jpg)
            python scripts/espelhar_revisao_cofre.py "e339-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" "${files[@]}"
            if [[ -s "$root/baseline.mp4" && -s "$root/variant.mp4" ]]; then
              bash scripts/arquivar_cofre_review.sh "review-e339-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" "$root/comparison.json" "$root/baseline.mp4" "$root/variant.mp4"
            fi
          fi
