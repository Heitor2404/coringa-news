name: E272 - adquirir somente tres pistas inspecionadas sem IA
on:
  push:
    branches: [atlas-direcao-visual-20261118]
    paths: ['.github/workflows/qa-adquirir-pretriagem-e272.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  acquire:
    if: github.ref == 'refs/heads/atlas-direcao-visual-20261118'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CAIXA_MAX_CHAMADAS: '0'
      CAIXA_TETO_USD: '0'
      USAR_CLAUDE: '0'
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.13', cache: pip}
      - run: |
          python -m pip install -q -r requirements.txt beautifulsoup4 pytest
          python -m pytest -q tests/test_adquirir_pretriagem_e272.py tests/test_pretriagem_e269.py tests/test_validar_arquivo_documental.py
      - name: Recuperar relatorio privado E270
        env:
          GH_TOKEN: ${{ secrets.COFRE_TOKEN }}
        run: |
          python - <<'PY'
          import base64,hashlib
          from pathlib import Path
          from scripts.recuperar_checkpoints_documentais import api
          m=api('');assert m.get('private') is True and m.get('id')==1454059520
          j=api('/contents/revisoes/e270-45619212982-1/pretriagem.json?ref=revisao-privada')
          raw=base64.b64decode(j['content']);assert len(raw)==j['size']
          assert hashlib.sha1(('blob '+str(len(raw))+'\0').encode()+raw).hexdigest()==j['sha']
          Path('pretriagem-e270.json').write_bytes(raw)
          PY
      - name: Adquirir somente selecionados
        run: python -m scripts.qa_adquirir_pretriagem_e272 benchmarks/e254/documentario.json pretriagem-e270.json benchmarks/e265/pretriagem_selecionada.json qa_e272
      - name: Preservar originais e pistas privadas
        env:
          GH_TOKEN: ${{ secrets.COFRE_TOKEN }}
        run: |
          shopt -s nullglob
          files=(qa_e272/*.json qa_e272/*.jpg)
          packets=(qa_e272/checkpoints/*.zip)
          if (( ${#packets[@]} > 0 )); then
            bash scripts/arquivar_cofre_review.sh "review-e272-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" "${files[@]}" qa_e272/manifesto-revisoes.jsonl "${packets[@]}"
          fi
          python scripts/espelhar_revisao_cofre.py "e272-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" "${files[@]}"
