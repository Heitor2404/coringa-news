name: E257 - amostragem distribuida de filmagens
on:
  push:
    branches: [atlas-direcao-visual-20261118]
    paths: ['.github/workflows/qa-amostragem-e257.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sampling:
    if: github.ref == 'refs/heads/atlas-direcao-visual-20261118'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.13', cache: pip}
      - run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg
          fi
          python -m pip install -q -r requirements.txt beautifulsoup4 pytest
      - name: Regressao sem IA
        run: python -m pytest -q tests/test_amostragem_documental_e257.py tests/test_direcao_observacao_e239.py tests/test_revisao_documental_e247.py tests/test_revisao_adaptativa_e248.py tests/test_ponte_multimodal_e256.py
      - name: Pesquisa e revisao em lote de filmagem real
        id: review
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          CAIXA_MAX_CHAMADAS: '2'
          CAIXA_TETO_USD: '0'
          USAR_CLAUDE: '0'
        run: python -m scripts.qa_revisao_documental_e247 benchmarks/e257/necessidades.json stage_documental/e257 movimento --adaptativa --qualidade
      - name: Preservar relatorio original
        if: ${{ !cancelled() && steps.review.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ secrets.COFRE_TOKEN }}
        run: |
          shopt -s nullglob
          root=stage_documental/e257
          bash scripts/arquivar_cofre_review.sh "review-e257-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" "$root/revisao.json" "$root"/revisao-*.jpg
      - name: Espelhar diagnostico e imagens
        if: ${{ !cancelled() && steps.review.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ secrets.COFRE_TOKEN }}
        run: |
          shopt -s nullglob
          root=stage_documental/e257
          python scripts/espelhar_revisao_cofre.py "e257-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" "$root/revisao.json" "$root"/revisao-*.jpg
      - name: Registrar cobertura real sem declarar sucesso semantico
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('stage_documental/e257/revisao.json').read_text())
          assert r['visao_chamadas_logicas']<=2 and r['publish'] is False
          print('E257 RESULTADO',r['cobertura'][0]['estado'],'chamadas',r['visao_chamadas_logicas'])
          PY
