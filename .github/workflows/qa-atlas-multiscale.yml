name: E240 - ATLAS multiescala transicao privada
on:
  push:
    branches: [atlas-direcao-visual-20261118]
    paths: ['benchmarks/e236/regioes.json','.github/workflows/qa-atlas-multiscale.yml']
  workflow_dispatch:
permissions:
  contents: read
env:
  DO_NOT_TRACK: "1"
  REMOTION_CHROME: /usr/bin/google-chrome
  CORINGA_CHROME: /usr/bin/google-chrome
jobs:
  map:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    if: github.ref == 'refs/heads/atlas-direcao-visual-20261118'
    strategy:
      fail-fast: false
      matrix:
        case: [grand_canyon, gibraltar]
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - uses: actions/setup-node@v4
        with: {node-version: "22", cache: npm, cache-dependency-path: motor4/package-lock.json}
      - name: Dependências e regressões
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg
          fi
          python -m pip install -q -r requirements.txt beautifulsoup4 pytest
          npm ci --prefix motor4 --no-audit --no-fund
          python -m pytest -q tests/test_ponte_mapa_atlas_filme.py tests/test_atlas_base_regional_e235.py tests/test_direcao_e234.py tests/test_atlas_multiscale_e237.py
      - name: Adquirir mapa regional e renderizar no ATLAS original
        run: python -m scripts.qa_atlas_multiscale benchmarks/e236/regioes.json ${{ matrix.case }}
      - name: Enviar prova cartográfica privada
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          from pathlib import Path
          from src.v3 import previa_telegram as T
          try:
              chat,info=T.chat_autorizado()
              r=T._api('sendVideo',{'chat_id':chat,'caption':'CORINGA · E240. Prova cartográfica ${{ matrix.case }}, 5,5s. Mapa de referência, não episódio. Revisão visual pendente.','supports_streaming':'true'},('video',T._caber(Path('qa_atlas_multiscale/${{ matrix.case }}/mapa.mp4'))))
              if not isinstance(r,dict) or not r.get('message_id'):raise RuntimeError()
          except Exception:
              raise SystemExit('Entrega privada não confirmada') from None
          print('MAPA PRIVADO ENTREGUE')
          PY
  avisar_falha:
    needs: map
    if: ${{ always() && (needs.map.result == 'failure' || needs.map.result == 'cancelled') }}
    permissions:
      actions: read
      contents: none
    uses: ./.github/workflows/notificar-falha-documental.yml
    with:
      result: ${{ needs.map.result }}
      job_name: map
    secrets:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
