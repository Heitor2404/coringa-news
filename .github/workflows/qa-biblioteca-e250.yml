name: E250 - biblioteca privada entre runners
on:
  push:
    branches: [atlas-direcao-visual-20261118]
    paths: ['.github/workflows/qa-biblioteca-e250.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  acquire:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    if: github.ref == 'refs/heads/atlas-direcao-visual-20261118'
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.13', cache: pip}
      - run: python -m pip install -q -r requirements.txt beautifulsoup4 pytest
      - run: python -m pytest -q tests/test_pacote_biblioteca_e250.py tests/test_acervo_recuperacao_e246.py
      - run: python -m scripts.qa_biblioteca_e250 acquire qa_e250
      - name: Gravar originais apenas em release privada em rascunho
        env:
          GH_TOKEN: ${{ secrets.COFRE_TOKEN }}
        run: |
          set -euo pipefail
          repo=Heitor2404/coringa-cofre
          tag="review-e250-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          test "$(gh api "repos/$repo" --jq '.private and (.id == 1454059520)')" = true
          if gh release view "$tag" --repo "$repo" >/dev/null 2>&1; then exit 1; fi
          gh release create "$tag" qa_e250/pacote/* --repo "$repo" --draft --target revisao-privada --title "E250 biblioteca privada" --notes "Originais em quarentena; direitos pendentes. Nao publicar."
  restore:
    needs: acquire
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.13', cache: pip}
      - run: python -m pip install -q -r requirements.txt beautifulsoup4
      - name: Recuperar pacote privado em runner novo
        env:
          GH_TOKEN: ${{ secrets.COFRE_TOKEN }}
        run: |
          set -euo pipefail
          repo=Heitor2404/coringa-cofre
          tag="review-e250-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          test "$(gh api "repos/$repo" --jq '.private and (.id == 1454059520)')" = true
          test "$(gh release view "$tag" --repo "$repo" --json isDraft --jq '.isDraft')" = true
          mkdir -p qa_e250/pacote
          gh release download "$tag" --repo "$repo" --pattern '*' --dir qa_e250/pacote
      - run: python -m scripts.qa_biblioteca_e250 restore qa_e250
      - name: Espelhar prova sem copiar originais para Git
        env:
          GH_TOKEN: ${{ secrets.COFRE_TOKEN }}
        run: |
          cp qa_e250/pacote/index.json qa_e250/pacote-index.json
          python scripts/espelhar_revisao_cofre.py "e250-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" qa_e250/revisao.json qa_e250/pacote-index.json qa_e250/pacote/recibos.json
