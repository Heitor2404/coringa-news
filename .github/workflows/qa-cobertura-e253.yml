name: E253 - cobertura documental multicenas privada
on:
  push:
    branches: [atlas-direcao-visual-20261118]
    paths: ['.github/workflows/qa-cobertura-e253.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  coverage:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    if: github.ref == 'refs/heads/atlas-direcao-visual-20261118'
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.13', cache: pip}
      - run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg
          fi
          python -m pip install -q -r requirements.txt beautifulsoup4 pytest
      - run: python -m pytest -q tests/test_cobertura_documental_e253.py tests/test_revisao_adaptativa_e248.py tests/test_revisao_documental_e247.py tests/test_acervo_documental_e246.py tests/test_reuso_documental_e251.py tests/test_fontes_cientificas_e252.py
      - name: Cobertura de quatro necessidades
        id: revisao
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          CAIXA_MAX_CHAMADAS: '4'
          CAIXA_TETO_USD: '0'
          USAR_CLAUDE: '0'
        run: python -m scripts.qa_revisao_documental_e247 benchmarks/e253/necessidades.json qa_revisao paisagens_glaciais --adaptativa --multicenas
      - name: Espelhar cobertura e folhas no cofre privado
        if: ${{ !cancelled() && steps.revisao.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ secrets.COFRE_TOKEN }}
        run: |
          shopt -s nullglob
          python scripts/espelhar_revisao_cofre.py "e253-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" qa_revisao/revisao.json qa_revisao/revisao-*.jpg
      - name: Conferir relatorio de cobertura
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('qa_revisao/revisao.json').read_text())
          c=r['cobertura_documentario']
          assert c['total']==4 and c['resumo']['DELEGAR_ATLAS']==1
          assert c['consumo']['visao']<=4
          assert [x['necessidade_id'] for x in c['cobertura']]==['n1','n2','n3','n4']
          assert not c['pronto_para_render'] and not c['publicar']
          print('E253 COBERTURA',c['resumo'],c['consumo'])
          PY
      - name: Enviar revisao privada ao Telegram
        if: ${{ !cancelled() && steps.revisao.outcome == 'success' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          from pathlib import Path
          from src.v3 import previa_telegram as T
          chat,_=T.chat_autorizado()
          for p in [Path('qa_revisao/revisao.json'),*sorted(Path('qa_revisao').glob('revisao-*.jpg'))]:
              r=T._api('sendDocument',{'chat_id':chat,'caption':'CORINGA E253 - cobertura multicenas privada; direitos pendentes.'},('document',p))
              if not isinstance(r,dict) or not r.get('message_id'):raise RuntimeError('Entrega privada nao confirmada')
          PY
