name: E312 - painel observado de comparacao sem escala comum
on:
  push:
    branches: [atlas-direcao-visual-20261118]
    paths: ['.github/workflows/qa-comparacao-e311.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  visual:
    if: github.ref == 'refs/heads/atlas-direcao-visual-20261118'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CAIXA_MAX_CHAMADAS: '0'
      CAIXA_TETO_USD: '0'
      USAR_CLAUDE: '0'
      REMOTION_CHROME: /usr/bin/google-chrome
      REMOTION_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.13', cache: pip}
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm, cache-dependency-path: motor4/package-lock.json}
      - name: Testes e prova da ponte
        run: |
          python -m pip install -q -r requirements.txt pytest beautifulsoup4
          npm ci --prefix motor4 --no-audit --no-fund
          python -m pytest -q tests/test_comparacao_e311.py tests/test_direcao_explicativa_e310.py tests/test_replanejamento_e308.py tests/test_direcao_short_e306.py tests/test_filme_editorial.py
          ./motor4/node_modules/.bin/tsc -p motor4/remotion/tsconfig.json --noEmit
          python -m scripts.qa_comparacao_e311
      - name: Renderizar registros e medir tipografia
        run: cd motor4 && node scripts/qa_comparacao_e311.mjs
      - name: Preservar prova privada
        env:
          GH_TOKEN: ${{ secrets.COFRE_TOKEN }}
        run: |
          root=stage_documental/e311
          python scripts/espelhar_revisao_cofre.py "e311-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" "$root/comparison.json" "$root/comparison-measures.json" "$root/n0.png" "$root/n1.png" "$root/paired.png"
