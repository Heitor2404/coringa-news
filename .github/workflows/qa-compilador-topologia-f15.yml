name: "LAB F15 — selecionar mecanismo por grafo estruturado e render privado"
on:
  push:
    branches: [atlas-direcao-visual-20261118]
    paths:
      - ".github/workflows/qa-compilador-topologia-f15.yml"
      - "src/v4/formatos/compilador_topologia_f15.py"
      - "src/v4/formatos/pedidos_topologia_f15/**"
      - "tests/test_compilador_topologia_f15.py"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: lab-f15-topologia-seletor-estrutural
  cancel-in-progress: true
jobs:
  seleccionar_e_bloquear:
    runs-on: ubuntu-22.04
    timeout-minutes: 27
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Dependências existentes, sem Claude, reconhecimento ou imagens externas
        run: |
          python -m pip install -q pytest cairosvg pillow numpy scipy opencv-python-headless
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update -qq
            sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends ffmpeg
          fi
      - name: Comprovar isomorfismo, bloqueios, física e regressões F7 e F14
        run: |
          python -m pytest -q \
            tests/test_compilador_topologia_f15.py \
            tests/test_engrenagens_f14.py \
            tests/test_mecanica_parametrica_f7.py
      - name: Gerar dois planos e dois MP4s usando o compilador SEM escolher renderer na CLI
        timeout-minutes: 11
        run: |
          mkdir -p qa_f15
          python -m src.v4.formatos.compilador_topologia_f15 \
            src/v4/formatos/pedidos_topologia_f15/pedido_estrutura_biela_f15.json \
            --plan qa_f15/PLANO_BIELA_F15.json \
            --render qa_f15/BIELA_COMPILADA_F15.mp4
          python -m src.v4.formatos.compilador_topologia_f15 \
            src/v4/formatos/pedidos_topologia_f15/pedido_estrutura_engrenagens_f15.json \
            --plan qa_f15/PLANO_ENGRENAGENS_F15.json \
            --render qa_f15/ENGRENAGENS_COMPILADAS_F15.mp4
      - name: Contraprovas de topologia inválida sem gerar MP4
        run: |
          python - <<'PY'
          import copy,json
          from pathlib import Path
          from src.v4.formatos import compilador_topologia_f15 as F
          base=Path('src/v4/formatos/pedidos_topologia_f15')
          root=Path('qa_f15')
          a=json.loads((base/'pedido_estrutura_biela_f15.json').read_text('utf8'))
          b=json.loads((base/'pedido_estrutura_engrenagens_f15.json').read_text('utf8'))
          cases={}
          bad=copy.deepcopy(a)
          bad['graph']['edges'][1]['joint']='meshes_with'
          cases['incorrect_joint']=bad
          bad=copy.deepcopy(b)
          bad['graph']['nodes'].append({'id':'new_invented_part','kind':'spur_gear'})
          cases['extra_part']=bad
          bad=copy.deepcopy(a)
          bad['required_events']=['curso_descendente','combustao_ficticia']
          cases['unknown_event']=bad
          bad=copy.deepcopy(b)
          bad['evidence']['source_is_image_license']=True
          cases['unverified_license']=bad
          bad=copy.deepcopy(a)
          bad['publish']=True
          cases['publish_request']=bad
          errors={}
          for name,bad in cases.items():
              try:F.compile_request(bad)
              except ValueError as e:
                  assert str(e).startswith('F15-BLOQUEADO-'),str(e)
                  errors[name]=str(e)
              else:
                  raise AssertionError('unexpectedly accepted '+name)
          assert len(errors)==5
          (root/'RECUSAS_F15.json').write_text(
              json.dumps({'schema':'f15-refusals-v1','cases':errors,
                  'publish':False},ensure_ascii=False,indent=2),encoding='utf8')
          PY
      - name: Conferir mídia real, roteamento, SHA, estágios e folha comparativa
        run: |
          python - <<'PY'
          import json,hashlib,subprocess
          from pathlib import Path
          from PIL import Image
          root=Path('qa_f15')
          items=[
            ('PLANO_BIELA_F15.json','BIELA_COMPILADA_F15.mp4','slider_crank_parametrico'),
            ('PLANO_ENGRENAGENS_F15.json','ENGRENAGENS_COMPILADAS_F15.mp4','external_spur_gear_reduction'),
          ]
          compare=Image.new('RGB',(4*270,2*480),'#edf3f7')
          output={}
          for row,(plan_name,movie_name,family) in enumerate(items):
              plan=json.loads((root/plan_name).read_text('utf8'))
              assert plan['compiled_family']==family
              assert plan['selected_by']=='ISOMORFISMO_GRAFO_TIPADO_EXATO'
              assert not plan['title_used_for_dispatch']
              assert not plan['publish'] and not plan['visual_approval']
              assert not plan['media_license_verified']
              assert not plan['industrial_identity_verified']
              mp4=root/movie_name
              meta=json.loads(subprocess.check_output(['ffprobe','-v','error',
                 '-show_entries','stream=codec_type,width,height,r_frame_rate:format=duration',
                 '-of','json',str(mp4)]))
              video=next(s for s in meta['streams'] if s['codec_type']=='video')
              assert (video['width'],video['height'])==(540,960)
              assert video['r_frame_rate']=='24/1'
              assert abs(float(meta['format']['duration'])-9.0)<.06
              assert not any(s['codec_type']=='audio' for s in meta['streams'])
              original=json.loads(mp4.with_suffix('.json').read_text('utf8'))
              digest=hashlib.sha256(mp4.read_bytes()).hexdigest()
              assert original['sha256']==digest and original['publish'] is False
              output[family]={'sha256':digest,'duration_s':9,'plan_sha':plan['graph_sha256'],
                              'roles':plan['role_binding']}
              for col,t in enumerate((.5,2.3,4.5,6.8)):
                  frame=root/(mp4.stem+f'_{col}.png')
                  subprocess.check_call(['ffmpeg','-hide_banner','-loglevel','error',
                          '-y','-ss',str(t),'-i',str(mp4),'-frames:v','1',str(frame)])
                  im=Image.open(frame).convert('RGB')
                  compare.paste(im.resize((270,480)),(270*col,row*480))
          compare.save(root/'COMPARATIVO_F15_2_FAMILIAS_8_QUADROS.jpg',quality=92)
          refusals=json.loads((root/'RECUSAS_F15.json').read_text('utf8'))
          result={
             'schema':'coringa-qa-f15-v1',
             'gate':'TOPOLOGIAS_PROVADAS_MEDIANTE_ENTRADA_ESTRUTURADA',
             'family_count':2,'private_videos':2,
             'rejected_requests':len(refusals['cases']),
             'title_based_selection':False,
             'arbitrary_mechanism_inference':False,
             'recognition_from_images_or_video':False,
             'commercial_media_rights':False,
             'production_enabled':False,'publish':False,
             'renders':output}
          (root/'QA_F15.json').write_text(json.dumps(result,ensure_ascii=False,indent=2),encoding='utf8')
          print(json.dumps(result,ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lab-f15-selecao-topologia-duas-familias-privado
          path: qa_f15/
          retention-days: 5
          if-no-files-found: warn
