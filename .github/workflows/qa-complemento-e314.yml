name: E314.1 - corrigir vinculo editorial no preflight
on:
  push:
    branches: [atlas-direcao-visual-20261118]
    paths: ['.github/workflows/qa-complemento-e314.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      CAIXA_MAX_CHAMADAS: '0'
      CAIXA_TETO_USD: '0'
      USAR_CLAUDE: '0'
      REMOTION_CHROME: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/download-artifact@v4
        with:
          name: lab-eclusa-hidraulica-moderna-privada
          run-id: '45110717183'
          github-token: ${{ github.token }}
          path: stage_lock
      - uses: ./.github/actions/setup-ffmpeg
      - uses: actions/setup-python@v5
        with: {python-version: '3.13', cache: pip}
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm, cache-dependency-path: motor4/package-lock.json}
      - name: Regressao e prova de bytes
        run: |
          python -m pip install -q -r requirements.txt pytest beautifulsoup4
          npm ci --prefix motor4 --no-audit --no-fund
          python -m pytest -q tests/test_ponte_animacao_editorial.py tests/test_politica_animacao.py tests/test_documentario_integral_e254.py tests/test_filme_editorial.py tests/test_contrato_visual_multitema.py tests/test_referencias_e217.py tests/test_direcao_explicativa_e310.py tests/test_reserva_janelas_e313.py
          python -m scripts.qa_complemento_e314
      - name: Renderizar trecho misto privado
        run: |
          cd motor4
          npx --no-install remotion render remotion/src/index.ts FilmeEditorial ../stage_documental/e314/proof.mp4 --props=../stage_documental/e314/props.json --public-dir=remotion/public --codec=h264 --crf=23 --scale=0.5 --concurrency=4 --log=error
      - name: Verificar duração e quadros
        run: |
          root=stage_documental/e314
          ffprobe -v error -show_streams -show_format -of json "$root/proof.mp4" > "$root/probe.json"
          python - <<'PY'
          import json
          from pathlib import Path
          r=Path('stage_documental/e314')
          p=json.loads((r/'props.json').read_text());q=json.loads((r/'probe.json').read_text())
          v=q['streams'][0];assert (v['width'],v['height'])==(540,960)
          assert int(v['nb_frames'])==round(p['duracao']*30)
          PY
          ffmpeg -v error -y -i "$root/proof.mp4" -vf "fps=1,scale=270:480,tile=4x4" -frames:v 1 "$root/contact.jpg"
      - name: Espelhar prova privada
        env:
          GH_TOKEN: ${{ secrets.COFRE_TOKEN }}
        run: |
          root=stage_documental/e314
          python scripts/espelhar_revisao_cofre.py "e314-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" "$root/proof.json" "$root/props.json" "$root/probe.json" "$root/contact.jpg"
      - uses: actions/upload-artifact@v4
        with:
          name: e314-prova-integrada-privada
          path: stage_documental/e314/proof.mp4
          retention-days: 5
