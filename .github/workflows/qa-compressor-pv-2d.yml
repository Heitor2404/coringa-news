name: "LAB — Compressor próprio 2D com ciclo físico P-V e válvulas"
on:
  push:
    branches: [atlas-direcao-visual-20261118]
    paths:
      - ".github/workflows/qa-compressor-pv-2d.yml"
      - "src/v4/formatos/compressor_pv_core.py"
      - "src/v4/formatos/render_compressor_pv_2d.py"
      - "tests/test_compressor_pv_causal.py"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: qa-compressor-pv-2d
  cancel-in-progress: true
jobs:
  verificar_compressor_nao_motor:
    runs-on: ubuntu-22.04
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Dependencias fisica e SVG
        run: |
          python -m pip install -q pytest pillow cairosvg
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
      - name: Testes: P-V, pressao autoabre valvula, ciclo distinto Otto
        run: |
          python -m pytest -q tests/test_compressor_pv_causal.py
      - name: MP4 privado de 8 segundos, um ciclo completo
        timeout-minutes: 5
        run: |
          mkdir -p qa_compressor_pv/frames
          python -m src.v4.formatos.render_compressor_pv_2d \
            qa_compressor_pv/COMPRESSOR_AR_FISICO_2D_PRIVADO.mp4
      - name: Quatro fases, FFprobe, contato e relatório transparente
        run: |
          python - <<'PY'
          import json,subprocess
          from pathlib import Path
          from PIL import Image,ImageDraw,ImageStat,ImageChops
          from src.v4.formatos.compressor_pv_core import estado,limites_fases
          root=Path('qa_compressor_pv')
          video=root/'COMPRESSOR_AR_FISICO_2D_PRIVADO.mp4'
          j=json.loads(subprocess.check_output([
              'ffprobe','-v','error','-show_entries',
              'format=duration:stream=codec_type,width,height,r_frame_rate',
              '-of','json',str(video)]))
          v=next(s for s in j['streams'] if s['codec_type']=='video')
          assert (v['width'],v['height'])==(540,960)
          assert v['r_frame_rate']=='24/1'
          assert abs(float(j['format']['duration'])-8.0)<.06
          assert not any(s['codec_type']=='audio' for s in j['streams'])
          phases=[('.04','reexpansao'),('.17','admissao'),('.34','admissao'),
                  ('.52','compressao'),('.68','compressao'),('.80','compressao'),
                  ('.91','descarga'),('.97','descarga')]
          board=Image.new('RGB',(4*270,2*490),'#EAF4F6')
          draw=ImageDraw.Draw(board)
          frames=[]
          for i,(u,name) in enumerate(phases):
              t=float(u)*8
              outfile=root/'frames'/f'{i:02d}_{name}.png'
              subprocess.check_call(['ffmpeg','-hide_banner','-loglevel','error',
                  '-y','-ss',str(t),'-i',str(video),'-frames:v','1',str(outfile)])
              im=Image.open(outfile).convert('RGB')
              frames.append(im)
              xx=(i%4)*270
              yy=(i//4)*490+10
              board.paste(im.resize((270,480)),(xx,yy))
          diff=[sum(ImageStat.Stat(ImageChops.difference(frames[0],im)).mean)/3
                for im in (frames[2],frames[5],frames[7])]
          assert min(diff)>3.0, f'mecanismo parado: {diff}'
          board.save(root/'contato_8_fases_compressor_PV.jpg',quality=91)
          (root/'qa_estados.json').write_text(json.dumps({
              'estado':'VIDEO_FISICO_COM_VALVULAS_CORRETAS',
              'sem_ignicao':True,
              'ar_admissao':True,
              'ar_pressurizado_saida':True,
              'auto_valvulas_por_pressao':True,
              'eventos':limites_fases(),
              'processo':'compressor_alternativo',
              'media_gerada':True,
              'origem_2D':'VETOR_PROCEDURAL_NOVO',
              'referencia_animada_do_compressor_obtida':False,
              'base_referencia_conceitual':'EFRC e Reddy, modelo PV simplificado',
              'publicar':False,
              'revisao_humana':'PENDENTE'
          },ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compressor-2d-pressao-valvulas-privado
          path: qa_compressor_pv/
          retention-days: 5
          if-no-files-found: warn
