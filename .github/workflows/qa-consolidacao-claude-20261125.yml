name: Consolidacao corretiva Claude - regressoes isoladas (sem IA, sem publicacao)
# Exclusivo da branch claude-consolidacao-corretiva-20261125. Retirar antes da integração
# (os workflows originais filtram atlas-direcao-visual-20261118 e permanecem inalterados).
on:
  push:
    branches: [claude-consolidacao-corretiva-20261125]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: qa-consolidacao-claude-20261125
  cancel-in-progress: true
jobs:
  validate:
    if: github.ref == 'refs/heads/claude-consolidacao-corretiva-20261125'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CAIXA_MAX_CHAMADAS: '0'
      CAIXA_TETO_USD: '0'
      USAR_CLAUDE: '0'
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.13', cache: pip}
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm, cache-dependency-path: motor4/package-lock.json}
      - name: Dependencias (ffmpeg/ffprobe verificados antes de qualquer teste)
        run: |
          npm ci --prefix motor4 --no-audit --no-fund
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg
          fi
          python -m pip install -q -r requirements.txt beautifulsoup4 pytest pyyaml
          ffprobe -version | head -1; ls -la /usr/bin/google-chrome
      - name: Remotion carrega a config da raiz e nao baixa navegador
        run: |
          cd motor4
          npx --no-install remotion compositions remotion/src/index.ts --log=verbose > ../remotion_cfg.log 2>&1 || true
          cd ..
          grep -q "Applied configuration from" remotion_cfg.log
          ! grep -q "Downloading Chrome" remotion_cfg.log
          grep -q FilmeEditorial remotion_cfg.log
          echo REMOTION_CONFIG_RAIZ_OK
      - name: Regressao acumulada E282 (referencia 222)
        run: |
          python -m pytest -q tests/test_integracao_corretiva_e260.py tests/test_checkpoint_e259.py tests/test_politica_progressiva_e258.py tests/test_pacote_biblioteca_e250.py tests/test_reuso_documental_e251.py tests/test_amostragem_documental_e257.py tests/test_ponte_multimodal_e256.py tests/test_documentario_integral_e254.py tests/test_ponte_mapa_atlas_filme.py tests/test_filme_editorial.py tests/test_fiscal_progressao.py tests/test_e202_diretor_visual.py tests/test_referencias_e217.py tests/test_cobertura_documental_e253.py tests/test_ponte_animacao_editorial.py tests/test_politica_animacao.py tests/test_pretriagem_e269.py tests/test_adquirir_pretriagem_e272.py tests/test_area_segura_plataformas.py tests/test_contrato_visual_e254_2.py tests/test_atlas_base_regional_e235.py
      - name: Controle multitematico (referencia 206)
        run: |
          python -m pytest -q tests/test_gate_filme_completo.py tests/test_ponte_mapa_atlas_filme.py tests/test_qa_video_fontes.py tests/test_filme_editorial.py tests/test_contrato_visual_multitema.py tests/test_rehidratar_fontes.py tests/test_duracao_editorial.py tests/test_pacing_content_aware.py tests/test_video_framing_multitema.py tests/test_gate_multitema_cobertura.py tests/test_estagiar_fotos.py tests/test_coletar_videos_publicos.py tests/test_montagem_documental_privada.py tests/test_montagem_privada_real.py tests/test_gate_flexivel_multitema.py
      - name: Regressoes novas desta branch
        run: python -m pytest -q tests/test_remotion_config_raiz.py tests/test_varredura_temporal_e283.py tests/test_legenda_fora_da_evidencia_e283.py $(ls tests/test_*e283*.py tests/test_*e284*.py 2>/dev/null | sort -u | grep -v -e varredura_temporal_e283 -e legenda_fora_da_evidencia_e283)
      - name: Descobrir checkpoints privados (somente leitura)
        id: ckpt
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.COFRE_TOKEN }}
        run: python -m scripts.recuperar_checkpoints_documentais benchmarks/e258/necessidades.json contrastes qa_claude_checkpoints
      - name: Replay sem IA com a nova amostragem temporal (reuso deve continuar >= 6)
        if: steps.ckpt.outcome == 'success'
        env:
          CORINGA_CHECKPOINTS_DESCOBERTOS: qa_claude_checkpoints/descoberta.json
        run: |
          python -m scripts.qa_revisao_documental_e247 benchmarks/e258/necessidades.json stage_documental/claude-replay contrastes --progressiva --multicenas --qualidade --replay-privado
          python -m scripts.qa_revisao_documental_e247 benchmarks/e258/necessidades.json stage_documental/claude-normal contrastes --progressiva --multicenas --qualidade --visao-zero
          python - <<'PY'
          import json
          from pathlib import Path
          for nome in ('claude-replay','claude-normal'):
              r=json.loads(Path(f'stage_documental/{nome}/revisao.json').read_text())
              assert r['visao_chamadas_logicas']==0 and r['publish'] is False
              assert r['reusos_analises']>=6, (nome, r['reusos_analises'])
              assert [x['estado'] for x in r['cobertura']]==['CANDIDATO_PRIVADO_REVISADO','LACUNA_PENDENTE'], r['cobertura']
              print('REUSO_SEM_IA',nome,r['reusos_analises'])
              for c in r.get('candidatos',[]) if isinstance(r.get('candidatos'),list) else []:
                  e=c.get('exploracao_temporal') or {}
                  if e.get('varredura_local'):print('VARREDURA',nome,e['varredura_local'].get('cortes'),len(e['varredura_local'].get('planos',[])))
          PY
