name: E264.9 - contrato de arquivo e memoria de video sem IA
on:
  push:
    branches: [atlas-direcao-visual-20261118]
    paths: ['.github/workflows/qa-contrato-cofre-e264.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract:
    if: github.ref == 'refs/heads/atlas-direcao-visual-20261118'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.13', cache: pip}
      - run: |
          python -m pip install -q -r requirements.txt beautifulsoup4 pytest
          python -m pytest -q tests/test_validar_arquivo_documental.py tests/test_reuso_documental_e251.py tests/test_checkpoint_e259.py tests/test_reparar_manifesto_e264.py tests/test_politica_progressiva_e258.py tests/test_revisao_documental_e247.py
