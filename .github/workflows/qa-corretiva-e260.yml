name: E285 - consolidacao tecnica seletiva sem IA
# Regressao tecnica obrigatoria na branch experimental.
on:
  push:
    branches: [atlas-direcao-visual-20261118]
    paths: ['.github/workflows/qa-corretiva-e260.yml','src/v4/formatos/amostragem_documental.py','scripts/qa_revisao_documental_e247.py','scripts/recuperar_checkpoints_documentais.py','src/v4/orcamento_visao.py','motor4/remotion.config.js']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: qa-consolidacao-claude-20261125
  cancel-in-progress: true
jobs:
  validate:
    if: github.ref == 'refs/heads/atlas-direcao-visual-20261118'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CAIXA_MAX_CHAMADAS: '0'
      CAIXA_TETO_USD: '0'
      USAR_CLAUDE: '0'
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false, fetch-depth: 1}
      - uses: actions/setup-python@v5
        with: {python-version: '3.13', cache: pip}
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm, cache-dependency-path: motor4/package-lock.json}
      - name: Dependencias (ffmpeg/ffprobe verificados antes de qualquer teste)
        run: |
          npm ci --prefix motor4 --no-audit --no-fund
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg
          fi
          python -m pip install -q -r requirements.txt beautifulsoup4 pytest pyyaml
          ffprobe -version | head -1; ls -la /usr/bin/google-chrome
      - name: Provas obrigatorias (estado registrado por prova; nenhuma ignorada)
        env:
          PROVAS_DIR: provas
          COFRE_GH_TOKEN: ${{ secrets.COFRE_TOKEN }}
        run: |
          P=scripts/estado_prova.sh
          $P remotion_config bash -c 'cd motor4 && npx --no-install remotion compositions remotion/src/index.ts --log=verbose > ../remotion_cfg.log 2>&1; rc=$?; cd ..; [ $rc -eq 0 ] && grep -q "Applied configuration from" remotion_cfg.log && ! grep -q "Downloading Chrome" remotion_cfg.log && grep -q FilmeEditorial remotion_cfg.log'
          $P acumulada_222 python -m pytest -q tests/test_integracao_corretiva_e260.py tests/test_checkpoint_e259.py tests/test_politica_progressiva_e258.py tests/test_pacote_biblioteca_e250.py tests/test_reuso_documental_e251.py tests/test_amostragem_documental_e257.py tests/test_ponte_multimodal_e256.py tests/test_documentario_integral_e254.py tests/test_ponte_mapa_atlas_filme.py tests/test_filme_editorial.py tests/test_fiscal_progressao.py tests/test_e202_diretor_visual.py tests/test_referencias_e217.py tests/test_cobertura_documental_e253.py tests/test_ponte_animacao_editorial.py tests/test_politica_animacao.py tests/test_pretriagem_e269.py tests/test_adquirir_pretriagem_e272.py tests/test_area_segura_plataformas.py tests/test_contrato_visual_e254_2.py tests/test_atlas_base_regional_e235.py
          $P multitema_206 python -m pytest -q tests/test_gate_filme_completo.py tests/test_ponte_mapa_atlas_filme.py tests/test_qa_video_fontes.py tests/test_filme_editorial.py tests/test_contrato_visual_multitema.py tests/test_rehidratar_fontes.py tests/test_duracao_editorial.py tests/test_pacing_content_aware.py tests/test_video_framing_multitema.py tests/test_gate_multitema_cobertura.py tests/test_estagiar_fotos.py tests/test_coletar_videos_publicos.py tests/test_montagem_documental_privada.py tests/test_montagem_privada_real.py tests/test_gate_flexivel_multitema.py
          $P novas_tecnicas python -m pytest -q tests/test_remotion_config_raiz.py tests/test_varredura_temporal_e283.py tests/test_varredura_limites_e284.py tests/test_contrato_validacao_e284.py tests/test_orcamento_visao_e284.py
          $P memoria python -m src.v3.memoria conferir
          # Checkpoints privados: sem token ou sem acesso = BLOQUEADA (77), nunca aprovada por omissão.
          $P checkpoints bash -c '[ -n "$COFRE_GH_TOKEN" ] || exit 77; GH_TOKEN="$COFRE_GH_TOKEN" python -m scripts.recuperar_checkpoints_documentais benchmarks/e258/necessidades.json contrastes qa_claude_checkpoints || exit 77; test -s qa_claude_checkpoints/descoberta.json || exit 77; python scripts/exigir_pacotes.py qa_claude_checkpoints/descoberta.json 2'
          export CORINGA_CHECKPOINTS_DESCOBERTOS=$PWD/qa_claude_checkpoints/descoberta.json
          $P replay_contrato bash -c 'test -s "$CORINGA_CHECKPOINTS_DESCOBERTOS" || exit 1; rm -rf stage_documental/claude-replay; python -m scripts.qa_revisao_documental_e247 benchmarks/e258/necessidades.json stage_documental/claude-replay contrastes --progressiva --multicenas --qualidade --replay-privado && python -m scripts.contrato_reuso_replay extrair stage_documental/claude-replay/revisao.json stage_documental/claude-replay/biblioteca.sqlite3 && python -m scripts.contrato_reuso_replay conferir stage_documental/claude-replay/revisao.json benchmarks/e284/contrato_replay_e260.json stage_documental/claude-replay/biblioteca.sqlite3'
          $P normal_contrato bash -c 'test -s "$CORINGA_CHECKPOINTS_DESCOBERTOS" || exit 1; rm -rf stage_documental/claude-normal; python -m scripts.qa_revisao_documental_e247 benchmarks/e258/necessidades.json stage_documental/claude-normal contrastes --progressiva --multicenas --qualidade --visao-zero && python -m scripts.contrato_reuso_replay conferir --normal stage_documental/claude-normal/revisao.json benchmarks/e284/contrato_replay_e260.json stage_documental/claude-normal/biblioteca.sqlite3'
          # Mesmo replay com o código do Work (257ce75d): o conjunto de revisões reaproveitadas deve ser idêntico.
          $P igual_ao_work bash -c 'test -s "$CORINGA_CHECKPOINTS_DESCOBERTOS" || exit 1; git fetch -q --depth 1 origin 257ce75db196840cc4d74132f301e7179a842d67 && git worktree add -f base_work FETCH_HEAD && ln -s "$PWD/motor4/node_modules" base_work/motor4/node_modules && ln -s "$PWD/qa_claude_checkpoints" base_work/qa_claude_checkpoints && (cd base_work && python -m scripts.qa_revisao_documental_e247 benchmarks/e258/necessidades.json ../stage_documental/work-replay contrastes --progressiva --multicenas --qualidade --replay-privado) && python -m scripts.comparar_reuso_work stage_documental/work-replay/revisao.json stage_documental/claude-replay/revisao.json'
      - name: Resumo inequivoco (falha se qualquer prova nao estiver APROVADA)
        if: ${{ always() }}
        run: python scripts/resumo_provas.py provas remotion_config acumulada_222 multitema_206 novas_claude memoria checkpoints replay_contrato normal_contrato igual_ao_work
