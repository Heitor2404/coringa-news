name: E282 - regressao acumulada e prevencao de falhas reais
on:
  push:
    branches: [atlas-direcao-visual-20261118]
    paths: ['.github/workflows/qa-corretiva-e260.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    if: github.ref == 'refs/heads/atlas-direcao-visual-20261118'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.13', cache: pip}
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm, cache-dependency-path: motor4/package-lock.json}
      - run: |
          npm ci --prefix motor4 --no-audit --no-fund
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg
          fi
          python -m pip install -q -r requirements.txt beautifulsoup4 pytest
      - name: Regressoes das capacidades existentes e novas
        run: |
          python -m py_compile scripts/recuperar_checkpoints_documentais.py scripts/qa_revisao_documental_e247.py src/v4/formatos/ponte_cobertura_filme.py src/v4/formatos/tempo_natural.py src/v4/formatos/filme_editorial.py src/midia.py
          python -m pytest -q tests/test_integracao_corretiva_e260.py tests/test_checkpoint_e259.py tests/test_politica_progressiva_e258.py tests/test_pacote_biblioteca_e250.py tests/test_reuso_documental_e251.py tests/test_amostragem_documental_e257.py tests/test_ponte_multimodal_e256.py tests/test_documentario_integral_e254.py tests/test_ponte_mapa_atlas_filme.py tests/test_filme_editorial.py tests/test_fiscal_progressao.py tests/test_e202_diretor_visual.py tests/test_referencias_e217.py tests/test_cobertura_documental_e253.py tests/test_ponte_animacao_editorial.py tests/test_politica_animacao.py tests/test_pretriagem_e269.py tests/test_adquirir_pretriagem_e272.py tests/test_area_segura_plataformas.py
      - name: Descobrir pacotes privados relevantes sem IDs fixos
        env:
          GH_TOKEN: ${{ secrets.COFRE_TOKEN }}
        run: python -m scripts.recuperar_checkpoints_documentais benchmarks/e258/necessidades.json contrastes qa_e260_checkpoints
      - name: Reutilizar analises em runner novo sem IA
        id: replay
        env:
          CORINGA_CHECKPOINTS_DESCOBERTOS: qa_e260_checkpoints/descoberta.json
          CAIXA_MAX_CHAMADAS: '0'
          CAIXA_TETO_USD: '0'
          USAR_CLAUDE: '0'
        run: python -m scripts.qa_revisao_documental_e247 benchmarks/e258/necessidades.json stage_documental/e260 contrastes --progressiva --multicenas --qualidade --replay-privado
      - name: Confirmar reuso sem repetir busca ou analise externa
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('stage_documental/e260/revisao.json').read_text())
          assert r['visao_chamadas_logicas']==0 and r['telemetria_visao']==[]
          assert r['cobertura_documentario']['consumo']['http']==0 and r['cobertura_documentario']['consumo']['buscas']==0
          assert r['reusos_analises']>=6
          assert [x['estado'] for x in r['cobertura']]==['CANDIDATO_PRIVADO_REVISADO','LACUNA_PENDENTE']
          assert r['publish'] is False
          print('E260 REUSO AUTOMATICO',r['reusos_analises'])
          PY
      - name: Testar fluxo progressivo normal com visao zero
        env:
          CORINGA_CHECKPOINTS_DESCOBERTOS: qa_e260_checkpoints/descoberta.json
          CAIXA_MAX_CHAMADAS: '0'
          CAIXA_TETO_USD: '0'
          USAR_CLAUDE: '0'
        run: |
          python -m scripts.qa_revisao_documental_e247 benchmarks/e258/necessidades.json stage_documental/e260-normal contrastes --progressiva --multicenas --qualidade --visao-zero
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('stage_documental/e260-normal/revisao.json').read_text())
          assert not r['modo_replay_privado'] and r['visao_chamadas_logicas']==0
          assert r['reusos_analises']>=6 and r['rede_aquisicao']['http']==0
          assert [x['estado'] for x in r['cobertura']]==['CANDIDATO_PRIVADO_REVISADO','LACUNA_PENDENTE']
          print('E260 NORMAL ZERO',r['reusos_analises'])
          PY
      - name: Repetir prova de aquisicao de provedores sem IA
        id: sources
        # Provider transport unchanged in this round; avoid repeating the
        # identical external probe for a scheduling-only correction.
        if: ${{ github.event_name == 'workflow_dispatch' && !cancelled() }}
        run: python -m scripts.qa_aquisicao_e258 qa_e260_fontes
      - name: Preservar diagnosticos privados
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ secrets.COFRE_TOKEN }}
        run: |
          shopt -s nullglob
          root=stage_documental/e260
          mkdir -p "$root"
          if [[ -s qa_e260_checkpoints/descoberta.json ]]; then cp qa_e260_checkpoints/descoberta.json "$root/descoberta-checkpoints.json"; fi
          if [[ -s qa_e260_fontes/revisao.json ]]; then cp qa_e260_fontes/revisao.json "$root/fontes.json"; fi
          if [[ -s stage_documental/e260-normal/revisao.json ]]; then cp stage_documental/e260-normal/revisao.json "$root/normal-zero.json"; fi
          files=("$root"/*.json "$root"/*.jpg)
          if (( ${#files[@]} > 0 )); then
            bash scripts/arquivar_cofre_review.sh "review-e260-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" "${files[@]}"
            python scripts/espelhar_revisao_cofre.py "e260-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" "${files[@]}"
          fi
