name: E279 - regressao do encadeamento documental
on:
  push:
    branches: [atlas-direcao-visual-20261118]
    paths: ['.github/workflows/qa-corretiva-e275.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regressao:
    if: github.ref == 'refs/heads/atlas-direcao-visual-20261118'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CAIXA_MAX_CHAMADAS: '0'
      CAIXA_TETO_USD: '0'
      USAR_CLAUDE: '0'
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.13', cache: pip}
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm, cache-dependency-path: motor4/package-lock.json}
      - run: |
          npm ci --prefix motor4 --no-audit --no-fund
          python -m pip install -q -r requirements.txt beautifulsoup4 pytest
      - name: Validar bloco corretivo sem rede de origem ou IA
        run: |
          python -m py_compile src/v4/acervo_v4.py src/v4/pretriagem_documental.py scripts/qa_revisao_documental_e247.py
          python -m pytest -q tests/test_politica_progressiva_e258.py tests/test_pretriagem_e269.py tests/test_adquirir_pretriagem_e272.py tests/test_checkpoint_e259.py tests/test_reuso_documental_e251.py tests/test_ponte_multimodal_e256.py tests/test_ponte_mapa_atlas_filme.py tests/test_ponte_animacao_editorial.py tests/test_politica_animacao.py tests/test_documentario_integral_e254.py tests/test_integracao_corretiva_e260.py tests/test_e202_diretor_visual.py
      - name: Verificar registro de continuidade e evidencias referenciadas
        run: |
          python - <<'PY'
          from pathlib import Path
          r=Path('docs/ESTADO_CANONICO_MOTOR.md').read_text()
          d=Path('docs/CONTINUIDADE_PROXIMO_CHAT.md').read_text()
          assert 'ESTADO_CANONICO_MOTOR.md' in d[:1000]
          for path in ('src/v4/formatos/ponte_mapa_atlas.py','src/v4/formatos/ponte_cobertura_filme.py','src/v4/pretriagem_documental.py','scripts/qa_revisao_documental_e247.py'):
              assert path in r and Path(path).is_file()
          for run in ('45551945864','45553006784','45509206301','45321450413','45615720734','45627022872'):
              assert run in r
          print('E275 CONTINUIDADE OK')
          PY
