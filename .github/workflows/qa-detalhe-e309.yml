name: E309 - detalhe observado com prova de pixels
on:
  push:
    branches: [atlas-direcao-visual-20261118]
    paths: ['.github/workflows/qa-detalhe-e309.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  visual:
    if: github.ref == 'refs/heads/atlas-direcao-visual-20261118'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CAIXA_MAX_CHAMADAS: '0'
      CAIXA_TETO_USD: '0'
      USAR_CLAUDE: '0'
      REMOTION_CHROME: /usr/bin/google-chrome
      REMOTION_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: ./.github/actions/setup-ffmpeg
      - uses: actions/setup-python@v5
        with: {python-version: '3.13', cache: pip}
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm, cache-dependency-path: motor4/package-lock.json}
      - name: Testes e compilacao
        run: |
          python -m pip install -q -r requirements.txt pytest beautifulsoup4
          npm ci --prefix motor4 --no-audit --no-fund
          python -m pytest -q tests/test_detalhe_e309.py tests/test_composicao_e286.py tests/test_filme_editorial.py tests/test_area_segura_plataformas.py tests/test_direcao_short_e307.py tests/test_replanejamento_e308.py
          ./motor4/node_modules/.bin/tsc -p motor4/remotion/tsconfig.json --noEmit
          python -m scripts.qa_visual_e286
          python -m scripts.qa_detalhe_e309
      - name: Render A B e conflito
        run: cd motor4 && node scripts/qa_detalhe_e309.mjs
      - name: Verificar pixels
        run: python -m scripts.qa_detalhe_pixels_e309
      - name: Guardar quadros privados
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ secrets.COFRE_TOKEN }}
        run: |
          shopt -s nullglob
          root=stage_documental/e286
          files=("$root"/detail-*.json "$root"/detail-*.png)
          if [[ -s "$root/detail-measures.json" ]]; then
            python scripts/espelhar_revisao_cofre.py "e309-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" "${files[@]}"
          fi
