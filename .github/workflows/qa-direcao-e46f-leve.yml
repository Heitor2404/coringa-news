name: E46F direção visual - testes leves
on:
  push:
    branches: [atlas-direcao-visual-20261118]
    paths: ['src/v4/formatos/direcao_cad_e46f.py','tests/test_direcao_cad_e46f.py','.github/workflows/qa-direcao-e46f-leve.yml']
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: python -m pip install numpy numba pillow pytest
      - run: python -m pytest -q tests/test_direcao_cad_e46f.py tests/test_revelacao_e45.py tests/test_hero_cad_e46e.py
      - run: python -m py_compile src/v4/formatos/direcao_cad_e46f.py src/v4/formatos/pipeline_e41.py src/v4/formatos/filme_e18.py
