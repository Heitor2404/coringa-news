name: E202 diretor visual autônomo multitema (prévias privadas)
# Fatos → acontecimento → modalidade verificada → cena declarativa → narração → FilmeEditorial → quadros → revisão
# → no máximo UMA correção dirigida. Provedores do projeto (Gemini grátis; Claude Code desligado por padrão).
# Nada é publicado nem enviado ao Telegram. MP4s saem CIFRADOS (GPG) no artifact; QA em texto.
on:
  push:
    branches: [atlas-direcao-visual-20261118]
    paths: ['.github/workflows/qa-diretor-e202.yml', '.github/e202/disparo.txt']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: e202-diretor
  cancel-in-progress: false
env:
  DO_NOT_TRACK: "1"
  REMOTION_DISABLE_TELEMETRY: "1"
  USAR_CLAUDE: "0"
jobs:
  e202:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: "3.13", cache: pip}
      - uses: actions/setup-node@v4
        with: {node-version: "22", cache: npm, cache-dependency-path: motor4/package-lock.json}
      - name: Dependências (versões fixadas)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q -r requirements.txt pytest
          npm ci --prefix motor4 --no-audit --no-fund
          mkdir -p ~/.fonts && cp motor4/identidade/ttf/*.ttf ~/.fonts/ 2>/dev/null; fc-cache -f
      - name: Testes (Python + contrato TS v1/v2 + tsc)
        run: |
          python -m pytest -q tests/test_e202_diretor_visual.py
          ./motor4/node_modules/.bin/tsc -p motor4/remotion/tsconfig.json --noEmit
          ./motor4/node_modules/.bin/tsc motor4/remotion/src/formatos/SceneGraphCoreE201.ts --module commonjs --target ES2020 --skipLibCheck --outDir /tmp/e202-test
          cp -r /tmp/e202-test /tmp/e201-test
          python - <<'PY'
          import json
          from src.v4.formatos import diretor_visual_e202 as D
          fx=json.load(open('tests/dados/e202_cena_sintetica.json'))
          disp={k:{'disponivel':k=='cena_declarativa','motivo':'-'} for k in D.MODALIDADES}
          _,c=D.verificar(fx['plano'],fx['caso'],disp); json.dump(c['c1']['scene_graph'],open('/tmp/e202_fixture_sg.json','w'))
          PY
          node --test motor4/remotion/tests/scene-graph-e202.test.cjs motor4/remotion/tests/scene-graph-e201.test.cjs
      - name: Ciclo autônomo nos três temas inéditos (uma tentativa por caso)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
        run: |
          ls benchmarks/e202/cache 2>/dev/null | sed 's/^/cache-antes: /' > /tmp/cache_antes.txt || true
          python -m src.v4.formatos.ciclo_e202 benchmarks/e202/temas_ineditos.json qa_e202 || echo "E202-CICLO-SAIDA $?"
      - name: Proveniência para reprodução local (respostas da IA e tempos medidos; sem áudio nem vídeo)
        if: always()
        run: |
          python - <<'PY'
          import json,pathlib
          antes=set(l.split(': ',1)[1].strip() for l in open('/tmp/cache_antes.txt') if ': ' in l)
          for p in sorted(pathlib.Path('benchmarks/e202/cache').glob('*.json')):
              if p.name not in antes:
                  print('E202-CACHE', p.name, json.dumps(json.loads(p.read_text()),ensure_ascii=False))
          for p in sorted(pathlib.Path('benchmarks/e202/narracao').glob('*.json')):
              print('E202-NARRACAO', p.name, json.dumps(json.loads(p.read_text()),ensure_ascii=False))
          for p in sorted(pathlib.Path('qa_e202').glob('*_registro.json')):
              r=json.loads(p.read_text())
              print('E202-REGISTRO', p.name, json.dumps({k:r.get(k) for k in ('caso','estado','mp4_final','direcao','etapas','erro')},ensure_ascii=False)[:60000])
          PY
      - name: Cifrar mídia (GPG, chave pública do projeto)
        if: always()
        run: |
          mkdir -p entrega
          cp qa_e202/*.json entrega/ 2>/dev/null || true
          tar -czf /tmp/midia.tgz qa_e202 2>/dev/null || true
          export GNUPGHOME=$(mktemp -d)
          gpg --batch --quiet --import .github/piloto/chave_publica.asc
          dest=$(gpg --list-keys --with-colons | awk -F: '/^fpr/{print $10; exit}')
          gpg --batch --yes --quiet --trust-model always --encrypt -r "$dest" -o entrega/e202-midia-${{ github.run_id }}.tgz.gpg /tmp/midia.tgz
          sha256sum /tmp/midia.tgz entrega/*.gpg
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: e202-diretor-privado, path: entrega/, retention-days: 14}
