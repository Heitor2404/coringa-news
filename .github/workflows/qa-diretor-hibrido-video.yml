name: "QA — diretor multimídia V2: foto, vídeo real e mecanismo"
on:
  push:
    branches: [atlas-direcao-visual-20261118]
    paths:
      - ".github/workflows/qa-diretor-hibrido-video.yml"
      - "src/v4/formatos/video_contextual_v3.py"
      - "src/v4/formatos/diretor_hibrido.py"
      - "src/v4/formatos/diretor_roteiro.py"
      - "src/v4/formatos/filme_editorial.py"
      - "motor4/remotion/src/formatos/FilmeEditorial.tsx"
      - "tests/test_video_contextual_v3.py"
      - "docs/v4/formatos/VIDEO_CURADO_PRIVADO_NIST_20261120.json"
      - "docs/v4/formatos/QA_ROTEIRO_V2_HIBRIDO_NIST_20261120.json"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: qa-diretor-hibrido-video
  cancel-in-progress: true
jobs:
  qa_video_original:
    runs-on: ubuntu-22.04
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: motor4/package-lock.json
      - name: Bibliotecas e verificação semântica sem IA
        run: |
          python -m pip install -q pillow requests numpy pyyaml cryptography pytest yt-dlp
          python -m pytest -q tests/test_video_contextual_v3.py tests/test_diretor_hibrido.py tests/test_video_framing_multitema.py
      - name: Confirmar que cenas exigem foto, video e mecanismo
        run: |
          mkdir -p qa_video
          python - <<'PY'
          import json
          from pathlib import Path
          from src.v4.formatos import diretor_hibrido,video_contextual_v3,ponte_biblioteca
          p=json.loads(Path('docs/v4/formatos/QA_ROTEIRO_V2_HIBRIDO_NIST_20261120.json').read_text('utf8'))
          v=json.loads(Path('docs/v4/formatos/VIDEO_CURADO_PRIVADO_NIST_20261120.json').read_text('utf8'))
          bib=video_contextual_v3.catalogo_com_video(ponte_biblioteca.catalogo(),v,requer_arquivo=False)
          result=diretor_hibrido.planejar(p,bib)
          assert [s['type'] for s in result['plano']['shots']]==['photo','video','mechanism']
          assert result['plano']['media'][result['plano']['shots'][1]['asset']]['license']=='REVIEW_PENDING'
          assert result['plano']['publicar'] is False
          Path('qa_video/relatorio_planejamento.json').write_text(json.dumps(result['triagem'],ensure_ascii=False,indent=2))
          print('PLANEJAMENTO_TRÊS_MODALIDADES_OK SEM APROVAÇÃO DE DIREITOS')
          PY
      - name: Recuperar ORIGINAL NIST sem contornar autenticação e validar SHA
        timeout-minutes: 9
        run: |
          mkdir -p stage_documental
          python - <<'PY'
          import json,os
          from pathlib import Path
          from src.v4.formatos import coletar_videos_publicos as C
          f=json.loads(Path('docs/v4/formatos/CANDIDATOS_VIDEO_NIST_NANOFAB_20261119.json').read_text('utf8'))['itens'][0]
          C.validar_fonte(f)
          target=Path('stage_documental/nist_nanofab_users_2017.mp4')
          C.baixar_nist(f,target)
          digest=C.sha256_arquivo(target)
          assert digest==f['sha256_esperado'], 'ORIGINAL ALTERADO: NÃO RENDERIZAR'
          data=C.provar_video(target)
          assert data['largura']==1360 and data['altura']==720
          assert abs(data['duracao_s']-105.05)<.15
          print(json.dumps({'estado':'SHA_VALIDADO','sha256':digest,'original_bytes':target.stat().st_size,'duracao_s':data['duracao_s']},ensure_ascii=False))
          PY
      - name: Resolver roteiro sem asset escolhido e preparar originais
        run: |
          python -m src.v4.formatos.diretor_hibrido docs/v4/formatos/QA_ROTEIRO_V2_HIBRIDO_NIST_20261120.json qa_video motor4/remotion/public --videos-curados docs/v4/formatos/VIDEO_CURADO_PRIVADO_NIST_20261120.json
          python - <<'PY'
          import json
          from pathlib import Path
          d=Path('qa_video')
          props=json.loads((d/'props.json').read_text('utf8'))
          provenance=json.loads((d/'proveniencia_hibrida.json').read_text('utf8'))
          assert [s['type'] for s in props['shots']]==['photo','video','mechanism']
          assert props['shots'][1]['video_context_layout']=='cena_integral'
          assert abs(props['shots'][1]['source_in_seconds']-58.15)<.001
          assert props['shots'][1]['source']=='NIST · The CNST NanoFab: Through the Users\u0027 Eyes (2017) · EUA'
          assert props['shots'][2]['mechanism']=='optical_projection'
          assert provenance['estado']=='ORIGINAIS_SHA_VERIFICADOS'
          assert len(provenance['midias'])==2
          assert props['private_review_only'] is True
          assert props['direitos_pendentes']
          print('FONTE NIST COM DIREITOS PENDENTES, CONTEXTO NÃO PROVA FABRICAÇÃO/EUV')
          PY
      - name: Compilar compositor compartilhado
        run: |
          cd motor4
          npm ci --no-audit --no-fund
          npx --no-install tsc -p remotion/tsconfig.json --noEmit
      - name: Renderizar prova privada sem voz, sem publicação
        timeout-minutes: 12
        run: |
          cd motor4
          npx --no-install remotion render remotion/src/index.ts FilmeEditorial ../qa_video/prova_video_contextual.mp4 --props=../qa_video/props.json --public-dir=remotion/public --codec=h264 --crf=24 --scale=0.5 --concurrency=2 --log=error
      - name: Provar duração, vídeo inteiro e área de ação
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update -qq
            sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends ffmpeg
          fi
          ffprobe -v error -show_entries format=duration,size:stream=codec_type,width,height -of json qa_video/prova_video_contextual.mp4 > qa_video/metadados.json
          ffmpeg -hide_banner -loglevel error -y -i qa_video/prova_video_contextual.mp4 -vf "fps=1.3,scale=270:480,tile=4x4" -frames:v 1 qa_video/contato_16_quadros.jpg
          ffmpeg -hide_banner -loglevel error -y -ss 4.2 -i qa_video/prova_video_contextual.mp4 -frames:v 1 qa_video/quadro_video_real.jpg
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          d=Path('qa_video')
          p=json.loads((d/'props.json').read_text())
          m=json.loads((d/'metadados.json').read_text())
          assert abs(float(m['format']['duration'])-12.5)<.08
          assert len([s for s in m['streams'] if s['codec_type']=='video'])==1
          assert not any(s['codec_type']=='audio' for s in m['streams'])
          assert p['private_review_only'] and len(p['direitos_pendentes'])==1
          file=d/'prova_video_contextual.mp4'
          result={'estado':'QA_TECNICO_PRIVADO_DIREITOS_PENDENTES','duracao_s':float(m['format']['duration']),'sha256_video_render':hashlib.sha256(file.read_bytes()).hexdigest(),'revisao_visual':'PENDENTE','revisao_direitos':'PENDENTE','prova_de_processo':False,'publicar':False,'telegram':False,'chamadas_ia':0}
          (d/'resultado.json').write_text(json.dumps(result,ensure_ascii=False,indent=2))
          print(json.dumps(result,ensure_ascii=False))
          PY
      - name: Guardar só prévia e relatórios (não o original NIST)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-diretor-video-contextual-v3-v4
          path: qa_video/
          retention-days: 5
          if-no-files-found: warn
