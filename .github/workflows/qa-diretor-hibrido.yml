name: "QA — contrato híbrido histórico, SHA e recusa de renderer reprovado"
on:
  push:
    branches: [atlas-direcao-visual-20261118]
    paths:
      - ".github/workflows/qa-diretor-hibrido.yml"
      - "src/v4/formatos/diretor_hibrido.py"
      - "src/v4/formatos/diretor_roteiro.py"
      - "src/v4/formatos/filme_editorial.py"
      - "src/v4/formatos/ponte_biblioteca.py"
      - "src/v4/biblioteca_comprovada.json"
      - "tests/test_diretor_hibrido.py"
      - "docs/v4/formatos/QA_ROTEIRO_V2_TAIWAN_20261120.json"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: qa-diretor-hibrido
  cancel-in-progress: true
jobs:
  registrar_sem_simular:
    runs-on: ubuntu-22.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: motor4/package-lock.json
      - name: Contrato de mídia, hashes e três recusas de fraude
        run: |
          python -m pip install -q pillow requests numpy pyyaml cryptography pytest
          python -m pytest -q tests/test_diretor_hibrido.py tests/test_diretor_roteiro_v2.py
      - name: Bloqueio editorial historico explicitamente verificado
        run: python -m pytest -q tests/test_diretor_hibrido.py -k renderer_reprovado
