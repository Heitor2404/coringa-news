name: "QA — finalizar mapa R2 com mesmo áudio natural, sem rerender"
on:
  push:
    branches: [atlas-direcao-visual-20261118]
    paths: [".github/qualidade/mapa_r2_audio_exato.txt"]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: qa-mapas-r2-audio-final
  cancel-in-progress: true
jobs:
  juntar:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: FFmpeg e PIL para auditoria
        run: |
          python -m pip install -q pillow requests
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq --no-install-recommends ffmpeg
          fi
      - name: Recuperar áudio original de tempo natural do run aprovado
        uses: actions/download-artifact@v4
        with:
          name: qa-diretor-mapas-voz-natural-progresso-global
          run-id: 44575540939
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: antes
      - name: Recuperar quadros R2 corrigidos, sem novo render nem IA
        uses: actions/download-artifact@v4
        with:
          name: qa-mapas-r2-labels-e-audio-identico
          run-id: 44576552618
          github-token: __TOKEN__
          path: r2
      - name: Corrigir só o MUX mantendo PACOTES de áudio originais
        run: |
          mkdir -p resultado
          cp r2/plano_sincronizado.json resultado/plano_sincronizado.json
          ffmpeg -hide_banner -loglevel error -y \
            -i r2/mapas_narrados_r2.mp4 -i antes/mapas_narrados.mp4 \
            -map 0:v:0 -map 1:a:0 -c:v copy -c:a copy \
            -movflags +faststart resultado/mapas_narrados_final.mp4
      - name: Reauditar cenas e verificar áudio IDÊNTICO
        run: |
          python -m scripts.qa_montagem_multitema \
            resultado/plano_sincronizado.json \
            resultado/mapas_narrados_final.mp4 resultado
          python - <<'PY'
          import json,subprocess
          from pathlib import Path
          root=Path('resultado')
          p=json.loads((root/'plano_sincronizado.json').read_text(encoding='utf-8'))
          q=json.loads((root/'qa_montagem.json').read_text(encoding='utf-8'))
          assert q['status_tecnico']=='PRONTO_PARA_REVISAO',q['problemas_tecnicos']
          assert q['tem_audio'] and not q['publicavel']
          assert p['sincronia_voz']['tempo_audio']==1.
          assert len(p['shots'])==3
          def md5(p):
              return subprocess.check_output(
                ['ffmpeg','-hide_banner','-loglevel','error','-i',str(p),
                '-map','0:a:0','-f','md5','pipe:1']).strip()
          assert md5('antes/mapas_narrados.mp4')==md5(root/'mapas_narrados_final.mp4')
          print('QA_FINAL_OK — R2 3 mapas, mesmo áudio, barra global, sem publicar',
                {'duracao':q['duracao'],'cenas':len(q['amostras_editoriais'])})
          PY
          cp r2/contato_editorial.jpg resultado/contato_editorial.jpg
      - name: Preservar prova final privada e folha de quadros
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-diretor-multitema-final-r2
          path: |
            resultado/mapas_narrados_final.mp4
            resultado/contato_editorial.jpg
            resultado/plano_sincronizado.json
            resultado/qa_montagem.json
          retention-days: 7
          if-no-files-found: warn
