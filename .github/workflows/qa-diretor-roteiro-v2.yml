name: "QA — roteiro V2 para forma V3 e capacidade V4"
on:
  push:
    branches: [atlas-direcao-visual-20261118]
    paths:
      - ".github/workflows/qa-diretor-roteiro-v2.yml"
      - "src/v4/formatos/diretor_roteiro.py"
      - "src/v4/formatos/diretor_processos.py"
      - "src/v4/formatos/catalogo_mecanismos.py"
      - "src/v4/formatos/filme_editorial.py"
      - "tests/test_diretor_roteiro_v2.py"
      - "docs/v4/formatos/QA_ROTEIRO_V2_TAIWAN_20261120.json"
      - "docs/v4/formatos/QA_ROTEIRO_V2_OXIDACAO_20261120.json"
      - "docs/v4/formatos/QA_ROTEIRO_V2_EUV_20261120.json"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: qa-diretor-roteiro-v2
  cancel-in-progress: true
jobs:
  roteiro_sem_preselecao:
    runs-on: ubuntu-22.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: motor4/package-lock.json
      - name: Testar V2→V3→V4 e negativos sem IA nem download de mídia
        run: |
          python -m pip install -q pillow requests numpy pyyaml cryptography pytest
          python -m pytest -q tests/test_diretor_roteiro_v2.py tests/test_diretor_processos.py
      - name: Triar história realista multiformato e tema sem mecanismo
        run: |
          mkdir -p qa_roteiro
          set +e
          python -m src.v4.formatos.diretor_roteiro docs/v4/formatos/QA_ROTEIRO_V2_TAIWAN_20261120.json qa_roteiro/relatorio_taiwan.json
          TW=$?
          python -m src.v4.formatos.diretor_roteiro docs/v4/formatos/QA_ROTEIRO_V2_OXIDACAO_20261120.json qa_roteiro/relatorio_oxidacao.json
          OX=$?
          set -e
          test "$TW" -eq 2 && test "$OX" -eq 2
          python - <<'PY'
          import json
          from pathlib import Path
          t=json.loads(Path('qa_roteiro/relatorio_taiwan.json').read_text())
          f=json.loads(Path('qa_roteiro/relatorio_oxidacao.json').read_text())
          assert [x['estado'] for x in t['decisoes']]==[
            'CANDIDATO_DOCUMENTAL_SEM_BYTES',
            'CAPACIDADE_TECNICA_DISPONIVEL','BLOQUEADO']
          assert f['decisoes'][0]['estado']=='BLOQUEADO'
          assert any(x['codigo']=='R-SEM-MECANISMO' for x in f['bloqueios'])
          assert all(x['publicar'] is False and x['pronto_para_render'] is False for x in (t,f))
          print('DIRETOR-TRIO: FOTO CANDIDATA / MECANISMO PRESENTE / REGISTRO AUSENTE')
          PY
      - name: Preflight da cena técnica proveniente de roteiro V2 (sem shots)
        run: |
          python -m src.v4.formatos.filme_editorial docs/v4/formatos/QA_ROTEIRO_V2_EUV_20261120.json qa_roteiro motor4/remotion/public
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('qa_roteiro/props.json').read_text())
          assert p['duracao']==6.9
          assert len(p['shots'])==1 and p['shots'][0]['mechanism']=='optical_projection'
          assert [x['action'] for x in p['shots'][0]['cues']]==['source','reticle','projection','wafer']
          print('ROTEIRO V2 → RENDERER REAL, SEM SHOTS MANUAIS')
          PY
      - name: Compilar Remotion
        run: |
          cd motor4
          npm ci --no-audit --no-fund
          npx --no-install tsc -p remotion/tsconfig.json --noEmit
      - name: Renderizar só o processo com capacidade real disponível
        timeout-minutes: 9
        run: |
          cd motor4
          npx --no-install remotion render remotion/src/index.ts FilmeEditorial ../qa_roteiro/prova_roteiro.mp4 --props=../qa_roteiro/props.json --public-dir=remotion/public --codec=h264 --crf=23 --scale=0.5 --concurrency=2 --log=error
      - name: Inspecionar duração e contato
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update -qq
            sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends ffmpeg
          fi
          ffprobe -v error -show_entries format=duration,size:stream=codec_type,width,height -of json qa_roteiro/prova_roteiro.mp4 > qa_roteiro/metadata.json
          ffmpeg -hide_banner -loglevel error -y -i qa_roteiro/prova_roteiro.mp4 -vf "fps=1.3,scale=270:480,tile=3x3" -frames:v 1 qa_roteiro/contato_9_quadros.jpg
          python - <<'PY'
          import json,hashlib
          from pathlib import Path
          d=Path('qa_roteiro')
          p=json.loads((d/'props.json').read_text())
          m=json.loads((d/'metadata.json').read_text())
          video=[s for s in m['streams'] if s['codec_type']=='video']
          assert len(video)==1 and video[0]['width']==540 and video[0]['height']==960
          assert abs(float(m['format']['duration'])-p['duracao'])<.08
          assert not any(s['codec_type']=='audio' for s in m['streams'])
          media=d/'prova_roteiro.mp4'
          result={'status':'QA_TECNICO_SEM_APROVACAO_DE_FILME','duracao_s':float(m['format']['duration']),'sha256':hashlib.sha256(media.read_bytes()).hexdigest(),'publicar':False,'telegram':False,'revisao_humana':'PENDENTE'}
          (d/'resultado.json').write_text(json.dumps(result,ensure_ascii=False,indent=2))
          print(json.dumps(result,ensure_ascii=False))
          PY
      - name: Guardar relatório e vídeo de laboratório
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-diretor-roteiro-v2
          path: qa_roteiro/
          retention-days: 5
          if-no-files-found: warn
