name: E219 - documentario geografia curado privado
on:
  push:
    branches: [atlas-direcao-visual-20261118]
    paths: ['.github/workflows/qa-documentario-e219.yml','scripts/qa_documentario_geografia_e219.py','benchmarks/e219/kilauea_2018.json']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: e219-documental
  cancel-in-progress: false
env:
  DO_NOT_TRACK: "1"
  REMOTION_CHROME: /usr/bin/google-chrome
  CORINGA_CHROME: /usr/bin/google-chrome
  REMOTION_DISABLE_TELEMETRY: "1"
jobs:
  documentario:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: "3.13", cache: pip}
      - uses: actions/setup-node@v4
        with: {node-version: "22", cache: npm, cache-dependency-path: motor4/package-lock.json}
      - name: Dependencias do compositor existente
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg
          fi
          python -m pip install -q -r requirements.txt beautifulsoup4
          npm ci --prefix motor4 --no-audit --no-fund
          ./motor4/node_modules/.bin/tsc -p motor4/remotion/tsconfig.json --noEmit
      - name: Confirmar destino privado Telegram antes de gastar TTS
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          from src.v3 import previa_telegram
          try:
              previa_telegram.chat_autorizado()
          except Exception:
              raise SystemExit("Telegram privado não confirmado; TTS não iniciado") from None
          print("TELEGRAM: destino privado autorizado, sem envio de mensagem de teste")
          PY
      - name: Aquisição de registros e voz Gemini medida
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
        run: python -m scripts.qa_documentario_geografia_e219 benchmarks/e219/kilauea_2018.json qa_e219
      - name: Render do episódio no FilmeEditorial existente
        run: |
          cd motor4
          npx --no-install remotion render remotion/src/index.ts FilmeEditorial ../qa_e219/filme.mp4 --props=../qa_e219/props.json --codec=h264 --crf=21 --scale=0.5 --concurrency=4 --public-dir=remotion/public --log=error
      - name: QA de duração, imagem e áudio
        id: qa
        run: |
          ffprobe -v error -show_streams -show_format -of json qa_e219/filme.mp4 > qa_e219/probe.json
          python - <<'PY'
          import json,hashlib
          from pathlib import Path
          p=json.load(open('qa_e219/props.json')); q=json.load(open('qa_e219/probe.json'))
          v=next(s for s in q['streams'] if s['codec_type']=='video')
          assert p['private_review_only'] and p['preview'] and p['duracao']>=60
          assert set(s['type'] for s in p['shots'])=={'video','atlas_map'}
          assert (v['width'],v['height'])==(540,960) and int(v['nb_frames'])==round(p['duracao']*30)
          assert any(s['codec_type']=='audio' for s in q['streams'])
          assert abs(float(q['format']['duration'])-p['duracao'])<.15
          out={'duration':p['duracao'],'shots':len(p['shots']),'types':sorted(set(s['type'] for s in p['shots'])),
               'sha256':hashlib.sha256(Path('qa_e219/filme.mp4').read_bytes()).hexdigest(),
               'video_sha256':hashlib.sha256(Path('qa_e219/filme.mp4').read_bytes()).hexdigest(),
               'props_sha256':hashlib.sha256(Path('qa_e219/props.json').read_bytes()).hexdigest(),
               'publish':False,'visual_approval':'PENDING','voice_approval':'PENDING'}
          Path('qa_e219/qa.json').write_text(json.dumps(out,indent=2));print('E219 MP4',out)
          PY
          ffmpeg -v error -y -i qa_e219/filme.mp4 -vf "fps=1/4,scale=216:384,tile=5x5" -frames:v 1 qa_e219/contato.jpg
      - name: Entregar documentário narrado ao Telegram privado
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m scripts.documentario_telegram qa_e219 --titulo "A erupção que fez o Havaí crescer"
      - name: Arquivar MP4 e arquivos de revisão no cofre privado
        if: ${{ !cancelled() && steps.qa.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ secrets.COFRE_TOKEN }}
        run: |
          tar -czf /tmp/qa-e219.tgz qa_e219
          bash scripts/arquivar_cofre_review.sh "review-e219-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" qa_e219/filme.mp4 /tmp/qa-e219.tgz qa_e219/qa.json
      - name: Cifrar resultados para revisão privada
        if: always()
        run: |
          mkdir -p entrega qa_e219
          export GNUPGHOME=$(mktemp -d)
          gpg --batch --quiet --import .github/piloto/chave_publica.asc
          original=$(gpg --list-keys --with-colons | awk -F: '/^fpr/{print $10; exit}')
          cat >/tmp/e219-review.asc <<'KEY'
          -----BEGIN PGP PUBLIC KEY BLOCK-----

          mDMEawXsuxYJKwYBBAHaRw8BAQdARxj7M2CGkzzORH8RVKIL6xFYliqRixaKr1Qe
          ZmDGzSW0G0UyMTkgcHJpdmF0ZSByZXZpZXcgc2Vzc2lvboiWBBMWCgA+FiEEmK1H
          imUKl/AaOSZNi8Uncan3xTQFAmsF7LsCGwEFCQABUYAFCwkIBwIGFQoJCAsCBBYC
          AwECHgECF4AACgkQi8Uncan3xTQ3+AEA4oULE4K27dREk6cy49vfvF698eCqfh3q
          rBYL3rtI94wA/2WgQekJtSLeGlbUXnaCNs1VUMK7Ynfs+X6jFlO4B6QPuDgEawXs
          uxIKKwYBBAGXVQEFAQEHQLwXXUgiUbXGwFBYvHLGKxHZiBn2s6D7n3FboolUExE/
          AwEIB4h+BBgWCgAmFiEEmK1HimUKl/AaOSZNi8Uncan3xTQFAmsF7LsCGwwFCQAB
          UYAACgkQi8Uncan3xTRBSwEA7KUMabPkFjbGk4H3+bvQptYR9fYgky8uAa7ny5E1
          Ym8BAP3RASfZM20231B6BgyO8EduOBHnDZsRNqGMWFETaTUD
          =enAW
          -----END PGP PUBLIC KEY BLOCK-----
          KEY
          gpg --batch --quiet --import /tmp/e219-review.asc
          tar -czf /tmp/e219.tgz qa_e219
          gpg --batch --yes --quiet --trust-model always --encrypt -r "$original" -r 98AD478A650A97F01A39264D8BC52771A9F7C534 -o entrega/e219.tgz.gpg /tmp/e219.tgz
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: e219-documentario-privado-cifrado, path: entrega/, retention-days: 7, if-no-files-found: error}
