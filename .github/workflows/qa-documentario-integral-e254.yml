name: E254 - documentario integral privado
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  DO_NOT_TRACK: '1'
  REMOTION_CHROME: /usr/bin/google-chrome
  CORINGA_CHROME: /usr/bin/google-chrome
  REMOTION_DISABLE_TELEMETRY: '1'
jobs:
  documentary:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    if: github.ref == 'refs/heads/atlas-direcao-visual-20261118'
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.13', cache: pip}
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm, cache-dependency-path: motor4/package-lock.json}
      - run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg
          fi
          python -m pip install -q -r requirements.txt beautifulsoup4 pytest
          npm ci --prefix motor4 --no-audit --no-fund
      - run: python -m pytest -q tests/test_espelho_cofre_e254.py tests/test_documentario_integral_e254.py tests/test_cobertura_documental_e253.py tests/test_revisao_documental_e247.py tests/test_direcao_observacao_e239.py tests/test_revisao_adaptativa_e248.py
      - name: Confirmar destino privado
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -c 'from src.v3 import previa_telegram as T; T.chat_autorizado()'
      - name: Cobertura real das 18 necessidades
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          CAIXA_MAX_CHAMADAS: '20'
          CAIXA_TETO_USD: '0'
          USAR_CLAUDE: '0'
        run: python -m scripts.qa_revisao_documental_e247 benchmarks/e254/documentario.json stage_documental/e254 gelo_paisagem --adaptativa --multicenas --integral
      - name: Preservar relatorio original no cofre antes do espelho
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ secrets.COFRE_TOKEN }}
        run: |
          shopt -s nullglob
          root=stage_documental/e254
          if [[ -s "$root/revisao.json" ]]; then
            bash scripts/arquivar_cofre_review.sh "review-e254-coverage-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" "$root/revisao.json" "$root"/revisao-*.jpg
          fi
      - name: Preflight e voz somente se houver cobertura
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m scripts.qa_documentario_integral_e254 stage_documental/e254
      - name: Render condicional e QA do video
        run: |
          set -euo pipefail
          root=stage_documental/e254
          if [[ ! -f "$root/props.json" ]]; then echo "E254 sem filme: consultar integral.json"; exit 0; fi
          (cd motor4 && npx --no-install remotion render remotion/src/index.ts FilmeEditorial ../"$root"/filme.mp4 --props=../"$root"/props.json --codec=h264 --crf=21 --scale=0.5 --concurrency=4 --public-dir=remotion/public --log=error)
          ffprobe -v error -show_streams -show_format -of json "$root/filme.mp4" > "$root/probe.json"
          python - <<'PY'
          import json,hashlib
          from pathlib import Path
          root=Path('stage_documental/e254')
          p=json.loads((root/'props.json').read_text());q=json.loads((root/'probe.json').read_text())
          assert p['private_review_only'] and p['preview'] and p['duracao']>=60
          assert any(s['codec_type']=='audio' for s in q['streams'])
          v=next(s for s in q['streams'] if s['codec_type']=='video')
          assert (v['width'],v['height'])==(540,960) and abs(float(q['format']['duration'])-p['duracao'])<.15
          (root/'qa.json').write_text(json.dumps({'duration':p['duracao'],'shots':len(p['shots']),'types':sorted(set(s['type'] for s in p['shots'])),'sha256':hashlib.sha256((root/'filme.mp4').read_bytes()).hexdigest(),'publish':False,'visual_approval':'PENDING','voice_approval':'PENDING'},indent=2))
          PY
          ffmpeg -v error -y -i "$root/filme.mp4" -vf "fps=1/4,scale=216:384,tile=5x5" -frames:v 1 "$root/contato.jpg"
      - name: Espelhar cobertura, diagnosticos e quadros
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ secrets.COFRE_TOKEN }}
        run: |
          shopt -s nullglob
          root=stage_documental/e254
          files=("$root"/*.json "$root"/*.jpg "$root"/*.mp4)
          if (( ${#files[@]} > 0 )); then python scripts/espelhar_revisao_cofre.py "e254-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" "${files[@]}"; fi
      - name: Entregar filme ou relatorio privado
        if: ${{ !cancelled() }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          root=stage_documental/e254
          if [[ -f "$root/qa.json" && -f "$root/filme.mp4" ]]; then
            python -m scripts.documentario_telegram "$root" --titulo "Como as geleiras esculpem paisagens"
          elif [[ -f "$root/integral.json" ]]; then
            python - <<'PY'
          from pathlib import Path
          from src.v3 import previa_telegram as T
          chat,_=T.chat_autorizado()
          for p in [Path('stage_documental/e254/integral.json'),Path('stage_documental/e254/revisao.json')]:
              r=T._api('sendDocument',{'chat_id':chat,'caption':'CORINGA E254 - preflight integral privado; filme ainda nao homologado.'},('document',p))
              if not isinstance(r,dict) or not r.get('message_id'):raise RuntimeError('Entrega privada nao confirmada')
          PY
          fi
      - name: Arquivar MP4 privado se validado
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ secrets.COFRE_TOKEN }}
        run: |
          root=stage_documental/e254
          if [[ -f "$root/qa.json" && -f "$root/filme.mp4" ]]; then
            bash scripts/arquivar_cofre_review.sh "review-e254-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" "$root/filme.mp4" "$root/qa.json"
          fi
  avisar_falha:
    needs: documentary
    if: ${{ always() && (needs.documentary.result == 'failure' || needs.documentary.result == 'cancelled') }}
    permissions:
      actions: read
      contents: none
    uses: ./.github/workflows/notificar-falha-documental.yml
    with:
      result: ${{ needs.documentary.result }}
      job_name: documentary
    secrets:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
