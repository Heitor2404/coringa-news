name: "LAB — Eclusa moderna, terceira física, câmera estável"
on:
  push:
    branches: [atlas-direcao-visual-20261118]
    paths:
      - ".github/workflows/qa-eclusa-hidraulica-moderna.yml"
      - "src/v4/formatos/render_eclusa_hidraulica_2d.py"
      - "src/v4/formatos/camera_causal_geometrias.json"
      - "src/v4/formatos/realce_causal_trajetos.json"
      - "tests/test_eclusa_hidraulica_moderna.py"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: qa-eclusa-hidraulica-moderna
  cancel-in-progress: true
jobs:
  eclusa_laboratorio:
    runs-on: ubuntu-22.04
    timeout-minutes: 19
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Preparar gráficos e validação sem Claude
        run: |
          python -m pip install -q pytest cairosvg pillow numpy scipy opencv-python-headless
          if ! command -v ffprobe >/dev/null || ! command -v ffmpeg >/dev/null; then
            sudo apt-get update -qq
            sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends ffmpeg
          fi
      - name: Testar sete estados, câmeras e regressões das três famílias
        run: |
          python -m pytest -q tests/test_eclusa_hidraulica_moderna.py \
            tests/test_camera_causal_svg.py tests/test_grafo_causal.py \
            tests/test_realce_causal_svg.py
      - name: Renderizar ciclo hidráulico privado em 9x16
        run: |
          mkdir -p prova_eclusa_moderna
          python -m src.v4.formatos.render_eclusa_hidraulica_2d \
            prova_eclusa_moderna/ECLUSA_HIDRAULICA_MODERNA_PRIVADA.mp4
      - name: Verificar arquivo e montar 7 comparações de etapa
        run: |
          python - <<'PY'
          import json,hashlib,subprocess,io
          from pathlib import Path
          from PIL import Image,ImageChops,ImageStat,ImageDraw
          import cairosvg
          from src.v4.formatos import render_eclusa_hidraulica_2d as L
          root=Path('prova_eclusa_moderna')
          video=root/'ECLUSA_HIDRAULICA_MODERNA_PRIVADA.mp4'
          out=json.loads(video.with_suffix('.json').read_text('utf8'))
          meta=json.loads(subprocess.check_output(['ffprobe','-v','error',
             '-show_entries','format=duration:stream=codec_type,width,height,r_frame_rate',
             '-of','json',str(video)]))
          v=next(s for s in meta['streams'] if s['codec_type']=='video')
          assert (v['width'],v['height'])==(540,960)
          assert v['r_frame_rate']=='24/1'
          assert abs(float(meta['format']['duration'])-12.6)<.06
          assert not any(s['codec_type']=='audio' for s in meta['streams'])
          assert out['sha256']==hashlib.sha256(video.read_bytes()).hexdigest()
          assert not out['publicar'] and not out['telegram']
          assert len(out['etapas'])==7
          grid=Image.new('RGB',(4*270,4*480),'#E8F0F3')
          rows=[]
          for i,(action,start,end,*_) in enumerate(L.PHASES):
            sec=(start+end)/2
            png=root/f'FASE_{i+1:02}_{action}.png'
            subprocess.check_call(['ffmpeg','-hide_banner','-loglevel','error','-y',
               '-ss',str(sec),'-i',str(video),'-frames:v','1',str(png)])
            img=Image.open(png).convert('RGB')
            assert img.size==(540,960)
            grid.paste(img.resize((270,480)),((i%4)*270,(i//4)*480))
            rows.append({'fase':action,'segundos':sec})
          grid.save(root/'CONTATO_7_FASES.jpg',quality=93)
          # Cotejo antigo vs novo não se diz 1:1 porque direção gráfica é outra.
          # A prova interna compara a cena verdadeira de enchimento e saída.
          first=Image.open(root/'FASE_04_rise.png').convert('RGB')
          last=Image.open(root/'FASE_07_exit.png').convert('RGB')
          d=ImageChops.difference(first.crop((155,390,389,750)),
                                  last.crop((155,390,389,750)))
          delta=sum(ImageStat.Stat(d).mean)/3
          assert delta>4,delta
          QA={'status':'LAB_TERCEIRA_FAMILIA_RENDER_REAL',
              'processo':'eclusa_hidraulica_7_estados',
              'fonte_fisica':'grafo_existente_sem_legacy_remotion',
              'camera':'PLANO_GERAL_TRAVADO',
              'grafo_7_acoes':True,'navio_flutua_com_agua':True,
              'delta_conteudo_camara_rgb':round(delta,3),
              'publicar':False,'revisao_humana':'PENDENTE',
              'sha256':out['sha256'],'estados':rows}
          (root/'QA_ECLUSA_MODERNA.json').write_text(
            json.dumps(QA,ensure_ascii=False,indent=2),encoding='utf8')
          print(json.dumps(QA,ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lab-eclusa-hidraulica-moderna-privada
          path: prova_eclusa_moderna/
          retention-days: 5
          if-no-files-found: warn
