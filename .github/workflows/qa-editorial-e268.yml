name: E268.2 - contrato editorial e rotas explicitas sem IA
on:
  push:
    branches: [atlas-direcao-visual-20261118]
    paths: ['.github/workflows/qa-editorial-e268.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    if: github.ref == 'refs/heads/atlas-direcao-visual-20261118'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.13', cache: pip}
      - run: |
          python -m pip install -q -r requirements.txt beautifulsoup4 pytest
          python -m pytest -q tests/test_diagnosticar_editorial_e268.py tests/test_politica_progressiva_e258.py tests/test_qualidade_multimodal_e255.py tests/test_ponte_multimodal_e256.py tests/test_ponte_animacao_editorial.py
      - name: Diagnostico de lacunas e alternativas ja descobertas
        env:
          GH_TOKEN: ${{ secrets.COFRE_TOKEN }}
        run: |
          python - <<'PY'
          import hashlib,json,subprocess
          from pathlib import Path
          from scripts.recuperar_checkpoints_documentais import api,listar_releases
          from scripts.diagnosticar_diversidade_documental import fila_editorial
          m=api('');assert m.get('private') is True and m.get('id')==1454059520
          tag='review-e2648-45613384343-1'
          rel=next(r for r in listar_releases(60) if r['tag_name']==tag and r['draft'] is True)
          a=next(a for a in rel['assets'] if a['name']=='revisao.json')
          assert 0<a['size']<=12_000_000
          root=Path('qa_e268');root.mkdir()
          subprocess.run(['gh','release','download',tag,'--repo','Heitor2404/coringa-cofre','--pattern','revisao.json','--dir',str(root)],check=True,timeout=120)
          raw=(root/'revisao.json').read_bytes()
          assert len(raw)==a['size'] and 'sha256:'+hashlib.sha256(raw).hexdigest()==a['digest']
          out=fila_editorial(json.loads(raw),json.loads(Path('benchmarks/e265/auditoria_visual.json').read_text()))
          (root/'fila.json').write_text(json.dumps(out,ensure_ascii=False,indent=2))
          print('E268 FILA',[(r['id'],len(r['observacoes']),len(r['pistas_foto']),len(r['pistas_video'])) for r in out['fila']],flush=True)
          PY
          python scripts/espelhar_revisao_cofre.py "e268-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" qa_e268/fila.json
