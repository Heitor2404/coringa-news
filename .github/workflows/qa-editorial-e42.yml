name: E42 contrato editorial de transmissão
on:
  push:
    branches: [atlas-direcao-visual-20261118]
    paths:
      - ".github/workflows/qa-editorial-e42.yml"
      - "src/v4/formatos/editorial_e42.py"
      - "tests/test_editorial_e42.py"
permissions:
  contents: read
jobs:
  contratos:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: python -m pip install numpy pytest
      - run: python -m pytest -q tests/test_editorial_e42.py tests/test_gates_brep_e36.py tests/test_eventos_trajetoria_e27.py tests/test_ponte_cad_editorial_e28.py
      - run: python -m py_compile src/v4/formatos/filme_e18.py src/v4/formatos/pipeline_e41.py src/v4/formatos/pipeline_e35.py
