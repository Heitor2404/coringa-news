name: E254.1 - espelho de relatorio grande sem IA
on:
  push:
    branches: [atlas-direcao-visual-20261118]
    paths: ['.github/workflows/qa-espelho-grande-e254.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mirror:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    if: github.ref == 'refs/heads/atlas-direcao-visual-20261118'
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - run: python -m pip install -q pytest requests Pillow
      - run: python -m pytest -q tests/test_espelho_cofre_e254.py
      - name: Criar prova sintetica de relatorio grande
        run: |
          mkdir -p qa_espelho
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('qa_espelho/revisao.json')
          p.write_text(json.dumps({'publicar':False,'sintetico':True,'necessidades':[{'id':i,'texto':'evidência çã 🌎 '*9000} for i in range(18)]},ensure_ascii=False),encoding='utf8')
          assert p.stat().st_size>850000
          print('bytes',p.stat().st_size)
          PY
      - name: Espelhar no cofre privado
        env:
          GH_TOKEN: ${{ secrets.COFRE_TOKEN }}
        run: python scripts/espelhar_revisao_cofre.py "e254-espelho-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" qa_espelho/revisao.json
      - name: Recuperar e validar bytes no mesmo cofre
        env:
          GH_TOKEN: ${{ secrets.COFRE_TOKEN }}
        run: |
          python - <<'PY'
          import os,json,base64,hashlib
          from pathlib import Path
          from scripts.espelhar_revisao_cofre import checked_api,BRANCH
          call=checked_api(os.environ['GH_TOKEN'])
          root='/contents/revisoes/e254-espelho-'+os.environ['GITHUB_RUN_ID']+'-'+os.environ['GITHUB_RUN_ATTEMPT']+'/'
          def read(name):
              r=call('GET',root+name+'?ref='+BRANCH)
              return base64.b64decode(r['content'])
          idx=json.loads(read('index.json'));m=json.loads(read('revisao-partes.json'))
          raw=b''.join(base64.b64decode(json.loads(read(n))['base64'],validate=True) for n in m['partes'])
          assert raw==Path('qa_espelho/revisao.json').read_bytes()
          assert hashlib.sha256(raw).hexdigest()==m['sha256'] and len(raw)==m['bytes']
          assert idx['publicar'] is False
          print('E254.1 ROUNDTRIP OK',len(raw),len(m['partes']),m['sha256'])
          PY
