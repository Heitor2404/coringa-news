name: E27 eventos e palco - provas leves
on:
  push:
    branches: [atlas-direcao-visual-20261118]
    paths:
      - ".github/workflows/qa-eventos-e27.yml"
      - "src/v4/formatos/eventos_trajetoria_e27.py"
      - "src/v4/formatos/visibilidade_e26.py"
      - "src/v4/formatos/filme_e18.py"
      - "tests/test_eventos_trajetoria_e27.py"
      - "tests/test_visibilidade_e26.py"
permissions:
  contents: read
jobs:
  eventos:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: |
          python -m pip install --only-binary=:all: numpy numba pillow pytest
      - run: python -m pytest -q tests/test_eventos_trajetoria_e27.py tests/test_visibilidade_e26.py
      - run: python -m py_compile src/v4/formatos/filme_e18.py src/v4/formatos/previa_step_e25.py
