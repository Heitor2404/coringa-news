name: E320 - evidencias oficiais de transformacao territorial
on:
  push:
    branches: [atlas-direcao-visual-20261118]
    paths: ['.github/workflows/qa-evidencias-territoriais-e320.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CAIXA_MAX_CHAMADAS: '0'
      CAIXA_TETO_USD: '0'
      USAR_CLAUDE: '0'
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.13', cache: pip}
      - name: Recuperar evidencias oficiais estaticas por fonte e finalidade
        run: |
          python -m pip install -q -r requirements.txt beautifulsoup4
          python - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image
          from scripts.qa_documentario_geografia_e219 import acquire_photo,STAGE,sha
          STAGE.mkdir(parents=True,exist_ok=True)
          root=Path('stage_documental/e320');root.mkdir(parents=True,exist_ok=True)
          sources=[
            ('map-kilauea-volcanos-lower-east-rift-zone','Mapa USGS: extensão da lava e antiga costa','USGS · Hawaiian Volcano Observatory','c6-0 / c6-1'),
            ('and-after-satellite-images-kapoho','Comparação de satélite: antes e depois de Kapoho','USGS · Volcano Hazards Program','c4-3 / c6-1'),
            ('kilauea-volcano-lava-filled-kapoho-bay','Registro aéreo: antiga baía preenchida','USGS · Hawaiian Volcano Observatory','c4-3'),
          ]
          rows=[]
          for i,(slug,label,credit,target) in enumerate(sources):
              try:
                  m=acquire_photo((slug,label,credit));p=Path(m['local_source'])
                  assert sha(p)==m['expected_sha256']
                  m['rights_status']='REVIEW_PENDING'
                  m['target_obligation']=target
                  m['semantic_review']='PENDING'
                  m['local_source']=str(root/p.name)
                  p.replace(m['local_source'])
                  with Image.open(m['local_source']) as im:
                      im.thumbnail((1080,1500));im.convert('RGB').save(root/f'evidencia-{i:02d}.jpg',quality=92)
                  rows.append({'status':'BYTES_VERIFIED','media':m})
              except Exception as e:
                  rows.append({'status':'ACQUISITION_FAILED','source':slug,'error':str(e)[:300]})
          (root/'evidencias.json').write_text(json.dumps({'publish':False,'new_ai':0,'records':rows},ensure_ascii=False,indent=2))
          assert any(r['status']=='BYTES_VERIFIED' for r in rows)
          PY
      - name: Arquivar originais e espelhar imagens privadas
        env:
          GH_TOKEN: ${{ secrets.COFRE_TOKEN }}
        run: |
          root=stage_documental/e320
          shopt -s nullglob
          originals=("$root"/[0-9a-f]*.jpg "$root"/[0-9a-f]*.png "$root"/[0-9a-f]*.webp)
          files=()
          for f in "${originals[@]}"; do
            [[ "$(basename "$f")" =~ ^[0-9a-f]{64}\.(jpg|png|webp)$ ]] && files+=("$f")
          done
          bash scripts/arquivar_cofre_review.sh "review-e320-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" "$root/evidencias.json" "${files[@]}"
          python scripts/espelhar_revisao_cofre.py "e320-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" "$root/evidencias.json" "$root"/evidencia-*.jpg
