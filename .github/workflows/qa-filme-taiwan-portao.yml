name: "QA — motor documental multitema + piloto Taiwan (sem Gemini)"
on:
  push:
    branches: [atlas-direcao-visual-20261118]
    paths:
      - ".github/qualidade/filme_taiwan_portao.txt"
      - ".github/workflows/qa-filme-taiwan-portao.yml"
      - "src/v4/formatos/**/*.py"
      - "src/v4/formatos/plataformas.json"
      - "src/v3/biblioteca.py"
      - "tests/test_gate_filme_completo.py"
      - "tests/test_gate_flexivel_multitema.py"
      - "tests/test_gate_multitema_cobertura.py"
      - "tests/test_estagiar_fotos.py"
      - "tests/test_coletar_videos_publicos.py"
      - "tests/test_filme_editorial.py"
      - "tests/test_qa_video_fontes.py"
      - "tests/test_duracao_editorial.py"
      - "tests/test_pacing_content_aware.py"
      - "tests/test_video_framing_multitema.py"
      - "motor4/remotion/src/formatos/FilmeEditorial.tsx"
      - "tests/test_contrato_visual_multitema.py"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: qa-piloto-taiwan-preflight
  cancel-in-progress: true
jobs:
  conferir_provas:
    runs-on: ubuntu-22.04
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Testar portão multiassunto, contrato ATLAS e evidências
        run: |
          python -m pip install -q pytest pillow requests numpy pyyaml cryptography
          python -m pytest -q tests/test_gate_filme_completo.py tests/test_ponte_mapa_atlas_filme.py tests/test_qa_video_fontes.py tests/test_filme_editorial.py tests/test_contrato_visual_multitema.py tests/test_rehidratar_fontes.py tests/test_duracao_editorial.py tests/test_pacing_content_aware.py tests/test_video_framing_multitema.py tests/test_gate_multitema_cobertura.py tests/test_estagiar_fotos.py tests/test_coletar_videos_publicos.py
      - name: Validar portão POSITIVO multitema com arquivos reais de fixture
        run: |
          python -m pytest -q tests/test_gate_flexivel_multitema.py
          echo "GATE_POSITIVO_TECNICO_MULTITEMA: permitido sem meta de stock footage; nao equivale a filme aprovado"
      - name: Recuperar mapa ATLAS ORIGINAL do workflow anterior, sem renderizar
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: qa-taiwan-mapa-atlas-original-integrado-filme
          run-id: 44588617776
          github-token: ${{ github.token }}
          path: stage_atlas/taiwan
      - name: Autenticar o mapa recuperado ou deixar BLOQUEADO se artefato expirou
        run: |
          python - <<'PY'
          from pathlib import Path
          from src.v4.formatos.ponte_mapa_atlas import validar_comprovante
          p=Path("stage_atlas/taiwan/mapa.mp4")
          side=Path("stage_atlas/taiwan/comprovante_atlas.json")
          if not p.is_file() or not side.is_file():
              print("MAPA_ATLAS_AUSENTE: artefato nao recuperado, gate continua bloqueado")
          else:
              import json
              q=json.loads(side.read_text(encoding="utf8"))
              erros=validar_comprovante({
                  "local_source":str(p),
                  "atlas_proof":str(side),
                  "expected_sha256":q["video_sha256"],
              })
              assert not erros,erros
              print("MAPA_ATLAS_REAL_RECUPERADO",q["video_sha256"],q["duracao_s"])
          PY
      - name: Estagiar fotos JA CURADAS (Commons, SHA) — reuso multitema
        run: |
          mkdir -p saida_preflight_taiwan
          set +e
          python -m src.v4.formatos.estagiar_fotos \
            docs/v4/formatos/CONTRATO_PILOTO_TAIWAN_INTEGRAL_20261119.json \
            saida_preflight_taiwan/catalogo_bytes.json \
            saida_preflight_taiwan/relatorio_fotos.json \
            --pasta stage_acervo/fotos
          rc=$?
          set -e
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("saida_preflight_taiwan/relatorio_fotos.json")
          assert p.exists(),"estagio falhou antes de emitir relatório"
          rel=json.loads(p.read_text())
          print("FOTOS_COM_SHA_VERIFICADO",rel["recuperadas"],"/",rel["solicitadas"],
                "falhas",len(rel["falhas"]))
          assert not rel["autorizacao_publicar"] and not rel["autorizacao_editorial"]
          PY
          if [ "$rc" -ne 0 ]; then
            echo "::warning::Alguma foto curada não pôde ser recuperada; gate permanece bloqueado"
          fi
      - name: REGRESSAO NEGATIVA — piloto Taiwan antigo continua barrando mídia ausente
        run: |
          mkdir -p saida_preflight_taiwan
          set +e
          python -m src.v4.formatos.gate_filme_completo \
            docs/v4/formatos/CONTRATO_PILOTO_TAIWAN_INTEGRAL_20261119.json \
            saida_preflight_taiwan/relatorio.json \
            --catalogo saida_preflight_taiwan/catalogo_bytes.json
          rc=$?
          set -e
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('saida_preflight_taiwan/relatorio.json')
          assert p.exists(),"gate não escreveu relatório"
          q=json.loads(p.read_text(encoding='utf8'))
          # A falta de mídia não é falha de código: é bloqueio editorial esperado,
          # que impede novas chamadas Gemini e render sem evidência suficiente.
          assert q['status']=='BLOQUEADO_EDITORIAL_SEM_PROVA',q
          assert not q['pronto_para_tts'] and not q['pronto_para_render']
          assert q['publicado'] is False
          print('REGRESSAO_NEGATIVA_TAIWAN_LEGADO',json.dumps({
              'cenas':q['total_cenas'],'bloqueios':len(q['bloqueios']),
              'videos_com_acao':q['videos_independentes_conferidos'],
              'mapas_comprovados_neste_runner':q['mapas_atlas_comprovados'],
              'somente_preproducao':True
          },ensure_ascii=False))
          for b in q['bloqueios']:
              print(b['codigo'],b['cena'],b['motivo'])
          PY
          if [ "$rc" -ne 1 ]; then
            echo "::error::portão deveria bloquear falta de mídia, exit foi $rc"
            exit 1
          fi
      - name: Diagnóstico do RASCUNHO editorial ativo — não usar legado como KPI
        run: |
          set +e
          python -m src.v4.formatos.gate_filme_completo \
            docs/v4/formatos/CONTRATO_TAIWAN_REEDICAO_CANDIDATA_20261119.json \
            saida_preflight_taiwan/relatorio_rascunho_atual.json \
            --catalogo saida_preflight_taiwan/catalogo_bytes.json
          rc=$?
          set -e
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("saida_preflight_taiwan/relatorio_rascunho_atual.json")
          assert p.is_file(),"gate não escreveu relatório para o rascunho"
          r=json.loads(p.read_text(encoding="utf8"))
          assert not r["publicado"]
          resumo={
            "rotulo":"RASCUNHO_EDITORIAL_NAO_FILME_APROVADO",
            "status":r["status"],
            "avisos":r.get("avisos_editoriais",[]),
            "bloqueios":[{"cena":x["cena"],"codigo":x["codigo"]} for x in r["bloqueios"]],
            "previsao_s":r.get("previsao_s"),
            "pronto_para_tts":r["pronto_para_tts"],
          }
          print("DIAGNOSTICO_RASCUNHO_ATUAL",json.dumps(resumo,ensure_ascii=False))
          PY
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 1 ]; then
            echo "::error::execução do diagnóstico falhou (erro do código, não da prova)"
            exit 1
          fi
      - name: Guardar relatório de falhas sem publicar
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-taiwan-acervo-antes-de-narracao
          path: |
            saida_preflight_taiwan/
            stage_acervo/fotos/
          retention-days: 7
          if-no-files-found: warn
