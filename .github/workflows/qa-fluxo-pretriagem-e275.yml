name: E278 - pertinencia contextual e selecao observada
on:
  push:
    branches: [atlas-direcao-visual-20261118]
    paths: ['.github/workflows/qa-fluxo-pretriagem-e275.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  proof:
    if: github.ref == 'refs/heads/atlas-direcao-visual-20261118'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CAIXA_MAX_CHAMADAS: '0'
      CAIXA_TETO_USD: '0'
      USAR_CLAUDE: '0'
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.13', cache: pip}
      - run: |
          python -m pip install -q -r requirements.txt beautifulsoup4 pytest
          python -m pytest -q tests/test_pretriagem_e269.py tests/test_politica_progressiva_e258.py tests/test_adquirir_pretriagem_e272.py
      - name: Preparar casos existentes sem nova curadoria
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('qa_e275');root.mkdir()
          base=json.loads(Path('benchmarks/e246/necessidades.json').read_text())
          facts=[];needs=[]
          for case in base['cases']:
              if case['id'] not in ('aquedutos','saturno'):continue
              mapping={f['id']:case['id']+'-'+f['id'] for f in case['fatos']}
              facts.extend({**f,'id':mapping[f['id']]} for f in case['fatos'])
              needs.extend({**n,'id':case['id']+'-'+n['id'],'fatos':[mapping[x] for x in n['fatos']]} for n in case['necessidades'])
          (root/'contrastes.json').write_text(json.dumps({'publish':False,'cases':[{'id':'contrastes','tema':'QA de selecao, historia e astronomia','fatos':facts,'necessidades':needs}]},ensure_ascii=False))
          PY
      - name: Executar o caminho progressivo normal sem visao
        run: python -m scripts.qa_revisao_documental_e247 qa_e275/contrastes.json stage_documental/e275 contrastes --progressiva --multicenas --visao-zero --pretriagem-pendente
      - name: Validar ausencia de promocao e contabilizacao
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('stage_documental/e275')
          r=json.loads((root/'revisao.json').read_text())
          p=json.loads((root/'pretriagem-pendente.json').read_text())
          assert r['publish'] is False and r['visao_chamadas_logicas']==0
          assert p['publicar'] is False and p['direitos_aprovados'] is False and p['visao']==p['cobertura_nova']==0
          assert r['rede_aquisicao']['http']<=12 and r['rede_aquisicao']['bytes']<=9000000
          assert all(n['estado']=='LACUNA_PENDENTE' for n in r['cobertura'])
          ids={x['necessidade_id'] for x in r['cobertura']}
          assert all(x['id'] in ids and all(a['estado']=='PRETRIAGEM_PENDENTE' and a['publicar'] is False and (root/a['folha']).is_file() for a in x['amostras']) for x in p['necessidades'])
          print('E278 FLUXO',[(x['id'],len(x['amostras']),len(x['erros'])) for x in p['necessidades']],r['rede_aquisicao']['http'],r['rede_aquisicao']['bytes'])
          PY
      - name: Espelhar provas privadas
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ secrets.COFRE_TOKEN }}
        run: |
          shopt -s nullglob
          files=(stage_documental/e275/revisao.json stage_documental/e275/pretriagem-pendente.json stage_documental/e275/pretriagem-*.jpg)
          valid=()
          for f in "${files[@]}"; do [[ -f "$f" ]] && valid+=("$f"); done
          if (( ${#valid[@]} > 0 )); then python scripts/espelhar_revisao_cofre.py "e278-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" "${valid[@]}"; fi
      - name: Recuperar somente folhas E276 ja inspecionadas
        env:
          GH_TOKEN: ${{ secrets.COFRE_TOKEN }}
        run: |
          python - <<'PY'
          import base64,hashlib,json
          from pathlib import Path
          from scripts.recuperar_checkpoints_documentais import api
          m=api('');assert m.get('private') is True and m.get('id')==1454059520
          dest=Path('qa_e278_folhas');dest.mkdir()
          observations=json.loads(Path('benchmarks/e278/observacoes.json').read_text())
          for name in ['pretriagem-pendente.json']+[o['folha'] for o in observations['observacoes']]:
              assert Path(name).name==name
              j=api('/contents/revisoes/e276-45628962634-1/'+name+'?ref=revisao-privada')
              raw=base64.b64decode(j['content']);assert len(raw)==j['size']
              assert hashlib.sha1(('blob '+str(len(raw))+'\0').encode()+raw).hexdigest()==j['sha']
              (dest/name).write_bytes(raw)
          PY
      - name: Adquirir apenas as duas pistas visualmente priorizadas
        run: python -m scripts.qa_adquirir_pretriagem_e272 qa_e275/contrastes.json qa_e278_folhas/pretriagem-pendente.json benchmarks/e278/observacoes.json qa_e278_aquisicao --observacoes qa_e278_folhas
      - name: Confirmar handoff privado sem promover cobertura
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('qa_e278_aquisicao')
          choices=json.loads((root/'escolhas-observadas.json').read_text())
          r=json.loads((root/'aquisicao.json').read_text())
          assert len(choices['selecao'])==len(r['resultados'])==2
          assert r['publicar'] is False and r['direitos_aprovados'] is False and r['visao']==r['cobertura_nova']==0
          print('E278 AQUISICAO',[(x['id'],x['estado']) for x in r['resultados']])
          PY
      - name: Preservar originais e evidencias privadas
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ secrets.COFRE_TOKEN }}
        run: |
          shopt -s nullglob
          files=(qa_e278_aquisicao/*.json qa_e278_aquisicao/*.jpg)
          packets=(qa_e278_aquisicao/checkpoints/*.zip)
          if (( ${#packets[@]} > 0 )); then
            bash scripts/arquivar_cofre_review.sh "review-e278-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" "${files[@]}" qa_e278_aquisicao/manifesto-revisoes.jsonl "${packets[@]}"
          fi
          if (( ${#files[@]} > 0 )); then python scripts/espelhar_revisao_cofre.py "e278-aquisicao-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" "${files[@]}"; fi
