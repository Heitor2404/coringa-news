name: "LAB E12–E14 — segundo autor MIT, acionador parcial, video privado"
on:
  push:
    branches: [atlas-direcao-visual-20261118]
    paths:
      - ".github/workflows/qa-fonte-independente-e12-e14.yml"
      - "src/v4/formatos/importador_juntas_json_e12.py"
      - "src/v4/formatos/solver_restricoes_e1.py"
      - "src/v4/formatos/renderer_mecanico_e9.py"
      - "src/v4/formatos/auditoria_visual_e10.py"
      - "benchmarks/e12_independent_planar_json_v1.json"
      - "tests/test_importador_juntas_e12.py"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: lab-e12-e14-real-json-second-author
  cancel-in-progress: true
jobs:
  independent_input:
    runs-on: ubuntu-22.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - name: Install numeric/vector/video testing
        run: |
          python -m pip install -q pytest numpy scipy cairosvg pillow
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update -qq
            sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends ffmpeg
          fi
      - name: E12 adversarial and legacy E1/E2/E7/E8/E9/E10 regressions
        run: |
          python -m pytest -q \
            tests/test_importador_juntas_e12.py \
            tests/test_renderer_mecanico_e9_e10.py \
            tests/test_importador_geometria_e7.py \
            tests/test_triagem_fontes_geometria_e8.py \
            tests/test_solver_generico_e1.py \
            tests/test_solver_generico_e2.py
      - name: Fetch independent MIT source JSONs by commit + blob
        timeout-minutes: 7
        run: |
          mkdir -p qa_e12_e14
          python -m src.v4.formatos.importador_juntas_json_e12 \
            benchmarks/e12_independent_planar_json_v1.json qa_e12_e14
      - name: Independent score and no-CAD-pretence gate
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path("qa_e12_e14")
          data=json.loads((root/"QA_E12_SOURCE_JSON.json").read_text("utf8"))
          assert data["tested_files"]==4
          assert data["passed"]+data["blocked"]==4
          assert data["passed"]>=1, data
          assert data["second_independent_author"] is True
          assert data["source_commit"]=="bb6137456a04d9afaa51240e9fc3e8540d269532"
          assert data["license_preserved"] and data["license_raw_has_placeholder_author"]
          assert data["no_CAD_contours_attached"]
          assert data["compliant_STL_not_reused_as_rigid_links"]
          assert data["no_source_to_spec_from_prose_or_video"]
          assert data["visual_approved"] is False and not data["publish"]
          assert all(x["source_provenance_verified"] and x["license_verified"]
                     and x["source_live"] for x in data["source_cases"])
          winners=[x for x in data["source_cases"]
                  if x["status"]=="PASS_SOURCE_JSON_TO_COMMON_SOLVER"]
          assert all(x["jacobian_full_rank"] and x["max_residual_m"]<1e-7
                     and x["source_joint_count"]==4 and x["moving_body_count"]==3
                     and not x["real_CAD_part_contours_imported"] for x in winners)
          summary={
            "schema":"coringa-e14-independent-source-batch-v1",
            "source_jsons_attempted":4,
            "source_jsons_accepted":data["passed"],
            "source_jsons_blocked":data["blocked"],
            "second_independent_author":True,
            "second_independent_schema":True,
            "oscillatory_input_ranges_from_source":True,
            "CAD_contours_reconstructed":False,
            "compliant_STL_reused":False,
            "source_is_physical_validated":False,
            "licenses_checked":True,
            "automatic_mechanism_from_unstructured_text":False,
            "user_style_homologated":False,
            "publish":False}
          (root/"QA_E14_SUMMARY.json").write_text(json.dumps(summary,indent=2),encoding="utf8")
          print(json.dumps(summary,ensure_ascii=False))
          PY
      - name: E14 batch four source-derived private videos on E9 common renderer
        timeout-minutes: 9
        run: |
          python - <<'PY'
          import hashlib,json,subprocess
          from pathlib import Path
          from PIL import Image,ImageChops,ImageStat
          from src.v4.formatos import solver_restricoes_e1 as S
          from src.v4.formatos import renderer_mecanico_e9 as R
          from src.v4.formatos import auditoria_visual_e10 as Q
          root=Path("qa_e12_e14")
          data=json.loads((root/"QA_E12_SOURCE_JSON.json").read_text("utf8"))
          ok=[x for x in data["source_cases"]
              if x["status"]=="PASS_SOURCE_JSON_TO_COMMON_SOLVER"]
          board=Image.new("RGB",(270*len(ok),480),"#092233")
          reports=[]
          for i,x in enumerate(ok):
              stem=Path(x["source_path"]).stem
              spec=json.loads((root/(stem+"_E12_SPEC.json")).read_text("utf8"))
              frames=S.trajectory(spec,121)
              assert all(f["jacobian_rank"]==f["jacobian_size"] for f in frames)
              technical,frames_png=Q.evaluate(spec,sample_frames=91)
              assert technical["stage_safezone_pass"] and technical["fixed_camera"]
              assert technical["joint_error_max_m"]<1e-6
              assert technical["industrial_part_contours_sourced"] is False
              assert not technical["aesthetic_approved"]
              movie=root/("E14_SECOND_SOURCE_"+stem+".mp4")
              metadata=R.render(spec,movie,title="E14 | FONTE INDEPENDENTE")
              assert metadata["renderer"]=="single_generic_e9_illustration_renderer"
              assert metadata["sha256"]==hashlib.sha256(movie.read_bytes()).hexdigest()
              assert not metadata["visual_approved"] and not metadata["publish"]
              probe=json.loads(subprocess.check_output(["ffprobe","-v","error",
                "-show_entries","stream=codec_type,width,height,r_frame_rate:format=duration",
                "-of","json",str(movie)]))
              v=next(s for s in probe["streams"] if s["codec_type"]=="video")
              assert (v["width"],v["height"])==(540,960)
              assert v["r_frame_rate"]=="18/1"
              assert not any(s["codec_type"]=="audio" for s in probe["streams"])
              path=root/("E14_STILL_"+stem+".png")
              subprocess.check_call(["ffmpeg","-hide_banner","-loglevel","error","-y",
                "-ss","0.7","-i",str(movie),"-frames:v","1",str(path)])
              image=Image.open(path).convert("RGB")
              board.paste(image.resize((270,480)),(i*270,0))
              reports.append({
                "source_path":x["source_path"],
                "source_sha256":x["source_sha256"],
                "source_commit":x["source_commit"],
                "body_count":x["moving_body_count"],
                "joint_count":x["source_joint_count"],
                "source_range_deg":x["input_source_range_deg"],
                "video":movie.name,"sha256":metadata["sha256"],
                "technical_QA":technical,
                "actual_flexure_STL_not_rendered":True,
                "visual_approved":False,"publish":False})
          board.save(root/"E14_SECOND_SOURCE_STORYBOARD.jpg",quality=92)
          summary=json.loads((root/"QA_E14_SUMMARY.json").read_text("utf8"))
          summary["rendered_private_videos"]=len(reports)
          summary["videos"]=reports
          summary["all_renderers_common_E9"]=True
          summary["second_repo_art_approved"]=False
          (root/"QA_E14_SUMMARY.json").write_text(
              json.dumps(summary,indent=2,ensure_ascii=False),encoding="utf8")
          assert len(reports)>=1
          print(json.dumps({"videos":len(reports),
             "second_source":data["source_repository"],
             "all_solver_bound":True,"publish":False},ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lab-e12-e14-second-author-real-joints-private
          path: qa_e12_e14/
          retention-days: 5
          if-no-files-found: warn
