name: "LAB E8 — fontes MIT independentes e geometrias ineditas no importador"
on:
  push:
    branches: [atlas-direcao-visual-20261118]
    paths:
      - ".github/workflows/qa-fontes-abertas-e8.yml"
      - "src/v4/formatos/triagem_fontes_geometria_e8.py"
      - "src/v4/formatos/importador_geometria_e7.py"
      - "benchmarks/e8_multi_repo_catalog_v1.json"
      - "benchmarks/e8_unseen_linkage_sources_v1.json"
      - "tests/test_triagem_fontes_geometria_e8.py"
      - "tests/test_importador_geometria_e7.py"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: lab-e8-multisource-unseen
  cancel-in-progress: true
jobs:
  verify_and_probe:
    runs-on: ubuntu-22.04
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install free numerical, SVG and test dependencies
        run: |
          python -m pip install -q pytest numpy scipy cairosvg pillow
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update -qq
            sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends ffmpeg
          fi
      - name: Run E8 adversarial and E7/E1/E2 physical regressions
        run: |
          python -m pytest -q \
            tests/test_triagem_fontes_geometria_e8.py \
            tests/test_importador_geometria_e7.py \
            tests/test_solver_generico_e1.py \
            tests/test_solver_generico_e2.py
      - name: Verify two MIT repositories by exact commit and source blobs
        timeout-minutes: 6
        run: |
          mkdir -p qa_e8
          python -m src.v4.formatos.triagem_fontes_geometria_e8 \
            benchmarks/e8_multi_repo_catalog_v1.json \
            qa_e8/E8_MULTI_SOURCE_TRIAGE.json
      - name: Run E7 import on six never-before-attempted upstream CSVs
        timeout-minutes: 9
        run: |
          python -m src.v4.formatos.importador_geometria_e7 \
            benchmarks/e8_unseen_linkage_sources_v1.json qa_e8 --live
      - name: Independently score what passes and what correctly refuses
        run: |
          python - <<'PY'
          import json,hashlib
          from pathlib import Path
          root=Path("qa_e8")
          catalog=json.loads((root/"E8_MULTI_SOURCE_TRIAGE.json").read_text("utf8"))
          results=json.loads((root/"QA_E7_GEOMETRY.json").read_text("utf8"))
          previous=json.loads(Path("benchmarks/e7_open_geometry_sources_v1.json").read_text("utf8"))
          new=json.loads(Path("benchmarks/e8_unseen_linkage_sources_v1.json").read_text("utf8"))
          assert catalog["source_count"]==2 and catalog["source_sample_files"]==4
          assert catalog["status"]=="PROVENANCE_CONFIRMED_CAPABILITY_GATED"
          assert len({x["repository"] for x in catalog["source_checks"]})==2
          assert all(x["runtime_source_verified"] and x["license_exact_blob_verified"]
                     for x in catalog["source_checks"])
          second=next(x for x in catalog["source_checks"]
                      if x["repository"]=="MasoudMiM/sketch-mechanisms")
          assert {x["capability"] for x in second["source_files"]}=={
            "INDEPENDENT_KINEMATIC_ORACLE_ONLY",
            "PARAMETRIC_PRESET_NO_EXPLICIT_JOINT_ANCHORS"}
          assert all(not f["can_build_mechanism_spec_without_named_template"]
                     for f in second["source_files"])
          assert catalog["source_files_with_complete_anchor_geometry"]>=1
          assert {x["path"] for x in previous["files"]}.isdisjoint(
                 {x["path"] for x in new["files"]})
          assert results["network_reported_live"]
          assert len(results["source_cases"])==6
          assert results["passed"]+results["blocked"]==6
          assert all(x["source_https_verified_in_ci"] and x["license_verified"]
                     for x in results["source_cases"])
          assert all(not x["publish"] for x in results["source_cases"])
          # Pre-declared test: must generalize to at least one unseen input.
          assert results["passed"]>=1,results
          winners=[x for x in results["source_cases"]
                   if x["status"]=="PASS_SOURCE_GEOMETRY_SOLVER_ONLY"]
          assert all(x["full_rank"] and x["max_residual_m"]<1e-7
                     and x["finite_slot_proof"] for x in winners)
          stem=Path(winners[0]["source_path"]).stem.replace("-","_")
          assert (root/(stem+"_E7_SPEC.json")).is_file()
          (root/"FIRST_SUCCESSFUL_STEM.txt").write_text(stem,encoding="utf8")
          report={
             "schema":"coringa-e8-generalization-lab-v1",
             "two_independent_mit_sources_verified":True,
             "source_repos":catalog["repositories"],
             "candidate_files_across_repos":catalog["source_sample_files"],
             "geometry_candidates":catalog["source_files_with_complete_anchor_geometry"],
             "second_repo_to_mechanism_spec":False,
             "unseen_source_cases_attempted":6,
             "unseen_source_cases_accepted":results["passed"],
             "unseen_source_cases_blocked":results["blocked"],
             "first_successful_source_path":winners[0]["source_path"],
             "from_structured_geometry":True,
             "from_unstructured_prose":False,
             "unrestricted_topic_discovery":False,
             "new_immutable_12_benchmark_targets_confirmed":0,
             "holdout_mechanisms_attempted":0,
             "art_approved":False,"publish":False,
             "gold_sha256":hashlib.sha256(
                Path("benchmarks/e8_unseen_linkage_sources_v1.json").read_bytes()).hexdigest()
          }
          (root/"E8_SUMMARY.json").write_text(json.dumps(report,indent=2),encoding="utf8")
          print(json.dumps(report,ensure_ascii=False))
          PY
      - name: Render first unseen accepted MechanismSpec on shared SVG renderer
        timeout-minutes: 6
        run: |
          STEM=$(cat qa_e8/FIRST_SUCCESSFUL_STEM.txt)
          INPUT=$(printf 'qa_e8/%s_E7_SPEC.json' "$STEM")
          python -m src.v4.formatos.renderer_corpos_e1 \
            "$INPUT" qa_e8/E8_UNSEEN_GENERIC_PRIVATE.mp4 \
            --title "LAB E8 | FONTE ESTRUTURADA EXTERNA"
      - name: Verify codec, frame changes, fixed camera, hash and contact sheet
        run: |
          python - <<'PY'
          import hashlib,json,subprocess
          from pathlib import Path
          from PIL import Image,ImageChops,ImageStat
          from src.v4.formatos import solver_restricoes_e1 as S
          from src.v4.formatos import renderer_corpos_e1 as R
          out=Path("qa_e8")
          stem=(out/"FIRST_SUCCESSFUL_STEM.txt").read_text("utf8")
          spec=json.loads((out/(stem+"_E7_SPEC.json")).read_text("utf8"))
          movie=out/"E8_UNSEEN_GENERIC_PRIVATE.mp4"
          meta=json.loads(movie.with_suffix(".json").read_text("utf8"))
          checksum=hashlib.sha256(movie.read_bytes()).hexdigest()
          assert meta["sha256"]==checksum and not meta["publish"]
          assert meta["renderer"]=="single_shared_svg_compositor"
          ff=json.loads(subprocess.check_output(["ffprobe","-v","error",
            "-show_entries","stream=codec_type,width,height,r_frame_rate:format=duration",
            "-of","json",str(movie)]))
          stream=next(x for x in ff["streams"] if x["codec_type"]=="video")
          assert (stream["width"],stream["height"])==(540,960)
          assert stream["r_frame_rate"]=="18/1"
          assert not any(x["codec_type"]=="audio" for x in ff["streams"])
          poses=S.trajectory(spec,121)
          assert max(p["max_residual_m"] for p in poses)<1e-7
          camera=R.geometry_bounds(spec,poses)
          assert camera["world_fixed_for_all_frames"]
          duration=float(ff["format"]["duration"])
          board=Image.new("RGB",(1080,480),"#eef3f5")
          grabbed=[]
          for i,frac in enumerate((.05,.28,.52,.76)):
              file=out/f"E8_FRAME_{i}.png"
              subprocess.check_call(["ffmpeg","-hide_banner","-loglevel","error","-y",
                "-ss",str(duration*frac),"-i",str(movie),"-frames:v","1",str(file)])
              img=Image.open(file).convert("RGB")
              assert img.size==(540,960)
              grabbed.append(img.crop((18,153,522,769)))
              board.paste(img.resize((270,480)),(270*i,0))
          board.save(out/"E8_CONTACT_SHEET.jpg",quality=92)
          motion=[sum(ImageStat.Stat(ImageChops.difference(grabbed[0],g)).mean)/3
                  for g in grabbed[1:]]
          assert max(motion)>0.4,("STATIC_STAGE",motion)
          report={"schema":"coringa-e8-private-video-qa-v1",
            "motion_rgb_change":max(motion),"video_sha256":checksum,
            "duration_s":duration,"camera_fixed":True,
            "media_from_third_party_copied":False,
            "visual_approved":False,"publish":False}
          (out/"E8_VIDEO_QA.json").write_text(json.dumps(report,indent=2),encoding="utf8")
          print(json.dumps(report,ensure_ascii=False))
          PY
      - name: Render ALL accepted source-derived mechanisms using one generic renderer
        timeout-minutes: 8
        run: |
          python - <<'PY'
          import hashlib,json,subprocess
          from pathlib import Path
          from PIL import Image,ImageChops,ImageStat
          from src.v4.formatos import solver_restricoes_e1 as S
          from src.v4.formatos import renderer_corpos_e1 as R
          root=Path("qa_e8")
          batch=json.loads((root/"QA_E7_GEOMETRY.json").read_text("utf8"))
          first=(root/"FIRST_SUCCESSFUL_STEM.txt").read_text("utf8")
          winners=[r for r in batch["source_cases"]
                   if r["status"]=="PASS_SOURCE_GEOMETRY_SOLVER_ONLY"]
          assert len(winners)==batch["passed"]>=1
          preview=Image.new("RGB",(270*len(winners),480),"#ecf2f5")
          reports=[]
          for i,r in enumerate(winners):
              stem=Path(r["source_path"]).stem.replace("-","_")
              path=root/(stem+"_E7_SPEC.json")
              assert path.is_file()
              spec=json.loads(path.read_text("utf8"))
              S.validate(spec)
              camera=R.geometry_bounds(spec,S.trajectory(spec,121))
              assert camera["world_fixed_for_all_frames"]
              dest=(root/"E8_UNSEEN_GENERIC_PRIVATE.mp4" if stem==first
                    else root/("E8_GENERIC_"+stem+".mp4"))
              if stem!=first:
                  subprocess.run(["python","-m","src.v4.formatos.renderer_corpos_e1",
                      str(path),str(dest),"--title","LAB E8 | MESMO SOLVER"],
                      check=True)
              metadata=json.loads(dest.with_suffix(".json").read_text("utf8"))
              sha=hashlib.sha256(dest.read_bytes()).hexdigest()
              assert sha==metadata["sha256"] and metadata["renderer"]=="single_shared_svg_compositor"
              assert not metadata["publish"] and not metadata["visual_approved"]
              assert metadata["camera_fixed"]
              probe=json.loads(subprocess.check_output(["ffprobe","-v","error",
                  "-show_entries","stream=codec_type,width,height:format=duration",
                  "-of","json",str(dest)]))
              video=next(v for v in probe["streams"] if v["codec_type"]=="video")
              assert (video["width"],video["height"])==(540,960)
              assert not any(v["codec_type"]=="audio" for v in probe["streams"])
              duration=float(probe["format"]["duration"])
              crops=[]
              for sample in (0.18,0.61):
                  imgpath=root/f"E8_{stem}_{int(sample*100)}.png"
                  subprocess.check_call(["ffmpeg","-hide_banner","-loglevel","error","-y",
                     "-ss",str(duration*sample),"-i",str(dest),
                     "-frames:v","1",str(imgpath)])
                  crops.append(Image.open(imgpath).convert("RGB"))
              delta=ImageChops.difference(crops[0].crop((18,153,522,769)),
                                          crops[1].crop((18,153,522,769)))
              intensity=sum(ImageStat.Stat(delta).mean)/3
              assert intensity>.10,("STATIC_BODY",r["source_path"],intensity)
              preview.paste(crops[0].resize((270,480)),(270*i,0))
              reports.append({
                  "source_path":r["source_path"],
                  "source_commit":r["source_commit"],
                  "source_csv_sha256":r["source_sha256"],
                  "video":dest.name,
                  "sha256":sha,
                  "distinct_moving_bodies":r["converted_body_count"],
                  "source_joint_count":r["converted_joint_count"],
                  "max_residual_m":r["max_residual_m"],
                  "motion_rgb_change":intensity,
                  "visual_approved":False,"publish":False})
          preview.save(root/"E8_ACCEPTED_MECHANISMS_CONTACT.jpg",quality=90)
          summary={
              "schema":"coringa-e8-cross-topology-video-v1",
              "count":len(reports),
              "same_generic_solver_and_renderer":True,
              "source_to_spec_from_text":False,
              "sources":reports,
              "independent_visual_homologation":False,
              "publish":False}
          (root/"E8_ALL_VIDEOS_QA.json").write_text(
              json.dumps(summary,ensure_ascii=False,indent=2),encoding="utf8")
          print(json.dumps({"count":len(reports),"video_names":[x["video"] for x in reports],
              "media_copied":False,"publish":False},ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lab-e8-independent-mit-sources-unseen-private
          path: qa_e8/
          retention-days: 5
          if-no-files-found: warn
