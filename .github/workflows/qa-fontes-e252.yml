name: E252 - fontes cientificas privadas
on:
  push:
    branches: [atlas-direcao-visual-20261118]
    paths: ['.github/workflows/qa-fontes-e252.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sources:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    if: github.ref == 'refs/heads/atlas-direcao-visual-20261118'
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.13', cache: pip}
      - run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg
          fi
          python -m pip install -q -r requirements.txt beautifulsoup4 pytest
      - run: python -m pytest -q tests/test_fontes_cientificas_e252.py tests/test_acervo_recuperacao_e246.py tests/test_acervo_documental_e246.py tests/test_reuso_documental_e251.py
      - run: python -m scripts.qa_fontes_e252 qa_fontes
      - name: Espelhar descoberta e amostras no cofre privado
        env:
          GH_TOKEN: ${{ secrets.COFRE_TOKEN }}
        run: |
          shopt -s nullglob
          python scripts/espelhar_revisao_cofre.py "e252-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" qa_fontes/revisao.json qa_fontes/*.jpg
