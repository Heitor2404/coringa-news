name: E354-E358 - descoberta publica e recibos sem IA
on:
  push:
    branches: [atlas-direcao-visual-20261118]
    paths: ['.github/workflows/qa-fontes-e354.yml','src/v4/fontes_publicas_e354.py','tests/test_fontes_publicas_e354.py']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CAIXA_MAX_CHAMADAS: '0'
      CAIXA_TETO_USD: '0'
      USAR_CLAUDE: '0'
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.13', cache: pip}
      - name: Testes de contrato
        run: |
          python -m pip install -q -r requirements.txt beautifulsoup4 pytest
          python -m pytest -q tests/test_fontes_publicas_e354.py tests/test_acervo_documental_e246.py tests/test_fontes_cientificas_e252.py tests/test_politica_vertical_e349.py
      - name: Sonda real de metadados
        run: python -m scripts.qa_fontes_e354
      - name: Preservar relatorio privado
        if: always()
        env:
          GH_TOKEN: ${{ secrets.COFRE_TOKEN }}
        run: |
          if [[ -s stage_documental/e354/source-audit.json ]]; then
            python scripts/espelhar_revisao_cofre.py "e354-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" stage_documental/e354/source-audit.json
          fi
