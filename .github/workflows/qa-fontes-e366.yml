name: E365-E366 - cache stock e fontes culturais existentes
on:
  push:
    branches: [atlas-direcao-visual-20261118]
    paths: ['.github/workflows/qa-fontes-e366.yml','src/v4/fontes_culturais_e366.py','src/v4/cache_stock_e365.py','tests/test_fontes_culturais_e366.py']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fontes-stock-e366
  cancel-in-progress: false
jobs:
  qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CAIXA_MAX_CHAMADAS: '0'
      CAIXA_TETO_USD: '0'
      USAR_CLAUDE: '0'
      CORINGA_STOCK_CACHE_DB: stage_stock_cache/cache.sqlite3
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: ./.github/actions/setup-ffmpeg
      - uses: actions/setup-python@v5
        with: {python-version: '3.13', cache: pip}
      - run: python -m pip install -q -r requirements.txt beautifulsoup4 pytest
      - name: Contratos de licenca e cache
        run: python -m pytest -q tests/test_fontes_contextuais_e359.py tests/test_fontes_culturais_e366.py tests/test_descoberta_paralela_e363.py tests/test_rotas_expandidas_e360.py
      - uses: actions/cache/restore@v4
        with:
          path: stage_stock_cache/
          key: coringa-stock-meta-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: coringa-stock-meta-v1-
      - name: Prova real limitada das chaves ja existentes
        env:
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          DATA_GOV_API_KEY: ${{ secrets.DATA_GOV_API_KEY }}
        run: python -m scripts.qa_fontes_e366
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: stage_stock_cache/
          key: coringa-stock-meta-v1-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Preservar relatorio e quadros privados
        if: always()
        env:
          GH_TOKEN: ${{ secrets.COFRE_TOKEN }}
        run: |
          shopt -s nullglob
          root=stage_documental/e366
          if [[ -s "$root/proof.json" ]]; then
            python scripts/espelhar_revisao_cofre.py "e366-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" "$root/proof.json" "$root"/*.jpg
          fi
