name: E271.1 - foto protagonista com atribuicao no cabecalho
on:
  push:
    branches: [atlas-direcao-visual-20261118]
    paths: ['.github/workflows/qa-fragmento-documental-e267.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fragment:
    if: github.ref == 'refs/heads/atlas-direcao-visual-20261118'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CAIXA_MAX_CHAMADAS: '0'
      CAIXA_TETO_USD: '0'
      USAR_CLAUDE: '0'
      REMOTION_CHROME: /usr/bin/google-chrome
      CORINGA_CHROME: /usr/bin/google-chrome
      REMOTION_DISABLE_TELEMETRY: '1'
      DO_NOT_TRACK: '1'
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.13', cache: pip}
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm, cache-dependency-path: motor4/package-lock.json}
      - run: |
          python -m pip install -q -r requirements.txt beautifulsoup4 pytest
          npm ci --prefix motor4 --no-audit --no-fund
          if ! command -v ffmpeg >/dev/null; then sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg; fi
          python -m pytest -q tests/test_documentario_integral_e254.py tests/test_ponte_multimodal_e256.py tests/test_ponte_animacao_editorial.py tests/test_area_segura_plataformas.py
      - name: Recuperar relatorio privado e selecionar fragmento editorial
        env:
          GH_TOKEN: ${{ secrets.COFRE_TOKEN }}
        run: |
          python - <<'PY'
          import hashlib,json,subprocess
          from pathlib import Path
          from scripts.recuperar_checkpoints_documentais import api,listar_releases
          meta=api('');assert meta.get('private') is True and meta.get('id')==1454059520
          tag='review-e2648-45613384343-1'
          rel=next(r for r in listar_releases(60) if r['tag_name']==tag and r['draft'] is True)
          a=next(a for a in rel['assets'] if a['name']=='revisao.json')
          assert 0<a['size']<=12_000_000
          root=Path('qa_e267');root.mkdir()
          subprocess.run(['gh','release','download',tag,'--repo','Heitor2404/coringa-cofre','--pattern','revisao.json','--dir',str(root)],check=True,timeout=120)
          raw=(root/'revisao.json').read_bytes()
          assert len(raw)==a['size'] and 'sha256:'+hashlib.sha256(raw).hexdigest()==a['digest']
          PY
          python -m scripts.qa_fragmento_documental_e267 selecionar benchmarks/e254/documentario.json qa_e267/revisao.json qa_e267/spec.json n3 n5 n6 n8 n11 n13
          python -m scripts.recuperar_checkpoints_documentais qa_e267/spec.json gelo_paisagem qa_e267/acervo
          echo "CORINGA_CHECKPOINTS_DESCOBERTOS=qa_e267/acervo/descoberta.json" >> "$GITHUB_ENV"
      - name: Preparar fragmento somente com originais revisados
        run: |
          python -m scripts.qa_revisao_documental_e247 qa_e267/spec.json stage_documental/e267 gelo_paisagem --progressiva --multicenas --integral --somente-acervo
          python -m scripts.qa_fragmento_documental_e267 preparar stage_documental/e267
      - name: Renderizar compositor real e extrair quadros
        run: |
          root=stage_documental/e267
          (cd motor4 && npx --no-install remotion render remotion/src/index.ts FilmeEditorial ../"$root/fragmento.mp4" --props=../"$root/fragmento/props.json" --public-dir=remotion/public --codec=h264 --crf=21 --scale=0.5 --concurrency=3 --log=error)
          ffprobe -v error -show_streams -show_format -of json "$root/fragmento.mp4" > "$root/probe.json"
          python - <<'PY'
          import hashlib,json,subprocess
          from pathlib import Path
          from src.v4.formatos import qa_area_segura as S
          root=Path('stage_documental/e267');p=root/'fragmento.json';q=json.loads(p.read_text())
          m=json.loads((root/'probe.json').read_text())
          v=next(s for s in m['streams'] if s['codec_type']=='video')
          assert (v['width'],v['height'])==(540,960)
          assert not any(s['codec_type']=='audio' for s in m['streams'])
          assert abs(float(m['format']['duration'])-q['duracao_s'])<.08
          for c in q['cenas']:
              out=root/(c['id']+'-quadro.jpg')
              subprocess.run(['ffmpeg','-v','error','-y','-ss',str((c['inicio']+c['fim'])/2),'-i',str(root/'fragmento.mp4'),'-frames:v','1',str(out)],check=True)
              S.overlay(out,root/(c['id']+'-safe.jpg'))
          q['sha256_render']=hashlib.sha256((root/'fragmento.mp4').read_bytes()).hexdigest()
          p.write_text(json.dumps(q,ensure_ascii=False,indent=2))
          PY
      - name: Arquivar somente prova privada
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ secrets.COFRE_TOKEN }}
        run: |
          shopt -s nullglob
          root=stage_documental/e267
          if [[ -s "$root/fragmento.json" ]]; then
            files=("$root/fragmento.json" "$root"/*-quadro.jpg "$root"/*-safe.jpg "$root"/fragmento.mp4)
            bash scripts/arquivar_cofre_review.sh "review-e2711-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" "${files[@]}"
            python scripts/espelhar_revisao_cofre.py "e2711-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" "${files[@]}"
          fi
