name: E382.1 - recuperar ARK Smithsonian declarado
on:
  push:
    branches: [atlas-direcao-visual-20261118]
    paths: ['.github/workflows/qa-guid-e3821.yml','scripts/qa_guid_e3821.py']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qa:
    if: github.ref == 'refs/heads/atlas-direcao-visual-20261118'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.13', cache: pip}
      - run: python -m pip install -q -r requirements.txt beautifulsoup4 pytest
      - run: python -m pytest -q tests/test_guid_e3821.py tests/test_identidade_contexto_e375.py tests/test_fontes_culturais_e366.py
      - run: python -m scripts.qa_guid_e3821
        env:
          DATA_GOV_API_KEY: ${{ secrets.DATA_GOV_API_KEY }}
      - name: Preservar diagnostico privado
        if: always()
        env:
          GH_TOKEN: ${{ secrets.COFRE_TOKEN }}
        run: |
          if [[ -s stage_documental/e3821/proof.json ]]; then
            python scripts/espelhar_revisao_cofre.py "e3821-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" stage_documental/e3821/proof.json
          fi
