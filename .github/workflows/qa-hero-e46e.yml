name: E46E composição equilibrada por referência real
# Revalidar com o compositor corrigido; o push só reage a este próprio arquivo.
on:
  push:
    branches: [atlas-direcao-visual-20261118]
    paths: ['.github/workflows/qa-hero-e46e.yml']
  workflow_dispatch:
    inputs:
      run_id:
        description: Run E41 concluído com QA E42 e palco
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  editorial:
    strategy:
      fail-fast: false
      matrix:
        include:
          - kind: ciclo
            artifact: e41-suporte-privado
            run: "45383874036"
          - kind: step
            artifact: e46b-step
            run: "45389737615"
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      DO_NOT_TRACK: "1"
      REMOTION_DISABLE_TELEMETRY: "1"
      CORINGA_CHROME: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          run-id: ${{ matrix.run }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: fonte_e44
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: motor4/package-lock.json
      - name: Reutilizar QA e palco da transmissão sem simular novamente
        run: |
          python -m pip install --only-binary=:all: numpy imageio-ffmpeg pytest
          python -m pytest -q tests/test_editorial_e42.py tests/test_ponte_cad_editorial_e28.py tests/test_reflow_cad_e31.py tests/test_painel_e46.py tests/test_hero_cad_e46d.py tests/test_hero_cad_e46e.py
          python -m src.v4.formatos.ponte_cad_editorial_e28 fonte_e44/QA.json motor4/remotion/public qa_e46e
          python -m src.v4.formatos.hero_cad_e46d qa_e46e/props.json motor4/remotion/public qa_e46e/REFLOW.json --balanced
          python - <<'PY'
          import json
          q=json.load(open("fonte_e44/QA.json"))
          p=json.load(open("qa_e46e/props.json"))
          assert p["private_review_only"] is True
          r=p["shots"][0]["cad_reflow"]
          assert r["viewport"]==[20,465,1060,1435]
          assert 900<=r["center_y"]<=1000
          assert r["publish"] is False
          assert max(r["motion_ui_fraction"].values())<=r["motion_ui_budget"]
          if q.get("estado")=="REPROVADO_INTERFERENCIA_BREP":
              assert "INTERFERÊNCIA DETECTADA" in p["shots"][0]["cad_warning"]
          print("E46E-REFLOW",json.dumps(r))
          PY
      - name: Renderizar o compositor real
        run: |
          npm ci --prefix motor4 --no-audit --no-fund
          ./motor4/node_modules/.bin/tsc --project motor4/remotion/tsconfig.json --noEmit
          cd motor4
          npx --no-install remotion render remotion/src/index.ts FilmeEditorial \
            ../qa_e46e/editorial_cad.mp4 --props=../qa_e46e/props.json \
            --codec=h264 --crf=20 --concurrency=2 --public-dir=remotion/public --log=error
      - name: Decodificar e conferir saída
        run: |
          python - <<'PY'
          import json,subprocess
          from pathlib import Path
          from src.v4.formatos.ponte_cad_editorial_e28 import verificar_video,ffmpeg,sha
          root=Path("qa_e46e")
          p=json.loads((root/"props.json").read_text())
          movie=root/"editorial_cad.mp4"
          r=verificar_video(movie,round(p["duracao"]*30))
          r.update(sha256=sha(movie),publish=False,visual_approved=False,
                   gate_fisico=json.load(open("fonte_e44/QA.json")).get("estado","SEM_GATE_UNIFICADO"))
          (root/"QA_EDITORIAL.json").write_text(json.dumps(r,indent=2))
          subprocess.check_call([ffmpeg(),"-v","error","-y","-i",str(movie),"-vf",
              "fps=1,scale=270:480,tile=4x2","-frames:v","1",str(root/"contato.jpg")])
          print("E46E-EDITORIAL",json.dumps(r))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e46e-balanced-${{ matrix.kind }}
          path: qa_e46e/
          retention-days: 14
