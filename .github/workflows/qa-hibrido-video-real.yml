name: "QA — três recursos documentais: foto, vídeo NIST e mecanismo"
on:
  push:
    branches: [atlas-direcao-visual-20261118]
    paths:
      - ".github/workflows/qa-hibrido-video-real.yml"
      - "src/v4/formatos/video_contextual_v3.py"
      - "src/v4/formatos/diretor_hibrido.py"
      - "src/v4/formatos/filme_editorial.py"
      - "docs/v4/formatos/VIDEO_CURADO_PRIVADO_NIST_20261120.json"
      - "docs/v4/formatos/QA_ROTEIRO_V2_HIBRIDO_NIST_20261120.json"
      - "tests/test_video_contextual_v3.py"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: qa-hibrido-video-real
  cancel-in-progress: true
jobs:
  filme_sem_fraude:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: motor4/package-lock.json
      - name: Dependências existentes + FFmpeg
        run: |
          python -m pip install -q pillow requests numpy pyyaml cryptography pytest yt-dlp
          if ! command -v ffprobe >/dev/null || ! command -v ffmpeg >/dev/null; then
            sudo apt-get update -qq
            sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends ffmpeg
          fi
      - name: Regressões de seleção, integridade, ROI, licença e fatos
        run: |
          python -m pytest -q tests/test_video_contextual_v3.py tests/test_diretor_hibrido.py tests/test_diretor_roteiro_v2.py tests/test_video_framing_multitema.py
      - name: Reidratar original NIST com MESMO SHA registrado em V3
        timeout-minutes: 9
        run: |
          mkdir -p stage_documental
          python - <<'PY'
          import json
          from pathlib import Path
          from src.v4.formatos.coletar_videos_publicos import baixar_fonte,sha256_arquivo,validar_fonte
          fonte=json.loads(Path('docs/v4/formatos/CANDIDATOS_VIDEO_NIST_NANOFAB_20261119.json').read_text())['itens'][0]
          janela=json.loads(Path('docs/v4/formatos/VIDEO_CURADO_PRIVADO_NIST_20261120.json').read_text())['videos'][0]
          validar_fonte(fonte)
          assert janela['sha256_origem']==fonte['sha256_esperado']
          assert janela['licenca']=='REVIEW_PENDING' and janela['publicar'] is False
          p=Path(janela['arquivo'])
          baixar_fonte(fonte,p)
          assert sha256_arquivo(p)==fonte['sha256_esperado'],'FONTE ALTERADA: BLOQUEAR'
          print('ARQUIVO NIST ORIGINAL SEM REENCODE',p.stat().st_size)
          PY
      - name: Compor plano AUTO a partir do roteiro V2, catálogo de fotos e V3 vídeo
        run: |
          mkdir -p qa_hibrido_video
          python -m src.v4.formatos.diretor_hibrido             docs/v4/formatos/QA_ROTEIRO_V2_HIBRIDO_NIST_20261120.json             qa_hibrido_video motor4/remotion/public             --videos-curados docs/v4/formatos/VIDEO_CURADO_PRIVADO_NIST_20261120.json
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('qa_hibrido_video')
          props=json.loads((p/'props.json').read_text())
          prov=json.loads((p/'proveniencia_hibrida.json').read_text())
          assert [x['type'] for x in props['shots']]==['photo','video','mechanism']
          assert props['duracao']==12.5
          assert props['shots'][1]['source_in_seconds']==58.15
          assert len(props['shots'][1]['framing_positions'])==3
          assert props['shots'][1]['evidence']=='representative'
          assert props['shots'][2]['mechanism']=='optical_projection'
          assert prov['estado']=='ORIGINAIS_SHA_VERIFICADOS'
          assert len(prov['midias'])==2
          assert prov['aprovacao_editorial'] is False
          print('FOTO+VIDEO+MECANISMO NO MESMO FILME PRIVADO')
          PY
      - name: Compilar compositor existente
        run: |
          cd motor4
          npm ci --no-audit --no-fund
          npx --no-install tsc -p remotion/tsconfig.json --noEmit
      - name: Renderizar três etapas distintas do mesmo filme
        timeout-minutes: 12
        run: |
          cd motor4
          npx --no-install remotion render remotion/src/index.ts FilmeEditorial ../qa_hibrido_video/prova_video_real.mp4 --props=../qa_hibrido_video/props.json --public-dir=remotion/public --codec=h264 --crf=23 --scale=0.5 --concurrency=2 --log=error
      - name: Comparar duração/voz e gerar evidência de todos os planos
        run: |
          ffprobe -v error -show_entries format=duration,size:stream=codec_type,width,height -of json qa_hibrido_video/prova_video_real.mp4 > qa_hibrido_video/metadata.json
          ffmpeg -hide_banner -loglevel error -y -i qa_hibrido_video/prova_video_real.mp4 -vf "fps=1.28,scale=270:480,tile=4x4" -frames:v 1 qa_hibrido_video/contato_16_quadros.jpg
          ffmpeg -hide_banner -loglevel error -y -ss 4.1 -i qa_hibrido_video/prova_video_real.mp4 -frames:v 1 qa_hibrido_video/quadro_video_vertical.png
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path('qa_hibrido_video')
          meta=json.loads((root/'metadata.json').read_text())
          props=json.loads((root/'props.json').read_text())
          video=[s for s in meta['streams'] if s['codec_type']=='video']
          assert len(video)==1 and video[0]['width']==540 and video[0]['height']==960
          assert not any(s['codec_type']=='audio' for s in meta['streams'])
          assert abs(float(meta['format']['duration'])-props['duracao'])<.08
          m=root/'prova_video_real.mp4'
          report={'status':'QA_PRIVADA_SEM_APROVACAO_DE_DIREITOS','sha256':hashlib.sha256(m.read_bytes()).hexdigest(),'duracao_s':float(meta['format']['duration']),'tipos':[x['type'] for x in props['shots']],'registro_video':'NIST_NAO_TSMC','uso_licenca':'REVIEW_PENDING','revisao_editorial':'PENDENTE','publicar':False,'telegram':False}
          (root/'resultado.json').write_text(json.dumps(report,ensure_ascii=False,indent=2))
          print(json.dumps(report,ensure_ascii=False))
          PY
      - name: Guardar vídeo final PRIVADO e provas (não guardar original NIST)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-hibrido-v3-video-real-sem-direitos
          path: qa_hibrido_video/
          retention-days: 5
          if-no-files-found: warn
