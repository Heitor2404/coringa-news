name: E382 - Smithsonian identidade sem confundir formato e sujeito
on:
  push:
    branches: [atlas-direcao-visual-20261118]
    paths: ['.github/workflows/qa-identidade-e382.yml','scripts/qa_identidade_e382.py']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qa:
    if: github.ref == 'refs/heads/atlas-direcao-visual-20261118'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.13', cache: pip}
      - run: python -m pip install -q -r requirements.txt beautifulsoup4 pytest
      - run: python -m pytest -q tests/test_identidade_contexto_e375.py tests/test_prioridade_e369.py tests/test_rotas_expandidas_e360.py
      - run: python -m scripts.qa_identidade_e382
        env:
          DATA_GOV_API_KEY: ${{ secrets.DATA_GOV_API_KEY }}
      - name: Preservar diagnostico privado
        if: always()
        env:
          GH_TOKEN: ${{ secrets.COFRE_TOKEN }}
        run: |
          if [[ -s stage_documental/e382/proof.json ]]; then
            python scripts/espelhar_revisao_cofre.py "e382-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" stage_documental/e382/proof.json
          fi
