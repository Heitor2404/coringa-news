name: E336 - imersao na aquisicao e diagnostico
on:
  push:
    branches: [atlas-direcao-visual-20261118]
    paths: ['.github/workflows/qa-imersao-e336.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      CAIXA_MAX_CHAMADAS: '0'
      CAIXA_TETO_USD: '0'
      USAR_CLAUDE: '0'
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: ./.github/actions/setup-ffmpeg
      - uses: actions/setup-python@v5
        with: {python-version: '3.13', cache: pip}
      - name: Testes de aquisicao, direcao e geometria sem render
        run: |
          python -m pip install -q -r requirements.txt beautifulsoup4 pytest
          python -m pytest -q tests/test_imersao_e328.py tests/test_direcao_short_e306.py tests/test_revisao_documental_e247.py tests/test_pretriagem_e269.py tests/test_replanejamento_e308.py tests/test_documentario_integral_e254.py tests/test_composicao_e286.py tests/test_recuperacao_cache_e333.py
