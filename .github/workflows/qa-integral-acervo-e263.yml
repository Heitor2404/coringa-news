name: E264.3 - pistas historicas e amostras privadas sem nova IA
on:
  push:
    branches: [atlas-direcao-visual-20261118]
    paths: ['.github/workflows/qa-integral-acervo-e263.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preflight:
    if: github.ref == 'refs/heads/atlas-direcao-visual-20261118'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CAIXA_MAX_CHAMADAS: '0'
      CAIXA_TETO_USD: '0'
      USAR_CLAUDE: '0'
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.13', cache: pip}
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm, cache-dependency-path: motor4/package-lock.json}
      - run: |
          python -m pip install -q -r requirements.txt beautifulsoup4 pytest
          npm ci --prefix motor4 --no-audit --no-fund
          if ! command -v ffmpeg >/dev/null; then sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg; fi
          python -m pytest -q tests/test_documentario_integral_e254.py tests/test_integracao_corretiva_e260.py tests/test_checkpoint_e259.py tests/test_reuso_documental_e251.py
      - name: Recuperar somente checkpoints do cofre
        env:
          GH_TOKEN: ${{ secrets.COFRE_TOKEN }}
        run: |
          python -m scripts.recuperar_checkpoints_documentais benchmarks/e254/documentario.json gelo_paisagem qa_e263_acervo
          echo "CORINGA_CHECKPOINTS_DESCOBERTOS=qa_e263_acervo/descoberta.json" >> "$GITHUB_ENV"
      - name: Medir as 18 necessidades sem pesquisa externa
        run: |
          python -m scripts.qa_revisao_documental_e247 benchmarks/e254/documentario.json stage_documental/e263-integral gelo_paisagem --progressiva --multicenas --integral --somente-acervo
          python -m scripts.qa_documentario_integral_e254 stage_documental/e263-integral --somente-preflight
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('stage_documental/e263-integral')
          r=json.loads((root/'revisao.json').read_text())
          q=json.loads((root/'integral.json').read_text())
          assert r['modo_somente_acervo'] and r['publish'] is False
          assert r['visao_chamadas_logicas']==r['rede_aquisicao']['http']==r['cobertura_documentario']['consumo']['buscas']==0
          assert not (root/'props.json').exists() and not (root/'narracao48k.wav').exists()
          d=json.loads(Path('qa_e263_acervo/descoberta.json').read_text())
          print('E264.3 DESCOBERTA', d,flush=True)
          print('E264.3 RESTAURACAO',r['restauracao'],flush=True)
          print('E264.3 CAPACIDADE',q,flush=True)
          leads={c['sha_catalogo'] for p in r['pesquisa'] for c in p['candidatos'] if c.get('amostra_pendente')}
          print('E264.3 AMOSTRAS PENDENTES',sorted(leads),flush=True)
          assert len(leads)==11, 'historical candidate retrieval incomplete'
          PY
      - name: Espelhar lacunas reais
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ secrets.COFRE_TOKEN }}
        run: |
          shopt -s nullglob
          files=(stage_documental/e263-integral/*.json stage_documental/e263-integral/*.jpg)
          if [[ -s qa_e263_acervo/descoberta.json ]]; then files+=(qa_e263_acervo/descoberta.json); fi
          if (( ${#files[@]} > 0 )); then python scripts/espelhar_revisao_cofre.py "e2643-integral-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" "${files[@]}"; fi
