name: E390 - documentario integral consolidado Taiwan atual
on:
  push:
    branches: [atlas-direcao-visual-20261118]
    paths: ['.github/workflows/qa-integral-e390.yml','scripts/qa_integral_e390.py','motor4/scripts/qa_integral_e390.mjs']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: integral-e390-atual
  cancel-in-progress: true
jobs:
  pilot:
    if: github.ref == 'refs/heads/atlas-direcao-visual-20261118'
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      CAIXA_TETO_USD: '0'
      CAIXA_MAX_CHAMADAS: '0'
      USAR_CLAUDE: '0'
      REMOTION_CHROME: /usr/bin/google-chrome
      CORINGA_CHROME: /usr/bin/google-chrome
      REMOTION_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: ./.github/actions/setup-ffmpeg
      - uses: actions/setup-python@v5
        with: {python-version: '3.13', cache: pip}
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm, cache-dependency-path: motor4/package-lock.json}
      - run: |
          python -m pip install -q -r requirements.txt beautifulsoup4 pytest
          npm ci --prefix motor4 --no-audit --no-fund
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg; fi
          python -m pytest -q tests/test_integral_e379.py tests/test_composicao_e286.py tests/test_video_framing_multitema.py tests/test_documentario_e233_tempos.py tests/test_orcamento_visao_e284.py tests/test_tts_autorizada_e289.py tests/test_alinhamento_e289.py tests/test_atlas_multiscale_e237.py tests/test_atlas_base_regional_e235.py tests/test_ui_e299.py tests/test_cortes_revisados_e302.py tests/test_evidencias_estaticas_e321.py tests/test_replanejamento_e319.py
          ./motor4/node_modules/.bin/tsc -p motor4/remotion/tsconfig.json --noEmit
      - name: Restaurar acervo ja adquirido sem consultar origens de video
        env:
          GH_TOKEN: ${{ secrets.COFRE_TOKEN }}
        run: python -m scripts.restaurar_piloto_e289 review-e287-45685353176-1 qa_e289 stage_documental/e219
      - name: Restaurar registros causais verificados E323
        env:
          GH_TOKEN: ${{ secrets.COFRE_TOKEN }}
        run: python -m scripts.restaurar_evidencias_causais_e324 benchmarks/e299/cortes_revisados_e324.json qa_e289 stage_documental/e219 review-e323-45864804065-1
      - name: Restaurar janela adicional revisada sem novas aquisicoes
        env:
          GH_TOKEN: ${{ secrets.COFRE_TOKEN }}
        run: python -m scripts.restaurar_cortes_revisados_e302 benchmarks/e299/cortes_revisados_e324.json qa_e289 stage_documental/e219
      - name: Recuperar evidencias estaticas autenticadas
        env:
          GH_TOKEN: ${{ secrets.COFRE_TOKEN }}
        run: python -m scripts.evidencias_estaticas_e321 benchmarks/e299/evidencias_estaticas_e326.json qa_e289 stage_documental/e321
      - name: Recuperar voz medida autenticada
        env:
          GH_TOKEN: ${{ secrets.COFRE_TOKEN }}
        run: python -m scripts.restaurar_voz_e289 review-e289-45689022910-1 qa_e289 medida
      - name: Realinhar e montar sem IA
        run: python -m scripts.qa_documentario_geografia_e219 benchmarks/e219/kilauea_review_e232.json qa_e289 --acervo-restaurado --voz-medida-restaurada --atlas-direcao=benchmarks/e219/direcao_atlas_e297.json --cortes-revisados=benchmarks/e299/cortes_revisados_e324.json --evidencias-revisadas=benchmarks/e299/evidencias_estaticas_e326.json
      - name: Diagnosticar faixas editoriais contra as tres plataformas
        run: python -m scripts.qa_ui_e299 qa_e289/ui-diagnostico.json
      - name: Aplicar montagem e paineis E348 sobre fontes restauradas
        env:
          GH_TOKEN: ${{ secrets.COFRE_TOKEN }}
        run: |
          python -m scripts.qa_integracao_e348
          python -m scripts.qa_integral_e376
      - name: Consolidar identidade e graficos narrados aprovados
        env:
          GH_TOKEN: ${{ secrets.COFRE_TOKEN }}
        run: python -m scripts.qa_integral_e390
      - name: Verificar todas as cenas e renderizar integral atual
        run: cd motor4 && node scripts/qa_integral_e390.mjs
      - name: Verificar 2492 quadros e audio original
        run: python -m scripts.qa_integral_e390 --finish
      - name: Arquivar somente filme consolidado
        env:
          GH_TOKEN: ${{ secrets.COFRE_TOKEN }}
        run: |
          root=stage_documental/e390
          bash scripts/arquivar_cofre_review.sh "review-e390-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" "$root/CORINGA-EXPLICA-KILAUEA-ATUAL-E390.mp4" "$root/consolidation.json" "$root/props-current.json" "$root/attribution-manifest.json" "$root/review.json"
      - name: Entregar documentario atual sem repetir modelo antigo
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m scripts.entrega_visual_e390
      - name: Preservar diagnostico privado
        if: always()
        env:
          GH_TOKEN: ${{ secrets.COFRE_TOKEN }}
        run: |
          shopt -s nullglob
          root=stage_documental/e390
          files=("$root"/*.json "$root"/current-contact-*.jpg)
          if (( ${#files[@]} )); then python scripts/espelhar_revisao_cofre.py "e390-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" "${files[@]}"; fi
