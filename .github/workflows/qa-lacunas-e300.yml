name: E301 - testar fontes alternativas e janelas curtas nativas
on:
  push:
    branches: [atlas-direcao-visual-20261118]
    paths: ['.github/workflows/qa-lacunas-e300.yml']
  workflow_dispatch:
permissions:
  contents: read
env:
  CAIXA_MAX_CHAMADAS: '0'
  CAIXA_TETO_USD: '0'
  USAR_CLAUDE: '0'
  REMOTION_CHROME: /usr/bin/google-chrome
  CORINGA_CHROME: /usr/bin/google-chrome
jobs:
  coverage:
    if: github.ref == 'refs/heads/atlas-direcao-visual-20261118'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: ./.github/actions/setup-ffmpeg
      - uses: actions/setup-python@v5
        with: {python-version: '3.13', cache: pip}
      - run: python -m pip install -q -r requirements.txt beautifulsoup4 pytest
      - name: Validar duracao nativa e diagnostico de qualidade
        run: python -m pytest -q tests/test_janelas_e301.py tests/test_documentario_e233_tempos.py
      - name: Adquirir candidatos de fatos e inspecionar janelas
        run: python -m scripts.qa_lacunas_e300 benchmarks/e299/lacunas_kilauea_e301.json qa_e300
      - name: Preservar originais e folhas privadas
        env:
          GH_TOKEN: ${{ secrets.COFRE_TOKEN }}
        run: |
          shopt -s nullglob
          files=(qa_e300/coverage.json qa_e300/*.jpg)
          originals=(qa_e300/originais/*.mp4)
          bash scripts/arquivar_cofre_review.sh "review-e300-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" "${files[@]}" "${originals[@]}"
          python scripts/espelhar_revisao_cofre.py "e300-coverage-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" "${files[@]}"
      - name: Verificar disponibilidade de candidatos
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('qa_e300/coverage.json').read_text())
          assert any(x['status']=='BYTES_AND_WINDOWS_VERIFIED' for x in r['records']), 'E300 SEM CANDIDATOS DECODIFICADOS'
          assert not r['publish'] and r['semantic_review']=='PENDING'
          PY
  map:
    # E300.1 map already succeeded; rerun only by explicit dispatch.
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/atlas-direcao-visual-20261118'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: ./.github/actions/setup-ffmpeg
      - uses: actions/setup-python@v5
        with: {python-version: '3.13', cache: pip}
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm, cache-dependency-path: motor4/package-lock.json}
      - run: |
          python -m pip install -q -r requirements.txt beautifulsoup4 pytest
          npm ci --prefix motor4 --no-audit --no-fund
          python -m pytest -q tests/test_atlas_multiscale_e237.py tests/test_atlas_base_regional_e235.py tests/test_ponte_mapa_atlas_filme.py
      - name: Prova de detalhe com coordenada oficial
        run: python -m scripts.qa_atlas_multiscale benchmarks/e299/atlas_detalhe.json kilauea_topo_e299
      - name: Preservar prova e quadros reais
        env:
          GH_TOKEN: ${{ secrets.COFRE_TOKEN }}
        run: |
          root=qa_atlas_multiscale/kilauea_topo_e299
          bash scripts/arquivar_cofre_review.sh "review-e300-map-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" "$root/planejamento.json" "$root/comprovante_atlas.json" "$root/mapa.mp4"
          python scripts/espelhar_revisao_cofre.py "e300-map-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" "$root/planejamento.json" "$root/comprovante_atlas.json" "$root/mapa.mp4"
