name: "LAB E9–E11 — geometria para ilustracao, QA independente e lote visual"
on:
  push:
    branches: [atlas-direcao-visual-20261118]
    paths:
      - ".github/workflows/qa-lote-visual-e9-e11.yml"
      - "src/v4/formatos/renderer_mecanico_e9.py"
      - "src/v4/formatos/auditoria_visual_e10.py"
      - "tests/test_renderer_mecanico_e9_e10.py"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: e9-e11-generic-visual-lab
  cancel-in-progress: true
jobs:
  verify_and_render:
    runs-on: ubuntu-22.04
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install existing numerical and vector-video dependencies
        run: |
          python -m pip install -q pytest numpy scipy cairosvg pillow
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update -qq
            sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends ffmpeg
          fi
      - name: E9/E10 visual, E7/E8 source and E1/E2 physical regressions
        run: |
          python -m pytest -q \
            tests/test_renderer_mecanico_e9_e10.py \
            tests/test_importador_geometria_e7.py \
            tests/test_triagem_fontes_geometria_e8.py \
            tests/test_solver_generico_e1.py \
            tests/test_solver_generico_e2.py
      - name: Reimport six pinned external geometry sketches and preserve refusals
        timeout-minutes: 7
        run: |
          mkdir -p qa_e9_e11/source
          python -m src.v4.formatos.importador_geometria_e7 \
            benchmarks/e8_unseen_linkage_sources_v1.json \
            qa_e9_e11/source --live
      - name: Generate all accepted 2D previews, baseline comparisons and QA
        timeout-minutes: 12
        run: |
          python - <<'PY'
          import hashlib,io,json,subprocess
          from pathlib import Path
          import cairosvg
          from PIL import Image,ImageChops,ImageStat,ImageDraw
          from src.v4.formatos import solver_restricoes_e1 as S
          from src.v4.formatos import renderer_corpos_e1 as R
          from src.v4.formatos import renderer_mecanico_e9 as V
          from src.v4.formatos import auditoria_visual_e10 as A
          root=Path("qa_e9_e11");source=root/"source"
          batch=json.loads((source/"QA_E7_GEOMETRY.json").read_text("utf8"))
          successful=[r for r in batch["source_cases"]
                      if r["status"]=="PASS_SOURCE_GEOMETRY_SOLVER_ONLY"]
          blocked=[r for r in batch["source_cases"]
                   if r["status"].startswith("BLOCKED_")]
          assert batch["passed"]==4 and batch["blocked"]==2
          assert len(successful)==4 and len(blocked)==2
          frameboard=Image.new("RGB",(1080,480),"#061927")
          comparison=Image.new("RGB",(540,480),"#061927")
          audits=[]
          for i,source_record in enumerate(successful):
              stem=Path(source_record["source_path"]).stem.replace("-","_")
              spec=json.loads((source/(stem+"_E7_SPEC.json")).read_text("utf8"))
              S.validate(spec)
              metrics,images=A.evaluate(spec,sample_frames=91)
              assert metrics["stage_safezone_pass"]
              assert metrics["joint_error_max_m"]<1e-6
              assert not metrics["aesthetic_approved"]
              assert not metrics["housing_dimensions_verified"]
              movie=root/("E9_INDUSTRIAL_ILLUSTRATION_"+stem+".mp4")
              metadata=V.render(spec,movie,title="LAB E9 | ESTRUTURA MECANICA")
              assert metadata["renderer"]=="single_generic_e9_illustration_renderer"
              assert not metadata["visual_approved"] and not metadata["publish"]
              assert metadata["synthetic_machine_appearance"] is True
              sha=hashlib.sha256(movie.read_bytes()).hexdigest()
              assert sha==metadata["sha256"]
              probe=json.loads(subprocess.check_output(["ffprobe","-v","error",
                   "-show_entries","stream=codec_type,width,height,r_frame_rate:format=duration",
                   "-of","json",str(movie)]))
              v=next(x for x in probe["streams"] if x["codec_type"]=="video")
              assert (v["width"],v["height"])==(540,960)
              assert v["r_frame_rate"]=="18/1"
              assert not any(x["codec_type"]=="audio" for x in probe["streams"])
              snap=root/("E9_FRAME_"+stem+".png")
              subprocess.check_call(["ffmpeg","-hide_banner","-loglevel","error","-y",
                  "-ss","0.55","-i",str(movie),"-frames:v","1",str(snap)])
              im=Image.open(snap).convert("RGB")
              assert im.size==(540,960)
              frameboard.paste(im.resize((270,480)),(i*270,0))
              if i==0:
                  frames=S.trajectory(spec,91)
                  camera=R.geometry_bounds(spec,frames)
                  baseline_svg=R.svg_frame(spec,frames[24],camera,title="LAB BASE")
                  baseline_png=cairosvg.svg2png(bytestring=baseline_svg.encode("utf8"))
                  baseline=Image.open(io.BytesIO(baseline_png)).convert("RGB")
                  enhancement_png=cairosvg.svg2png(
                      bytestring=V.svg_frame(spec,frames[24],camera,frames,
                          title="LAB E9").encode("utf8"))
                  enhanced=Image.open(io.BytesIO(enhancement_png)).convert("RGB")
                  assert baseline.size==enhanced.size==(540,960)
                  baseline.save(root/"E8_BASELINE_STILL.png")
                  enhanced.save(root/"E9_STILL.png")
                  difference=ImageChops.difference(
                      baseline.crop((20,155,520,765)),
                      enhanced.crop((20,155,520,765)))
                  before_after_delta=sum(ImageStat.Stat(difference).mean)/3
                  assert before_after_delta>4,("NO_MEANINGFUL_VISUAL_CHANGE",before_after_delta)
                  comparison.paste(baseline.resize((270,480)),(0,0))
                  comparison.paste(enhanced.resize((270,480)),(270,0))
              audits.append({
                 "source_path":source_record["source_path"],
                 "source_sha256":source_record["source_sha256"],
                 "source_commit":source_record["source_commit"],
                 "body_count":len(spec["bodies"]),
                 "joint_count":len(spec["joints"]),
                 "video":movie.name,
                 "video_sha256":sha,
                 "technical_visual_qa":metrics,
                 "illustrative_appearance_only":True,
                 "source_contours_not_available":True,
                 "independent_style_approval":False,
                 "publish":False})
          frameboard.save(root/"E11_FOUR_MECHANISMS_CONTACT.jpg",quality=91)
          comparison.save(root/"E11_BASELINE_VS_E9.jpg",quality=93)
          report={
             "schema":"coringa-e11-visual-gate-batch-v1",
             "source_repo":"jackhale98/linkage_design",
             "source_sha_fixed_and_license_verified":True,
             "unseen_csvs_attempted":6,
             "kinematic_imports_accepted":len(successful),
             "kinematic_imports_rejected":len(blocked),
             "accepted_sources":audits,
             "rejected_sources":[{"path":r["source_path"],"reason":r["status"]}
                                 for r in blocked],
             "all_videos_share_renderer":True,
             "all_views_source_centerlines":True,
             "all_joint_positions_from_solver":True,
             "aesthetic_approved":False,
             "machine_cad_realism_proven":False,
             "industrial_machine_identity_proven":False,
             "baseline_pixel_delta_stage":before_after_delta,
             "production_integrated":False,"publish":False}
          (root/"QA_E11_BATCH.json").write_text(
              json.dumps(report,ensure_ascii=False,indent=2),encoding="utf8")
          print(json.dumps({
              "status":"PHYSICS_AND_GENERIC_ILLUSTRATION_VALIDATED_NOT_ART",
              "rendered_videos":len(audits),
              "blocked_sources":len(blocked),
              "baseline_pixel_delta":before_after_delta,
              "min_safezone":all(x["technical_visual_qa"]["stage_safezone_pass"]
                                 for x in audits),
              "publish":False
          },ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lab-e9-e11-four-generic-machines-illustrative-private
          path: qa_e9_e11/
          retention-days: 5
          if-no-files-found: warn
