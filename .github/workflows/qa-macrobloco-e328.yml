name: E328 - macrobloco composicao e direcao multitema
on:
  push:
    branches: [atlas-direcao-visual-20261118]
    paths: ['.github/workflows/qa-macrobloco-e328.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    env:
      CAIXA_MAX_CHAMADAS: '0'
      CAIXA_TETO_USD: '0'
      USAR_CLAUDE: '0'
      REMOTION_CHROME: /usr/bin/google-chrome
      REMOTION_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: ./.github/actions/setup-ffmpeg
      - uses: actions/setup-python@v5
        with: {python-version: '3.13', cache: pip}
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm, cache-dependency-path: motor4/package-lock.json}
      - name: Testes agrupados e preparar prova focal
        run: |
          python -m pip install -q -r requirements.txt pytest beautifulsoup4
          npm ci --prefix motor4 --no-audit --no-fund
          python -m pytest -q tests/test_imersao_e328.py tests/test_composicao_e286.py tests/test_area_segura_plataformas.py tests/test_ui_e299.py tests/test_revelacao_documental_e327.py tests/test_evidencias_estaticas_e321.py tests/test_documentario_integral_e254.py tests/test_direcao_short_e306.py tests/test_comparacao_e311.py tests/test_revisao_documental_e247.py tests/test_observacao_temporal_e315.py tests/test_fonte_relacionada_e317.py
          ./motor4/node_modules/.bin/tsc -p motor4/remotion/tsconfig.json --noEmit
          python -m scripts.qa_visual_e286
      - name: Renderizar somente quadros A B e medir tipografia real
        run: cd motor4 && node scripts/qa_macrobloco_e328.mjs
      - name: Espelhar provas privadas inclusive falhas
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ secrets.COFRE_TOKEN }}
        run: |
          shopt -s nullglob
          root=stage_documental/e286/e328
          if [[ -s "$root/comparison.json" ]]; then
            python scripts/espelhar_revisao_cofre.py "e328-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" "$root/comparison.json" "$root"/*.png
          fi
