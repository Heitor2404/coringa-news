name: "QA — rerender multitema com áudio preservado e rótulos sem colisão"
on:
  push:
    branches: [atlas-direcao-visual-20261118]
    paths: [".github/qualidade/mapa_rotulos_r2.txt"]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: qa-mapa-labels-r2
  cancel-in-progress: true
env:
  REMOTION_DISABLE_TELEMETRY: "1"
  CORINGA_CHROME: /usr/bin/google-chrome
  REMOTION_CHROME: /usr/bin/google-chrome
jobs:
  visual:
    runs-on: ubuntu-22.04
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: motor4/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Usar vídeo e plano sincronizado anteriores com mesmos bytes de áudio
        uses: actions/download-artifact@v4
        with:
          name: qa-diretor-mapas-voz-natural-progresso-global
          run-id: 44575540939
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: anterior
      - name: FFmpeg, Python e teste sem novas chamadas Edge TTS
        run: |
          python -m pip install -q pytest pillow requests
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq --no-install-recommends ffmpeg
          fi
          python -m pytest -q tests/test_mapas_voz_direcao_multitema.py
          test -s anterior/mapas_narrados.mp4
          test -s anterior/plano_sincronizado.json
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('anterior/plano_sincronizado.json').read_text())
          assert p['sincronia_voz']['tempo_audio']==1
          assert [x['type'] for x in p['shots']]==['map']*3
          print('Retemporização natural e identidade dos mapas PRESERVADAS')
          PY
      - name: Compilar e redesenhar apenas o visual
        timeout-minutes: 17
        run: |
          mkdir -p saida_mapas_r2
          cp anterior/plano_sincronizado.json saida_mapas_r2/plano_sincronizado.json
          python -m src.v4.formatos.filme_editorial \
            saida_mapas_r2/plano_sincronizado.json \
            saida_mapas_r2 motor4/remotion/public
          (
            cd motor4
            npm ci --no-audit --no-fund
            npx --no-install tsc -p remotion/tsconfig.json --noEmit
            npx --no-install remotion render remotion/src/index.ts FilmeEditorial \
              ../saida_mapas_r2/visual.mp4 \
              --props=../saida_mapas_r2/props.json --codec=h264 --crf=22 \
              --concurrency=2 --scale=0.5 \
              --public-dir=remotion/public --log=error
          )
          ffmpeg -hide_banner -loglevel error -y \
            -i saida_mapas_r2/visual.mp4 -i anterior/mapas_narrados.mp4 \
            -map 0:v:0 -map 1:a:0 -c:v copy -c:a copy \
            -movflags +faststart saida_mapas_r2/mapas_narrados_r2.mp4
      - name: Auditar visual real, duração e voz idêntica
        run: |
          python -m scripts.qa_montagem_multitema \
            saida_mapas_r2/plano_sincronizado.json \
            saida_mapas_r2/mapas_narrados_r2.mp4 saida_mapas_r2
          python - <<'PY'
          import json,subprocess
          from pathlib import Path
          out=Path('saida_mapas_r2')
          d=json.loads((out/'qa_montagem.json').read_text())
          assert d['status_tecnico']=='PRONTO_PARA_REVISAO',d['problemas_tecnicos']
          assert d['tem_audio'] and not d['publicavel']
          a=subprocess.check_output(['ffmpeg','-hide_banner','-loglevel','error',
                '-i','anterior/mapas_narrados.mp4','-map','0:a:0',
                '-f','md5','pipe:1']).strip()
          b=subprocess.check_output(['ffmpeg','-hide_banner','-loglevel','error',
                '-i',str(out/'mapas_narrados_r2.mp4'),'-map','0:a:0',
                '-f','md5','pipe:1']).strip()
          assert a==b,'áudio reencodado ou alterado: comparação A/B inválida'
          print('QA_R2_OK',{ 'tempo':d['duracao'],'tres_cenas':len(d['amostras_editoriais']),
                'audio_igual':True,'publicado':False})
          PY
      - name: Testar protocolo de entrega e enviar prévia ao Telegram PRIVADO
        timeout-minutes: 8
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python -m pytest -q tests/test_qa_mapas_r2_telegram.py
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "::error::Telegram privado não configurado; QA pronto mas envio bloqueado"
            exit 1
          fi
          python -m scripts.qa_mapas_r2_telegram saida_mapas_r2
      - name: Artefato privado para revisão
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-mapas-r2-labels-e-audio-identico
          path: |
            saida_mapas_r2/mapas_narrados_r2.mp4
            saida_mapas_r2/contato_editorial.jpg
            saida_mapas_r2/qa_montagem.json
            saida_mapas_r2/plano_sincronizado.json
          retention-days: 7
          if-no-files-found: warn
