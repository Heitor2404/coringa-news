name: "QA — entregar prévia final de mapas R2 no Telegram privado"
on:
  push:
    branches: [atlas-direcao-visual-20261118]
    paths: [".github/qualidade/entrega_telegram_mapa_r2.txt"]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: telegram-mapas-r2-entrega
  cancel-in-progress: false
jobs:
  entrega:
    runs-on: ubuntu-22.04
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Recuperar EXATAMENTE o vídeo já validado sem render/IA
        uses: actions/download-artifact@v4
        with:
          name: qa-mapas-r2-labels-e-audio-identico
          run-id: 44577678092
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: saida_mapas_r2
      - name: Dependências e 4 testes de privacidade e bloqueio
        run: |
          python -m pip install -q pytest requests
          if ! command -v ffprobe >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq --no-install-recommends ffmpeg
          fi
          python -m pytest -q tests/test_qa_mapas_r2_telegram.py
          test -s saida_mapas_r2/mapas_narrados_r2.mp4
          test -s saida_mapas_r2/qa_montagem.json
          test -s saida_mapas_r2/contato_editorial.jpg
      - name: Entregar VÍDEO e folha no Telegram privado autorizado
        timeout-minutes: 8
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "::error::Telegram privado indisponível; não tentar outro destino"
            exit 1
          fi
          python -m scripts.qa_mapas_r2_telegram saida_mapas_r2
