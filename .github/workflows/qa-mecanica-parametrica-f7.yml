name: "LAB F7 — mecânica paramétrica, duas montagens e regressão compressor/Otto"
on:
  push:
    branches: [atlas-direcao-visual-20261118]
    paths:
      - ".github/workflows/qa-mecanica-parametrica-f7.yml"
      - "src/v4/formatos/cinematica_biela_manivela.py"
      - "src/v4/formatos/primitivas_fisicas_parametricas.py"
      - "src/v4/formatos/compositor_cinematico_parametrico_2d.py"
      - "src/v4/formatos/cenas_parametricas/biela_manivela_curso_*.json"
      - "src/v4/formatos/compressor_pv_core.py"
      - "src/v4/formatos/render_reconstrucao_causal_2d.py"
      - "src/v4/formatos/render_compressor_conjunto_2d.py"
      - "tests/test_mecanica_parametrica_f7.py"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: f7-cinematica-parametrica
  cancel-in-progress: true
jobs:
  prova_mecanica:
    runs-on: ubuntu-22.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Dependências offline de física SVG e FFmpeg
        run: |
          python -m pip install -q pytest cairosvg pillow numpy scipy opencv-python-headless
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update -qq
            sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends ffmpeg
          fi
      - name: Testes das juntas, da biela e regressões das famílias existentes
        run: |
          python -m pytest -q \
            tests/test_mecanica_parametrica_f7.py \
            tests/test_compressor_conjunto_2d.py \
            tests/test_reference_reconstruction_2d.py \
            tests/test_camera_causal_svg.py \
            tests/test_compositor_parametrico_2d.py \
            tests/test_eclusa_hidraulica_moderna.py \
            tests/test_grafo_causal.py
      - name: Renderizar 2 vídeos de UM compositor, sem Claude
        timeout-minutes: 10
        run: |
          mkdir -p qa_f7_mecanico
          python -m src.v4.formatos.compositor_cinematico_parametrico_2d \
            src/v4/formatos/cenas_parametricas/biela_manivela_curso_curto.json \
            qa_f7_mecanico/BIELA_CURSO_CURTO_F7.mp4
          python -m src.v4.formatos.compositor_cinematico_parametrico_2d \
            src/v4/formatos/cenas_parametricas/biela_manivela_curso_longo.json \
            qa_f7_mecanico/BIELA_CURSO_LONGO_F7.mp4
      - name: Validar arquivos, extrair quadros e provar diferença física
        run: |
          python - <<'PY'
          import hashlib,json,subprocess
          from pathlib import Path
          from PIL import Image,ImageChops,ImageStat
          root=Path('qa_f7_mecanico')
          films=['BIELA_CURSO_CURTO_F7.mp4','BIELA_CURSO_LONGO_F7.mp4']
          board=Image.new('RGB',(4*270,2*480),'#EDF2F4')
          reports={}
          for row,name in enumerate(films):
            movie=root/name
            meta=json.loads(subprocess.check_output(['ffprobe','-v','error',
              '-show_entries','format=duration:stream=codec_type,width,height,r_frame_rate',
              '-of','json',str(movie)]))
            stream=next(x for x in meta['streams'] if x['codec_type']=='video')
            assert (stream['width'],stream['height'])==(540,960)
            assert stream['r_frame_rate']=='24/1'
            assert abs(float(meta['format']['duration'])-9)<.05
            assert not any(x['codec_type']=='audio' for x in meta['streams'])
            frames=[]
            for col,second in enumerate((.5,2.3,4.5,6.8)):
              output=root/f'{name[:-4]}_{col}.png'
              subprocess.check_call(['ffmpeg','-hide_banner','-loglevel','error',
                '-y','-ss',str(second),'-i',str(movie),'-frames:v','1',str(output)])
              image=Image.open(output).convert('RGB')
              frames.append(image)
              board.paste(image.resize((270,480)),(col*270,row*480))
            delta=ImageChops.difference(frames[0].crop((45,303,470,822)),
                                        frames[2].crop((45,303,470,822)))
            variation=sum(ImageStat.Stat(delta).mean)/3
            assert variation>5,variation
            report=json.loads(movie.with_suffix('.json').read_text('utf8'))
            digest=hashlib.sha256(movie.read_bytes()).hexdigest()
            assert report['sha256']==digest
            assert report['camera_fixed'] and not report['publish']
            reports[name]={'sha256':digest,
                 'difference_physical_roi_rgb':round(variation,3),
                 'identity_not_homologated':True}
          board.save(root/'COMPARACAO_F7_2_RIGS_8_QUADROS.jpg',quality=93)
          (root/'QA_F7_MECANICA.json').write_text(json.dumps({
            'status':'DUAS_MONTAGENS_MECANICAS_REAIS',
            'renderer_count':1,'technical_validation_only':True,
            'publication_approved':False,
            'visual_identity':'PENDENTE','movies':reports
          },ensure_ascii=False,indent=2),encoding='utf8')
          print(json.dumps(reports,ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lab-f7-mecanica-biela-manivela-dois-rigs-privados
          path: qa_f7_mecanico/
          retention-days: 5
          if-no-files-found: warn
