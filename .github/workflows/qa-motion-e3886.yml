name: E388.6 - continuidade e escala de area comum
on:
  push:
    branches: [atlas-direcao-visual-20261118]
    paths: ['.github/workflows/qa-motion-e3886.yml','motor4/scripts/qa_motion_e3886.mjs']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qa:
    if: github.ref == 'refs/heads/atlas-direcao-visual-20261118'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CAIXA_MAX_CHAMADAS: '0'
      CAIXA_TETO_USD: '0'
      USAR_CLAUDE: '0'
      REMOTION_CHROME: /usr/bin/google-chrome
      REMOTION_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: ./.github/actions/setup-ffmpeg
      - uses: actions/setup-python@v5
        with: {python-version: '3.13', cache: pip}
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm, cache-dependency-path: motor4/package-lock.json}
      - name: Regressoes e compilacao
        run: |
          python -m pip install -q -r requirements.txt beautifulsoup4 pytest
          npm ci --prefix motor4 --no-audit --no-fund
          python -m pytest -q tests/test_imersao_e328.py tests/test_composicao_e286.py tests/test_area_segura_plataformas.py tests/test_ui_e299.py tests/test_documentario_integral_e254.py tests/test_motion_direcao_e3884.py
          motor4/node_modules/.bin/tsc motor4/remotion/src/formatos/MotionChartCoreE3883.ts --target ES2022 --module commonjs --skipLibCheck --outDir /tmp/e3883-test
          node --test motor4/remotion/tests/motion-e3883.test.cjs
          (cd motor4 && npx --no-install tsc -p remotion/tsconfig.json --noEmit)
      - name: Preparar audio e ancoras autenticados do cofre
        env:
          GH_TOKEN: ${{ secrets.COFRE_TOKEN }}
        run: python -m scripts.qa_motion_e3886
      - name: Render motion Taiwan e verificar tipografia
        run: cd motor4 && node scripts/qa_motion_e3886.mjs
      - name: Arquivar videos privados antes da entrega
        if: always()
        env:
          GH_TOKEN: ${{ secrets.COFRE_TOKEN }}
        run: |
          shopt -s nullglob
          root=stage_documental/e3886
          videos=("$root"/motion-*.mp4)
          if (( ${#videos[@]} )); then bash scripts/arquivar_cofre_review.sh "review-e3886-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" "${videos[@]}" "$root/motion-attribution.json" "$root/comparison.json"; fi
      - name: Entrega privada de todas as provas visuais
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m scripts.entrega_visual_e3886
      - name: Preservar diagnostico e recibos privados
        if: always()
        env:
          GH_TOKEN: ${{ secrets.COFRE_TOKEN }}
        run: |
          shopt -s nullglob
          root=stage_documental/e3886
          if [[ -d "$root" ]]; then
            files=("$root"/*.json "$root"/*.jpg "$root"/motion-*.png)
            if (( ${#files[@]} )); then python scripts/espelhar_revisao_cofre.py "e3886-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" "${files[@]}"; fi
          fi
