name: E392B.1 - revisao de arte e legenda medida
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qa:
    if: github.ref == 'refs/heads/atlas-direcao-visual-20261118'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CAIXA_MAX_CHAMADAS: '0'
      CAIXA_TETO_USD: '0'
      USAR_CLAUDE: '0'
      REMOTION_CHROME: /usr/bin/google-chrome
      REMOTION_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: ./.github/actions/setup-ffmpeg
      - uses: actions/setup-python@v5
        with: {python-version: '3.13', cache: pip}
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm, cache-dependency-path: motor4/package-lock.json}
      - name: Compilar e regressao da arquitetura anterior
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libcairo2
          python -m pip install -q -r requirements.txt beautifulsoup4 pytest cairosvg
          npm ci --prefix motor4 --no-audit --no-fund
          python -m pytest -q tests/test_grafo_causal.py tests/test_camera_causal_svg.py tests/test_compilador_topologia_f15.py tests/test_engrenagens_f14.py tests/test_pecas_visuais_f8.py tests/test_relacoes_com_evidencia_f17.py tests/test_storyboard_e392.py
          motor4/node_modules/.bin/tsc motor4/remotion/src/formatos/CaptionFitE392.ts --target ES2022 --module commonjs --skipLibCheck --outDir /tmp/e392-caption
          node --test motor4/remotion/tests/caption-fit-e392.test.cjs
          (cd motor4 && npx --no-install tsc -p remotion/tsconfig.json --noEmit)
      - name: Preparar fonte e grafo autenticados
        env:
          GH_TOKEN: ${{ secrets.COFRE_TOKEN }}
        run: python -m scripts.qa_storyboard_e392
      - name: Render quatro quadros para aprovar arte antes de video
        run: cd motor4 && node scripts/qa_storyboard_e392.mjs
      - name: Entregar storyboard privado
        if: ${{ always() && !cancelled() }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m scripts.entrega_storyboard_e392
      - name: Preservar diagnostico privado
        if: always()
        env:
          GH_TOKEN: ${{ secrets.COFRE_TOKEN }}
        run: |
          shopt -s nullglob
          root=stage_documental/e392
          files=("$root"/*.json "$root"/*.jpg "$root"/*.png)
          if (( ${#files[@]} )); then python scripts/espelhar_revisao_cofre.py "e392-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" "${files[@]}"; fi
  alert:
    needs: qa
    if: ${{ always() && (needs.qa.result == 'failure' || needs.qa.result == 'cancelled') }}
    permissions:
      actions: read
      contents: none
    uses: ./.github/workflows/notificar-falha-documental.yml
    with:
      result: ${{ needs.qa.result }}
      job_name: qa
    secrets:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
