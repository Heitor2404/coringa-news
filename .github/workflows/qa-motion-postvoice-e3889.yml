name: E388.9 - alternativa quantitativa pos voz medida
on:
  push:
    branches: [atlas-direcao-visual-20261118]
    paths: ['.github/workflows/qa-motion-postvoice-e3889.yml','src/v4/formatos/motion_postvoice_e3889.py','tests/test_motion_postvoice_e3889.py']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qa:
    if: github.ref == 'refs/heads/atlas-direcao-visual-20261118'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      CAIXA_MAX_CHAMADAS: '0'
      CAIXA_TETO_USD: '0'
      USAR_CLAUDE: '0'
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.13', cache: pip}
      - name: Instalar dependencias e testar sem render
        run: |
          python -m pip install -q -r requirements.txt pytest beautifulsoup4
          python -m pytest -q tests/test_motion_postvoice_e3889.py tests/test_motion_intake_e3888.py tests/test_motion_direcao_e3884.py tests/test_documentario_integral_e254.py tests/test_direcao_short_e306.py tests/test_direcao_short_e307.py tests/test_gate_multitema_cobertura.py
