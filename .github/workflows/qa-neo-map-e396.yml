name: E396C - cartografia acabamento e travessia ilustrativa
on:
  push:
    branches: [atlas-direcao-visual-20261118]
    paths: ['.github/workflows/qa-neo-map-e396.yml','scripts/qa_neo_map_e396.py','motor4/remotion/src/neo-map-e396.tsx']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qa:
    if: github.ref == 'refs/heads/atlas-direcao-visual-20261118'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      REMOTION_CHROME: /usr/bin/google-chrome
      CORINGA_CHROME: /usr/bin/google-chrome
      REMOTION_DISABLE_TELEMETRY: '1'
      CAIXA_MAX_CHAMADAS: '0'
      CAIXA_TETO_USD: '0'
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: ./.github/actions/setup-ffmpeg
      - uses: actions/setup-python@v5
        with: {python-version: '3.13', cache: pip}
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm, cache-dependency-path: motor4/package-lock.json}
      - name: Dependencias e regressao cartografica
        run: |
          python -m pip install -q -r requirements.txt beautifulsoup4 pytest
          npm ci --prefix motor4 --no-audit --no-fund
          python -m pytest -q tests/test_ponte_mapa_atlas_filme.py tests/test_atlas_multiscale_e237.py tests/test_atlas_base_regional_e235.py
          motor4/node_modules/.bin/tsc -p motor4/remotion/tsconfig.json --noEmit
      - name: Adquirir mosaicos licenciados e verificar cobertura em todos os quadros
        run: python -m scripts.qa_neo_map_e396
      - name: Renderizar dois enquadramentos nativos MapLibre
        run: |
          cd motor4
          npx --no-install remotion render remotion/src/neo-map-e396.tsx NeoMapWide ../qa_neo_map_e396/wide.mp4 --props=../qa_neo_map_e396/wide.json --codec=h264 --crf=18 --concurrency=1 --public-dir=remotion/public --log=error
          npx --no-install remotion render remotion/src/neo-map-e396.tsx NeoMapPortrait ../qa_neo_map_e396/portrait.mp4 --props=../qa_neo_map_e396/portrait.json --codec=h264 --crf=18 --concurrency=1 --public-dir=remotion/public --log=error
      - name: Validar videos e criar comparativos
        run: python -m scripts.verificar_neo_map_e396
      - name: Entregar provas privadas
        if: ${{ always() && !cancelled() }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m scripts.entregar_neo_map_e396
      - name: Preservar provas e recibos
        if: always()
        env:
          GH_TOKEN: ${{ secrets.COFRE_TOKEN }}
        run: |
          shopt -s nullglob
          root=qa_neo_map_e396
          videos=("$root"/*.mp4)
          if (( ${#videos[@]} )); then bash scripts/arquivar_cofre_review.sh "review-e396c-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" "${videos[@]}" "$root/manifest.json"; fi
          files=("$root"/manifest.json "$root"/qa.json "$root"/delivery.json "$root"/detail-discovery.json "$root"/*.jpg)
          existing=()
          for f in "${files[@]}"; do if [[ -f "$f" ]]; then existing+=("$f"); fi; done
          if (( ${#existing[@]} )); then python scripts/espelhar_revisao_cofre.py "e396c-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" "${existing[@]}"; fi
  alert:
    needs: qa
    if: ${{ always() && (needs.qa.result == 'failure' || needs.qa.result == 'cancelled') }}
    permissions:
      actions: read
      contents: none
    uses: ./.github/workflows/notificar-falha-documental.yml
    with:
      result: ${{ needs.qa.result }}
      job_name: qa
    secrets:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
