name: E363 - onda paralela publica e atribuicao
on:
  push:
    branches: [atlas-direcao-visual-20261118]
    paths: ['.github/workflows/qa-onda-e363.yml','src/v4/descoberta_paralela_e363.py','tests/test_descoberta_paralela_e363.py']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      CAIXA_MAX_CHAMADAS: '0'
      CAIXA_TETO_USD: '0'
      USAR_CLAUDE: '0'
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: ./.github/actions/setup-ffmpeg
      - uses: actions/setup-python@v5
        with: {python-version: '3.13', cache: pip}
      - run: python -m pip install -q -r requirements.txt beautifulsoup4 pytest
      - name: Contratos e regressao
        run: python -m pytest -q tests/test_descoberta_paralela_e363.py tests/test_rotas_expandidas_e360.py tests/test_fontes_publicas_e354.py tests/test_galerias_oficiais_e356.py tests/test_acervo_documental_e246.py tests/test_politica_progressiva_e258.py
      - run: python -m scripts.qa_onda_e363
      - name: Preservar prova privada
        if: always()
        env:
          GH_TOKEN: ${{ secrets.COFRE_TOKEN }}
        run: |
          if [[ -s stage_documental/e363/wave.json ]]; then
            python scripts/espelhar_revisao_cofre.py "e363-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" stage_documental/e363/wave.json
          fi
