name: E263 - paginas oficiais no fluxo documental
on:
  push:
    branches: [atlas-direcao-visual-20261118]
    paths: ['.github/workflows/qa-paginas-oficiais-e263.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  proof:
    if: github.ref == 'refs/heads/atlas-direcao-visual-20261118'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      CAIXA_MAX_CHAMADAS: '0'
      CAIXA_TETO_USD: '0'
      USAR_CLAUDE: '0'
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.13', cache: pip}
      - run: |
          python -m pip install -q -r requirements.txt beautifulsoup4 pytest
          if ! command -v ffmpeg >/dev/null; then sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg; fi
          python -m py_compile scripts/qa_revisao_documental_e247.py scripts/qa_pesquisa_documental_e246.py
          python -m pytest -q tests/test_documentario_integral_e254.py tests/test_politica_progressiva_e258.py tests/test_integracao_corretiva_e260.py
      - name: Provar duas paginas individuais sem IA
        run: python -m scripts.qa_paginas_oficiais_e263 stage_documental/e263
      - name: Espelhar diagnostico privado
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ secrets.COFRE_TOKEN }}
        run: |
          shopt -s nullglob
          files=(stage_documental/e263/prova.json stage_documental/e263/geologia.jpg stage_documental/e263/biologia.jpg)
          valid=()
          for f in "${files[@]}"; do [[ ! -f "$f" ]] || valid+=("$f"); done
          if (( ${#valid[@]} > 0 )); then
            python scripts/espelhar_revisao_cofre.py "e263-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" "${valid[@]}"
          fi
