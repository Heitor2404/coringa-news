name: E204 palco amplo - replay privado multitema sem IA
on:
  push:
    branches: [atlas-direcao-visual-20261118]
    paths: ['.github/workflows/qa-palco-e204.yml','scripts/qa_e204_palco.py','tests/test_e204_palco.py','src/v4/formatos/cena_declarativa_e202.py']
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - uses: actions/setup-node@v4
        with: {node-version: "22", cache: npm, cache-dependency-path: motor4/package-lock.json}
      - run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg
          fi
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1
          pip install -q -r requirements.txt pytest
          npm ci --prefix motor4 --no-audit --no-fund
          python -m pytest -q tests/test_e204_palco.py tests/test_e202_diretor_visual.py
          ./motor4/node_modules/.bin/tsc -p motor4/remotion/tsconfig.json --noEmit
      - run: python -m scripts.qa_e204_palco
      - name: Cifrar mídia privada
        if: always()
        run: |
          mkdir -p entrega
          if [ -d qa_e204 ]; then
            cp qa_e204/*_qa.json entrega/ 2>/dev/null || true
            tar -czf /tmp/e204.tgz qa_e204
            export GNUPGHOME=$(mktemp -d)
            gpg --batch --quiet --import .github/piloto/chave_publica.asc
            dest=$(gpg --list-keys --with-colons | awk -F: '/^fpr/{print $10; exit}')
            gpg --batch --yes --quiet --trust-model always --encrypt -r "$dest" -o entrega/e204.tgz.gpg /tmp/e204.tgz
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: e204-palco-privado, path: entrega/, retention-days: 14}
