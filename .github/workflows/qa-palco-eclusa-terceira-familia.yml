name: "LAB — 3a familia hidraulica com palco geométrico compartilhado"
on:
  push:
    branches: [atlas-direcao-visual-20261118]
    paths:
      - ".github/workflows/qa-palco-eclusa-terceira-familia.yml"
      - "motor4/remotion/src/Root.tsx"
      - "motor4/remotion/src/formatos/LockCausalCycle.tsx"
      - "motor4/remotion/src/formatos/palco-eclusa-hidraulica-lab.json"
      - "src/v4/formatos/palco_vertical.py"
      - "tests/test_palco_vertical_eclusa.py"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: lab-palco-eclusa-hidraulica
  cancel-in-progress: true
env:
  DO_NOT_TRACK: "1"
  REMOTION_DISABLE_TELEMETRY: "1"
  DISABLE_TELEMETRY: "true"
jobs:
  ciclo_terceira_familia:
    runs-on: ubuntu-22.04
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: motor4/package-lock.json
      - name: Provar contrato geométrico e ciclo existente sem IA
        run: |
          python -m pip install -q pytest requests pillow pyyaml cairosvg
          python -m pytest -q tests/test_palco_vertical_eclusa.py tests/test_filme_panama_ciclo_19s.py
      - name: Compilar Remotion preservando producao
        timeout-minutes: 8
        run: |
          cd motor4
          npm ci --no-audit --no-fund
          npx --no-install tsc -p remotion/tsconfig.json --noEmit
      - name: Renderizar ciclo hidráulico completo 17,5s no palco compacto
        timeout-minutes: 11
        run: |
          mkdir -p qa_eclusa_palco
          cd motor4
          npx --no-install remotion render remotion/src/index.ts ProvaPalcoEclusaHidraulica \
            ../qa_eclusa_palco/ECLUSA_CICLO_PALCO_COMUM_17S5.mp4 \
            --codec=h264 --crf=23 --scale=0.5 --concurrency=2 --log=error
      - name: Comparar um quadro do palco ANTIGO x novo sem duplicar renderer
        timeout-minutes: 4
        run: |
          printf '%s' '{"duracao":17.5,"private_review_only":true,"modo":"anterior"}' > qa_eclusa_palco/props_anterior.json
          cd motor4
          npx --no-install remotion still remotion/src/index.ts ProvaPalcoEclusaHidraulica \
            ../qa_eclusa_palco/FRAME_ANTERIOR_9S.png --frame=216 \
            --props=../qa_eclusa_palco/props_anterior.json --scale=0.5 --log=error
      - name: Garantir ferramentas de inspeção audiovisual
        timeout-minutes: 3
        run: |
          if ! command -v ffprobe >/dev/null || ! command -v ffmpeg >/dev/null; then
            sudo apt-get update -qq
            sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends ffmpeg
          fi
          ffprobe -version | head -1
      - name: Verificar MP4 e progressao fisica por quadros reais
        run: |
          python - <<'PY'
          import hashlib,json,subprocess
          from pathlib import Path
          from PIL import Image,ImageChops,ImageStat,ImageDraw
          from src.v4.formatos.palco_vertical import PalcoVertical,CaixaVisivel
          out=Path('qa_eclusa_palco')
          video=out/'ECLUSA_CICLO_PALCO_COMUM_17S5.mp4'
          meta=json.loads(subprocess.check_output([
            'ffprobe','-v','error','-show_entries',
            'format=duration,size:stream=codec_type,width,height,r_frame_rate',
            '-of','json',str(video)]))
          stream=next(s for s in meta['streams'] if s['codec_type']=='video')
          assert (stream['width'],stream['height'])==(540,960)
          assert stream['r_frame_rate']=='24/1'
          assert abs(float(meta['format']['duration'])-17.5)<.07
          assert not any(s['codec_type']=='audio' for s in meta['streams'])
          moments=[.9,2.4,3.7,5.5,7.5,10,12.9,14.8,16,17.35]
          board=Image.new('RGB',(5*270,2*504),'#142638')
          draw=ImageDraw.Draw(board)
          frames={}
          for i,t in enumerate(moments):
            dest=out/f'FRAME_{i:02}.png'
            subprocess.check_call(['ffmpeg','-hide_banner','-loglevel','error',
                  '-y','-ss',str(t),'-i',str(video),'-frames:v','1',str(dest)])
            image=Image.open(dest).convert('RGB')
            frames[t]=image
            xx=i%5*270
            yy=i//5*504
            board.paste(image.resize((270,480)),(xx,yy+24))
            draw.text((xx+8,yy+7),f'{t:.2f}s',fill='#D6E7EC')
          board.save(out/'CONTATO_ECLUSA_10_FASES.jpg',quality=92)
          def delta(a,b,roi):
            x=ImageChops.difference(frames[a].crop(roi),frames[b].crop(roi))
            return sum(ImageStat.Stat(x).mean)/3
          # Somente a região do mecanismo, sem contagem por título/status.
          metrics={
            'entrada_navio':delta(.9,2.4,(90,390,390,720)),
            'agua_subindo':delta(7.5,12.9,(140,365,420,690)),
            'saida_navio':delta(16,17.35,(120,330,490,610)),
          }
          assert min(metrics.values())>2.0,metrics
          old=Image.open(out/'FRAME_ANTERIOR_9S.png').convert('RGB')
          # Mesmo instante da cena (9s = frame 216), novo via vídeo de fato.
          current=out/'FRAME_NOVO_9S.png'
          subprocess.check_call(['ffmpeg','-hide_banner','-loglevel','error',
             '-y','-ss','9','-i',str(video),'-frames:v','1',str(current)])
          new=Image.open(current).convert('RGB')
          # Comparar no mesmo alcance físico; não alegar classificação visual.
          crop=(31,280,509,755)
          movement=sum(ImageStat.Stat(ImageChops.difference(
              old.crop(crop),new.crop(crop))).mean)/3
          assert movement>4,movement
          beforeafter=Image.new('RGB',(1080,960),'white')
          beforeafter.paste(old,(0,0));beforeafter.paste(new,(540,0))
          beforeafter.save(out/'COMPARACAO_ANTERIOR_NOVO.jpg',quality=92)
          contract=json.loads(Path('motor4/remotion/src/formatos/palco-eclusa-hidraulica-lab.json').read_text('utf8'))
          b=contract['caixa_conservadora']
          palco=PalcoVertical(1080,1920,CaixaVisivel(b['left'],b['top'],b['right'],b['bottom']),
               contract['editorial_termina_y'],contract['rodape_comeca_y'],
               contract['folga_superior'],contract['folga_inferior'])
          assert palco.deslocar()==35
          report={
            'status':'QA_GEOMETRICO_E_MOVIMENTO_OK_VISUAL_HUMANA_PENDENTE',
            'publicar':False, 'claude':False, 'midia_externa':False,
            'familia':'eclusa_hidraulica', 'sequencia': [x['action'] for x in contract['eventos']],
            'duracao_s':float(meta['format']['duration']),
            'dimensoes':[540,960], 'fps':24,
            'subida_palco_px_1080x1920':35,
            'movimento_escala_rgb':{k:round(v,3) for k,v in metrics.items()},
            'comparacao_posicoes_rgb':round(movement,3),
            'video_sha256':hashlib.sha256(video.read_bytes()).hexdigest(),
            'revisao_humana':'PENDENTE','semanticamente_certificado':False,
          }
          (out/'QA_ECLUSA_PALCO.json').write_text(
            json.dumps(report,ensure_ascii=False,indent=2),encoding='utf8')
          print(json.dumps(report,ensure_ascii=False))
          PY
      - name: Guardar prova privada, sem postagem
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lab-terceira-familia-eclusa-palco-vertical
          path: qa_eclusa_palco/
          retention-days: 5
          if-no-files-found: warn
