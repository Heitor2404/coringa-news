name: "LAB — palco vertical multimecanismo (COMPRESSOR + OTTO)"
on:
  push:
    branches: [atlas-direcao-visual-20261118]
    paths:
      - "src/v4/formatos/palco_vertical.py"
      - "src/v4/formatos/render_compressor_conjunto_2d.py"
      - "src/v4/formatos/render_reconstrucao_causal_2d.py"
      - "tests/test_palco_vertical_multifamilia.py"
      - ".github/workflows/qa-palco-vertical-multifamilia.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: qa-palco-vertical-multifamilia
  cancel-in-progress: true
jobs:
  dois_mecanismos:
    runs-on: ubuntu-22.04
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Dependencias offline
        run: |
          python -m pip install -q pillow cairosvg pytest
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          fi
      - name: Testar mesma geometria em dois processos
        run: |
          python -m pytest -q tests/test_palco_vertical_multifamilia.py \
            tests/test_compressor_conjunto_2d.py tests/test_reference_reconstruction_2d.py
      - name: Renderizar dois videos REAIS sem narração/IA
        timeout-minutes: 8
        run: |
          mkdir -p qa_palco_duas_familias
          python -m src.v4.formatos.render_compressor_conjunto_2d \
            qa_palco_duas_familias/COMPRESSOR_ENQUADRAMENTO_COMPARTILHADO.mp4
          python -m src.v4.formatos.render_reconstrucao_causal_2d \
            docs/v4/formatos/reference_first/otto_48f_measured_motion.json \
            docs/v4/formatos/reference_first/otto_48f_causal_reviewed_scene.json \
            qa_palco_duas_familias/MOTOR_OTTO_ENQUADRAMENTO_COMPARTILHADO.mp4
      - name: Prova de frames e contato lado a lado
        run: |
          python - <<'PY'
          import hashlib,json,subprocess
          from pathlib import Path
          from PIL import Image,ImageChops,ImageStat,ImageDraw
          root=Path('qa_palco_duas_familias')
          vids=[
            ('COMPRESSOR',root/'COMPRESSOR_ENQUADRAMENTO_COMPARTILHADO.mp4'),
            ('MOTOR_OTTO',root/'MOTOR_OTTO_ENQUADRAMENTO_COMPARTILHADO.mp4')
          ]
          sheet=Image.new('RGB',(6*270,2*500),'#EDF3F5')
          draw=ImageDraw.Draw(sheet)
          report={'aprovacao_humana':'PENDENTE','publicar':False,
                  'renderizadores':{},'valida_estetica':False}
          for y,(key,video) in enumerate(vids):
            meta=json.loads(subprocess.check_output(['ffprobe','-v','error',
                '-show_entries','stream=codec_type,width,height,r_frame_rate:format=duration',
                '-of','json',str(video)]))
            v=next(s for s in meta['streams'] if s['codec_type']=='video')
            assert (v['width'],v['height'])==(540,960)
            assert abs(float(meta['format']['duration'])-8)<.06
            assert not any(s['codec_type']=='audio' for s in meta['streams'])
            frames=[]
            for i,t in enumerate([.04,.20,.39,.56,.73,.94]):
              png=root/f'{key}_{i:02}.png'
              subprocess.check_call(['ffmpeg','-hide_banner','-loglevel','error','-y',
                  '-ss',str(t*8),'-i',str(video),'-frames:v','1',str(png)])
              im=Image.open(png).convert('RGB')
              frames.append(im)
              sheet.paste(im.resize((270,480)),(i*270,y*500+20))
            a=frames[0].crop((40,240,500,890))
            b=frames[-1].crop((40,240,500,890))
            movement=sum(ImageStat.Stat(ImageChops.difference(a,b)).mean)/3
            assert movement>2,(key,movement)
            report['renderizadores'][key]={
               'sha256_video':hashlib.sha256(video.read_bytes()).hexdigest(),
               'duracao_s':float(meta['format']['duration']),
               'fps':v['r_frame_rate'],'quadros_analisados':6,
               'delta_rgb_palco':round(movement,3),
               'estado':'MOVIMENTO_CONFIRMADO_SEM_APROVACAO_ESTETICA'}
            draw.text((10,y*500+4),key,fill='#182E3F')
          sheet.save(root/'CONTATO_COMPRESSOR_E_OTTO.jpg',quality=90)
          (root/'QA_MULTIMECANISMO.json').write_text(
            json.dumps(report,ensure_ascii=False,indent=2),encoding='utf8')
          print(json.dumps(report,ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prova-palco-comum-compressor-otto-sem-ia
          path: qa_palco_duas_familias/
          retention-days: 5
          if-no-files-found: warn
