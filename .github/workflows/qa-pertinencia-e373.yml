name: E373 - pertinencia de objetos e metadados de galerias
on:
  push:
    branches: [atlas-direcao-visual-20261118]
    paths: ['.github/workflows/qa-pertinencia-e373.yml','tests/test_pertinencia_e373.py']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: ./.github/actions/setup-ffmpeg
      - uses: actions/setup-python@v5
        with: {python-version: '3.13', cache: pip}
      - run: python -m pip install -q -r requirements.txt beautifulsoup4 pytest
      - run: python -m pytest -q tests/test_pertinencia_e373.py tests/test_fontes_culturais_e366.py tests/test_fontes_publicas_e354.py tests/test_galerias_oficiais_e356.py tests/test_prioridade_e369.py tests/test_politica_progressiva_e258.py
      - name: Sonda limitada de metadados
        env:
          DATA_GOV_API_KEY: ${{ secrets.DATA_GOV_API_KEY }}
        run: python -m scripts.qa_pertinencia_e373
      - name: Preservar relatório privado
        if: always()
        env:
          GH_TOKEN: ${{ secrets.COFRE_TOKEN }}
        run: |
          if [[ -s stage_documental/e373/proof.json ]]; then
            python scripts/espelhar_revisao_cofre.py "e373-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" stage_documental/e373/proof.json
          fi
