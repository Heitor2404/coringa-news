name: E246.1-5 - recuperacao audiovisual multitema privada
on:
  push:
    branches: [atlas-direcao-visual-20261118]
    paths: ['.github/workflows/qa-pesquisa-documental-e246.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  coverage:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        caso: [camuflagem, aquedutos, saturno]
    if: github.ref == 'refs/heads/atlas-direcao-visual-20261118'
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: "3.13", cache: pip}
      - name: Dependencias de aquisicao
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg
          fi
          python -m pip install -q -r requirements.txt beautifulsoup4
      - name: Regressões do contrato de observação
        run: python -m pip install -q pytest && python -m pytest -q tests/test_acervo_recuperacao_e246.py tests/test_acervo_documental_e246.py tests/test_direcao_observacao_e238.py tests/test_direcao_observacao_e239.py
      - name: Pesquisar necessidade sem URLs predefinidas
        run: python -m scripts.qa_pesquisa_documental_e246 benchmarks/e246/necessidades.json qa_pesquisa ${{ matrix.caso }}
      - name: Enviar folhas e manifesto ao destino privado
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          from pathlib import Path
          from src.v3 import previa_telegram as T
          try:
              chat,_=T.chat_autorizado()
              root=Path('qa_pesquisa')
              paths=sorted(root.glob('candidatos.jpg'))+[root/'pesquisa.json']
              for path in paths:
                  r=T._api('sendDocument',{'chat_id':chat,'caption':'CORINGA · E246 recuperação · ${{ matrix.caso }}. Pesquisa de candidatos, direitos e semântica pendentes.'},('document',path))
                  if not isinstance(r,dict) or not r.get('message_id'):raise RuntimeError()
          except Exception:
              raise SystemExit('Entrega privada não confirmada') from None
          print('E246 PESQUISA ENTREGUE',len(paths))
          PY
  avisar_falha:
    needs: coverage
    if: ${{ always() && (needs.coverage.result == 'failure' || needs.coverage.result == 'cancelled') }}
    permissions:
      actions: read
      contents: none
    uses: ./.github/workflows/notificar-falha-documental.yml
    with:
      result: ${{ needs.coverage.result }}
      job_name: coverage
    secrets:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
