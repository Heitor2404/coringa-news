name: E258.4 - diversidade de candidatos e diagnostico de tamanho
on:
  push:
    branches: [atlas-direcao-visual-20261118]
    paths: ['.github/workflows/qa-politica-e258.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    if: github.ref == 'refs/heads/atlas-direcao-visual-20261118'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.13', cache: pip}
      - run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg
          fi
          python -m pip install -q -r requirements.txt beautifulsoup4 pytest
      - name: Compilar e verificar regressao
        run: |
          python -m py_compile src/midia.py src/gemini.py src/v4/acervo_v4.py src/v4/formatos/revisao_documental.py src/v4/formatos/amostragem_documental.py scripts/qa_revisao_documental_e247.py scripts/qa_pesquisa_documental_e246.py
          python -m pytest -q tests/test_politica_progressiva_e258.py tests/test_acervo_recuperacao_e246.py tests/test_acervo_documental_e246.py tests/test_amostragem_documental_e257.py tests/test_revisao_adaptativa_e248.py tests/test_cobertura_documental_e253.py tests/test_revisao_documental_e247.py tests/test_pacote_biblioteca_e250.py
      - name: Provar aquisicao real sem IA
        id: acquire
        run: python -m scripts.qa_aquisicao_e258 qa_e258
      - name: Preservar relatorios privados
        if: ${{ !cancelled() && steps.acquire.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ secrets.COFRE_TOKEN }}
        run: |
          shopt -s nullglob
          bash scripts/arquivar_cofre_review.sh "review-e258-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" qa_e258/revisao.json qa_e258/*.jpg
          python scripts/espelhar_revisao_cofre.py "e258-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" qa_e258/revisao.json qa_e258/*.jpg
