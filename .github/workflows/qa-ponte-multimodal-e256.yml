name: E256 - ponte multimodal privada sem IA
on:
  push:
    branches: [atlas-direcao-visual-20261118]
    paths: ['.github/workflows/qa-ponte-multimodal-e256.yml']
  workflow_dispatch:
permissions:
  contents: read
env:
  DO_NOT_TRACK: '1'
  REMOTION_CHROME: /usr/bin/google-chrome
  CORINGA_CHROME: /usr/bin/google-chrome
  REMOTION_DISABLE_TELEMETRY: '1'
jobs:
  bridge:
    if: github.ref == 'refs/heads/atlas-direcao-visual-20261118'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.13', cache: pip}
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm, cache-dependency-path: motor4/package-lock.json}
      - run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg
          fi
          python -m pip install -q -r requirements.txt beautifulsoup4 pytest
          npm ci --prefix motor4 --no-audit --no-fund
      - run: python -m pytest -q tests/test_ponte_multimodal_e256.py tests/test_ponte_mapa_atlas_filme.py tests/test_documentario_integral_e254.py tests/test_contrato_visual_e254_2.py tests/test_qualidade_multimodal_e255.py tests/test_acervo_documental_e246.py
      - name: Render ATLAS real e prova da ponte
        run: python -m scripts.qa_ponte_multimodal_e256 qa_e256
      - name: Preservar mapa e diagnosticos
        env:
          GH_TOKEN: ${{ secrets.COFRE_TOKEN }}
        run: |
          bash scripts/arquivar_cofre_review.sh "review-e256-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" stage_atlas/e256/mapa.mp4 stage_atlas/e256/comprovante_atlas.json qa_e256/*.json qa_e256/*.jpg
      - name: Espelhar diagnosticos e contato
        env:
          GH_TOKEN: ${{ secrets.COFRE_TOKEN }}
        run: python scripts/espelhar_revisao_cofre.py "e256-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" qa_e256/*.json qa_e256/*.jpg
