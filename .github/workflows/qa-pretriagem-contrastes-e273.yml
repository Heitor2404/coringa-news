name: E273 - recuperacao das tres pistas e pretriagem contrastante
on:
  push:
    branches: [atlas-direcao-visual-20261118]
    paths: ['.github/workflows/qa-pretriagem-contrastes-e273.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    if: github.ref == 'refs/heads/atlas-direcao-visual-20261118'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CAIXA_MAX_CHAMADAS: '0'
      CAIXA_TETO_USD: '0'
      USAR_CLAUDE: '0'
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.13', cache: pip}
      - run: |
          python -m pip install -q -r requirements.txt beautifulsoup4 pytest
          python -m pytest -q tests/test_pretriagem_e269.py tests/test_adquirir_pretriagem_e272.py tests/test_checkpoint_e259.py tests/test_reuso_documental_e251.py tests/test_politica_progressiva_e258.py
      - name: Preparar somente lacunas pendentes e casos contrastantes
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('qa_e273');root.mkdir()
          spec=json.loads(Path('benchmarks/e254/documentario.json').read_text())
          c=spec['cases'][0];ids={'n16','n17','n18'}
          c['necessidades']=[n for n in c['necessidades'] if n['id'] in ids]
          c['chapters']=[{**ch,'needs':[i for i in ch['needs'] if i in ids]} for ch in c['chapters'] if ids.intersection(ch['needs'])]
          (root/'lacunas.json').write_text(json.dumps(spec,ensure_ascii=False))
          base=json.loads(Path('benchmarks/e246/necessidades.json').read_text())
          cases=[]
          facts=[];needs=[]
          for case in base['cases']:
              if case['id'] not in ('aquedutos','saturno'):continue
              mapping={f['id']:case['id']+'-'+f['id'] for f in case['fatos']}
              facts.extend({**f,'id':mapping[f['id']]} for f in case['fatos'])
              needs.extend({**n,'id':case['id']+'-'+n['id'],'fatos':[mapping[x] for x in n['fatos']]} for n in case['necessidades'])
          cases.append({'id':'contrastes','tema':'QA de selecao, historia e astronomia','fatos':facts,'necessidades':needs})
          (root/'contrastes.json').write_text(json.dumps({'publish':False,'cases':cases},ensure_ascii=False))
          (root/'sem-historico.json').write_text(json.dumps({'publicar':False,'necessidades':[{'id':n['id'],'amostras':[]} for n in needs]}))
          PY
      - name: Recuperar apenas as tres lacunas do cofre
        env:
          GH_TOKEN: ${{ secrets.COFRE_TOKEN }}
        run: python -m scripts.recuperar_checkpoints_documentais qa_e273/lacunas.json gelo_paisagem qa_e273/acervo
      - name: Provar recuperacao das pistas sem promover cobertura
        env:
          CORINGA_CHECKPOINTS_DESCOBERTOS: qa_e273/acervo/descoberta.json
        run: |
          python -m scripts.qa_revisao_documental_e247 qa_e273/lacunas.json stage_documental/e273 gelo_paisagem --progressiva --multicenas --integral --somente-acervo
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('stage_documental/e273/revisao.json').read_text())
          expected={'n16':'7da628aef7ae','n17':'faf19b055148','n18':'251c37acae43'}
          seen={n['id']:c['sha_catalogo'][:12] for n in r['pesquisa'] for c in n['candidatos'] if c.get('pista_aquisicao_mesmo_escopo') and c.get('amostra_pendente') and c['sha_catalogo'][:12]==expected.get(n['id'])}
          assert r['visao_chamadas_logicas']==r['rede_aquisicao']['http']==r['cobertura_documentario']['consumo']['buscas']==0
          assert seen==expected,seen
          assert all(x['estado']=='LACUNA_PENDENTE' for x in r['cobertura'])
          print('E273 PISTAS RECUPERADAS',seen,flush=True)
          PY
      - name: Pretriagem real de historia e astronomia
        run: python -m scripts.qa_pretriagem_e269 qa_e273/contrastes.json qa_e273/sem-historico.json qa_e273/previas contrastes
      - name: Espelhar evidencias privadas
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ secrets.COFRE_TOKEN }}
        run: |
          shopt -s nullglob
          files=(qa_e273/previas/*.json qa_e273/previas/*.jpg stage_documental/e273/revisao.json stage_documental/e273/*.jpg qa_e273/acervo/descoberta.json)
          valid=()
          for f in "${files[@]}"; do [[ -f "$f" ]] && valid+=("$f"); done
          if (( ${#valid[@]} > 0 )); then python scripts/espelhar_revisao_cofre.py "e273-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" "${valid[@]}"; fi
