name: E269.1 - pretriagem por miniaturas sem visao paga
on:
  push:
    branches: [atlas-direcao-visual-20261118]
    paths: ['.github/workflows/qa-pretriagem-e269.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preview:
    if: github.ref == 'refs/heads/atlas-direcao-visual-20261118'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      CAIXA_MAX_CHAMADAS: '0'
      CAIXA_TETO_USD: '0'
      USAR_CLAUDE: '0'
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.13', cache: pip}
      - run: |
          python -m pip install -q -r requirements.txt beautifulsoup4 pytest
          python -m pytest -q tests/test_pretriagem_e269.py tests/test_politica_progressiva_e258.py tests/test_diagnosticar_editorial_e268.py
      - name: Recuperar diagnostico da aquisicao anterior
        env:
          GH_TOKEN: ${{ secrets.COFRE_TOKEN }}
        run: |
          python - <<'PY'
          import json,subprocess,base64
          from pathlib import Path
          from scripts.recuperar_checkpoints_documentais import api
          m=api('');assert m.get('private') is True and m.get('id')==1454059520
          j=api('/contents/revisoes/e266-45616312051-1/lacunas.json?ref=revisao-privada')
          raw=base64.b64decode(j['content']);assert len(raw)==j['size']
          Path('lacunas-e266.json').write_bytes(raw)
          PY
      - name: Triar miniaturas de alternativas precisas
        run: python -m scripts.qa_pretriagem_e269 benchmarks/e254/documentario.json lacunas-e266.json qa_e269 gelo_paisagem
      - name: Espelhar folhas privadas
        env:
          GH_TOKEN: ${{ secrets.COFRE_TOKEN }}
        run: |
          shopt -s nullglob
          files=(qa_e269/*.json qa_e269/*.jpg)
          python scripts/espelhar_revisao_cofre.py "e269-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" "${files[@]}"
