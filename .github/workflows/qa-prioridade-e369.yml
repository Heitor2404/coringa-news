name: E369 - prioridade documental e redirecionamento restrito Smithsonian
on:
  push:
    branches: [atlas-direcao-visual-20261118]
    paths: ['.github/workflows/qa-prioridade-e369.yml','src/v4/prioridade_fontes_e369.py','tests/test_prioridade_e369.py']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.13', cache: pip}
      - run: python -m pip install -q -r requirements.txt beautifulsoup4 pytest
      - run: python -m pytest -q tests/test_prioridade_e369.py tests/test_descoberta_paralela_e363.py tests/test_rotas_expandidas_e360.py tests/test_fontes_culturais_e366.py tests/test_acervo_documental_e246.py tests/test_politica_progressiva_e258.py
      - name: Sonda real limitada Smithsonian
        env:
          DATA_GOV_API_KEY: ${{ secrets.DATA_GOV_API_KEY }}
        run: python -m scripts.qa_smithsonian_e369
      - name: Preservar relatório privado
        if: always()
        env:
          GH_TOKEN: ${{ secrets.COFRE_TOKEN }}
        run: |
          shopt -s nullglob
          root=stage_documental/e369
          if [[ -s "$root/proof.json" ]]; then
            python scripts/espelhar_revisao_cofre.py "e369-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" "$root/proof.json" "$root"/*.jpg
          fi
