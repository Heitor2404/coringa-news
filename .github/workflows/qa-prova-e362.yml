name: E362 - replay de fontes abertas e galeria USGS
on:
  push:
    branches: [atlas-direcao-visual-20261118]
    paths: ['.github/workflows/qa-prova-e362.yml','scripts/qa_prova_e362.py']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CAIXA_MAX_CHAMADAS: '0'
      CAIXA_TETO_USD: '0'
      USAR_CLAUDE: '0'
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: ./.github/actions/setup-ffmpeg
      - uses: actions/setup-python@v5
        with: {python-version: '3.13', cache: pip}
      - run: python -m pip install -q -r requirements.txt beautifulsoup4 pytest
      - run: python -m pytest -q tests/test_fontes_publicas_e354.py tests/test_galerias_oficiais_e356.py tests/test_rotas_expandidas_e360.py tests/test_fontes_cientificas_e252.py
      - name: Prova privada de bytes e decodificação
        env:
          GH_TOKEN: ${{ secrets.COFRE_TOKEN }}
        run: python -m scripts.qa_prova_e362
      - name: Preservar prova privada
        if: always()
        env:
          GH_TOKEN: ${{ secrets.COFRE_TOKEN }}
        run: |
          shopt -s nullglob
          root=stage_documental/e362
          if [[ -s "$root/proof.json" ]]; then
            python scripts/espelhar_revisao_cofre.py "e362-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" "$root/proof.json" "$root"/*.jpg
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e362-originais-privados
          path: stage_documental/e362/originais/
          retention-days: 3
          if-no-files-found: ignore
