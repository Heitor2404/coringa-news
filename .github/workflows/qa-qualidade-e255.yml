name: E255 - qualidade audiovisual contrastante
on:
  push:
    branches: [atlas-direcao-visual-20261118]
    paths: ['.github/workflows/qa-qualidade-e255.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quality:
    if: github.ref == 'refs/heads/atlas-direcao-visual-20261118'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.13', cache: pip}
      - run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg
          fi
          python -m pip install -q -r requirements.txt beautifulsoup4 pytest
      - name: Regressao sem IA
        run: python -m pytest -q tests/test_qualidade_multimodal_e255.py tests/test_contrato_visual_e254_2.py tests/test_documentario_integral_e254.py tests/test_cobertura_documental_e253.py tests/test_revisao_documental_e247.py tests/test_revisao_adaptativa_e248.py tests/test_acervo_documental_e246.py tests/test_acervo_recuperacao_e246.py tests/test_espelho_cofre_e254.py
      - name: Pequena revisao real com orcamento limitado
        id: review
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          CAIXA_MAX_CHAMADAS: '4'
          CAIXA_TETO_USD: '0'
          USAR_CLAUDE: '0'
        run: python -m scripts.qa_revisao_documental_e247 benchmarks/e255/necessidades.json stage_documental/e255 contrastes --adaptativa --multicenas --qualidade
      - name: Preservar diagnostico original no cofre
        if: ${{ !cancelled() && steps.review.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ secrets.COFRE_TOKEN }}
        run: |
          shopt -s nullglob
          root=stage_documental/e255
          bash scripts/arquivar_cofre_review.sh "review-e255-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" "$root/revisao.json" "$root"/revisao-*.jpg
      - name: Espelhar diagnostico e imagens
        if: ${{ !cancelled() && steps.review.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ secrets.COFRE_TOKEN }}
        run: |
          shopt -s nullglob
          root=stage_documental/e255
          python scripts/espelhar_revisao_cofre.py "e255-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" "$root/revisao.json" "$root"/revisao-*.jpg
      - name: Conferir contratos e resultados
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('stage_documental/e255/revisao.json').read_text())
          c=r['cobertura_documentario']
          assert c['total']==4 and c['consumo']['visao']<=4
          assert c['resumo']['DELEGAR_ATLAS']==1
          assert all(x['encaminhamento']['publicar'] is False and x['encaminhamento']['pronto_para_render'] is False for x in c['cobertura'])
          print('E255 RESULTADOS',c['resumo'],c['consumo'])
          PY
