name: "LAB F3 — ênfase física por relações, câmera travada (2 famílias)"
on:
  push:
    branches: [atlas-direcao-visual-20261118]
    paths:
      - ".github/workflows/qa-realce-causal-svg.yml"
      - "src/v4/formatos/realce_causal_svg.py"
      - "src/v4/formatos/realce_causal_trajetos.json"
      - "src/v4/formatos/render_compressor_conjunto_2d.py"
      - "src/v4/formatos/render_reconstrucao_causal_2d.py"
      - "tests/test_realce_causal_svg.py"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: qa-realce-causal-svg
  cancel-in-progress: true
jobs:
  validar_dois_mecanismos:
    runs-on: ubuntu-22.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Instalar ferramentas de QA offline e render
        run: |
          python -m pip install -q pillow cairosvg pytest numpy scipy opencv-python-headless
          if ! command -v ffprobe >/dev/null || ! command -v ffmpeg >/dev/null; then
            sudo apt-get update -qq
            sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends ffmpeg
          fi
      - name: Testar física, fluxos e pose travada
        run: |
          python -m pytest -q tests/test_realce_causal_svg.py \
            tests/test_camera_causal_svg.py tests/test_compressor_conjunto_2d.py \
            tests/test_reference_reconstruction_2d.py
      - name: Gerar dois MP4s privados com realce explícito
        timeout-minutes: 9
        run: |
          mkdir -p prova_realce_causal
          python -m src.v4.formatos.render_compressor_conjunto_2d \
            prova_realce_causal/COMPRESSOR_REALCE_CAUSAL.mp4 \
            --camera-causal --realce-causal
          python -m src.v4.formatos.render_reconstrucao_causal_2d \
            docs/v4/formatos/reference_first/otto_48f_measured_motion.json \
            docs/v4/formatos/reference_first/otto_48f_causal_reviewed_scene.json \
            prova_realce_causal/OTTO_REALCE_CAUSAL.mp4 \
            --camera-causal --realce-causal
      - name: Comparar efeito em peças com o plano estável original
        run: |
          python - <<'PY'
          import io,json,hashlib,subprocess
          from pathlib import Path
          from PIL import Image,ImageChops,ImageStat,ImageDraw
          import cairosvg
          from src.v4.formatos import render_compressor_conjunto_2d as P
          from src.v4.formatos import render_reconstrucao_causal_2d as O
          from src.v4.formatos.compressor_pv_core import limites_fases
          out=Path('prova_realce_causal')
          manifest=json.loads(P.MANIFESTO_PADRAO.read_text('utf8'))
          d=Path('docs/v4/formatos/reference_first')
          mov=json.loads((d/'otto_48f_measured_motion.json').read_text('utf8'))
          scene=json.loads((d/'otto_48f_causal_reviewed_scene.json').read_text('utf8'))
          def img(svg):
              return Image.open(io.BytesIO(cairosvg.svg2png(bytestring=svg.encode()))).convert('RGB')
          board=Image.new('RGB',(4*540,4*960),'#DFEAEF')
          for i,(fam,action) in enumerate([
            ('compressor','REEXPANSAO_RESIDUAL'),('compressor','ADMISSAO_AR'),
            ('compressor','COMPRESSAO_AR'),('compressor','DESCARGA_PRESSURIZADA'),
            ('otto','admissao_mistura'),('otto','compressao_mistura'),
            ('otto','ignicao_expansao'),('otto','escape_gases')]):
              if fam=='compressor':
                dct=limites_fases(P.AssemblyLayout().spec())[action]
                t=(dct['de']+dct['ate'])/2
                before=P.frame_svg(t,manifest,camera_causal=True)
                after=P.frame_svg(t,manifest,camera_causal=True,realce_causal=True)
              else:
                total=mov['quadros'];idx=[e['tipo'] for e in scene['ciclo']].index(action)
                st=scene['ciclo'][idx]['quadro_inicio']
                en=(scene['ciclo'][idx+1]['quadro_inicio'] if idx+1<len(scene['ciclo']) else total)
                t=(st+en)/(2*total)
                before=O.svg_frame(mov,scene,t,camera_causal=True)
                after=O.svg_frame(mov,scene,t,camera_causal=True,realce_causal=True)
              aa,bb=img(before),img(after)
              col=0 if i<4 else 2
              row=i%4
              board.paste(aa,(col*540,row*960))
              board.paste(bb,((col+1)*540,row*960))
          board.save(out/'QUADROS_8_FASES_ANTES_DEPOIS.jpg',quality=92)
          videos={}
          for fam,p in (
            ('COMPRESSOR',out/'COMPRESSOR_REALCE_CAUSAL.mp4'),
            ('OTTO',out/'OTTO_REALCE_CAUSAL.mp4')
          ):
            j=json.loads(subprocess.check_output(['ffprobe','-v','error','-show_entries',
               'format=duration:stream=codec_type,width,height,r_frame_rate',
               '-of','json',str(p)]))
            v=next(s for s in j['streams'] if s['codec_type']=='video')
            assert (v['width'],v['height'])==(540,960)
            assert v['r_frame_rate']=='24/1'
            assert abs(float(j['format']['duration'])-8)<.05
            assert not any(s['codec_type']=='audio' for s in j['streams'])
            report=json.loads(p.with_suffix('.json').read_text('utf8'))
            assert report['camera_causal']['politica_camera']=='PLANO_GERAL_TRAVADO_SEM_PAN_OU_ZOOM'
            assert report['realce_causal']['habilitado'] is True
            assert report['publicar'] is False
            videos[fam]={'sha256':hashlib.sha256(p.read_bytes()).hexdigest(),
                          'estado':'RENDER_PRIVADO_GRAFO_VALIDADO_ARTE_NAO_HOMOLOGADA'}
          result={
            'status':'DUAS_FAMILIAS_REALCE_FISICO_RENDERIZADO',
            'no_pan':True,'no_cards':True,'publicar':False,
            'revisao_visual':'PENDENTE',
            'videos':videos}
          (out/'QA_REALCE_CAUSAL.json').write_text(json.dumps(result,ensure_ascii=False,indent=2),encoding='utf8')
          print(json.dumps(result,ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lab-realce-causal-compressor-otto-privado
          path: prova_realce_causal/
          retention-days: 5
          if-no-files-found: warn
