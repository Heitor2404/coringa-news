name: E249 - recuperacao documental sem IA
on:
  push:
    branches: [atlas-direcao-visual-20261118]
    paths: ['.github/workflows/qa-recuperacao-e249.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  recovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    if: github.ref == 'refs/heads/atlas-direcao-visual-20261118'
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.13', cache: pip}
      - run: python -m pip install -q -r requirements.txt beautifulsoup4 pytest
      - run: python -m pytest -q tests/test_revisao_adaptativa_e248.py tests/test_revisao_documental_e247.py tests/test_acervo_recuperacao_e246.py tests/test_acervo_documental_e246.py
      - name: Recuperacao real sem IA
        run: python -m scripts.qa_recuperacao_e249 qa_recuperacao
      - name: Espelhar no cofre privado
        env:
          GH_TOKEN: ${{ secrets.COFRE_TOKEN }}
        run: |
          shopt -s nullglob
          python scripts/espelhar_revisao_cofre.py "e249-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" qa_recuperacao/revisao.json qa_recuperacao/*.jpg
