name: "LAB F9 — referência externa de compressor e confronto com render real"
on:
  push:
    branches: [atlas-direcao-visual-20261118]
    paths:
      - ".github/workflows/qa-referencia-compressor-f9.yml"
      - "src/v4/formatos/referencia_evidencia_f9.py"
      - "src/v4/formatos/referencias_visuais_f9/**"
      - "src/v4/formatos/render_compressor_conjunto_2d.py"
      - "tests/test_referencia_evidencia_f9.py"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: lab-f9-referencia-compressor
  cancel-in-progress: true
jobs:
  prova_externa_privada:
    runs-on: ubuntu-22.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Dependencias de teste e desenho, sem API paga
        run: |
          python -m pip install -q pytest pillow cairosvg requests numpy scipy opencv-python-headless
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update -qq
            sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends ffmpeg
          fi
      - name: Regressões fonte, direitos, física e compositor
        run: |
          python -m pytest -q \
            tests/test_referencia_evidencia_f9.py \
            tests/test_compressor_conjunto_2d.py \
            tests/test_identidade_visual_maquina.py \
            tests/test_pecas_visuais_f8.py
      - name: Download restrito Commons, SHA, foto e confronto visual
        timeout-minutes: 8
        run: |
          mkdir -p qa_f9_evidencia
          PINNED=$(python - <<'PY'
          import json
          d=json.load(open('src/v4/formatos/referencias_visuais_f9/compressor_elliott_2018.json'))
          print('yes' if d['file']['expected_sha256'] else 'no')
          PY
          )
          if [ "$PINNED" = yes ]; then
            python -m src.v4.formatos.referencia_evidencia_f9 \
              --saida qa_f9_evidencia --animar
          else
            python -m src.v4.formatos.referencia_evidencia_f9 \
              --saida qa_f9_evidencia
            echo "ATENÇÃO: candidato ainda NÃO tem SHA fixado; nenhum MP4 final liberado"
          fi
      - name: Rejeitar relatório com publicação ou identidade falsamente aprovadas
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image
          base=Path('qa_f9_evidencia')
          r=json.loads((base/'RELATORIO_REFERENCIA_F9.json').read_text('utf8'))
          assert r['publication_allowed'] is False
          assert r['identity_homologated'] is False
          assert r['frames_inferred_from_image'] is False
          assert r['physics_simulated_from_external_image'] is False
          assert r['license']=='CC BY-SA 4.0'
          assert r['hidden_unverified_roles']
          assert r['original_sha256']
          assert r['dimensions']==[2100,1500]
          with Image.open(base/'CONTATO_REFERENCIA_VS_COMPRESSOR_REAL_F9.jpg') as image:
              assert image.size==(1530,1050)
          if r['sha_pinned_and_verified']:
              assert r['private_comparison_duration_s']==8
              assert (base/'AUDITORIA_F9_COMPRESSOR_VS_REFERENCIA_PRIVADA.mp4').is_file()
          else:
              assert not list(base.glob('*.mp4'))
          print('F9: proveniência, direitos e estado visual auditados')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lab-f9-referencia-compressor-real-privado
          path: qa_f9_evidencia/
          retention-days: 5
          if-no-files-found: warn
