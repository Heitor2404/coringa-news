name: "QA — Pesquisa de referências animadas (2D + 3D)"
on:
  push:
    branches: [atlas-direcao-visual-20261118]
    paths:
      - "src/v4/formatos/referencias_mecanismos.py"
      - "tests/test_referencias_mecanismos.py"
      - "src/v4/formatos/amostrar_referencia.py"
      - "tests/test_amostrar_referencia.py"
      - "src/v4/formatos/inspecionar_referencia.py"
      - "tests/test_inspecionar_referencia.py"
      - ".github/workflows/qa-referencias-animadas.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  referencias_sem_publicacao:
    runs-on: ubuntu-22.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Dependencias minimas
        run: python -m pip install -q pytest requests pillow
      - name: Testar roteamento multitema offline sem IA
        run: python -m pytest -q tests/test_referencias_mecanismos.py tests/test_amostrar_referencia.py tests/test_inspecionar_referencia.py
      - name: Demonstrar pesquisa desligada com bloqueio honesto
        run: |
          python -m src.v4.formatos.referencias_mecanismos docs/v4/formatos/briefs_referencia/motor_pistao.json saida_ref/pistao --sem-rede
          python -m src.v4.formatos.referencias_mecanismos docs/v4/formatos/briefs_referencia/circulacao_cardiaca.json saida_ref/coracao --sem-rede
          python - <<'PY'
          import json
          for tema in ('pistao','coracao'):
              j=json.load(open('saida_ref/'+tema+'/planejamento.json'))
              assert not j['publicar'] and j['renderer'] is None
              assert j['estado']=='SEM_REFERENCIAS'
          PY
      - name: Garimpo publico REAL — pistao e coracao, sem Gemini
        if: github.event_name == 'workflow_dispatch'
        timeout-minutes: 5
        continue-on-error: true
        run: |
          python -m src.v4.formatos.referencias_mecanismos docs/v4/formatos/briefs_referencia/motor_pistao.json saida_ref/live_pistao
          python -m src.v4.formatos.referencias_mecanismos docs/v4/formatos/briefs_referencia/circulacao_cardiaca.json saida_ref/live_coracao
      - name: Amostrar os primeiros GIFs encontrados por tema
        if: github.event_name == 'workflow_dispatch'
        timeout-minutes: 2
        continue-on-error: true
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from src.v4.formatos.amostrar_referencia import amostrar_gif
          for nome in ("live_pistao","live_coracao"):
              arq=Path("saida_ref")/nome/"referencias.json"
              if not arq.exists():
                  continue
              doc=json.loads(arq.read_text(encoding="utf-8"))
              itens=[it for it in doc.get("candidatos",[])
                     if it.get("midia")=="animacao_gif"]
              if not itens:
                  print(nome, "SEM GIF")
                  continue
              try:
                  r=amostrar_gif(itens[0],Path("saida_ref")/nome/"quadros")
                  print(nome, "QUADROS",r["numero_quadros"],r["sha256"][:14])
              except Exception as exc:
                  print(nome,"BLOQUEADO",type(exc).__name__,str(exc)[:160])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pesquisa-multitema-2d-3d-privada
          path: saida_ref/
          retention-days: 3
          if-no-files-found: warn
