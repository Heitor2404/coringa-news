name: E265 - bloco de recuperacao integral e diagnostico editorial sem IA
on:
  push:
    branches: [atlas-direcao-visual-20261118]
    paths: ['.github/workflows/qa-replay-integral-e265.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  replay:
    if: github.ref == 'refs/heads/atlas-direcao-visual-20261118'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CAIXA_MAX_CHAMADAS: '0'
      CAIXA_TETO_USD: '0'
      USAR_CLAUDE: '0'
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.13', cache: pip}
      - run: |
          python -m pip install -q -r requirements.txt beautifulsoup4 pytest
          python -m pytest -q tests/test_checkpoint_e259.py tests/test_reuso_documental_e251.py tests/test_revisao_documental_e247.py tests/test_validar_arquivo_documental.py tests/test_integracao_corretiva_e260.py tests/test_documentario_integral_e254.py tests/test_ponte_multimodal_e256.py tests/test_ponte_mapa_atlas_filme.py tests/test_ponte_animacao_editorial.py tests/test_politica_animacao.py
      - name: Recuperar acervo por prioridade de revisao
        env:
          GH_TOKEN: ${{ secrets.COFRE_TOKEN }}
        run: |
          python -m scripts.recuperar_checkpoints_documentais benchmarks/e254/documentario.json gelo_paisagem qa_e265
          echo "CORINGA_CHECKPOINTS_DESCOBERTOS=qa_e265/descoberta.json" >> "$GITHUB_ENV"
      - name: Recuperar relatorio anterior verificado
        env:
          GH_TOKEN: ${{ secrets.COFRE_TOKEN }}
        run: |
          python - <<'PY'
          import hashlib,json,subprocess
          from pathlib import Path
          from scripts.recuperar_checkpoints_documentais import api,listar_releases
          meta=api('');assert meta.get('private') is True and meta.get('id')==1454059520
          tag='review-e2648-45613384343-1'
          rel=next(r for r in listar_releases(60) if r['tag_name']==tag and r['draft'] is True)
          a=next(a for a in rel['assets'] if a['name']=='revisao.json')
          assert 0<a['size']<=12_000_000
          root=Path('qa_e265');subprocess.run(['gh','release','download',tag,'--repo','Heitor2404/coringa-cofre','--pattern','revisao.json','--dir',str(root)],check=True,timeout=120)
          raw=(root/'revisao.json').read_bytes()
          assert len(raw)==a['size'] and 'sha256:'+hashlib.sha256(raw).hexdigest()==a['digest']
          j=json.loads(raw);assert j['publish'] is False
          (root/'anterior.json').write_text(json.dumps({'cobertos':[x['necessidade_id'] for x in j['cobertura'] if x['estado']=='CANDIDATO_PRIVADO_REVISADO'],'publicar':False}))
          PY
      - name: Provar recuperacao integral e medir lacunas
        run: |
          python -m scripts.qa_revisao_documental_e247 benchmarks/e254/documentario.json stage_documental/e265 gelo_paisagem --progressiva --multicenas --integral --somente-acervo
          python -m scripts.qa_documentario_integral_e254 stage_documental/e265 --somente-preflight
          python - <<'PY'
          import json
          from pathlib import Path
          from scripts.diagnosticar_diversidade_documental import diagnosticar
          root=Path('stage_documental/e265');r=json.loads((root/'revisao.json').read_text())
          prev=json.loads(Path('qa_e265/anterior.json').read_text())
          d=diagnosticar(r);(root/'diversidade.json').write_text(json.dumps(d,ensure_ascii=False,indent=2))
          assert r['visao_chamadas_logicas']==r['rede_aquisicao']['http']==r['cobertura_documentario']['consumo']['buscas']==0
          assert r['publish'] is False and not (root/'props.json').exists()
          covered={x['necessidade_id'] for x in r['cobertura'] if x['estado']=='CANDIDATO_PRIVADO_REVISADO'}
          print('E265 COBERTURA',sorted(covered),'anterior',prev,'reusos',r['reusos_analises'],'diversidade',d,flush=True)
          assert set(prev['cobertos'])<=covered, 'perda de cobertura anterior'
          PY
      - name: Preservar diagnosticos privados
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ secrets.COFRE_TOKEN }}
        run: |
          shopt -s nullglob
          root=stage_documental/e265
          if [[ -s "$root/revisao.json" ]]; then
            files=("$root"/*.json "$root"/*.jpg qa_e265/descoberta.json qa_e265/anterior.json)
            python scripts/espelhar_revisao_cofre.py "e265-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" "${files[@]}"
          fi
