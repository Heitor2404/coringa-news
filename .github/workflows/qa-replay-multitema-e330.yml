name: E330.1 - replay de revisoes reais multitema na ponte geral
on:
  push:
    branches: [atlas-direcao-visual-20261118]
    paths: ['.github/workflows/qa-replay-multitema-e330.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: replay-multitema-e330
  cancel-in-progress: true
jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      CAIXA_MAX_CHAMADAS: '0'
      CAIXA_TETO_USD: '0'
      USAR_CLAUDE: '0'
      REMOTION_CHROME: /usr/bin/google-chrome
      REMOTION_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: ./.github/actions/setup-ffmpeg
      - uses: actions/setup-python@v5
        with: {python-version: '3.13', cache: pip}
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm, cache-dependency-path: motor4/package-lock.json}
      - name: Dependencias e restauracao limitada de originais autenticados
        env:
          GH_TOKEN: ${{ secrets.COFRE_TOKEN }}
        run: |
          python -m pip install -q -r requirements.txt beautifulsoup4 pytest
          npm ci --prefix motor4 --no-audit --no-fund
          python -m scripts.qa_replay_multitema_e330
      - name: Provas focais de revisoes reais sem nova voz
        run: cd motor4 && node scripts/qa_replay_multitema_e330.mjs
      - name: Preservar resultados e quadros mesmo em falha
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ secrets.COFRE_TOKEN }}
        run: |
          shopt -s nullglob
          root=stage_documental/e330
          if [[ -s "$root/replay.json" ]]; then
            files=("$root/replay.json" "$root"/*.png)
            [[ ! -s "$root/frames.json" ]] || files+=("$root/frames.json")
            python scripts/espelhar_revisao_cofre.py "e330-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" "${files[@]}"
          fi
