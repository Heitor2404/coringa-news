name: E377 - busca Commons retrato sem perder busca ampla
on:
  push:
    branches: [atlas-direcao-visual-20261118]
    paths: ['.github/workflows/qa-retrato-e377.yml','tests/test_retrato_e377.py']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.13', cache: pip}
      - run: python -m pip install -q -r requirements.txt beautifulsoup4 pytest
      - run: python -m pytest -q tests/test_retrato_e377.py tests/test_politica_vertical_e349.py tests/test_imersao_e328.py tests/test_identidade_contexto_e375.py tests/test_rotas_expandidas_e360.py tests/test_prioridade_e369.py
      - run: python -m scripts.qa_retrato_e377
      - name: Preservar metadados privados
        if: always()
        env:
          GH_TOKEN: ${{ secrets.COFRE_TOKEN }}
        run: |
          if [[ -s stage_documental/e377/proof.json ]]; then
            python scripts/espelhar_revisao_cofre.py "e377-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" stage_documental/e377/proof.json
          fi
