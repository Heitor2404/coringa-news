name: E380 - aquisicao retrato Commons com qualidade de composicao
on:
  push:
    branches: [atlas-direcao-visual-20261118]
    paths: ['.github/workflows/qa-retrato-e380.yml','scripts/qa_retrato_e380.py']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qa:
    if: github.ref == 'refs/heads/atlas-direcao-visual-20261118'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: ./.github/actions/setup-ffmpeg
      - uses: actions/setup-python@v5
        with: {python-version: '3.13', cache: pip}
      - run: python -m pip install -q -r requirements.txt beautifulsoup4 pytest
      - run: python -m pytest -q tests/test_retrato_e377.py tests/test_politica_vertical_e349.py tests/test_imersao_e328.py
      - run: python -m scripts.qa_retrato_e380
      - name: Preservar prova privada
        if: always()
        env:
          GH_TOKEN: ${{ secrets.COFRE_TOKEN }}
        run: |
          shopt -s nullglob
          root=stage_documental/e380
          if [[ -s "$root/proof.json" ]]; then
            python scripts/espelhar_revisao_cofre.py "e380-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" "$root/proof.json" "$root"/*.jpg
          fi
