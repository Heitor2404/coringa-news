name: E259 - recuperacao de analises reais sem IA
on:
  push:
    branches: [atlas-direcao-visual-20261118]
    paths: ['.github/workflows/qa-reuso-analises-e259.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  replay:
    if: github.ref == 'refs/heads/atlas-direcao-visual-20261118'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.13', cache: pip}
      - run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg
          fi
          python -m pip install -q -r requirements.txt beautifulsoup4 pytest
      - name: Regressao de checkpoints e biblioteca
        run: |
          python -m py_compile src/v3/pacote_biblioteca.py scripts/qa_revisao_documental_e247.py
          python -m pytest -q tests/test_checkpoint_e259.py tests/test_pacote_biblioteca_e250.py tests/test_politica_progressiva_e258.py tests/test_reuso_documental_e251.py tests/test_amostragem_documental_e257.py
      - name: Recuperar originais e analises da E258.1
        env:
          GH_TOKEN: ${{ secrets.COFRE_TOKEN }}
        run: |
          set -euo pipefail
          repo=Heitor2404/coringa-cofre
          tag=review-e258-progressiva-45544941326-1
          test "$(gh api "repos/$repo" --jq '.private and (.id == 1454059520)')" = true
          test "$(gh release view "$tag" --repo "$repo" --json isDraft --jq '.isDraft')" = true
          mkdir -p qa_checkpoints
          gh release download "$tag" --repo "$repo" --pattern 'cm-5881a94f434d.zip' --pattern 'cm-cc825cc83cab.zip' --dir qa_checkpoints
          python - <<'PY'
          from pathlib import Path
          from src.v3 import pacote_biblioteca as P
          for mid,h in [('cm-5881a94f434d','551b3585abba15a0cd8631301c68d3e1ef61475a17cd616018cff00b1848b6ea'),('cm-cc825cc83cab','56119f2ac98fe0875e206c1d2ac01608f3098e9faa475664d1bcf5ccbc55aeea')]:
              P.extrair_checkpoint(Path('qa_checkpoints')/(mid+'.zip'),Path('qa_checkpoints')/mid,expected_sha256=h)
          PY
      - name: Reaplicar revisor existente sem pesquisa externa ou IA
        id: replay
        env:
          CORINGA_PACOTE_PRIVADO: qa_checkpoints/cm-5881a94f434d:qa_checkpoints/cm-cc825cc83cab
          CAIXA_MAX_CHAMADAS: '0'
          CAIXA_TETO_USD: '0'
          USAR_CLAUDE: '0'
        run: python -m scripts.qa_revisao_documental_e247 benchmarks/e258/necessidades.json stage_documental/e259 contrastes --progressiva --multicenas --qualidade --replay-privado
      - name: Preservar diagnostico privado
        if: ${{ !cancelled() && steps.replay.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ secrets.COFRE_TOKEN }}
        run: |
          shopt -s nullglob
          root=stage_documental/e259
          bash scripts/arquivar_cofre_review.sh "review-e259-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" "$root/revisao.json" "$root"/revisao-*.jpg
          python scripts/espelhar_revisao_cofre.py "e259-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" "$root/revisao.json" "$root"/revisao-*.jpg
      - name: Confirmar reaproveitamento e preservar resultados negativos
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('stage_documental/e259/revisao.json').read_text())
          assert r['modo_replay_privado'] and r['visao_chamadas_logicas']==0 and r['telemetria_visao']==[]
          assert r['restauracao']['originais_restaurados']==2 and r['restauracao']['analises_restauradas']>=4
          assert r['cobertura_documentario']['consumo']['http']==0 and r['cobertura_documentario']['consumo']['buscas']==0
          assert r['reusos_analises']>=6
          assert [x['estado'] for x in r['cobertura']]==['CANDIDATO_PRIVADO_REVISADO','LACUNA_PENDENTE']
          assert r['publish'] is False and not r['pronto_para_render']
          print('E259 REPLAY',r['reusos_analises'],r['cobertura_documentario']['resumo'])
          PY
