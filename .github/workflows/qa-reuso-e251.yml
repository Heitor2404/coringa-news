name: E251 - reuso documental privado
on:
  push:
    branches: [atlas-direcao-visual-20261118]
    paths: ['.github/workflows/qa-reuso-e251.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reuse:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    if: github.ref == 'refs/heads/atlas-direcao-visual-20261118'
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.13', cache: pip}
      - run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg
          fi
          python -m pip install -q -r requirements.txt beautifulsoup4 pytest
      - name: Regressao V3 e revisao documental
        run: python -m pytest -q tests/test_reuso_documental_e251.py tests/test_pacote_biblioteca_e250.py tests/test_revisao_adaptativa_e248.py tests/test_revisao_documental_e247.py tests/test_acervo_recuperacao_e246.py
      - name: Recuperar pacote anterior sem consultar fontes
        env:
          GH_TOKEN: ${{ secrets.COFRE_TOKEN }}
        run: |
          set -euo pipefail
          repo=Heitor2404/coringa-cofre
          tag=review-e250-45534747639-1
          test "$(gh api "repos/$repo" --jq '.private and (.id == 1454059520)')" = true
          test "$(gh release view "$tag" --repo "$repo" --json isDraft --jq '.isDraft')" = true
          mkdir -p qa_pack
          gh release download "$tag" --repo "$repo" --pattern '*' --dir qa_pack
      - name: Revisao do original reutilizado
        id: revisao
        env:
          CORINGA_PACOTE_PRIVADO: qa_pack
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          CAIXA_MAX_CHAMADAS: '2'
          CAIXA_TETO_USD: '0'
          USAR_CLAUDE: '0'
        run: python -m scripts.qa_revisao_documental_e247 benchmarks/e248/necessidades.json qa_revisao saturno --adaptativa
      - name: Espelhar no cofre privado
        if: ${{ !cancelled() && steps.revisao.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ secrets.COFRE_TOKEN }}
        run: |
          shopt -s nullglob
          python scripts/espelhar_revisao_cofre.py "e251-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" qa_revisao/revisao.json qa_revisao/revisao-*.jpg
      - name: Confirmar reuso real no relatorio
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('qa_revisao/revisao.json').read_text())
          assert r['reusos_bytes']>=1 and r['reuso_bytes_validado']
          assert r['pesquisa'][0]['buscas']==[]
          assert not r['publish'] and not r['pronto_para_render']
          print('E251 ORIGINAL REUTILIZADO',r['reusos_bytes'],'visao',r['visao_chamadas_logicas'])
          PY
      - name: Enviar revisao privada ao Telegram
        if: ${{ !cancelled() && steps.revisao.outcome == 'success' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          from pathlib import Path
          from src.v3 import previa_telegram as T
          chat,_=T.chat_autorizado()
          for p in [Path('qa_revisao/revisao.json'),*sorted(Path('qa_revisao').glob('revisao-*.jpg'))]:
              r=T._api('sendDocument',{'chat_id':chat,'caption':'CORINGA E251 - Reuso privado, direitos pendentes.'},('document',p))
              if not isinstance(r,dict) or not r.get('message_id'):raise RuntimeError('Entrega privada nao confirmada')
          PY
