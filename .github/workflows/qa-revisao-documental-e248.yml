name: E248 - revisao semantica multitema privada
on:
  push:
    branches: [atlas-direcao-visual-20261118]
    paths: ['.github/workflows/qa-revisao-documental-e248.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  coverage:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        caso: [camuflagem, saturno, geleiras]
    if: github.ref == 'refs/heads/atlas-direcao-visual-20261118'
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: "3.13", cache: pip}
      - name: Dependencias de aquisicao
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg
          fi
          python -m pip install -q -r requirements.txt beautifulsoup4
      - name: Regressões do contrato de observação
        run: python -m pip install -q pytest && python -m pytest -q tests/test_revisao_adaptativa_e248.py tests/test_revisao_documental_e247.py tests/test_acervo_recuperacao_e246.py tests/test_acervo_documental_e246.py tests/test_direcao_observacao_e238.py tests/test_direcao_observacao_e239.py
      - name: Pesquisar e revisar pertinencia com Gemini
        id: revisao
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          CAIXA_MAX_CHAMADAS: '2'
          CAIXA_TETO_USD: '0'
          USAR_CLAUDE: '0'
        run: python -m scripts.qa_revisao_documental_e247 benchmarks/e248/necessidades.json qa_revisao ${{ matrix.caso }} --adaptativa
      - name: Espelhar relatorio e folhas no cofre privado
        if: ${{ !cancelled() && steps.revisao.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ secrets.COFRE_TOKEN }}
          CASO: ${{ matrix.caso }}
        run: |
          shopt -s nullglob
          python scripts/espelhar_revisao_cofre.py "e248-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${CASO}" qa_revisao/revisao.json qa_revisao/revisao-*.jpg
      - name: Enviar folhas e manifesto ao destino privado
        if: ${{ !cancelled() && steps.revisao.outcome == 'success' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          from pathlib import Path
          from src.v3 import previa_telegram as T
          try:
              chat,_=T.chat_autorizado()
              root=Path('qa_revisao')
              paths=sorted(root.glob('revisao-*.jpg'))+[root/'revisao.json']
              for path in paths:
                  r=T._api('sendDocument',{'chat_id':chat,'caption':'CORINGA · E248 · ${{ matrix.caso }}. Inspeção semântica assistida; direitos e revisão humana pendentes.'},('document',path))
                  if not isinstance(r,dict) or not r.get('message_id'):raise RuntimeError()
          except Exception:
              raise SystemExit('Entrega privada não confirmada') from None
          print('E248 REVISAO ENTREGUE',len(paths))
          PY
  avisar_falha:
    needs: coverage
    if: ${{ always() && (needs.coverage.result == 'failure' || needs.coverage.result == 'cancelled') }}
    permissions:
      actions: read
      contents: none
    uses: ./.github/workflows/notificar-falha-documental.yml
    with:
      result: ${{ needs.coverage.result }}
      job_name: coverage
    secrets:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
