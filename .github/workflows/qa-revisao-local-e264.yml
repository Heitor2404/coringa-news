name: E264.4 - revisar acervo local e preservar memoria semantica
on:
  push:
    branches: [atlas-direcao-visual-20261118]
    paths: ['.github/workflows/qa-revisao-local-e264.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  local:
    if: github.ref == 'refs/heads/atlas-direcao-visual-20261118'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.13', cache: pip}
      - run: |
          python -m pip install -q -r requirements.txt beautifulsoup4 pytest
          python -m pytest -q tests/test_reuso_documental_e251.py tests/test_checkpoint_e259.py tests/test_revisao_documental_e247.py tests/test_politica_progressiva_e258.py tests/test_documentario_integral_e254.py tests/test_integracao_corretiva_e260.py
      - name: Restaurar originais do cofre
        env:
          GH_TOKEN: ${{ secrets.COFRE_TOKEN }}
        run: python -m scripts.recuperar_checkpoints_documentais benchmarks/e254/documentario.json gelo_paisagem qa_e2644
      - name: Revisar somente pistas locais, sem busca ou TTS
        env:
          CORINGA_CHECKPOINTS_DESCOBERTOS: qa_e2644/descoberta.json
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          CAIXA_MAX_CHAMADAS: '9'
          CAIXA_TETO_USD: '0'
          USAR_CLAUDE: '0'
          CORINGA_LIMITE_REVISAO_LOCAL: '9'
        run: |
          python -m scripts.qa_revisao_documental_e247 benchmarks/e254/documentario.json stage_documental/e2644 gelo_paisagem --progressiva --multicenas --integral --revisar-acervo
          python -m scripts.qa_documentario_integral_e254 stage_documental/e2644 --somente-preflight
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('stage_documental/e2644')
          r=json.loads((root/'revisao.json').read_text())
          q=json.loads((root/'integral.json').read_text())
          assert r['modo_revisar_acervo'] and r['publish'] is False
          assert r['visao_chamadas_logicas']<=9 and r['rede_aquisicao']['http']==r['cobertura_documentario']['consumo']['buscas']==0
          assert not (root/'props.json').exists() and not (root/'narracao48k.wav').exists()
          print('E264.4 RESULTADO',q, 'vision',r['visao_chamadas_logicas'], 'reusos',r['reusos_analises'],flush=True)
          PY
      - name: Arquivar e espelhar resultados privados
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ secrets.COFRE_TOKEN }}
        run: |
          shopt -s nullglob
          root=stage_documental/e2644
          if [[ -s "$root/revisao.json" ]]; then
            files=("$root"/*.json "$root"/*.jpg)
            bash scripts/arquivar_cofre_review.sh "review-e2644-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" "${files[@]}" "$root"/checkpoints/*.zip
            python scripts/espelhar_revisao_cofre.py "e2644-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" "${files[@]}"
          fi
