name: E281 - prova real privada de selecao e movimento
on:
  push:
    branches: [atlas-direcao-visual-20261118]
    paths: ['.github/workflows/qa-selecao-real-e281.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  proof:
    if: github.ref == 'refs/heads/atlas-direcao-visual-20261118'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CAIXA_MAX_CHAMADAS: '4'
      CAIXA_TETO_USD: '0'
      USAR_CLAUDE: '0'
      CORINGA_LIMITE_VISAO_DOCUMENTAL: '4'
      REMOTION_CHROME: /usr/bin/google-chrome
      REMOTION_DISABLE_TELEMETRY: '1'
      DO_NOT_TRACK: '1'
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.13', cache: pip}
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm, cache-dependency-path: motor4/package-lock.json}
      - name: Regressao antes de consumir cota
        run: |
          python -m pip install -q -r requirements.txt beautifulsoup4 pytest
          python -m pytest -q tests/test_pretriagem_e269.py tests/test_adquirir_pretriagem_e272.py tests/test_politica_progressiva_e258.py tests/test_amostragem_documental_e257.py tests/test_documentario_integral_e254.py tests/test_area_segura_plataformas.py
      - name: Prova com duas necessidades novas, cota existente e sem faturamento autorizado
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
        run: python -m scripts.qa_revisao_documental_e247 benchmarks/e281/contraste.json stage_documental/e281 contraste_e281 --progressiva --multicenas --qualidade --pretriagem-pendente --revisar-previas --encadear-previas
      - name: Verificar resultados reais e preparar somente se houver cobertura
        run: |
          python - <<'PY'
          import json,math
          from pathlib import Path
          from src.v4.formatos import ponte_cobertura_filme as P,filme_editorial as F
          from scripts.qa_documentario_curado_e218 import PUBLIC
          root=Path('stage_documental/e281')
          r=json.loads((root/'revisao.json').read_text())
          assert r['publish'] is False and r['visao_chamadas_logicas']<=4
          chosen,gate=P.preparar_cobertura(r,r['case'],minimo_s=1.4)
          summary={'publicar':False,'tipo':'PROVA_CURTA_NAO_DOCUMENTARIO','visao':r['visao_chamadas_logicas'],'gate':gate,'voz':False}
          print('E281 RESULTADO',[(x['necessidade_id'],x['estado']) for x in r['cobertura']],summary)
          if gate['pronto_para_tts']:
              ends=[];end=0
              for ch in r['case']['chapters']:
                  end+=sum(math.floor(chosen[i]['cap']*30+1e-6) for i in ch['needs']);ends.append(end)
              plan=P.plano(r['case'],chosen,ends)
              F.preparar(plan,root/'fragmento',PUBLIC,fragmento_misto=True)
              summary['duracao_s']=plan['duracao']
          (root/'prova.json').write_text(json.dumps(summary,ensure_ascii=False,indent=2))
          PY
      - name: Renderizar fragmento real quando o gate permitir
        run: |
          root=stage_documental/e281
          if [[ -f "$root/fragmento/props.json" ]]; then
            npm ci --prefix motor4 --no-audit --no-fund
            (cd motor4 && npx --no-install remotion render remotion/src/index.ts FilmeEditorial ../"$root/fragmento.mp4" --props=../"$root/fragmento/props.json" --public-dir=remotion/public --codec=h264 --crf=21 --scale=0.5 --concurrency=3 --log=error)
            ffprobe -v error -show_streams -show_format -of json "$root/fragmento.mp4" > "$root/probe.json"
          fi
      - name: Preservar evidencias e arquivos privados
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ secrets.COFRE_TOKEN }}
        run: |
          shopt -s nullglob
          root=stage_documental/e281
          files=("$root"/*.json "$root"/*.jpg "$root"/*.mp4)
          packets=("$root"/checkpoints/*.zip)
          if (( ${#packets[@]} > 0 )); then
            bash scripts/arquivar_cofre_review.sh "review-e281-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" "${files[@]}" "$root/manifesto-revisoes.jsonl" "${packets[@]}"
          fi
          if (( ${#files[@]} > 0 )); then python scripts/espelhar_revisao_cofre.py "e281-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" "${files[@]}"; fi
