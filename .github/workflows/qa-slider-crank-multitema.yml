name: "QA — Slider-crank multitema ilustrado (pistao + compressor)"
on:
  push:
    branches: [atlas-direcao-visual-20261118]
    paths:
      - ".github/workflows/qa-slider-crank-multitema.yml"
      - "motor4/remotion/src/Root.tsx"
      - "motor4/remotion/src/formatos/SliderCrankRig.ts"
      - "motor4/remotion/src/formatos/SliderCrankProof.tsx"
      - "motor4/remotion/src/formatos/slider-crank-proofs.json"
      - "tests/test_slider_crank_multitema.py"
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: qa-slider-crank-multitema
  cancel-in-progress: true

jobs:
  duas_configuracoes_um_renderer:
    runs-on: ubuntu-22.04
    timeout-minutes: 19
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: motor4/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Dependencias render e QA
        run: |
          python -m pip install -q pytest pillow
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update -qq
            sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends ffmpeg
          fi
          cd motor4
          npm ci --no-audit --no-fund
          npx --no-install tsc -p remotion/tsconfig.json --noEmit
      - name: Garantir mesmo mecanismo em dois contextos fisicos
        run: python -m pytest -q tests/test_slider_crank_multitema.py
      - name: Gerar props declarativas dos dois temas
        run: |
          mkdir -p qa_slider/frames
          python - <<'PY'
          import json
          from pathlib import Path
          src=json.loads(Path('motor4/remotion/src/formatos/slider-crank-proofs.json').read_text('utf8'))
          assert not src['qa']['publish'] and not src['qa']['telegram']
          for kind in ('motor','compressor'):
              (Path('qa_slider')/('props-'+kind+'.json')).write_text(
                  json.dumps({'kind':kind,'duracao':src['duration'],
                              'private_review_only':True},ensure_ascii=False,indent=2))
          PY
      - name: Renderizar pistao e virabrequim
        timeout-minutes: 6
        run: |
          cd motor4
          npx --no-install remotion render remotion/src/index.ts ProvaA-Pistao ../qa_slider/pistao_A_PRIVADO.mp4 --props=../qa_slider/props-motor.json --public-dir=remotion/public --codec=h264 --crf=20 --scale=0.5 --concurrency=2 --log=error
      - name: Renderizar compressor com MESMO renderer
        timeout-minutes: 6
        run: |
          cd motor4
          npx --no-install remotion render remotion/src/index.ts ProvaA-Compressor ../qa_slider/compressor_A_PRIVADO.mp4 --props=../qa_slider/props-compressor.json --public-dir=remotion/public --codec=h264 --crf=20 --scale=0.5 --concurrency=2 --log=error
      - name: Montar contato e testar frames reais + areas seguras
        run: |
          python - <<'PY'
          import hashlib, json, subprocess
          from pathlib import Path
          from PIL import Image, ImageDraw, ImageChops, ImageStat
          target=Path('qa_slider')
          frames=target/'frames'
          specs=json.loads(Path('motor4/remotion/src/formatos/slider-crank-proofs.json').read_text('utf8'))
          safe=json.loads(Path('src/v4/formatos/plataformas.json').read_text('utf8'))
          points=[.4,1.75,3.6,5.0,7.0]
          contact=Image.new('RGB',(5*245,2*493),(236,242,242))
          cd=ImageDraw.Draw(contact)
          overlay=Image.new('RGB',(3*290,2*555),(236,243,244))
          od=ImageDraw.Draw(overlay)
          output={}
          for row,(kind,name) in enumerate((('motor','pistao_A_PRIVADO.mp4'),('compressor','compressor_A_PRIVADO.mp4'))):
              path=target/name
              assert path.exists() and path.stat().st_size>25000
              metadata=json.loads(subprocess.check_output([
                  'ffprobe','-v','error','-show_entries',
                  'format=duration:stream=codec_type,width,height','-of','json',str(path)]))
              streams=metadata['streams']
              video=next(s for s in streams if s['codec_type']=='video')
              assert video['width']==540 and video['height']==960
              assert not any(s['codec_type']=='audio' for s in streams)
              assert abs(float(metadata['format']['duration'])-specs['duration'])<.04
              selected=[]
              for col,t in enumerate(points):
                  frame=frames/(kind+'_'+str(t).replace('.','_')+'.png')
                  subprocess.check_call(['ffmpeg','-hide_banner','-loglevel','error','-y',
                     '-ss',str(t),'-i',str(path),'-frames:v','1',str(frame)])
                  im=Image.open(frame).convert('RGB')
                  selected.append(im)
                  tile=im.copy();tile.thumbnail((230,409))
                  x=col*245+8;y=row*493+49
                  contact.paste(tile,(x,y))
                  cd.text((x,y-30),kind+' @ '+str(t)+'s',fill='#0E2B3B')
              for col,profile_name in enumerate(safe['ativos_seguros']):
                  profile=safe['perfis'][profile_name]
                  im=selected[2].resize((270,480)).convert('RGBA')
                  highlight=Image.new('RGBA',im.size,(0,0,0,0))
                  d=ImageDraw.Draw(highlight,'RGBA')
                  k=270/1080
                  d.rectangle((0,0,270,profile['topo']*k),fill=(223,37,67,89))
                  d.rectangle((0,(1920-profile['base'])*k,270,480),fill=(223,37,67,89))
                  right=profile['direita']
                  d.rectangle(((1080-right['largura'])*k,right['de_y']*k,
                              270,min(1920,right['ate_y'])*k),
                              fill=(223,37,67,103))
                  im=Image.alpha_composite(im,highlight).convert('RGB')
                  x=col*290+8;y=row*555+42
                  overlay.paste(im,(x,y))
                  od.text((x,y-27),kind+' · '+profile['nome'][:23],fill='#0E2B3B')
              # Detect only gross technical failure, NOT semantic quality.
              a,b=selected[0],selected[2]
              diff=ImageChops.difference(a.crop((155,285,370,584)),
                                         b.crop((155,285,370,584)))
              metric=sum(ImageStat.Stat(diff).mean)/3
              assert metric>3.0,(kind,'mecanismo congelado',metric)
              output[kind]={
                  'mp4_sha256':hashlib.sha256(path.read_bytes()).hexdigest(),
                  'motion_delta_0_4_to_3_6':round(metric,2),
                  'resolution':[540,960],
                  'frames':len(points),
                  'story_beats':len(specs['models'][kind]['steps'])
              }
          contact.save(target/'contato_pistao_compressor_10quadros.jpg',quality=91)
          overlay.save(target/'areas_seguras_3redes.jpg',quality=90)
          (target/'resultado.json').write_text(json.dumps({
              'status':'QA_ESTRUTURAL_APROVADA_SE_CI_VERDE_VISUAL_HUMANO_PENDENTE',
              'publicar':False,'telegram':False,'narracao':False,
              'renderer':'SliderCrankProof.tsx','rig':'SliderCrankRig.ts',
              'testes':'um rig fisico, duas configuracoes',
              'human_review':'PENDING', 'resultados':output
          },ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa-slidercrank-2temas-privado
          path: qa_slider/
          retention-days: 5
          if-no-files-found: warn
