name: "LAB E1 — solver genérico de juntas + baseline congelado de 12"
on:
  push:
    branches: [atlas-direcao-visual-20261118]
    paths:
      - ".github/workflows/qa-solver-generico-e1.yml"
      - "src/v4/formatos/solver_restricoes_e1.py"
      - "src/v4/formatos/renderer_corpos_e1.py"
      - "benchmarks/generalizacao_mecanismos_v1.json"
      - "benchmarks/probes_f15_v1.json"
      - "benchmarks/rodar_baseline_f15_e0.py"
      - "benchmarks/specs_genericas_e1/**"
      - "tests/test_solver_generico_e1.py"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: lab-e1-constraint-solver-common
  cancel-in-progress: true
jobs:
  benchmark_baseline_and_joint_solver:
    runs-on: ubuntu-22.04
    timeout-minutes: 26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install numeric + SVG deps (no paid APIs)
        run: |
          python -m pip install -q pytest numpy scipy cairosvg pillow
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update -qq
            sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends ffmpeg
          fi
      - name: Test baseline and 3 mechanisms on a single joint solver, regression F7
        run: |
          python -m pytest -q \
            tests/test_solver_generico_e1.py \
            tests/test_mecanica_parametrica_f7.py
      - name: Measure baseline against original immutable 12 targets
        run: |
          mkdir -p qa_e1
          python -m benchmarks.rodar_baseline_f15_e0 qa_e1/BASELINE_F15_12.json
      - name: Render generic animated bodies from THREE different mechanism specs
        timeout-minutes: 12
        run: |
          python -m src.v4.formatos.renderer_corpos_e1 \
             benchmarks/specs_genericas_e1/oraculo_biela_e1.json \
             qa_e1/ORACULO_BIELA_E1.mp4 --title "REFERENCIA · BIELA"
          python -m src.v4.formatos.renderer_corpos_e1 \
             benchmarks/specs_genericas_e1/quatro_barras_e1.json \
             qa_e1/QUATRO_BARRAS_E1.mp4 --title "QUATRO BARRAS"
          python -m src.v4.formatos.renderer_corpos_e1 \
             benchmarks/specs_genericas_e1/scotch_yoke_e1.json \
             qa_e1/SCOTCH_YOKE_E1.mp4 --title "SCOTCH YOKE"
      - name: Check real MP4s, independent kinematic tests, provenance and contact sheet
        run: |
          python - <<'PY'
          import hashlib,json,math,subprocess
          from pathlib import Path
          from PIL import Image
          import numpy as np
          from src.v4.formatos import solver_restricoes_e1 as S
          from src.v4.formatos import cinematica_biela_manivela as F7
          root=Path("qa_e1")
          defs=[
            ("oraculo_biela_e1","ORACULO_BIELA_E1.mp4"),
            ("quatro_barras_e1","QUATRO_BARRAS_E1.mp4"),
            ("scotch_yoke_e1","SCOTCH_YOKE_E1.mp4")
          ]
          board=Image.new("RGB",(4*270,3*480),"#EAF2F4")
          results=[]
          for row,(name,movie) in enumerate(defs):
              scene=json.loads((Path("benchmarks/specs_genericas_e1")/(name+".json")).read_text("utf8"))
              frames=S.trajectory(scene,121)
              path=root/movie
              m=json.loads(path.with_suffix(".json").read_text("utf8"))
              info=json.loads(subprocess.check_output(["ffprobe","-v","error",
                  "-show_entries","stream=codec_type,width,height,r_frame_rate:format=duration",
                  "-of","json",str(path)]))
              video=next(s for s in info["streams"] if s["codec_type"]=="video")
              assert (video["width"],video["height"])==(540,960)
              assert video["r_frame_rate"]=="18/1"
              assert abs(float(info["format"]["duration"])-6)<.05
              assert not any(s["codec_type"]=="audio" for s in info["streams"])
              sha=hashlib.sha256(path.read_bytes()).hexdigest()
              assert sha==m["sha256"]
              assert m["renderer"]=="single_shared_svg_compositor" and not m["publish"]
              for col,t in enumerate((.3,1.8,3.3,4.8)):
                  out=root/(path.stem+"_"+str(col)+".png")
                  subprocess.check_call(["ffmpeg","-hide_banner","-loglevel","error",
                     "-y","-ss",str(t),"-i",str(path),"-frames:v","1",str(out)])
                  board.paste(Image.open(out).convert("RGB").resize((270,480)),(col*270,row*480))
              error=max(f["max_residual_m"] for f in frames)
              assert error<1e-8
              measured={"name":name,"sha256":sha,"max_closure_m":error,
                        "common_solver":True,"same_renderer":True,
                        "source_generated":False,"human_provided_spec":True,
                        "publish":False,"visual_approved":False}
              if name=="oraculo_biela_e1":
                  compare=[]
                  for f in frames:
                      oracle=F7.calcular(2*math.pi*f["t"]/6,35,120,250,600)
                      compare.append(abs(f["poses"]["slider"][1]-(oracle.piston_y-600)/100))
                  measured["max_against_F7_oracle_m"]=max(compare)
                  assert measured["max_against_F7_oracle_m"]<1e-7
              if name=="quatro_barras_e1":
                  rocker=np.array([f["poses"]["rocker"][2] for f in frames])
                  measured["rocker_swing_rad"]=float(rocker.max()-rocker.min())
                  assert measured["rocker_swing_rad"]>.35
              if name=="scotch_yoke_e1":
                  measured["max_sinusoid_error_m"]=max(abs(
                      f["poses"]["yoke"][0]-.65*math.sin(2*math.pi*f["t"]/6)) for f in frames)
                  assert measured["max_sinusoid_error_m"]<1e-7
              results.append(measured)
          board.save(root/"COMPARATIVO_SOLVER_E1_3_MECANISMOS_12_QUADROS.jpg",quality=92)
          baseline=json.loads((root/"BASELINE_F15_12.json").read_text("utf8"))
          assert baseline["blocked"]==12 and baseline["score_ge_3"]==0
          assert len(results)==3 and all(x["common_solver"] and x["same_renderer"] for x in results)
          report={
              "schema":"coringa-generic-joint-solver-E1-qa-v0",
              "legacy_baseline_blocked":baseline["blocked"],
              "legacy_baseline_tested":12,
              "new_generic_solver_physical_oracle":1,
              "new_generic_solver_unseen_mechanisms_numerically_validated":2,
              "new_benchmark_targets_attempted":["quatro_barras","scotch_yoke"],
              "new_benchmark_targets_not_attempted":10,
              "provisional_level3_candidates":2,
              "external_visual_independent_approval":False,
              "mechanism_spec_was_manually_authored":True,
              "source_to_spec_automatic":False,
              "constraints_are_kinematic_not_contact":True,
              "generalized_to_holdouts":False,
              "production_enabled":False,"publish":False,
              "results":results
          }
          (root/"QA_SOLVER_E1.json").write_text(json.dumps(report,ensure_ascii=False,indent=2),encoding="utf8")
          print(json.dumps(report,ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lab-e1-baseline12-solver-3-mecanismos-privado
          path: qa_e1/
          retention-days: 5
          if-no-files-found: warn
