name: "LAB E2 — rolling generico pinhao-cremalheira + regressao E1"
on:
  push:
    branches: [atlas-direcao-visual-20261118]
    paths:
      - ".github/workflows/qa-solver-generico-e2.yml"
      - "src/v4/formatos/solver_restricoes_e1.py"
      - "src/v4/formatos/renderer_corpos_e1.py"
      - "benchmarks/specs_genericas_e2/**"
      - "benchmarks/specs_genericas_e1/**"
      - "tests/test_solver_generico_e2.py"
      - "tests/test_solver_generico_e1.py"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: lab-e2-generic-rolling
  cancel-in-progress: true
jobs:
  verify_new_topology:
    runs-on: ubuntu-22.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install free simulation and renderer tools
        run: |
          python -m pip install -q pytest numpy scipy cairosvg pillow
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update -qq
            sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends ffmpeg
          fi
      - name: Run E1+E2 physical regressions and adversarial constraints
        run: |
          python -m pytest -q \
            tests/test_solver_generico_e1.py \
            tests/test_solver_generico_e2.py \
            tests/test_mecanica_parametrica_f7.py
      - name: Generate new mechanism MP4 with existing common renderer
        timeout-minutes: 7
        run: |
          mkdir -p qa_e2
          python -m src.v4.formatos.renderer_corpos_e1 \
            benchmarks/specs_genericas_e2/pinhao_cremalheira_e2.json \
            qa_e2/PINHAO_CREMALHEIRA_E2.mp4 \
            --title "PINHAO + CREMALHEIRA"
      - name: Independently measure geometry, all frames, codec and contact sheet
        run: |
          python - <<'PY'
          import hashlib,json,math,subprocess
          from pathlib import Path
          from PIL import Image,ImageChops,ImageStat
          from src.v4.formatos import solver_restricoes_e1 as S
          from src.v4.formatos import renderer_corpos_e1 as R
          root=Path("qa_e2")
          spec=json.loads(Path("benchmarks/specs_genericas_e2/pinhao_cremalheira_e2.json").read_text("utf8"))
          frames=S.trajectory(spec,121)
          joint=spec["joints"][-1];radius=joint["pitch_radius_m"]
          physics=max(abs(f["poses"]["rack"][0]-radius*f["poses"]["pinion"][2]) for f in frames)
          assert physics<1e-8
          assert max(f["max_residual_m"] for f in frames)<1e-8
          assert abs(frames[-1]["poses"]["rack"][0]-frames[0]["poses"]["rack"][0]-math.pi*radius)<1e-8
          assert all(f["jacobian_rank"]==6 for f in frames)
          movie=root/"PINHAO_CREMALHEIRA_E2.mp4"
          meta=json.loads(movie.with_suffix(".json").read_text("utf8"))
          raw=json.loads(subprocess.check_output(["ffprobe","-v","error","-show_entries",
             "stream=codec_type,width,height,r_frame_rate:format=duration",
             "-of","json",str(movie)]))
          video=next(x for x in raw["streams"] if x["codec_type"]=="video")
          assert (video["width"],video["height"])==(540,960)
          assert video["r_frame_rate"]=="18/1"
          assert abs(float(raw["format"]["duration"])-6)<.1
          assert not any(x["codec_type"]=="audio" for x in raw["streams"])
          sha=hashlib.sha256(movie.read_bytes()).hexdigest()
          assert sha==meta["sha256"]
          assert meta["renderer"]=="single_shared_svg_compositor"
          assert meta["source_generated"] is False and meta["publish"] is False
          board=Image.new("RGB",(270*4,480),"#EAF2F4")
          grabs=[]
          for col,t in enumerate((.2,1.7,3.2,4.7)):
              pic=root/("FRAME_"+str(col)+".png")
              subprocess.check_call(["ffmpeg","-hide_banner","-loglevel","error","-y",
                 "-ss",str(t),"-i",str(movie),"-frames:v","1",str(pic)])
              img=Image.open(pic).convert("RGB")
              board.paste(img.resize((270,480)),(col*270,0))
              grabs.append(img.copy())
          board.save(root/"CONTATO_E2_4_QUADROS.jpg",quality=92)
          differences=[sum(ImageStat.Stat(ImageChops.difference(grabs[0],g)).mean)/3 for g in grabs[1:]]
          assert max(differences)>1, "Frames not visibly changing"
          camera=R.geometry_bounds(spec,frames)
          report={
            "schema":"coringa-e2-pinion-rack-qa-v0",
            "status":"NUMERICALLY_VALIDATED_NOT_ARTISTICALLY_APPROVED",
            "topology":"ideal_rack_pinion_contact_side_and_no_slip",
            "spec_source":"manual", "source_generated":False,
            "mechanisms_new_attempted_cumulative":3,
            "benchmark_targets_total":12,
            "benchmark_targets_not_attempted":9,
            "holdouts_attempted":0,
            "old_f15_probes_admitted":0,
            "physical_solver":"same_as_E1",
            "renderer":"same_as_E1",
            "max_rolling_error_m":physics,
            "max_joint_residual_m":max(f["max_residual_m"] for f in frames),
            "rack_stroke_m":frames[-1]["poses"]["rack"][0]-frames[0]["poses"]["rack"][0],
            "pitch_radius_m":radius,
            "max_sampled_rgb_change":max(differences),
            "camera_fixed":camera["world_fixed_for_all_frames"],
            "sha256":sha,
            "visual_approved":False, "publish":False,
            "limitations":["ideal pitch rolling not force/contact simulation",
                           "gear silhouette is illustrative not CAD",
                           "no automated source-to-spec or licensed industrial asset"]
          }
          (root/"QA_SOLVER_E2.json").write_text(json.dumps(report,indent=2),encoding="utf8")
          print(json.dumps(report,ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lab-e2-pinhao-cremalheira-generico-privado
          path: qa_e2/
          retention-days: 5
          if-no-files-found: warn
