name: "LAB — amostrar pistão referencial de 24 quadros (sem assumir compressor)"
on:
  push:
    branches: [atlas-direcao-visual-20261118]
    paths:
      - ".github/workflows/qa-source-piston-24f.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  amostrar_animacao_real:
    runs-on: ubuntu-22.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -q pillow requests
      - name: Download de GIF original verificado no Commons e contato
        run: |
          mkdir -p qa_source_24
          python - <<'PY'
          import hashlib,io,json,requests
          from pathlib import Path
          from PIL import Image,ImageDraw
          url="https://upload.wikimedia.org/wikipedia/commons/d/d4/Piston.gif"
          out=Path('qa_source_24')
          result={'source_page':'https://commons.wikimedia.org/wiki/File:Piston.gif',
                  'creator':'R. Castelnuovo; imagem cortada por Jahobr',
                  'declared_license':'CC BY-SA 3.0 / GFDL','process_proven':False,
                  'type':'MECHANICAL_PISTON_REFERENCE_NOT_COMPRESSOR',
                  'publication_allowed':False}
          try:
              r=requests.get(url,timeout=20,headers={
                  'User-Agent':'CoringaExplicaReferences/1.0 (research; github.com/Heitor2404/coringa-news)'})
              r.raise_for_status()
              assert len(r.content)<4_000_000 and r.content[:3]==b'GIF'
              file=out/'source_Piston_Castelnuovo_24f.gif'
              file.write_bytes(r.content)
              with Image.open(io.BytesIO(r.content)) as gif:
                  result['frames']=gif.n_frames
                  result['dimensions']=[gif.width,gif.height]
                  assert gif.n_frames >= 20
                  indices=list(range(0,gif.n_frames,max(1,gif.n_frames//12)))[:12]
                  w,h=gif.size
                  canvas=Image.new('RGB',(4*240,3*340),'#EEF5F8')
                  draw=ImageDraw.Draw(canvas)
                  for j,i in enumerate(indices):
                      gif.seek(i)
                      im=gif.convert('RGB')
                      im.thumbnail((224,300))
                      x=(j%4)*240+8
                      y=(j//4)*340+28
                      canvas.paste(im,(x+(224-im.width)//2,y))
                      draw.text((x,y-22),f'QUADRO {i:02d}',fill='#183956')
                  canvas.save(out/'piston_12_frames_reais.jpg',quality=93)
              result.update({'status':'EXTRAIDO_NAO_INSPECIONADO_COMO_COMPRESSOR',
                  'sha256':hashlib.sha256(r.content).hexdigest(),
                  'sampled_frames':indices})
          except Exception as e:
              result.update({'status':'BLOQUEADO_DOWNLOAD_OU_GIF',
                  'error':type(e).__name__+':'+str(e)[:160]})
          (out/'source_check.json').write_text(json.dumps(result,indent=2,ensure_ascii=False))
          print(json.dumps(result,ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pistao-24f-referencia-mecanica-nao-compressor
          path: qa_source_24/
          retention-days: 5
          if-no-files-found: warn
