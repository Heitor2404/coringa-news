name: E397B - reconstrucao espacial cinematografica
on:
  push:
    branches: [atlas-direcao-visual-20261118]
    paths: ['.github/workflows/qa-spatial-e397b.yml','motor4/remotion/src/spatial-e397b.tsx','motor4/remotion/src/formatos/SpatialDirectorE397B.ts','motor4/scripts/spatial-e397b.test.cjs','scripts/verificar_spatial_e397b.py','scripts/entregar_spatial_e397b.py']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qa:
    if: github.ref == 'refs/heads/atlas-direcao-visual-20261118'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - case: ship
            composition: SpatialShipB
          - case: wind
            composition: SpatialWindB
    env:
      MAP_CASE: ${{ matrix.case }}
      REMOTION_CHROME: /usr/bin/google-chrome
      CORINGA_CHROME: /usr/bin/google-chrome
      REMOTION_DISABLE_TELEMETRY: '1'
      CAIXA_MAX_CHAMADAS: '0'
      CAIXA_TETO_USD: '0'
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: ./.github/actions/setup-ffmpeg
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm, cache-dependency-path: motor4/package-lock.json}
      - name: Regressao de mecanismos e camera
        run: |
          python -m pip install -q -r requirements.txt pillow pytest
          python -m pytest -q tests/test_atlas_3d_editorial_safe.py tests/test_slider_crank_multitema.py
          cd motor4
          npm ci --no-audit --no-fund
          npx --no-install tsc -p remotion/tsconfig.json --noEmit
          mkdir -p .qa-e397
          npx --no-install tsc remotion/src/formatos/SpatialDirectorE397B.ts --target ES2022 --module commonjs --moduleResolution node --skipLibCheck --esModuleInterop --outDir .qa-e397
          printf '{"type":"commonjs"}' > .qa-e397/package.json
          node scripts/spatial-e397b.test.cjs "$PWD/.qa-e397/SpatialDirectorE397B.js"
      - name: Renderizar prova vertical nativa
        run: |
          mkdir -p qa_spatial_e397b
          cd motor4
          npx --no-install remotion render remotion/src/spatial-e397b.tsx ${{ matrix.composition }} ../qa_spatial_e397b/portrait.mp4 --codec=h264 --crf=19 --concurrency=1 --gl=swangle --log=error
      - name: Validar video e amostras
        run: python -m scripts.verificar_spatial_e397b
      - name: Entregar video Telegram privado
        if: ${{ success() }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m scripts.entregar_spatial_e397b
      - name: Preservar provas e recibos
        if: always()
        env:
          GH_TOKEN: ${{ secrets.COFRE_TOKEN }}
        run: |
          shopt -s nullglob
          root=qa_spatial_e397b
          if [[ -f "$root/portrait.mp4" ]]; then bash scripts/arquivar_cofre_review.sh "review-e397b-${MAP_CASE}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" "$root/portrait.mp4"; fi
          files=("$root"/qa.json "$root"/delivery.json "$root"/*.jpg "$root"/*.base64.json)
          existing=()
          for f in "${files[@]}"; do if [[ -f "$f" ]]; then existing+=("$f"); fi; done
          if (( ${#existing[@]} )); then python scripts/espelhar_revisao_cofre.py "e397b-${MAP_CASE}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" "${existing[@]}"; fi
  alert:
    needs: qa
    if: ${{ always() && (needs.qa.result == 'failure' || needs.qa.result == 'cancelled') }}
    permissions:
      actions: read
      contents: none
    uses: ./.github/workflows/notificar-falha-documental.yml
    with:
      result: ${{ needs.qa.result }}
      job_name: qa
    secrets:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
