name: E17 STEP articulado em ciclo fechado
on:
  push:
    branches: [atlas-direcao-visual-20261118]
    paths:
      - ".github/workflows/qa-step-fechado-e17.yml"
      - "src/v4/formatos/*e17.py"
      - "src/v4/formatos/adaptador_step_e23.py"
      - "src/v4/formatos/previa_step_e25.py"
      - "src/v4/formatos/visibilidade_e26.py"
      - "src/v4/formatos/eventos_trajetoria_e27.py"
      - "src/v4/formatos/ponte_cad_editorial_e28.py"
      - "tests/test_ponte_cad_editorial_e28.py"
      - "motor4/remotion/src/formatos/FilmeEditorial.tsx"
      - "tests/test_eventos_trajetoria_e27.py"
      - "src/v4/formatos/filme_e18.py"
      - "tests/test_visibilidade_e26.py"
      - "src/v4/formatos/multicorpo_e18.py"
      - "tests/test_adaptador_step_e23.py"
      - "src/v4/formatos/solver_restricoes_e1.py"
      - "src/v4/formatos/render_cad_e15.py"
      - "benchmarks/e17_closed_step.json"
      - "tests/test_cad_fechado_e17.py"
permissions:
  contents: read
  actions: read
jobs:
  cycle:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      OPENBLAS_NUM_THREADS: 1
      E17_CAD_DIR: source_e17
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Runtime
        run: |
          python -m pip install -q cadquery==2.7.0 pillow scipy pytest cairosvg numba imageio-ffmpeg
          echo "FFMPEG=$(python -c 'import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())')" >> "$GITHUB_ENV"
      - name: Download source for local use on runner
        run: |
          mkdir -p source_e17
          # Ask the publisher for its current authorized download URL.
          curl -fsS --retry 2 --max-time 30 https://xemstudio.com/mcp \
            -H 'Content-Type: application/json' -H 'Accept: application/json, text/event-stream' \
            --data '{"jsonrpc":"2.0","id":1,"method":"tools/call","params":{"name":"get_free_files","arguments":{"object":"print-in-place-crank-slider"}}}' \
            -o "$RUNNER_TEMP/xem-free-files.json"
          step_url=$(jq -er '.result.structuredContent.files[] | select(.name=="print-in-place-crank-slider-assembly") | .step' "$RUNNER_TEMP/xem-free-files.json")
          case "$step_url" in https://xemstudio.com/files/*) ;; *) exit 1 ;; esac
          curl -fsS --retry 2 --max-time 60 "$step_url" -o source_e17/loop.step
          curl -fsSL --retry 2 --max-time 60 "$(jq -r .files.license[0] benchmarks/e17_closed_step.json)" -o source_e17/LICENSE.md
      - name: Regressions and independent kinematic oracle
        run: python -m pytest -q -s tests/test_eventos_trajetoria_e27.py tests/test_visibilidade_e26.py tests/test_adaptador_step_e23.py tests/test_cad_fechado_e17.py tests/test_solver_generico_e1.py tests/test_solver_generico_e2.py tests/test_importador_juntas_e12.py tests/test_renderer_mecanico_e9_e10.py tests/test_importador_geometria_e7.py tests/test_triagem_fontes_geometria_e8.py
      - name: STEP no solver e renderer compartilhados E25
        run: python -m src.v4.formatos.previa_step_e25 benchmarks/e17_closed_step.json source_e17/loop.step source_e17/LICENSE.md qa_e25
      - name: Solid intersections, render and decode
        run: python -m src.v4.formatos.previa_cad_e17 benchmarks/e17_closed_step.json source_e17/loop.step source_e17/LICENSE.md qa_e17
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e17-volta-step-verificada
          path: |
            qa_e17/volta_completa.mp4
            qa_e17/volta_completa.jpg
            qa_e17/QA.json
            qa_e25/*.mp4
            qa_e25/*_folha.jpg
            qa_e25/QA.json
          retention-days: 14

  editorial-cad:
    needs: cycle
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      DO_NOT_TRACK: "1"
      REMOTION_DISABLE_TELEMETRY: "1"
      CORINGA_CHROME: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: e17-volta-step-verificada
          path: prova_cad
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: motor4/package-lock.json
      - name: Validar fonte e eventos, sem publicar
        run: |
          python -m pip install --only-binary=:all: numpy pytest imageio-ffmpeg
          python -m pytest -q tests/test_ponte_cad_editorial_e28.py
          python -m src.v4.formatos.ponte_cad_editorial_e28 prova_cad/qa_e25/QA.json motor4/remotion/public qa_e28
      - name: Instalar e compilar o compositor existente
        run: |
          npm ci --prefix motor4 --no-audit --no-fund
          ./motor4/node_modules/.bin/tsc --project motor4/remotion/tsconfig.json --noEmit
      - name: Render privado do palco CAD no FilmeEditorial
        run: |
          cd motor4
          npx --no-install remotion render remotion/src/index.ts FilmeEditorial \
            ../qa_e28/editorial_cad.mp4 --props=../qa_e28/props.json \
            --codec=h264 --crf=20 --concurrency=2 --public-dir=remotion/public --log=error
      - name: Decodificar e auditar a saida
        run: |
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path
          from src.v4.formatos.ponte_cad_editorial_e28 import verificar_video,ffmpeg,sha
          root=Path("qa_e28")
          p=json.loads((root/"props.json").read_text())
          n=round(p["duracao"]*30)
          movie=root/"editorial_cad.mp4"
          r=verificar_video(movie,n)
          r.update(sha256=sha(movie),publish=False,visual_approved=False)
          (root/"QA_EDITORIAL.json").write_text(json.dumps(r,indent=2))
          subprocess.check_call([ffmpeg(),"-v","error","-y","-i",str(movie),"-vf",
              "fps=2,scale=270:480,tile=4x2","-frames:v","1",str(root/"contato.jpg")])
          print("E28-EDITORIAL",json.dumps(r))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e28-cad-editorial-privado
          path: qa_e28/
          retention-days: 7
