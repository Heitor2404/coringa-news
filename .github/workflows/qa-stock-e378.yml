name: E378 - stock real declarado e replay de cache
on:
  push:
    branches: [atlas-direcao-visual-20261118]
    paths: ['.github/workflows/qa-stock-e378.yml','tests/test_stock_real_e378.py']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fontes-stock-e366
  cancel-in-progress: false
jobs:
  qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    env:
      CAIXA_MAX_CHAMADAS: '0'
      CAIXA_TETO_USD: '0'
      USAR_CLAUDE: '0'
      CORINGA_STOCK_CACHE_DB: stage_stock_cache/cache.sqlite3
      CORINGA_STOCK_CONTEXT_ENABLED: '1'
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: ./.github/actions/setup-ffmpeg
      - uses: actions/setup-python@v5
        with: {python-version: '3.13', cache: pip}
      - run: python -m pip install -q -r requirements.txt beautifulsoup4 pytest
      - run: python -m pytest -q tests/test_stock_real_e378.py tests/test_fontes_contextuais_e359.py tests/test_identidade_contexto_e375.py
      - uses: actions/cache/restore@v4
        with:
          path: stage_stock_cache/
          key: coringa-stock-meta-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: coringa-stock-meta-v1-
      - name: Prova real com credenciais existentes
        env:
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: python -m scripts.qa_stock_e378
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: stage_stock_cache/
          key: coringa-stock-meta-v1-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Preservar prova privada
        if: always()
        env:
          GH_TOKEN: ${{ secrets.COFRE_TOKEN }}
        run: |
          shopt -s nullglob
          root=stage_documental/e378
          if [[ -s "$root/proof.json" ]]; then
            python scripts/espelhar_revisao_cofre.py "e378-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" "$root/proof.json" "$root"/*.jpg
          fi
