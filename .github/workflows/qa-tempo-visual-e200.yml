name: E200 relógio visual transversal ATLAS e motion
on:
  push:
    branches: [atlas-direcao-visual-20261118]
    paths:
      - 'src/v4/formatos/tempo_visual_e200.py'
      - 'tests/test_tempo_visual_e200.py'
      - 'motor4/remotion/src/formatos/TempoVisualE200.ts'
      - 'motor4/remotion/tests/tempo-visual-e200.test.mjs'
      - '.github/workflows/qa-tempo-visual-e200.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - uses: actions/setup-node@v4
        with: {node-version: "22", cache: npm, cache-dependency-path: motor4/package-lock.json}
      - run: |
          python -m pip install pytest
          python -m pytest -q tests/test_tempo_visual_e200.py
          python -m py_compile src/v4/formatos/plano.py
          node --experimental-strip-types --test motor4/remotion/tests/tempo-visual-e200.test.mjs
      - run: |
          npm ci --prefix motor4 --no-audit --no-fund
          ./motor4/node_modules/.bin/tsc -p motor4/remotion/tsconfig.json --noEmit
