name: E291 - proteger evidencia de textos e validar recortes intermediarios
on:
  push:
    branches: [atlas-direcao-visual-20261118]
    paths: ['.github/workflows/qa-tipografia-e290.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: qa-tipografia-e290
  cancel-in-progress: false
jobs:
  visual:
    if: github.ref == 'refs/heads/atlas-direcao-visual-20261118'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CAIXA_MAX_CHAMADAS: '0'
      CAIXA_TETO_USD: '0'
      USAR_CLAUDE: '0'
      REMOTION_CHROME: /usr/bin/google-chrome
      REMOTION_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.13', cache: pip}
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm, cache-dependency-path: motor4/package-lock.json}
      - name: Regressoes e compilacao do compositor
        run: |
          python -m pip install -q -r requirements.txt pytest beautifulsoup4
          npm ci --prefix motor4 --no-audit --no-fund
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg; fi
          python -m pytest -q tests/test_composicao_e286.py tests/test_filme_editorial.py tests/test_area_segura_plataformas.py tests/test_video_framing_multitema.py tests/test_alinhamento_e289.py
          ./motor4/node_modules/.bin/tsc -p motor4/remotion/tsconfig.json --noEmit
          python -m scripts.qa_visual_e286
      - name: Medir texto, regiao protegida e renderizar 16 quadros 1080x1920
        run: cd motor4 && node scripts/qa_texto_e290.mjs
      - name: Preservar medidas e quadros mesmo se houver overflow
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ secrets.COFRE_TOKEN }}
        run: |
          shopt -s nullglob
          root=stage_documental/e286/e290
          files=("$root"/medidas.json "$root"/*.png)
          if [[ -s "$root/medidas.json" ]]; then
            bash scripts/arquivar_cofre_review.sh "review-e290-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" "${files[@]}"
            python scripts/espelhar_revisao_cofre.py "e290-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" "${files[@]}"
          fi
