name: "LAB F10 — transmissão geométrica no compressor completo"
on:
  push:
    branches: [atlas-direcao-visual-20261118]
    paths:
      - ".github/workflows/qa-transmissao-compressor-f10.yml"
      - "src/v4/formatos/primitivas_fisicas_parametricas.py"
      - "src/v4/formatos/render_compressor_conjunto_2d.py"
      - "tests/test_transmissao_parametrica_f10.py"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: lab-f10-transmissao-compressor
  cancel-in-progress: true
jobs:
  prova_compressor:
    runs-on: ubuntu-22.04
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Dependencias SVG e ffmpeg, sem IA
        run: |
          python -m pip install -q pytest pillow cairosvg numpy scipy opencv-python-headless
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update -qq
            sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends ffmpeg
          fi
      - name: Suite geometria F10 e regressao F7/compressor
        run: |
          python -m pytest -q \
            tests/test_transmissao_parametrica_f10.py \
            tests/test_compressor_conjunto_2d.py \
            tests/test_mecanica_parametrica_f7.py \
            tests/test_camera_causal_svg.py
      - name: MP4s reais de mesmo compressor, antes e depois F10
        timeout-minutes: 10
        run: |
          mkdir -p qa_transmissao_f10
          python -m src.v4.formatos.render_compressor_conjunto_2d \
            qa_transmissao_f10/COMPRESSOR_F10_ANTES.mp4 \
            --camera-causal --duracao 8 --fps 24
          python -m src.v4.formatos.render_compressor_conjunto_2d \
            qa_transmissao_f10/COMPRESSOR_F10_CORREIA_PARAMETRICA.mp4 \
            --camera-causal --transmissao-parametrica --duracao 8 --fps 24
      - name: Extrair frames reais, checar continuidade e qualidade tecnica
        run: |
          python - <<'PY'
          import json,hashlib,subprocess
          from pathlib import Path
          from PIL import Image,ImageChops,ImageStat
          out=Path('qa_transmissao_f10')
          names=['COMPRESSOR_F10_ANTES','COMPRESSOR_F10_CORREIA_PARAMETRICA']
          frames={}
          board=Image.new('RGB',(4*270,2*480),'#eff5f8')
          report={}
          for row,name in enumerate(names):
              mp4=out/(name+'.mp4')
              meta=json.loads(subprocess.check_output(['ffprobe','-v','error',
                '-show_entries','stream=codec_type,width,height,r_frame_rate:format=duration',
                '-of','json',str(mp4)]))
              streams=meta['streams']
              track=next(x for x in streams if x['codec_type']=='video')
              assert (track['width'],track['height'])==(540,960)
              assert track['r_frame_rate']=='24/1'
              assert abs(float(meta['format']['duration'])-8)<.05
              assert not any(x['codec_type']=='audio' for x in streams)
              info=json.loads((out/(name+'.json')).read_text('utf8'))
              assert info['sha256_video']==hashlib.sha256(mp4.read_bytes()).hexdigest()
              assert info['camera_causal']['politica_camera']=='PLANO_GERAL_TRAVADO_SEM_PAN_OU_ZOOM'
              assert info['publicar'] is False
              report[name]={'sha256':info['sha256_video'],
                 'transmissao_parametrica':info['transmissao_parametrica']['habilitada'],
                 'fps':24,'duration':8,'publicar':False}
              frames[name]=[]
              for col,t in enumerate((.5,2.2,4.4,7.5)):
                  png=out/f'{name}_{col}.png'
                  subprocess.check_call(['ffmpeg','-hide_banner','-loglevel','error',
                    '-y','-ss',str(t),'-i',str(mp4),'-frames:v','1',str(png)])
                  im=Image.open(png).convert('RGB')
                  frames[name].append(im)
                  board.paste(im.resize((270,480)),(col*270,row*480))
          before,after=frames[names[0]],frames[names[1]]
          pixel_audit=[]
          for i in range(4):
              delta=ImageChops.difference(before[i],after[i])
              def delta_mean(box):
                  return sum(ImageStat.Stat(delta.crop(box)).mean)/3
              header=delta_mean((0,0,540,270))
              footer=delta_mean((0,905,540,960))
              belt=delta_mean((55,498,395,700))
              pixel_audit.append({'frame':i,
                  'header_rgb_delta':round(header,4),
                  'footer_rgb_delta':round(footer,4),
                  'belt_roi_rgb_delta':round(belt,4)})
              # SVG direto e invariancia exata sao cobrados na suite Python.
              # MP4 H.264 muda blocos ate fora do ROI por quantizacao,
              # com ruido medio empiricamente baixo (<0.35 RGB no header
              # mesmo quando as geometrias SVG são IDENTICAS nessa regiao).
              # O teste Python exige diferenca ZERO sobre o SVG sem compressao.
              assert header<.60,('cabecalho realmente alterado',i,header)
              assert footer<.08,('rodape realmente alterado',i,footer)
              assert belt>1.,('correia sem diferenca visual',i,belt)
          board.save(out/'COMPARATIVO_COMPRESSOR_F10_8_QUADROS.jpg',quality=90)
          (out/'QA_F10_TRANSMISSAO.json').write_text(json.dumps({
            'status':'PROVA_GEOMETRICA_COM_VIDEO_REAL',
            'antes_e_depois_mesmo_mecanismo':True,
            'sistema_fisico_novo':False,
            'avaliacao_humana': 'PENDENTE',
            'copia_de_midia_externa':False,
            'publicar':False,'pixel_audit_mp4_h264':pixel_audit,'movies':report
          },ensure_ascii=False,indent=2),encoding='utf8')
          print(json.dumps(report,ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lab-f10-compressor-correia-antes-depois-privado
          path: qa_transmissao_f10/
          retention-days: 5
          if-no-files-found: warn
