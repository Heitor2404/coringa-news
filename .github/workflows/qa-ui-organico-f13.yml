name: "LAB F13 — UI orgânica observada versus guia de ads + título lateral"
on:
  push:
    branches: [atlas-direcao-visual-20261118]
    paths:
      - ".github/workflows/qa-ui-organico-f13.yml"
      - "src/v4/formatos/perfis_ui_evidencia_f13.json"
      - "src/v4/formatos/layout_organico_f13.py"
      - "src/v4/formatos/qa_ui_organico_f13.py"
      - "src/v4/formatos/compositor_cinematico_parametrico_2d.py"
      - "tests/test_layout_organico_f13.py"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: lab-f13-ui-organic-reference-evidence
  cancel-in-progress: true
jobs:
  compare_evidence:
    runs-on: ubuntu-22.04
    timeout-minutes: 26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Dependencias existentes e FFmpeg — sem Claude nem API paga
        run: |
          python -m pip install -q pytest pillow cairosvg numpy scipy opencv-python-headless
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update -qq
            sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends ffmpeg
          fi
      - name: Regressoes F13/F12/F11/F10/F7 e origem dos perfis
        run: |
          python -m pytest -q \
            tests/test_layout_organico_f13.py \
            tests/test_layout_hero_mecanico_f12.py \
            tests/test_qa_svg_mobile_f11.py \
            tests/test_transmissao_parametrica_f10.py \
            tests/test_mecanica_parametrica_f7.py
      - name: Gerar MP4 anterior e duas variantes F13 sem mudanca no motor
        timeout-minutes: 10
        run: |
          mkdir -p qa_f13
          python -m src.v4.formatos.compositor_cinematico_parametrico_2d \
            src/v4/formatos/cenas_parametricas/biela_manivela_curso_curto.json \
            qa_f13/BIELA_CURTO_F12_BASELINE.mp4 --transmissao-animada --hero-f12
          python -m src.v4.formatos.compositor_cinematico_parametrico_2d \
            src/v4/formatos/cenas_parametricas/biela_manivela_curso_curto.json \
            qa_f13/BIELA_CURTO_F13_TITULO_LATERAL.mp4 --transmissao-animada --organico-f13
          python -m src.v4.formatos.compositor_cinematico_parametrico_2d \
            src/v4/formatos/cenas_parametricas/biela_manivela_curso_longo.json \
            qa_f13/BIELA_LONGO_F13_TITULO_LATERAL.mp4 --transmissao-animada --organico-f13
      - name: Auditar texto e atores por pixel em fontes organicas versus ads
        timeout-minutes: 9
        run: |
          python -m src.v4.formatos.qa_ui_organico_f13 \
            src/v4/formatos/cenas_parametricas/biela_manivela_curso_curto.json qa_f13 > /dev/null
          python -m src.v4.formatos.qa_ui_organico_f13 \
            src/v4/formatos/cenas_parametricas/biela_manivela_curso_longo.json qa_f13 > /dev/null
      - name: Prova auditavel de MP4 e texto sem esconder o risco de UI real
        run: |
          python - <<'PY'
          import hashlib,json,subprocess
          from pathlib import Path
          from PIL import Image,ImageChops,ImageStat
          root=Path('qa_f13')
          names=['BIELA_CURTO_F12_BASELINE','BIELA_CURTO_F13_TITULO_LATERAL','BIELA_LONGO_F13_TITULO_LATERAL']
          board=Image.new('RGB',(4*270,3*480),'#E6F0F4')
          frames={}
          movies={}
          for row,name in enumerate(names):
              mp4=root/(name+'.mp4')
              info=json.loads(subprocess.check_output(['ffprobe','-v','error','-show_entries',
                   'stream=codec_type,width,height,r_frame_rate:format=duration','-of','json',str(mp4)]))
              video=next(s for s in info['streams'] if s['codec_type']=='video')
              assert (video['width'],video['height'])==(540,960)
              assert video['r_frame_rate']=='24/1'
              assert abs(float(info['format']['duration'])-9)<.05
              assert not any(s['codec_type']=='audio' for s in info['streams'])
              data=json.loads((root/(name+'.json')).read_text('utf8'))
              sha=hashlib.sha256(mp4.read_bytes()).hexdigest()
              assert data['sha256']==sha
              assert data['publish'] is False and data['camera_fixed']
              assert data['belt_animation_f11'] is True
              f13='_F13_' in name
              assert data['layout_mobile_f12']==('hero_lateral_f13' if f13 else 'hero_elevado_f12')
              assert data['scale_reduction_f12'] is False
              movies[name]={'sha256':sha,'layout':data['layout_mobile_f12']}
              frames[name]=[]
              for col,t in enumerate((.5,2.3,4.5,6.8)):
                  out=root/f'{name}_{col}.png'
                  subprocess.check_call(['ffmpeg','-hide_banner','-loglevel','error','-y',
                       '-ss',str(t),'-i',str(mp4),'-frames:v','1',str(out)])
                  im=Image.open(out).convert('RGB')
                  frames[name].append(im)
                  board.paste(im.resize((270,480)),(col*270,row*480))
          board.save(root/'COMPARATIVO_F12_VS_F13_12_QUADROS.jpg',quality=92)
          rgb_diffs=[]
          for i in range(4):
              a,b=frames[names[0]][i],frames[names[1]][i]
              delta=ImageChops.difference(a,b)
              val=sum(ImageStat.Stat(delta).mean)/3
              assert val>.3 and val<25,(i,val)
              rgb_diffs.append(round(val,4))
          risk={}
          for key in ('curto','longo'):
              name='biela_manivela_curso_'+key
              doc=json.loads((root/(name+'_F13_UI_RISCOS.json')).read_text('utf8'))
              assert doc['screenshot_user_device'] is False
              assert doc['visual_approval'] is False and doc['publish'] is False
              assert len(doc['profile_provenance'])==5
              old=[]
              new=[]
              title_samples=[]
              for data in doc['samples'].values():
                  a=data['hero_f12']['essential_text']['title']['ui_risks']
                  b=data['organic_f13']['essential_text']['title']['ui_risks']
                  organic=[p['id'] for p in doc['profile_provenance'] if p['placement']=='organic']
                  old.extend(a[n] for n in organic)
                  new.extend(b[n] for n in organic)
                  for role in ('piston','connecting_rod','flywheel','drive_belt'):
                      assert data['hero_f12']['roles'][role]['bbox']==data['organic_f13']['roles'][role]['bbox']
                  title_samples.append({'before_reels':a['reels_organic_android_oct2026'],
                                        'after_reels':b['reels_organic_android_oct2026']})
              assert max(old)>.85
              assert max(new)==0,new
              risk[key]={'reels_title_sample':title_samples,'max_observed_organic_title_before':max(old),
                         'max_observed_organic_title_after':max(new),
                         'device_screenshot_verified':False}
          qa={'status':'F13_SOURCED_UI_SCENARIOS_TESTED_DEVICE_APPROVAL_BLOCKED',
              'profiles_are_official':False,'official_ad_reference_separate':True,
              'screenshots_captured_on_user_device':False,'machine_geometry_changed':False,
              'allowed_to_publish':False,'sample_risks':risk,
              'rgb_frame_differences':rgb_diffs,'videos':movies}
          (root/'QA_F13.json').write_text(json.dumps(qa,ensure_ascii=False,indent=2),encoding='utf8')
          print(json.dumps(qa,ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lab-f13-ui-organica-titulo-lateral-evidencias-privadas
          path: qa_f13/
          retention-days: 5
          if-no-files-found: warn
