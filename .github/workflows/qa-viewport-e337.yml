name: E337 - comparacao real do viewport observado
on:
  push:
    branches: [atlas-direcao-visual-20261118]
    paths: ['.github/workflows/qa-viewport-e337.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CAIXA_MAX_CHAMADAS: '0'
      CAIXA_TETO_USD: '0'
      USAR_CLAUDE: '0'
      REMOTION_CHROME: /usr/bin/google-chrome
      REMOTION_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: ./.github/actions/setup-ffmpeg
      - uses: actions/setup-python@v5
        with: {python-version: '3.13', cache: pip}
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm, cache-dependency-path: motor4/package-lock.json}
      - name: Regressoes e compilacao
        run: |
          python -m pip install -q -r requirements.txt beautifulsoup4 pytest
          npm ci --prefix motor4 --no-audit --no-fund
          python -m pytest -q tests/test_imersao_e328.py tests/test_composicao_e286.py tests/test_documentario_integral_e254.py tests/test_recuperacao_cache_e333.py tests/test_direcao_short_e306.py tests/test_ui_e299.py tests/test_area_segura_plataformas.py
          (cd motor4 && npx --no-install tsc -p remotion/tsconfig.json --noEmit)
      - name: Restaurar apenas tres originais autenticados
        env:
          GH_TOKEN: ${{ secrets.COFRE_TOKEN }}
        run: python -m scripts.qa_viewport_e337
      - name: Render A B e medir texto e area real
        run: cd motor4 && node scripts/qa_viewport_e337.mjs
      - name: Preservar prova privada mesmo em falha
        if: always()
        env:
          GH_TOKEN: ${{ secrets.COFRE_TOKEN }}
        run: |
          shopt -s nullglob
          root=stage_documental/e337
          if [[ -s "$root/replay.json" ]]; then
            files=("$root/replay.json" "$root"/*.png)
            [[ ! -s "$root/comparison.json" ]] || files+=("$root/comparison.json")
            python scripts/espelhar_revisao_cofre.py "e337-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" "${files[@]}"
          fi
