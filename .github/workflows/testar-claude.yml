name: Testar Claude

# Botão para conferir se o Claude (assinatura Pro) está funcionando ANTES de gerar um vídeo.
# Faz 2 pedidos minúsculos (Haiku e Sonnet): custa menos de 1 centavo de dólar do crédito mensal.
on:
  workflow_dispatch:

jobs:
  testar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: |
          pip install requests
          timeout 300 npm install -g @anthropic-ai/claude-code@2.1.322 --no-audit --no-fund   # mesma versão fixa do gerar-videos
      - name: Pedir ao Claude
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          [ -n "$CLAUDE_CODE_OAUTH_TOKEN" ] || { echo "❌ Falta o secret CLAUDE_CODE_OAUTH_TOKEN"; exit 1; }
          claude --version
          python - <<'PY'
          import json, os, requests
          from src import claude, gemini
          ok = True
          for leve, nome in ((True, 'Haiku'), (False, 'Sonnet')):
              try:
                  r = gemini.extrair_json(claude.pedir('Responda só este JSON: {"ok": true, "modelo": "<seu nome>"}', leve=leve))
                  print(f'✔ {nome}: {r}')
              except Exception as e:
                  ok = False
                  print(f'✘ {nome}: {e}')
          msg = ('✅ Claude funcionando: ' + claude.resumo_gasto()) if ok else '❌ Claude NÃO funcionou (ver o log do workflow "Testar Claude")'
          print(msg)
          tok, chat = os.getenv('TELEGRAM_BOT_TOKEN'), os.getenv('TELEGRAM_CHAT_ID')
          if tok and chat:
              requests.post(f'https://api.telegram.org/bot{tok}/sendMessage', data={'chat_id': chat, 'text': msg}, timeout=30)
          raise SystemExit(0 if ok else 1)
          PY
