<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 520" width="400" height="520">
  <!-- Mascote original do Coringa News: bobo da corte repórter -->
  <defs>
    <linearGradient id="pele" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe0c2"/><stop offset="1" stop-color="#f2c29b"/></linearGradient>
    <linearGradient id="amar" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffe14d"/><stop offset="1" stop-color="#f5b800"/></linearGradient>
    <linearGradient id="verm" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff5a4d"/><stop offset="1" stop-color="#c8231b"/></linearGradient>
    <linearGradient id="roupa" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#232b3d"/><stop offset="1" stop-color="#121826"/></linearGradient>
  </defs>
  <!-- corpo / colete de imprensa -->
  <g id="corpo">
    <path d="M90 520 C 95 420, 140 385, 200 385 C 260 385, 305 420, 310 520 Z" fill="url(#roupa)"/>
    <path d="M200 388 L200 520" stroke="#0b0f18" stroke-width="4"/>
    <rect x="222" y="430" width="70" height="44" rx="8" fill="#fff"/>
    <text x="257" y="449" text-anchor="middle" font-family="JBM, monospace" font-weight="700" font-size="13" fill="#121826">IMPRENSA</text>
    <rect x="232" y="456" width="50" height="8" rx="3" fill="#FFD21F"/>
    <!-- gola de bobo (zigue-zague) -->
    <path d="M120 400 L145 375 L160 405 L180 375 L200 408 L220 375 L240 405 L255 375 L280 400 L262 418 L138 418 Z" fill="url(#amar)" stroke="#0b0f18" stroke-width="4" stroke-linejoin="round"/>
    <circle cx="145" cy="378" r="7" fill="#c8231b" stroke="#0b0f18" stroke-width="3"/>
    <circle cx="200" cy="410" r="7" fill="#c8231b" stroke="#0b0f18" stroke-width="3"/>
    <circle cx="255" cy="378" r="7" fill="#c8231b" stroke="#0b0f18" stroke-width="3"/>
  </g>
  <!-- cabeça -->
  <g id="cabeca">
    <ellipse cx="200" cy="292" rx="92" ry="96" fill="url(#pele)" stroke="#0b0f18" stroke-width="5"/>
    <!-- bochechas -->
    <ellipse cx="140" cy="318" rx="16" ry="10" fill="#ff8a7a" opacity=".55"/>
    <ellipse cx="260" cy="318" rx="16" ry="10" fill="#ff8a7a" opacity=".55"/>
    <!-- olhos -->
    <g id="olhos">
      <ellipse cx="165" cy="285" rx="17" ry="21" fill="#fff" stroke="#0b0f18" stroke-width="4"/>
      <ellipse cx="235" cy="285" rx="17" ry="21" fill="#fff" stroke="#0b0f18" stroke-width="4"/>
      <circle cx="169" cy="289" r="9" fill="#0b0f18"/><circle cx="239" cy="289" r="9" fill="#0b0f18"/>
      <circle cx="172" cy="285" r="3" fill="#fff"/><circle cx="242" cy="285" r="3" fill="#fff"/>
    </g>
    <path id="palpebras" d="M146 285 h38 M216 285 h38" stroke="#0b0f18" stroke-width="5" stroke-linecap="round" opacity="0"/>
    <!-- sobrancelhas -->
    <path d="M148 252 q17 -10 34 0 M218 252 q17 -10 34 0" stroke="#0b0f18" stroke-width="5" fill="none" stroke-linecap="round"/>
    <!-- marca de losango no olho (estilo carta) -->
    <path d="M200 232 l7 10 l-7 10 l-7 -10 z" fill="#c8231b"/>
    <!-- boca: fechada e aberta (alternadas na animação) -->
    <path id="bocaF" d="M168 336 q32 26 64 0" stroke="#0b0f18" stroke-width="5" fill="none" stroke-linecap="round"/>
    <g id="bocaA" opacity="0">
      <path d="M170 332 q30 40 60 0 z" fill="#7a1b1b" stroke="#0b0f18" stroke-width="5" stroke-linejoin="round"/>
      <path d="M182 350 q18 10 36 0" fill="#ff7a7a"/>
    </g>
  </g>
  <!-- chapéu de três pontas -->
  <g id="chapeu">
    <path d="M112 262 C 100 200, 60 170, 20 175 C 55 190, 70 215, 80 240 Z" fill="url(#amar)" stroke="#0b0f18" stroke-width="5" stroke-linejoin="round"/>
    <path d="M288 262 C 300 200, 340 170, 380 175 C 345 190, 330 215, 320 240 Z" fill="url(#verm)" stroke="#0b0f18" stroke-width="5" stroke-linejoin="round"/>
    <path d="M118 250 C 120 160, 160 100, 200 60 C 240 100, 280 160, 282 250 Z" fill="#1b2232" stroke="#0b0f18" stroke-width="5" stroke-linejoin="round"/>
    <path d="M200 60 C 185 120, 180 190, 190 250 L 210 250 C 220 190, 215 120, 200 60 Z" fill="url(#amar)" opacity=".9"/>
    <path d="M106 262 C 150 236, 250 236, 294 262 L 290 280 C 250 258, 150 258, 110 280 Z" fill="url(#amar)" stroke="#0b0f18" stroke-width="5" stroke-linejoin="round"/>
    <circle cx="20" cy="175" r="14" fill="#FFD21F" stroke="#0b0f18" stroke-width="4"/>
    <circle cx="380" cy="175" r="14" fill="#FFD21F" stroke="#0b0f18" stroke-width="4"/>
    <circle cx="200" cy="56" r="15" fill="#FFD21F" stroke="#0b0f18" stroke-width="4"/>
  </g>
  <!-- microfone -->
  <g id="mic">
    <rect x="300" y="395" width="22" height="95" rx="8" fill="#2a3245" stroke="#0b0f18" stroke-width="4" transform="rotate(-18 311 440)"/>
    <rect x="292" y="392" width="42" height="34" rx="6" fill="#FFD21F" stroke="#0b0f18" stroke-width="4" transform="rotate(-18 311 410)"/>
    <text x="313" y="415" text-anchor="middle" font-family="Mont, sans-serif" font-weight="900" font-size="16" fill="#121826" transform="rotate(-18 311 410)">CN</text>
    <circle cx="322" cy="372" r="30" fill="#3b4459" stroke="#0b0f18" stroke-width="5"/>
    <path d="M300 362 h44 M298 375 h48 M303 388 h38" stroke="#596480" stroke-width="3"/>
  </g>
</svg>
