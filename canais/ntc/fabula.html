<!doctype html><html><head><meta charset="utf-8"><style>
/* Ninguém Te Contou — motor 2D com a arte do Flow (cenário pintado + Val e objetos recortados). Tudo por seek(t). */
html,body{margin:0;background:#000}
#st{position:relative;width:1080px;height:1920px;overflow:hidden;font-family:Inter,'DejaVu Sans',sans-serif}
.cena{position:absolute;inset:0;opacity:0}
.cam{position:absolute;left:0;top:0;width:1080px;height:1920px;transform-origin:0 0}
.bg{position:absolute;left:0;width:1080px}
.spr{position:absolute;transform-origin:50% 100%}
.spr img{position:absolute;left:0;top:0;width:100%;height:100%}
.val{filter:sepia(.14) saturate(1.08) brightness(.97)}
.p img{filter:drop-shadow(0 14px 6px rgba(40,20,10,.42))}
.p.ceu img{filter:none}
.sombra{position:absolute;border-radius:50%;background:rgba(40,20,10,.35);filter:blur(8px)}
.risco{position:absolute;height:9px;border-radius:5px;background:#2A1E1A;transform-origin:0 50%}
.vin{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 55%,transparent 50%,rgba(30,12,5,.45) 100%)}
#fx{position:absolute;inset:0;pointer-events:none;z-index:4}
#fx i{position:absolute;display:block;left:0;top:0}
#hud{position:absolute;left:50%;top:250px;transform:translateX(-50%);background:#2A1E1A;border:6px solid #F2C14E;border-radius:22px;padding:12px 40px;text-align:center;opacity:0;box-shadow:0 12px 30px rgba(0,0,0,.35);z-index:5}
#hud small{display:block;font-weight:800;font-size:28px;letter-spacing:3px;color:#F2C14E;white-space:nowrap}
#hud b{display:block;font-weight:900;font-size:100px;line-height:1;color:#fff;font-variant-numeric:tabular-nums}
#cap{position:absolute;left:70px;right:70px;top:480px;text-align:center;font-weight:900;font-size:86px;line-height:1.02;color:#fff;text-transform:uppercase;-webkit-text-stroke:12px #2A1E1A;paint-order:stroke fill;z-index:6}
#cap i{font-style:normal;color:#F2C14E}
#balao{position:absolute;left:0;top:0;background:#fff;border:7px solid #2A1E1A;border-radius:34px;padding:16px 32px;font-weight:900;font-size:68px;line-height:1.05;color:#2A1E1A;opacity:0;z-index:6;box-shadow:0 10px 0 rgba(0,0,0,.18);max-width:860px;text-align:center}
#balao:after{content:'';position:absolute;left:var(--rabo,50%);bottom:-36px;margin-left:-18px;border:18px solid transparent;border-top:22px solid #2A1E1A}
#titulo{position:absolute;left:60px;right:60px;top:300px;text-align:center;font-weight:900;font-size:118px;line-height:.95;color:#fff;-webkit-text-stroke:14px #2A1E1A;paint-order:stroke fill;opacity:0;z-index:7}
#titulo i{font-style:normal;color:#F2C14E}
#fim{position:absolute;left:90px;right:90px;top:520px;text-align:center;opacity:0;z-index:7}
#fim .pa{display:inline-block;background:#F2C14E;color:#2A1E1A;border:7px solid #2A1E1A;border-radius:22px;font-weight:900;font-size:68px;padding:10px 34px}
#fim .c{margin-top:22px;font-weight:900;font-size:58px;line-height:1.05;color:#fff;-webkit-text-stroke:10px #2A1E1A;paint-order:stroke fill}
#flash{position:absolute;inset:0;background:#fff;opacity:0;z-index:8;pointer-events:none}
</style></head><body><div id="st"><div id="fx"></div>
<div id="titulo"></div><div id="hud"><small id="rot"></small><b id="num">0</b></div><div id="balao"></div><div id="cap"></div>
<div id="fim"><div class="pa" id="fimp"></div><div class="c" id="fimc"></div></div><div id="flash"></div></div>
<script src="data.js"></script>
<script>
const D=window.DATA,$=id=>document.getElementById(id),cl=(x,a=0,b=1)=>Math.max(a,Math.min(b,x)),lerp=(a,b,k)=>a+(b-a)*k;
const eo=k=>1-Math.pow(1-cl(k),3),eio=k=>{k=cl(k);return k<.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2},back=k=>{k=cl(k);const c=1.7;return 1+(c+1)*Math.pow(k-1,3)+c*Math.pow(k-1,2)};
const rnd=s=>{const x=Math.sin(s*9301+49297)*233280;return x-Math.floor(x)};
const ST=$('st'),FX=$('fx'),A='arte/';
// ── Val: poses do Flow. "perto" = imagem usada nos planos fechados (mais resolução).
const POSE={neutra:{src:'frente',w:535,h:1134,perto:'tres_quartos'},tres_quartos:{src:'tres_quartos',w:955,h:2119},
  comemora:{src:'comemora',w:1230,h:1835,alt:.93},explica:{src:'explica',w:1058,h:2123},brava:{src:'brava',w:1155,h:2123},
  susto:{src:'panico',w:1216,h:2123},desesperada:{src:'panico',w:1216,h:2123}};
const CAB={x:150/535,w:.46*498/535,h:.46*640/1134};   // cabeça trocável medida na pose "frente"
const VAL_ALT=1040;
const cenas=D.cenas.map((c,i)=>{const el=document.createElement('div');el.className='cena';
  let h=`<div class="cam"><img class="bg" src="${A}cenarios/${c.cen}.jpg" style="top:${c.bg_top||0}px;height:${c.bg_h||1934}px">`;
  const prop=(p,j)=>{let o='';const n=p.n||1;for(let k=0;k<n;k++)o+=`<div class="spr p${p.ceu?' ceu':''}" data-j="${j}" data-k="${k}" style="transform-origin:50% ${p.anim==='balanca'?'0%':'100%'}"><img src="${A}objetos/usar/${p.t}.png"></div>`;return o};
  (c.props||[]).forEach((p,j)=>{if(p.atras)h+=prop(p,j)});
  let V=null;
  if(c.val){const P=POSE[c.val.pose]||POSE.neutra,alt=VAL_ALT*(P.alt||1)*(c.val.s||1);V={x:c.val.x,chao:c.chao,alt,P,pose:c.val.pose};
    h+=`<div class="sombra"></div><div class="spr val"><img class="vc" src="${A}val/recorte/${P.src}.png"><img class="vh" style="display:none;left:${CAB.x*100}%;width:${CAB.w*100}%;height:${CAB.h*100}%"></div>`;
    h+=[0,1,2,3,4].map(()=>'<div class="risco" style="opacity:0"></div>').join('')}
  (c.props||[]).forEach((p,j)=>{if(!p.atras)h+=prop(p,j)});
  h+='</div>'+(c.noite?'<div style="position:absolute;inset:0;background:rgba(25,35,90,.5);mix-blend-mode:multiply"></div>':'')+'<div class="vin"></div>';
  el.innerHTML=h;ST.insertBefore(el,ST.firstChild);
  // planos: geral → (rosto / objeto / meio), corte a cada ~2,3 s como nos vídeos virais
  const dur=c.b-c.a,n=Math.max(1,Math.round(dur/2.3)),pl=[];
  const p0=(c.props||[]).find(p=>!['corre','foge','some'].includes(p.anim));
  const alvoObj=p0?{x:p0.x+p0.w*.5,y:p0.y-p0.w*p0.ar*.5,z:1.55}:null;
  const susto=V&&['susto','desesperada'].includes(V.pose);
  // susto: se tem a causa (objeto) na cena, primeiro o plano geral (vê o bicho + o pulo) e logo o corte para o rosto
  if(susto&&(c.props||[]).length)pl.push({t0:c.a,tipo:'geral'});
  for(let q=0;q<n;q++){let tipo='geral';
    if(susto&&q===0)tipo='rosto';
    else if(q>0){const op=[];if(V)op.push('rosto');if(alvoObj&&!(c.balao&&V))op.push('objeto');if(!(c.balao&&V))op.push('meio');else op.push('geral');tipo=op[(q-1+i)%op.length]}   // com balão: só planos em que ele cabe em cima da cabeça
    pl.push({t0:susto&&q===0&&pl.length?c.a+Math.min(1.1,dur*.35):c.a+dur*q/n,tipo})}
  return{c,el,V,pl,alvoObj,cam:el.querySelector('.cam'),bg:el.querySelector('.bg'),val:el.querySelector('.val'),vc:el.querySelector('.vc'),vh:el.querySelector('.vh'),
    sombra:el.querySelector('.sombra'),riscos:[...el.querySelectorAll('.risco')],props:[...el.querySelectorAll('.p')]}});
function alvo(S,tipo){const V=S.V;
  if(tipo==='rosto'&&V)return{x:V.x,y:V.chao-V.alt*.80,z:1.75,sy:1150};
  if(tipo==='objeto'&&S.alvoObj)return{...S.alvoObj,sy:1100};
  if(tipo==='meio')return{x:V?V.x:540,y:V?V.chao-V.alt*.5:1500,z:1.3,sy:1200};
  return{x:540,y:960,z:1,sy:960}}
// confete (comemoração) e poeira (o que cai)
const CONF=Array.from({length:46},(_,i)=>({x:rnd(i)*1080,v:500+rnd(i+7)*500,r:rnd(i+3)*720,c:['#F2C14E','#F28AA8','#7DBE4A','#5B8FD6','#E07A6B'][i%5],w:14+rnd(i+1)*12}));
FX.innerHTML=CONF.map(p=>`<i class="cf" style="width:${p.w}px;height:${p.w*.55}px;background:${p.c};border-radius:3px"></i>`).join('')
  +Array.from({length:10},()=>'<i class="po" style="width:60px;height:60px;border-radius:50%;background:rgba(240,230,215,.85)"></i>').join('');
const CF=[...FX.querySelectorAll('.cf')],PO=[...FX.querySelectorAll('.po')];
window.seek=t=>{
  let i=D.cenas.findIndex(c=>t>=c.a&&t<c.b);if(i<0)i=D.cenas.length-1;
  const S=cenas[i],c=S.c,d=t-c.a,V=S.V;
  cenas.forEach((x,j)=>x.el.style.opacity=j===i?1:0);
  // ── câmera
  const pl=[...S.pl].reverse().find(p=>t>=p.t0)||S.pl[0],dp=t-pl.t0;
  const fimOn=c.fim&&d>c.fim.de-0.4,tipo=fimOn?'geral':pl.tipo,Al=alvo(S,tipo);
  let z=Al.z*(1+0.05*eio(dp/2.6));
  let tx=540-Al.x*z,ty=Al.sy-Al.y*z;
  tx=Math.min(0,Math.max(1080-1080*z,tx));ty=Math.min(0,Math.max(1920-1920*z,ty));
  const corte=dp<0.14?1-dp/0.14:0;
  const susto=V&&['susto','desesperada'].includes(V.pose);
  let sh=0;(c.props||[]).forEach(p=>{if(p.anim==='cai'){const dd=d-(p.de||0)-0.5;if(dd>0&&dd<0.45)sh=Math.max(sh,16*(1-dd/0.45))}});
  if(susto&&d<0.55)sh=Math.max(sh,22*(1-d/0.55));
  if(c.tremor&&d<0.6)sh=Math.max(sh,20*(1-d/0.6));
  const zz=z*(1+(susto&&d<0.6?0.10*Math.exp(-d*14):0.03*corte));
  S.cam.style.transform=`translate(${tx+Math.sin(t*67)*sh-(zz-z)*540}px,${ty+Math.cos(t*59)*sh-(zz-z)*960}px) scale(${zz})`;
  S.bg.style.filter=tipo==='rosto'||tipo==='objeto'?'blur(5px)':'none';
  S.el.style.filter=`saturate(${1-(c.cinza??0)}) brightness(${1-(c.cinza??0)*0.12})`;
  $('flash').style.opacity=(susto&&d<0.1)?0.55*(1-d/0.1):(i>0&&i%2===1&&d<0.12?0.35*(1-d/0.12):0);
  // ── Val
  let cabTop=null,cabX=null;
  if(V){const perto=tipo==='rosto'&&V.P.perto,P=perto?POSE[V.P.perto]:V.P,src=A+'val/recorte/'+P.src+'.png';
    if(S.vc.dataset.s!==src){S.vc.src=src;S.vc.dataset.s=src}
    const h=V.alt*(perto?1:1),w=h*P.w/P.h;
    Object.assign(S.val.style,{left:(V.x-w/2)+'px',top:(V.chao-h)+'px',width:w+'px',height:h+'px'});
    let sx=1,sy=1,dy=0;const pose=V.pose;
    const r=Math.sin(t*2.6)*0.012;sy+=r;sx-=r*.6;                                           // respira
    if(!susto){const k=cl(d/0.35);sy+=0.10*(1-back(k))*-1;sx+=0.06*(1-back(k))}               // entra com mola
    if(susto){if(d<0.42){const k=d/0.42;dy=-4*130*k*(1-k);sy+=0.10*(1-k);sx-=0.06*(1-k)}       // pulo de susto
      else{const b=d-0.42;sy-=0.12*Math.exp(-b*9)*Math.cos(b*26);sx+=0.08*Math.exp(-b*9)*Math.cos(b*26)}
      sx*=1+Math.sin(t*38)*0.006}
    if(pose==='comemora')dy=-Math.abs(Math.sin(t*6))*40;
    if(pose==='brava')sx*=1+Math.sin(t*30)*0.004;
    if(pose==='explica'){dy=-Math.abs(Math.sin(t*3.2))*8}
    if(c.balao&&d>(c.balao_de??0.6)&&d<(c.balao_de??0.6)+0.9)sy+=Math.sin((d-(c.balao_de??0.6))*14)*0.012;  // "fala"
    S.val.style.transform=`translateY(${dy}px) scale(${sx},${sy})`;
    // cabeça trocável (só na pose de frente): pisca de tempos em tempos
    const pisca=P.src==='frente'&&((t+i*.7)%3.4)<0.12;
    if(pisca){if(S.vh.dataset.s!=='p'){S.vh.src=A+'val/recorte/cabeca_piscando.png';S.vh.dataset.s='p'}S.vh.style.display='block'}else S.vh.style.display='none';
    const sw=lerp(w*.62,w*.40,cl(-dy/130));Object.assign(S.sombra.style,{left:(V.x-sw/2)+'px',top:(V.chao-22)+'px',width:sw+'px',height:'44px'});
    // riscos de susto em volta da cabeça
    S.riscos.forEach((e,k)=>{const dd=d-0.25;if(!susto||dd<0||dd>1.6){e.style.opacity=0;return}
      const a=(-150+k*30)*Math.PI/180,R0=V.alt*.24+Math.sin(dd*30+k)*8,L=lerp(14,46,eo(dd/.15));
      e.style.opacity=1;e.style.width=L+'px';e.style.left=(V.x+Math.cos(a)*R0)+'px';e.style.top=(V.chao-V.alt*.83+Math.sin(a)*R0+dy)+'px';e.style.transform=`rotate(${a*180/Math.PI}deg)`});
    cabTop=(V.chao-h*1.0+dy)*zz+ty;cabX=V.x*zz+tx}
  // ── objetos
  S.props.forEach(e=>{const p=c.props[+e.dataset.j],k=+e.dataset.k,de=(p.de||0)+k*(p.passo||0.15),dd=d-de;
    const W=p.w,H=W*p.ar,x0=p.x+k*(p.dx||0),y0=p.y+k*(p.dy||0);let o=dd>=0?1:0,tr='',X=x0;
    if(p.anim==='corre'||p.anim==='foge'){X=x0+dd*p.vel;tr=`translateY(${-Math.abs(Math.sin(dd*30))*8}px) rotate(${Math.sin(dd*30+k)*4}deg)`;
      if(p.lim)o*=cl(Math.min(X-p.lim[0]+W,p.lim[1]-X)/60)}
    else if(p.anim==='some'){o=dd<0?1:cl(1-dd/0.5);tr=`scale(${1-cl(dd/0.5)*0.6}) rotate(${Math.max(0,dd)*260}deg)`}
    else if(p.anim==='cai'){const T=0.5;if(dd<T)tr=`translateY(${-(1-Math.pow(cl(dd/T),2))*900}px)`;else{const b=dd-T;tr=`translateY(${-Math.abs(Math.sin(b*14))*60*Math.exp(-b*6)}px) scale(${1+0.12*Math.exp(-b*12)},${1-0.12*Math.exp(-b*12)})`}}
    else if(p.anim==='pula')tr=`translateY(${-Math.abs(Math.sin(dd*6))*40}px)`;
    else if(p.anim==='balanca')tr=`rotate(${Math.sin(dd*3)*8}deg)`;
    else if(p.anim==='cresce')tr=`scale(${cl(back(dd/0.5),0,1.1)})`;
    else tr=`scale(${cl(back(dd/0.3),0,1.1)})`;
    if(p.flip)tr+=' scaleX(-1)';
    Object.assign(e.style,{left:X+'px',top:(y0-H)+'px',width:W+'px',height:H+'px',opacity:o,transform:tr})});
  // ── partículas
  const festa=V&&V.pose==='comemora'||c.confete;
  CF.forEach((e,k)=>{const p=CONF[k];if(!festa||d>2.6){e.style.opacity=0;return}const y=-60+d*p.v-200*rnd(k+5);e.style.opacity=y>-50?1:0;
    e.style.transform=`translate(${p.x+Math.sin(d*3+k)*40}px,${y}px) rotate(${p.r+d*400}deg)`});
  const queda=(c.props||[]).find(p=>p.anim==='cai');
  PO.forEach((e,k)=>{if(!queda){e.style.opacity=0;return}const dd=d-(queda.de||0)-0.5;if(dd<0||dd>0.7){e.style.opacity=0;return}
    const a=(k/10)*Math.PI,r=60+dd*260,px=queda.x+queda.w/2+Math.cos(a)*r-30,py=queda.y-20-Math.sin(a)*r*0.35;
    e.style.opacity=0.8*(1-dd/0.7);e.style.transform=`translate(${px*zz+tx}px,${py*zz+ty}px) scale(${1+dd*1.5})`});
  // ── título, painel, balão, legenda, final
  const ti=$('titulo');if(c.titulo){ti.innerHTML=c.titulo;const tf=Math.min(2.6,c.b-c.a-0.3);ti.style.opacity=d<tf?cl(d/0.2):cl((tf+0.3-d)/0.3);ti.style.transform=`scale(${lerp(0.7,1,cl(back(d/0.45),0,1.1))})`}else ti.style.opacity=0;
  const tituloOn=c.titulo&&d<2.9;
  const hd=$('hud');if(c.painel&&!tituloOn&&!fimOn){hd.style.opacity=1;$('rot').textContent=c.painel.rot;const kn=eo((d-0.2)/0.9);
    $('num').textContent=(c.painel.fmt||'{}').replace('{}',Math.round(lerp(c.painel.de??c.painel.para,c.painel.para,kn)).toLocaleString('pt-BR'));
    hd.style.transform=`translateX(-50%) scale(${d<0.3?1+0.12*(1-d/0.3):1})`}else hd.style.opacity=0;
  const cap=$('cap');let txt=null,t0=0;
  const g=(D.captions||[]).find(x=>t>=x.start&&t<x.end+0.05);
  if(g){txt=g.words.map(w=>w.hl?`<i>${w.w}</i>`:w.w).join(' ');t0=g.start}
  if(txt&&!tituloOn&&!(c.fim&&d>c.fim.de)){if(cap.dataset.k!=t0){cap.innerHTML=txt;cap.dataset.k=t0}cap.style.opacity=1;cap.style.top=(c.painel?480:330)+'px';cap.style.transform=`scale(${lerp(0.85,1,cl(back((t-t0)/0.18),0,1.1))})`}else cap.style.opacity=0;
  const bl=$('balao'),bde=c.balao_de??0.6;
  if(c.balao&&d>bde&&!fimOn){const k=cl(back((d-bde)/0.3),0,1.1);if(bl.dataset.k!=i){bl.textContent=c.balao;bl.dataset.k=i;bl.style.whiteSpace=c.balao.length<=22?'nowrap':'normal'}bl.style.left='0px';bl.style.opacity=1;
    const bw=bl.offsetWidth,bh=bl.offsetHeight;
    // em cima da cabeça; se bater na legenda/painel, vai para o lado da cabeça (nunca na frente do rosto)
    const capEl=$('cap'),topo=capEl.style.opacity==1?capEl.offsetTop+capEl.offsetHeight+24:($('hud').style.opacity==1?470:250);
    let hx=cabX??540,hy=cabTop??900,bx=Math.min(1080-40-bw,Math.max(40,hx-bw/2)),by=hy-bh-50,rabo=cl(hx-bx,50,bw-50);
    if(by<topo){by=Math.max(topo,hy);const meia=(V?V.alt*.16:150)*zz;
      if(hx+meia+bw<1060){bx=hx+meia;rabo=50}else{bx=Math.max(20,hx-meia-bw);rabo=bw-50}}
    bl.style.setProperty('--rabo',rabo+'px');bl.style.transformOrigin=`${rabo}px 100%`;
    bl.style.left=bx+'px';bl.style.top=by+'px';bl.style.transform=`scale(${k}) rotate(${Math.sin(t*5)*1.2}deg)`}else bl.style.opacity=0;
  const f=$('fim');if(c.fim&&d>c.fim.de){$('fimp').textContent=c.fim.p;$('fimc').innerHTML=c.fim.c;f.style.opacity=1;f.style.transform=`scale(${cl(back((d-c.fim.de)/0.35),0,1.1)})`}else f.style.opacity=0;
};
const pre=['frente','tres_quartos','comemora','explica','brava','panico','cabeca_piscando'].map(s=>{const im=new Image();im.src=A+'val/recorte/'+s+'.png';return im.decode().catch(()=>0)});
Promise.all([...[...document.images].map(i=>i.decode().catch(()=>0)),...pre,document.fonts.ready]).then(()=>{seek(0);window.READY=true});
</script></body></html>
