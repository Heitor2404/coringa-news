<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;background:#000}
#st{position:relative;width:1080px;height:1920px;overflow:hidden;font-family:Inter,sans-serif}
.cena{position:absolute;inset:0;opacity:0}
.cam{position:absolute;left:0;top:0;width:1080px;height:1920px;transform-origin:0 0}
.bg{position:absolute;inset:0;width:1080px;height:1920px}
.p{position:absolute;transform-origin:50% 100%}
.val{position:absolute;transform-origin:50% 100%}
.val svg{width:100%;height:100%;overflow:visible}
.sombra{position:absolute;border-radius:50%;background:rgba(0,0,0,.22);filter:blur(6px)}
.vinheta{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 55%,transparent 55%,rgba(20,10,5,.35) 100%)}
#fx{position:absolute;inset:0;pointer-events:none;z-index:4}
#fx i{position:absolute;display:block}
#hud{position:absolute;left:50%;top:300px;transform:translateX(-50%);background:#2A1E1A;border:6px solid #F2C14E;border-radius:22px;padding:14px 36px;text-align:center;opacity:0;box-shadow:0 12px 30px rgba(0,0,0,.35);z-index:5}
#hud small{display:block;font-weight:800;font-size:28px;letter-spacing:3px;color:#F2C14E;white-space:nowrap}
#hud b{display:block;font-weight:900;font-size:104px;line-height:1;color:#fff;font-variant-numeric:tabular-nums}
#cap{position:absolute;left:70px;right:70px;top:570px;text-align:center;font-weight:900;font-size:80px;line-height:1.02;color:#fff;text-transform:uppercase;letter-spacing:-1px;-webkit-text-stroke:10px #2A1E1A;paint-order:stroke fill;z-index:6}
#cap i{font-style:normal;color:#F2C14E}
#balao{position:absolute;background:#fff;border:6px solid #2A1E1A;border-radius:30px;padding:16px 26px;font-weight:900;font-size:46px;color:#2A1E1A;opacity:0;transform-origin:0% 100%;max-width:440px;z-index:6;box-shadow:0 10px 0 rgba(0,0,0,.18)}
#balao:after{content:'';position:absolute;left:30px;bottom:-34px;border:18px solid transparent;border-top:20px solid #2A1E1A}
#titulo{position:absolute;left:60px;right:60px;top:300px;text-align:center;font-weight:900;font-size:118px;line-height:.95;color:#fff;-webkit-text-stroke:14px #2A1E1A;paint-order:stroke fill;opacity:0;z-index:6}
#titulo i{font-style:normal;color:#F28AA8}
#marca{position:absolute;top:220px;width:100%;text-align:center;font-weight:800;font-size:28px;letter-spacing:4px;color:rgba(255,255,255,.75);-webkit-text-stroke:5px rgba(42,30,26,.6);paint-order:stroke fill;z-index:6}
#fim{position:absolute;left:90px;right:90px;top:560px;text-align:center;opacity:0;z-index:7}
#fim .pa{display:inline-block;background:#F28AA8;color:#2A1E1A;border:6px solid #2A1E1A;border-radius:20px;font-weight:900;font-size:60px;padding:10px 30px}
#fim .c{margin-top:18px;font-weight:900;font-size:46px;color:#fff;-webkit-text-stroke:8px #2A1E1A;paint-order:stroke fill}
#flash{position:absolute;inset:0;background:#fff;opacity:0;z-index:8;pointer-events:none}
</style></head><body><div id="st"><div id="marca">NINGUÉM TE CONTOU</div><div id="fx"></div>
<div id="titulo"></div><div id="hud"><small id="rot"></small><b id="num">0</b></div><div id="balao"></div><div id="cap"></div>
<div id="fim"><div class="pa" id="fimp"></div><div class="c" id="fimc"></div></div><div id="flash"></div></div>
<script src="data.js"></script>
<script>
const D=window.DATA,$=id=>document.getElementById(id),cl=(x,a=0,b=1)=>Math.max(a,Math.min(b,x)),lerp=(a,b,k)=>a+(b-a)*k;
const eo=k=>1-Math.pow(1-cl(k),3),eio=k=>{k=cl(k);return k<.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2},back=k=>{k=cl(k);const c=1.7;return 1+(c+1)*Math.pow(k-1,3)+c*Math.pow(k-1,2)};
const rnd=s=>{const x=Math.sin(s*9301+49297)*233280;return x-Math.floor(x)};
const ST=$('st'),FX=$('fx');
// ── cenas: cada uma vira 2 ou 3 PLANOS (geral → rosto da Val / objeto → meio), cortes a cada ~2,2 s como nos vídeos virais
const cenas=D.cenas.map((c,i)=>{const el=document.createElement('div');el.className='cena';
  let h=`<div class="cam"><img class="bg" src="cen/${c.cen}.svg">`;
  (c.props||[]).forEach((p,j)=>{const n=p.n||1;for(let k=0;k<n;k++)h+=`<img class="p" data-j="${j}" data-k="${k}" src="prop/${p.t}.svg" style="left:${p.x+(k*(p.dx||0))}px;top:${p.y+(k*(p.dy||0))}px;width:${(p.w||160)}px">`});
  let V=null;
  if(c.val){const s=c.val.s||1;V={x:c.val.x??180,y:c.val.y??860,w:720*s,h:1032*s,s};
    h+=`<div class="sombra" style="left:${V.x+V.w*.27}px;top:${V.y+V.h*.935}px;width:${V.w*.46}px;height:${V.h*.05}px"></div>`;
    h+=`<div class="val" style="left:${V.x}px;top:${V.y}px;width:${V.w}px;height:${V.h}px">${(D.val_svg||{})[c.val.pose]||''}</div>`}
  h+='</div>'+(c.noite?'<div style="position:absolute;inset:0;background:rgba(25,35,90,.5);mix-blend-mode:multiply"></div>':'')+'<div class="vinheta"></div>';el.innerHTML=h;ST.insertBefore(el,ST.firstChild);
  const dur=c.b-c.a,n=Math.max(1,Math.round(dur/2.3)),pl=[];
  const alvoVal=V?{x:V.x+V.w*.5,y:V.y+V.h*.24,z:2.0}:null;
  const p0=(c.props||[])[0],alvoObj=p0?{x:p0.anim==='corre'||p0.anim==='foge'?540:p0.x+(p0.w||160)/2,y:p0.y+(p0.w||160)*.35,z:1.6}:null;
  for(let q=0;q<n;q++){let tipo='geral';if(q>0){const op=[];if(c.balao&&alvoVal)op.push('rosto');if(alvoObj)op.push('objeto');if(alvoVal&&!c.balao)op.push('rosto');op.push('meio');tipo=op[(q-1+i)%op.length]}
    pl.push({t0:c.a+dur*q/n,tipo})}
  return{c,el,V,pl,alvoVal,alvoObj,cam:el.querySelector('.cam')}});
function alvo(s,tipo){if(tipo==='rosto'&&s.alvoVal)return s.alvoVal;if(tipo==='objeto'&&s.alvoObj)return s.alvoObj;if(tipo==='meio')return{x:540,y:1150,z:1.28};return{x:540,y:1000,z:1.0}}
// confete (comemoração) e poeira (o que cai): partículas na camada de efeitos
const CONF=Array.from({length:46},(_,i)=>({x:rnd(i)*1080,v:500+rnd(i+7)*500,r:rnd(i+3)*720,c:['#F2C14E','#F28AA8','#7DBE4A','#5B8FD6','#E07A6B'][i%5],w:14+rnd(i+1)*12}));
FX.innerHTML=CONF.map(p=>`<i class="cf" style="width:${p.w}px;height:${p.w*.55}px;background:${p.c};border-radius:3px"></i>`).join('')
  +Array.from({length:10},()=>'<i class="po" style="width:60px;height:60px;border-radius:50%;background:rgba(240,230,215,.85)"></i>').join('');
const CF=[...FX.querySelectorAll('.cf')],PO=[...FX.querySelectorAll('.po')];
window.seek=t=>{
  let i=D.cenas.findIndex(c=>t>=c.a&&t<c.b);if(i<0)i=D.cenas.length-1;
  const S=cenas[i],c=S.c,d=t-c.a;
  cenas.forEach((x,j)=>x.el.style.opacity=j===i?1:0);
  // ── câmera: plano atual, leve deriva e tranco no corte
  const pl=[...S.pl].reverse().find(p=>t>=p.t0)||S.pl[0],dp=t-pl.t0,A=alvo(S,pl.tipo);
  let fimOn=c.fim&&d>c.fim.de-0.4;const A2=fimOn?alvo(S,'geral'):A;
  let z=A2.z*(1+0.035*cl(dp/2.5)),tx=540-A2.x*z,ty=(pl.tipo==='geral'||fimOn?0:1080-A2.y*z);
  if(pl.tipo==='geral'||fimOn){z=1+0.04*cl(dp/2.5);tx=-540*(z-1);ty=-1000*(z-1)}
  tx=Math.min(0,Math.max(1080-1080*z,tx));ty=Math.min(0,Math.max(1920-1920*z,ty));
  const corte=dp<0.12?1-dp/0.12:0;z*=1+0.03*corte;
  // tremor: quando algo cai no chão, no susto/desespero e no começo de efeito forte
  let sh=0;(c.props||[]).forEach(p=>{if(p.anim==='cai'){const dd=d-(p.de||0)-0.5;if(dd>0&&dd<0.45)sh=Math.max(sh,16*(1-dd/0.45))}});
  if(c.val&&['susto','desesperada'].includes(c.val.pose)&&d<0.5)sh=Math.max(sh,12*(1-d/0.5));
  if(c.tremor&&d<0.6)sh=Math.max(sh,20*(1-d/0.6));
  const sx=Math.sin(t*61)*sh,sy=Math.cos(t*53)*sh;
  // transição entre cenas: chicote (desliza) ou clarão, alternando
  const wx=0;if(i>0&&i%2===0&&d<0.25)z*=1+0.12*(1-eo(d/0.25));
  S.cam.style.transform=`translate(${tx+sx+wx}px,${ty+sy}px) scale(${z})`;
  S.el.style.filter=`saturate(${1-(c.cinza??0)}) brightness(${1-(c.cinza??0)*0.1})`;
  $('flash').style.opacity=i>0&&i%2===1&&d<0.12?0.4*(1-d/0.12):0;
  // ── Valdirene: esqueleto (braços no ombro, cabeça no pescoço), piscar, boca e "respiração"
  const vEl=S.el.querySelector('.val');
  if(vEl){const pose=c.val.pose,kp=back(d/0.35),r=Math.sin(t*3.2)*0.012;
    const pulo=pose==='comemora'?-Math.abs(Math.sin(t*6))*34:0;
    vEl.style.transform=`translateY(${pulo}px) scale(${(c.val.flip?-1:1)*(lerp(0.88,1,cl(kp,0,1.1))+r)},${lerp(1.1,1,cl(kp,0,1.1))-r})`;
    const amp={comemora:14,explica:8,desesperada:10,susto:3,brava:4,neutra:3}[pose]||3,vel={comemora:9,desesperada:11,susto:30}[pose]||2.2;
    const be=vEl.querySelector('.be'),bd=vEl.querySelector('.bd'),cab=vEl.querySelector('.cab'),ol=vEl.querySelector('.olhos'),bo=vEl.querySelector('.boca');
    if(be)be.setAttribute('transform',`rotate(${Math.sin(t*vel)*amp} 230 304)`);
    if(bd)bd.setAttribute('transform',`rotate(${Math.sin(t*vel+1.7)*amp*(pose==='explica'?1.6:1)} 370 304)`);
    const tilt=pose==='desesperada'?Math.sin(t*14)*7:pose==='brava'?Math.sin(t*20)*2:Math.sin(t*1.4)*3,nod=c.balao&&d>0.6&&d<1.4?Math.sin((d-0.6)*12)*5:0;
    if(cab)cab.setAttribute('transform',`rotate(${tilt+nod} 300 280)`);
    const piscar=((t+i*.7)%3.4)<0.12;if(ol)ol.setAttribute('transform',piscar?'translate(0 190) scale(1 0.12) translate(0 -190)':'');
    const fala=c.balao&&d>0.55&&d<1.5?Math.abs(Math.sin(d*22)):0;if(bo)bo.setAttribute('transform',fala?`translate(0 ${232*(1-(1+fala*.8))}) scale(1 ${1+fala*.8})`:'')}
  // ── objetos (com gravidade e quique)
  S.el.querySelectorAll('.p').forEach(im=>{const p=c.props[+im.dataset.j],kk=+im.dataset.k,de=(p.de||0)+kk*(p.passo||0.15),dd=d-de;
    let o=dd>=0?1:0,tr='';
    if(p.anim==='corre'){const v=p.vel||420;tr=`translateX(${(dd*v)%1500}px) translateY(${-Math.abs(Math.sin(dd*28))*10}px) rotate(${Math.sin(dd*25)*5}deg)`}
    else if(p.anim==='foge'){tr=`translateX(${dd*(p.vel||-600)}px) translateY(${-Math.abs(Math.sin(dd*22))*12}px)`}
    else if(p.anim==='some'){o=dd<0?1:cl(1-dd/0.5);tr=`scale(${1-cl(dd/0.5)*0.6}) rotate(${Math.max(0,dd)*260}deg)`}
    else if(p.anim==='cai'){const T=0.5;if(dd<T)tr=`translateY(${-(1-Math.pow(dd/T,2))*900}px)`;else{const b=dd-T;tr=`translateY(${-Math.abs(Math.sin(b*14))*60*Math.exp(-b*6)}px) scale(${1+0.12*Math.exp(-b*12)},${1-0.12*Math.exp(-b*12)})`}}
    else if(p.anim==='pula'){tr=`translateY(${-Math.abs(Math.sin(dd*6))*34}px)`}
    else if(p.anim==='balanca'){tr=`rotate(${Math.sin(dd*3)*8}deg)`}
    else if(p.anim==='cresce'){tr=`scale(${cl(back(dd/0.5),0,1.1)})`}
    else tr=`scale(${cl(back(dd/0.3),0,1.1)})`;
    im.style.opacity=o;im.style.transform=tr});
  // ── partículas: confete na comemoração; poeira quando algo cai
  const festa=c.val&&c.val.pose==='comemora'||c.confete;
  CF.forEach((e,k)=>{const p=CONF[k];if(!festa||d>2.6){e.style.opacity=0;return}const y=-60+d*p.v-200*rnd(k+5);e.style.opacity=y>-50?1:0;
    e.style.transform=`translate(${p.x+Math.sin(d*3+k)*40}px,${y}px) rotate(${p.r+d*400}deg)`});
  const queda=(c.props||[]).find(p=>p.anim==='cai');
  PO.forEach((e,k)=>{if(!queda){e.style.opacity=0;return}const dd=d-(queda.de||0)-0.5;if(dd<0||dd>0.7){e.style.opacity=0;return}
    const a=(k/10)*Math.PI,r=60+dd*260;const pt=[(queda.x+(queda.w||160)/2+Math.cos(a)*r-30),(queda.y+(queda.w||160)*0.7-Math.sin(a)*r*0.35)];
    e.style.opacity=0.8*(1-dd/0.7);e.style.transform=`translate(${pt[0]*z+tx}px,${pt[1]*z+ty}px) scale(${1+dd*1.5})`});
  // ── título, painel, balão, legenda, final
  const ti=$('titulo');if(c.titulo){ti.innerHTML=c.titulo;const tf=Math.min(2.6,c.b-c.a-0.3);ti.style.opacity=d<tf?cl(d/0.2):cl((tf+0.3-d)/0.3);ti.style.transform=`scale(${lerp(0.7,1,cl(back(d/0.45),0,1.1))})`}else ti.style.opacity=0;
  const h=$('hud');if(c.painel){h.style.opacity=1;$('rot').textContent=c.painel.rot;const kn=eo((d-0.2)/0.9);
    const val=lerp(c.painel.de??c.painel.para,c.painel.para,kn);$('num').textContent=(c.painel.fmt||'{}').replace('{}',Math.round(val).toLocaleString('pt-BR'));
    h.style.transform=`translateX(-50%) scale(${d<0.3?1+0.12*(1-d/0.3):1})`}else h.style.opacity=0;
  const bl=$('balao');if(c.balao&&d>(c.balao_de??0.6)){const k=cl(back((d-(c.balao_de??0.6))/0.3),0,1.1);bl.textContent=c.balao;bl.style.opacity=1;
    let bx=c.balao_x??560,by=c.balao_y??900;if(S.V){const hx=(S.V.x+S.V.w*.70)*z+tx,hy=(S.V.y+S.V.h*.03)*z+ty;bx=Math.min(600,Math.max(40,hx+30));by=Math.min(1480,Math.max(760,hy))}
    bl.style.left=bx+'px';bl.style.top=by+'px';bl.style.transform=`scale(${k}) rotate(${Math.sin(t*4)*1.5}deg)`}else bl.style.opacity=0;
  const cap=$('cap');let txt=null,t0=0;
  const g=(D.captions||[]).find(x=>t>=x.start&&t<x.end+0.05);
  if(g){txt=g.words.map(w=>w.hl?`<i>${w.w}</i>`:w.w).join(' ');t0=g.start}
  else{const cp=[...(c.caps||[])].reverse().find(x=>t>=x[0]);if(cp){txt=cp[1];t0=cp[0]}}
  if(txt&&!(c.titulo&&d<2.9)&&!(c.fim&&d>c.fim.de)){if(cap.dataset.k!=t0){cap.innerHTML=txt;cap.dataset.k=t0}cap.style.opacity=1;cap.style.top=(c.cap_y??570)+'px';cap.style.transform=`scale(${lerp(0.85,1,cl(back((t-t0)/0.18),0,1.1))})`}else cap.style.opacity=0;
  const f=$('fim');if(c.fim&&d>c.fim.de){$('fimp').textContent=c.fim.p;$('fimc').innerHTML=c.fim.c;f.style.opacity=1;f.style.transform=`scale(${cl(back((d-c.fim.de)/0.35),0,1.1)})`}else f.style.opacity=0;
};
const im=[...document.images].map(i=>i.decode().catch(()=>0));Promise.all(im.concat([document.fonts.ready])).then(()=>{seek(0);window.READY=true});
</script></body></html>
