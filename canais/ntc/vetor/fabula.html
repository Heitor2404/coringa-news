  if(c.luz==='holofote'&&cabeca){const gh=document.getElementById('gHolofote');gh.setAttribute('cx',cabeca.x);gh.setAttribute('cy',cabeca.top+260*zz);gh.setAttribute('r',380+260*zz)}
